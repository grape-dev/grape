# Grape 四进程反代配置（Issue #699 Phase 4）
#
# 按路径分流到四个进程端口：
#   :38080 Mgmt（用户面 API / IM WS / 前端托管，默认）
#   :38081 Event（webhook 接收 / A2A 交接 / 事件操作）
#   :38082 Worker（runtime 协议端点 / tasks 通知·完成 / SSE 执行）
#   :38083 Insight（可观测性 / 仪表盘 / 全局搜索 / 延迟上报）
#
# 部署：cp deploy/nginx-grape-four-process.conf /etc/nginx/conf.d/grape.conf && nginx -s reload

upstream grape_server {
    server 127.0.0.1:38080;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}
upstream grape_event_server {
    server 127.0.0.1:38081;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}
upstream grape_worker_server {
    # Issue #3969：worker 上游多实例互备。本机为默认成员；对等主控 worker 端点由部署写入
    # /etc/nginx/conf.d/grape-worker-peers.conf（四进程共享同一 RDS，可互备；文件缺省不存在
    # = 仅本机，include 的 glob 不匹配时不报错）。max_fails/fail_timeout 让 nginx 在连续
    # 失败后临时摘除故障上游，keepalive 复用连接降低握手开销。
    server 127.0.0.1:38082 max_fails=2 fail_timeout=10s;
    include /etc/nginx/conf.d/grape-worker-peers.conf*;
    # Issue #3847：keepalive 参数走公共片段（keepalive 32 + upstream 90s > 客户端 65s）。
    include conf.d/nginx-grape-upstream-keepalive.inc;
}
upstream grape_insight_server {
    server 127.0.0.1:38083;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}

server {
    listen 443 ssl;
    server_name grape.example.com;   # TODO: 替换为实际域名

    # Issue #3847：公共重试/连接复用策略（proxy_next_upstream + HTTP/1.1 keepalive）
    include conf.d/nginx-grape-upstream.inc;

    # gzip 压缩（API JSON 响应 0.8~1.4MB 明文 → 压缩后 ~100-150KB）
    gzip on;
    gzip_types application/json;
    gzip_min_length 10k;
    gzip_comp_level 5;
    gzip_vary on;

    # 多图上传放行（前端上限 9×5MB，base64 后 ≈45MB+开销）
    client_max_body_size 50m;

    # Issue #1616/#1052: 契约入口固化——/openapi.json 与 /static/ 显式专用 location，
    # 不落兜底 location / 漂移（实测部分部署受上层访问控制影响 /openapi.json 403、
    # /static/openapi.json 404/200 不一致）。契约必须实时下发，禁缓存（no-cache），
    # 避免 CDN/代理把旧契约发给 CLI（grape refresh 依赖实时全量契约）。
    location = /openapi.json {
        proxy_pass http://grape_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        proxy_pass http://grape_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }


    # 服务间专用端点（跨域读原语 + 跨域补偿写）：nginx 到上游是同机回环，
    # 上游看到的来源恒为 127.0.0.1，中间件的「回环放行」会连带放过外部请求（QA F1）。
    # 必须在所有 location 之前显式拦截，不允许经 location / 兜底转发。
    location /internal/ {
        deny all;
        return 404;
    }

    # ===== Worker 进程 (:38082) =====
    # Issue #3969：幂等端点在网关层允许 http_502 切换（non_idempotent），其余 POST 仅连接级
    # 重试（error timeout），避免非幂等写被重复执行。正则 location 优先于上方前缀匹配。
    location ~ ^/api/runtime/(heartbeat|heartbeat-v2|register|tasks/[^/]+/state)$ {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Worker API（注册/心跳/认领/完成等 POST 端点）
    location /api/runtime/ {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Issue #3969：多上游故障切换 + keepalive（HTTP/1.1 长连接）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # tasks notify/complete/current — Agent runtime 调用
    location ~ ^/api/tasks/(notify|complete|current|awaiting-input)($|/) {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # chat 读端点（GET：conversations / messages / config / task 流与状态 / 图片）—归 Mgmt（设计 §5.5）
    # Worker 仅 include_selected(chat.router, methods={"POST"})，读端点在 Worker 会 405/404，
    # 故必须先于下方 /api/chat/ 前缀块命中（nginx 正则优先于前缀匹配）。
    location ~ ^/api/chat/(conversations|messages|config|task/|analyze-image|image/) {
        proxy_pass http://grape_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # chat 执行端点（POST send / send/stream / submit 等）—归 Worker（设计 §5.5）
    # SSE 需 proxy_buffering off / read_timeout 300s
    location /api/chat/ {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== Event 进程 (:38081) =====
    # Webhook 接收
    location /webhook/ {
        proxy_pass http://grape_event_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2A 交接
    location /api/a2a {
        proxy_pass http://grape_event_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # events 操作端点（terminate/redispatch）
    location ~ ^/api/events/.*/(terminate|redispatch) {
        proxy_pass http://grape_event_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Insight 进程 (:38083) =====
    # 可观测性面板
    location /api/obs/ {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 仪表盘
    location /api/dashboard/ {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 全局搜索
    location /api/search {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 延迟上报
    location /api/latency {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Mgmt 进程 (:38080) — 默认 =====
    location / {
        proxy_pass http://grape_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support（IM WS / SSE 流）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 流（Mgmt 代理 Runtime 的 task_messages）
    location /api/task-logs/ {
        proxy_pass http://grape_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

# 80 → 443 跳转（可选）
server {
    listen 80;
    server_name grape.example.com;   # TODO: 替换为实际域名
    return 301 https://$host$request_uri;
}