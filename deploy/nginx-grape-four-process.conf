# Grape 四进程反代配置（Issue #699 Phase 4）
#
# 按路径分流到四个进程端口：
#   :38080 Mgmt（用户面 API / IM WS / 前端托管，默认）
#   :38081 Event（webhook 接收 / A2A 交接 / 事件操作）
#   :38082 Worker（runtime 协议端点 / tasks 通知·完成 / SSE 执行）
#   :38083 Insight（可观测性 / 仪表盘 / 全局搜索 / 延迟上报）
#
# 部署：cp deploy/nginx-grape-four-process.conf /etc/nginx/conf.d/grape.conf && nginx -s reload

upstream grape_server {
    server 127.0.0.1:38080;
}
upstream grape_event_server {
    server 127.0.0.1:38081;
}
upstream grape_worker_server {
    server 127.0.0.1:38082;
}
upstream grape_insight_server {
    server 127.0.0.1:38083;
}

server {
    listen 443 ssl;
    server_name grape.example.com;   # TODO: 替换为实际域名

    # gzip 压缩（API JSON 响应 0.8~1.4MB 明文 → 压缩后 ~100-150KB）
    gzip on;
    gzip_types application/json;
    gzip_min_length 10k;
    gzip_comp_level 5;
    gzip_vary on;

    # 多图上传放行（前端上限 9×5MB，base64 后 ≈45MB+开销）
    client_max_body_size 50m;

    # 服务间专用端点（跨域读原语 + 跨域补偿写）：nginx 到上游是同机回环，
    # 上游看到的来源恒为 127.0.0.1，中间件的「回环放行」会连带放过外部请求（QA F1）。
    # 必须在所有 location 之前显式拦截，不允许经 location / 兜底转发。
    location /internal/ {
        deny all;
        return 404;
    }

    # ===== Worker 进程 (:38082) =====
    # Worker API（注册/心跳/认领/完成等 POST 端点）
    location /api/runtime/ {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # tasks notify/complete/current — Agent runtime 调用
    location ~ ^/api/tasks/(notify|complete|current|awaiting-input)($|/) {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # chat 读端点（GET：conversations / messages / config / task 流与状态 / 图片）—归 Mgmt（设计 §5.5）
    # Worker 仅 include_selected(chat.router, methods={"POST"})，读端点在 Worker 会 405/404，
    # 故必须先于下方 /api/chat/ 前缀块命中（nginx 正则优先于前缀匹配）。
    location ~ ^/api/chat/(conversations|messages|config|task/|analyze-image|image/) {
        proxy_pass http://grape_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # chat 执行端点（POST send / send/stream / submit 等）—归 Worker（设计 §5.5）
    # SSE 需 proxy_buffering off / read_timeout 300s
    location /api/chat/ {
        proxy_pass http://grape_worker_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== Event 进程 (:38081) =====
    # Webhook 接收
    location /webhook/ {
        proxy_pass http://grape_event_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2A 交接
    location /api/a2a {
        proxy_pass http://grape_event_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # events 操作端点（terminate/redispatch）
    location ~ ^/api/events/.*/(terminate|redispatch) {
        proxy_pass http://grape_event_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Insight 进程 (:38083) =====
    # 可观测性面板
    location /api/obs/ {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 仪表盘
    location /api/dashboard/ {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 全局搜索
    location /api/search {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 延迟上报
    location /api/latency {
        proxy_pass http://grape_insight_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Mgmt 进程 (:38080) — 默认 =====
    location / {
        proxy_pass http://grape_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support（IM WS / SSE 流）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 流（Mgmt 代理 Runtime 的 task_messages）
    location /api/task-logs/ {
        proxy_pass http://grape_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

# 80 → 443 跳转（可选）
server {
    listen 80;
    server_name grape.example.com;   # TODO: 替换为实际域名
    return 301 https://$host$request_uri;
}