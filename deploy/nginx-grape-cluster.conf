# Grape 三进程 nginx 反代配置 — 统一入口 :38080
upstream grape_a {
    server 127.0.0.1:38081;
}
upstream grape_b {
    server 127.0.0.1:38082;
}
upstream grape_c {
    server 127.0.0.1:38083;
}

server {
    listen 38080;
    server_name _;

    # /internal/* 拒绝外部访问
    location /internal/ {
        deny all;
        return 404;
    }

    # Worker API (rta_ token) → C
    location /api/runtime/ {
        proxy_pass http://grape_c;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Worker task endpoints → C
    location /api/tasks/ {
        proxy_pass http://grape_c;
        proxy_set_header Host $http_host;
    }

    # Webhook / A2A → B
    location /api/webhook/ {
        proxy_pass http://grape_b;
        proxy_set_header Host $http_host;
    }
    location /api/a2a {
        proxy_pass http://grape_b;
        proxy_set_header Host $http_host;
    }
    # events 路由全部走 A（A 加载了完整 events.router，含 GET 详情 + POST 操作）

    # SSE streams → A
    location /api/task-logs/ {
        proxy_pass http://grape_a;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    # 默认 → A（含 /health, /api/obs/, /api/dashboard/ 等用户面）
    location / {
        proxy_pass http://grape_a;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
