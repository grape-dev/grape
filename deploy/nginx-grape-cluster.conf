# Grape 四进程 nginx 反代配置 — 统一入口 :38080
upstream grape_mgmt {
    server 127.0.0.1:38081;
}
upstream grape_event {
    server 127.0.0.1:38082;
}
upstream grape_worker {
    server 127.0.0.1:38083;
}
upstream grape_insight {
    server 127.0.0.1:38084;
}

server {
    listen 38080;
    server_name _;

    # 拒绝外部访问 /internal/*
    location /internal/ {
        deny all;
        return 404;
    }

    # Health (路由到 Insight，避免 Mgmt SPA fallback)
    location = /health {
        proxy_pass http://grape_insight;
        proxy_set_header Host $host;
    }
    location = /api/ping {
        proxy_pass http://grape_worker;
        proxy_set_header Host $host;
    }

    # Worker API (rta_ token 认证)
    location /api/runtime/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Worker task endpoints
    location /api/tasks/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Webhook / A2A → Event
    location /api/webhook/ {
        proxy_pass http://grape_event;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/a2a {
        proxy_pass http://grape_event;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/events/ {
        proxy_pass http://grape_event;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Insight (dashboard / observability)
    location /api/dashboard/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/obs/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/search {
        proxy_pass http://grape_insight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/latency {
        proxy_pass http://grape_insight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE streams (Mgmt 代理 Runtime 的 task_messages)
    location /api/task-logs/ {
        proxy_pass http://grape_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # 默认 → Mgmt
    location / {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
