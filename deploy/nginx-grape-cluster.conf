# Grape 四进程 nginx 反代配置 — 统一入口 :38080
upstream grape_mgmt {
    server 127.0.0.1:38081;
}
upstream grape_event {
    server 127.0.0.1:38082;
}
upstream grape_worker {
    # Issue #3969：worker 上游多实例互备。对等主控 worker 端点由部署写入
    # /etc/nginx/conf.d/grape-cluster-worker-peers.conf（文件缺省不存在 = 仅本机）。
    server 127.0.0.1:38083 max_fails=2 fail_timeout=10s;
    include /etc/nginx/conf.d/grape-cluster-worker-peers.conf*;
    keepalive 32;
}
upstream grape_insight {
    server 127.0.0.1:38084;
}

server {
    listen 38080;
    server_name _;

    # Issue #1616/#1052: 契约入口固化——/openapi.json 与 /static/ 显式专用 location，
    # 不落兜底 location / 漂移（实测部分部署受上层访问控制影响 /openapi.json 403、
    # /static/openapi.json 404/200 不一致）。契约必须实时下发，禁缓存（no-cache），
    # 避免 CDN/代理把旧契约发给 CLI（grape refresh 依赖实时全量契约）。
    location = /openapi.json {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }


    location /internal/ {
        deny all;
        return 404;
    }

    location = /health {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location = /api/ping {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
    }

    # Issue #3969：幂等端点允许网关级 http_502 切换（non_idempotent）；其余 POST 仅连接级重试。
    location ~ ^/api/runtime/(heartbeat|heartbeat-v2|register|tasks/[^/]+/state)$ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }
    location /api/runtime/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Issue #3969：多上游故障切换 + keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }
    location /api/tasks/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    location /api/webhook/ {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
    }
    location /api/a2a {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
    }

    location /api/dashboard/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location /api/obs/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location /api/search {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location /api/latency {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }

    location /api/task-logs/ {
        proxy_pass http://grape_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
