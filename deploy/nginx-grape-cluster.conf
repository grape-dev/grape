# Grape 四进程 nginx 反代配置 — 统一入口 :38080
# Issue #3847：WS 升级与 upstream keepalive 共存。location 内一旦出现任何
# proxy_set_header，server 级（nginx-grape-upstream.inc）的 Connection 设置即被整体覆盖，
# 故升级类 location 统一用本 map：客户端发起 Upgrade 时发 Connection: upgrade，
# 普通请求发空值（nginx 不下发 Connection 头）从而保留长连接复用。
map $http_upgrade $grape_connection_upgrade {
    default upgrade;
    ''      "";
}

upstream grape_mgmt {
    # Issue #3847：同一地址声明两次——nginx 仅在 upstream 有 ≥2 peer 时才执行
    # proxy_next_upstream 重试；单 peer 时 tries 2 是空转。第二个同址 peer 让 reload/
    # 重启窗口内被切断的 GET 请求重试一次（POST 默认不重试，不会重复写）。
    server 127.0.0.1:38081;
    server 127.0.0.1:38081;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}
upstream grape_event {
    # Issue #3847：同一地址声明两次——nginx 仅在 upstream 有 ≥2 peer 时才执行
    # proxy_next_upstream 重试；单 peer 时 tries 2 是空转。第二个同址 peer 让 reload/
    # 重启窗口内被切断的 GET 请求重试一次（POST 默认不重试，不会重复写）。
    server 127.0.0.1:38082;
    server 127.0.0.1:38082;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}
upstream grape_worker {
    # Issue #3969：worker 上游多实例互备。对等主控 worker 端点由部署写入
    # /etc/nginx/conf.d/grape-cluster-worker-peers.conf（文件缺省不存在 = 仅本机）。
    server 127.0.0.1:38083 max_fails=2 fail_timeout=10s;
    include /etc/nginx/conf.d/grape-cluster-worker-peers.conf*;
    # Issue #3847：keepalive 参数走公共片段（keepalive 32 + upstream 90s > 客户端 65s）。
    # Issue #3847：同一地址声明两次——nginx 仅在 upstream 有 ≥2 peer 时才执行
    # proxy_next_upstream 重试；单 peer 时 tries 2 是空转。第二个同址 peer 让 reload/
    # 重启窗口内被切断的 GET 请求重试一次（POST 默认不重试，不会重复写）。
    server 127.0.0.1:38083 max_fails=2 fail_timeout=10s;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}
upstream grape_insight {
    # Issue #3847：同一地址声明两次——nginx 仅在 upstream 有 ≥2 peer 时才执行
    # proxy_next_upstream 重试；单 peer 时 tries 2 是空转。第二个同址 peer 让 reload/
    # 重启窗口内被切断的 GET 请求重试一次（POST 默认不重试，不会重复写）。
    server 127.0.0.1:38084;
    server 127.0.0.1:38084;
    include conf.d/nginx-grape-upstream-keepalive.inc;
}

server {
    listen 38080;
    server_name _;

    # 后端附件上限 200MB：边缘小于它，上传先 413（upstream 模板缺失项，合入 #3847 重构后补回）
    client_max_body_size 200m;

    # Issue #3847：公共重试/连接复用策略（proxy_next_upstream + HTTP/1.1 keepalive）
    include conf.d/nginx-grape-upstream.inc;

    # Issue #1616/#1052: 契约入口固化——/openapi.json 与 /static/ 显式专用 location，
    # 不落兜底 location / 漂移（实测部分部署受上层访问控制影响 /openapi.json 403、
    # /static/openapi.json 404/200 不一致）。契约必须实时下发，禁缓存（no-cache），
    # 避免 CDN/代理把旧契约发给 CLI（grape refresh 依赖实时全量契约）。
    location = /openapi.json {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
        add_header Cache-Control "no-cache";
    }


    location /internal/ {
        deny all;
        return 404;
    }

    location = /health {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }
    location = /api/ping {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }

    # Issue #3969：幂等端点允许网关级 http_502 切换（non_idempotent）；其余 POST 仅连接级重试。
    location ~ ^/api/runtime/(heartbeat|heartbeat-v2|register|tasks/[^/]+/state)$ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }
    location /api/runtime/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Issue #3969：多上游故障切换 + keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }
    location /api/tasks/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # chat 执行端点（send/submit）走 worker，且必须关缓冲：SSE 增量下发。
    # 正则 location 优先于前缀兜底 /，chat 读端点（GET 历史/配置）仍落 mgmt。
    location ~ ^/api/chat/(send|submit) {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $grape_connection_upgrade;
        proxy_buffering off;
        # SSE 长连接口径：同仓四套模板一律 300s（见 nginx-grape-four-process.conf:178
        # 「SSE 需 proxy_buffering off / read_timeout 300s」），此处不单独放大。
        proxy_read_timeout 300s;
    }

    # webhook.router 是 APIRouter 无 prefix → 真实路径 /webhook/{provider}。
    # 旧模板写成 /api/webhook/ 是死路由（打到 mgmt 兜底 → 405），此处按代码实定位。
    location /webhook/ {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }

    # 流水线 handoff（event 独占：webhook.py 内的 POST /api/pipeline/handoff，兜底到 mgmt 会 405）
    location = /api/pipeline/handoff {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # 注意：/api/issues/{owner}/{repo} **不要**单独分流。openapi 实测 mgmt 注册 GET+POST、
    # event 仅 POST；用正则抢会给 mgmt 隐式仅有的 GET 造成 405，且 limit_except 内不允许
    # proxy_set_header（nginx -t: "directive is not allowed here"），方法级分流只能靠变量 proxy_pass
    # 丢 keepalive/多上游——得不偿失。该路径由兜底 location / → mgmt 处理，POST 同样成立。
    location /api/a2a {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }

    location /api/dashboard/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }
    location /api/obs/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }
    location /api/search {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }
    location /api/latency {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }

    location /api/task-logs/ {
        proxy_pass http://grape_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # Issue #3847：长连接复用（location 覆盖 server 级设置）
    }
}
