# Grape 四进程 nginx 反代配置 — 统一入口 :38080
upstream grape_mgmt {
    server 127.0.0.1:38081;
}
upstream grape_event {
    server 127.0.0.1:38082;
}
upstream grape_worker {
    server 127.0.0.1:38083;
}
upstream grape_insight {
    server 127.0.0.1:38084;
}

server {
    listen 38080;
    server_name _;

    location /internal/ {
        deny all;
        return 404;
    }

    location = /health {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location = /api/ping {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
    }

    location /api/runtime/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/tasks/ {
        proxy_pass http://grape_worker;
        proxy_set_header Host $http_host;
    }

    location /api/webhook/ {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
    }
    location /api/a2a {
        proxy_pass http://grape_event;
        proxy_set_header Host $http_host;
    }

    location /api/dashboard/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location /api/obs/ {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location /api/search {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }
    location /api/latency {
        proxy_pass http://grape_insight;
        proxy_set_header Host $http_host;
    }

    location /api/task-logs/ {
        proxy_pass http://grape_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://grape_mgmt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
