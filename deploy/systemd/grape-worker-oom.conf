[Service]
# Issue #4203：生产 worker 由模板单元 grape@worker.service 托管（ExecStart →
# scripts/grape-systemd-run.sh worker → scripts/start-worker.py）。内存上限与快速重启
# 参数必须落在这条路径上，否则走 grape@ 的机器拿不到 MemoryMax，OOM 仍会选中 worker
# 主进程（某主控机 24h 内多次 OOM kill）。
#
# 安装位置：/etc/systemd/system/grape@worker.service.d/30-worker-oom.conf
#   scripts/install-grape-systemd.sh 会在部署 worker 角色时自动装上本文件；
#   手工安装：install -D -m 644 deploy/systemd/grape-worker-oom.conf \
#             /etc/systemd/system/grape@worker.service.d/30-worker-oom.conf
#             systemctl daemon-reload && systemctl restart grape@worker
#
# ⚠️ 取值与 deploy/systemd/grape-worker-server.service 保持一致（两条部署路径的字面值
# 由 tests/deploy/test_issue_4203_deploy_config.py 断言相等，防漂移）。
# 待 SRE 按 004 dmesg victim 行（total-vm/rss）与实测 RSS 峰值校准后按宿主机覆盖。

# 内存边界显式化：OOM 变成可预测的 cgroup 失败而非整机风险。
# MemoryHigh=6G 软限（回收压力起峰），MemoryMax=8G 硬限（16G 主机保守默认）。
MemoryAccounting=yes
MemoryHigh=6G
MemoryMax=8G

# 秒级拉起 + 连续失败步进退避（RestartSteps 步数 × 上限封顶）。
# 原模板 RestartSec=5 是 十余秒 不可用窗口的 41%（OOM 后 12s 内 数百次 502 的主因）。
RestartSec=1
RestartSteps=5
RestartMaxDelaySec=30