# Grape gzip 配置（drop-in，放 /etc/nginx/conf.d/grape-gzip.conf）
#
# 为什么需要：nginx.conf 里 `gzip on;` 一直开着，但 `gzip_types` 整行被注释，
# 默认只压缩 text/html —— 于是 /api/issues 这类接口返回的 JSON 全程明文传输。
# 实测（2026-11-18，EIP 120.46.213.1:38080）：
#   同一接口   LAN 190ms  /  公网 1452-3271ms
#   /api/issues/mine  146928B 明文 → 12097B gzip，公网降到 145-257ms
# 这个差距足以把需求中心首屏推过前端 8s 看门狗，症状就是「一直加载中 → 加载失败」。
#
# 放在 conf.d/ 而不是改主 nginx.conf：便于随仓库分发、可幂等覆盖、不污染发行版默认配置。
# 该目录被 http 块 include，gzip_* 指令在此处合法。
#
# 注意：这里【不能】再写 `gzip on;` —— 主 nginx.conf 的 http 块已有该指令，
# 同一 http 块重复声明会让 nginx -t 报 "gzip directive is duplicate"。

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain
           text/css
           text/xml
           text/javascript
           application/json
           application/javascript
           application/xml
           application/xml+rss
           application/vnd.api+json
           image/svg+xml;
