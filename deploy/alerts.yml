# Grape Prometheus Alerting Rules
#
# 参考 multica deploy/helm/multica/templates/prometheusrule.yaml
# 使用方式：在 Prometheus / Grafana 中加载此规则文件
#   promtool check rules alerts.yml  # 验证
#   在 prometheus.yml 中 rule_files: - alerts.yml
#
groups:
  - name: grape-business
    rules:
      # 任务卡住：running 超 30 分钟
      - alert: GrapeTaskStuck
        expr: grape_task_stuck > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent task stuck (>15min running)"
          description: "{{ $value }} task(s) have been running for over 15 minutes."

      # 任务失败率：5 分钟内失败率 > 50%
      - alert: GrapeTaskFailureRateHigh
        expr: |
          sum(rate(grape_agent_task_failed_total[5m])) /
          clamp_min(sum(rate(grape_agent_task_terminal_total[5m])), 1) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Task failure rate > 50%"
          description: "More than half of terminal tasks are failing in the last 5 minutes."

      # 全部 runtime 离线
      - alert: GrapeAllRuntimesOffline
        expr: grape_runtime_online{mode="local"} + grape_runtime_online{mode="remote"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "All runtimes offline"
          description: "No runtimes (local or remote) are online. New tasks cannot execute."

      # MySQL 连接池使用率 > 80%
      # 分母必须是**配置上限** max_connections（grape_db_max_connections），
      # 不能用 Max_used_connections —— 那是历史峰值（高水位），分母用错会让比值长期贴近 1
      # 造成永久误报（实测：74/78=93.6% 报警，真实上限 8000，占用 0.93%）。
      - alert: GrapeDBPoolUsageHigh
        # 这两个值取自 MySQL SHOW GLOBAL STATUS，每个进程都会把同一份全局值报一遍
        # （实测 8 条 series）。不做聚合会同时触发 8 条同名告警，所以取 max()。
        expr: max(grape_db_threads_connected) / clamp_min(max(grape_db_max_connections), 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connection pool usage > 80%"
          description: "{{ $value | humanizePercentage }} of the configured max_connections are in use."

      # MySQL 连接中止
      - alert: GrapeDBAbortedConnects
        # 同上：全局计数器被每个进程重复上报，先 max() 再算增量，避免 8 条重复告警。
        expr: max(increase(grape_db_aborted_connects_total[10m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL aborted connections"
          description: "{{ $value }} connections aborted in the last 10 minutes."

      # HTTP 5xx 错误率
      - alert: GrapeHTTPErrorRateHigh
        expr: |
          sum(rate(grape_http_requests_total{status=~"5.."}[5m])) /
          clamp_min(sum(rate(grape_http_requests_total[5m])), 1) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate > 10%"
          description: "More than 10% of HTTP requests are returning 5xx errors."

      # 队列积压
      - alert: GrapeTaskQueueBacklog
        expr: grape_task_queued > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Task queue backlog"
          description: "{{ $value }} tasks queued for more than 10 minutes."

      # Issue #3963：同仓 repo-dispatch 租约争用（task enqueue busy）连续发生
      # 语义：入队侧等待预算（≈租约 TTL）耗尽仍未抢到租约 → execution 记
      # error_code=REPO_DISPATCH_BUSY 并 requeue 下一 tick（不判 failed、定时任务不丢）。
      # 连续 busy = 同仓临界区长期超时（#3927 db_lock 长持有）或派发风暴，需人工介入。
      # 指标 grape_repo_dispatch_busy_total 未出现（旧版本/未开 METRICS_ADDR）时规则不触发。
      - alert: GrapeRepoDispatchBusyHigh
        expr: sum by (repo) (increase(grape_repo_dispatch_busy_total[5m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repo dispatch lease busy repeated (repo={{ $labels.repo }})"
          description: "{{ $value }} repo-dispatch lease waits exhausted their budget in 5m for repo {{ $labels.repo }} — enqueue is queueing behind a long-held lease (see #3927 db_lock) and autopilot runs are being requeued; check lease_wait_seconds and db_lock hold time."

      # Issue #1938：事件回报丢失补偿频发
      # 语义：任务已终态但事件回报未落库，服务端级联收敛并自行生成/回填结论。
      # 频发 = worker 回报链路在丢消息，且事件结论已不属于 Agent 真实答复口径。
      - alert: GrapeCascadeCompensationHigh
        expr: sum by (agent_type, trigger) (increase(grape_event_cascade_compensation_total[10m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event report-missing compensation is frequent"
          description: "{{ $value }} cascade compensations in the last 10 minutes (agent={{ $labels.agent_type }}, trigger={{ $labels.trigger }}) — agent report was lost; check the worker report/callback path."
      # Issue #2085（#1297 移植）：worker contract_guard 失败信号（契约退化检出 / 缓存重建失败）
      # 语义：worker 检出 CLI 契约缓存退化（outcome=degraded），或从主控重建缓存失败
      # （outcome=rebuild_failed，worker 带退化契约继续跑，warn-only 不阻断启动）。
      # 信号经 POST /api/runtime/contract-guard/signal 落服务端指标，此前该故障仅
      # worker 日志可见，值守无从感知。
      # 排查：看 worker 日志 "contract guard" 行；~/.grape/contract-guard-alerts.jsonl
      # （上报失败兜底落点，存在即说明 worker 连不上主控/无凭据）；确认主控
      # /static/openapi.json 可达与 RUNTIME_TOKEN 有效；必要时
      # GRAPE_CONTRACT_GUARD_DISABLED=true 先停用再修复（逃生口）。
      - alert: GrapeContractGuardFailed
        expr: increase(grape_contract_guard_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker contract guard failed (contract degradation or rebuild failure)"
          description: "Contract guard reported failures in the last 10 minutes (outcome label: degraded = CLI contract cache degradation detected, rebuild_failed = full-contract rebuild from master failed). Risk: business command groups (git-repo/issues/scenes/a2a/knowledge/repos) may vanish from CLI. Check worker logs for 'contract guard', ~/.grape/contract-guard-alerts.jsonl fallback file, and master /static/openapi.json reachability."
