# Grape Prometheus Alerting Rules
#
# 参考 multica deploy/helm/multica/templates/prometheusrule.yaml
# 使用方式：在 Prometheus / Grafana 中加载此规则文件
#   promtool check rules alerts.yml  # 验证
#   在 prometheus.yml 中 rule_files: - alerts.yml
#
groups:
  - name: grape-business
    rules:
      # 任务卡住：running 超 30 分钟
      - alert: GrapeTaskStuck
        expr: grape_task_stuck > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent task stuck (>15min running)"
          description: "{{ $value }} task(s) have been running for over 15 minutes."

      # 任务失败率：5 分钟内失败率 > 50%
      - alert: GrapeTaskFailureRateHigh
        expr: |
          sum(rate(grape_agent_task_failed_total[5m])) /
          clamp_min(sum(rate(grape_agent_task_terminal_total[5m])), 1) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Task failure rate > 50%"
          description: "More than half of terminal tasks are failing in the last 5 minutes."

      # 全部 runtime 离线
      - alert: GrapeAllRuntimesOffline
        expr: grape_runtime_online{mode="local"} + grape_runtime_online{mode="remote"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "All runtimes offline"
          description: "No runtimes (local or remote) are online. New tasks cannot execute."

      # MySQL 连接池使用率 > 80%
      # 分母必须是**配置上限** max_connections（grape_db_max_connections），
      # 不能用 Max_used_connections —— 那是历史峰值（高水位），分母用错会让比值长期贴近 1
      # 造成永久误报（实测：74/78=93.6% 报警，真实上限 8000，占用 0.93%）。
      - alert: GrapeDBPoolUsageHigh
        # 这两个值取自 MySQL SHOW GLOBAL STATUS，每个进程都会把同一份全局值报一遍
        # （实测 8 条 series）。不做聚合会同时触发 8 条同名告警，所以取 max()。
        expr: max(grape_db_threads_connected) / clamp_min(max(grape_db_max_connections), 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connection pool usage > 80%"
          description: "{{ $value | humanizePercentage }} of the configured max_connections are in use."

      # MySQL 连接中止
      - alert: GrapeDBAbortedConnects
        # 同上：全局计数器被每个进程重复上报，先 max() 再算增量，避免 8 条重复告警。
        expr: max(increase(grape_db_aborted_connects_total[10m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL aborted connections"
          description: "{{ $value }} connections aborted in the last 10 minutes."

      # HTTP 5xx 错误率——分级（Issue #3847）
      # 背景：发布/热加载窗口 5xx 率 1.63%（基线 0.077%）时旧单阈值 10% 完全哑火。
      # 分级：warning ≥0.5%（发布窗口可容忍上限），critical ≥2%（需立即回滚）。
      # 阈值常量与 scripts/deploy-drain.sh 的 GATEWAY_502_THRESHOLD=0.005 保持一致。
      - alert: GrapeHTTPErrorRateWarning
        expr: |
          sum(rate(grape_http_requests_total{status=~"5.."}[5m])) /
          clamp_min(sum(rate(grape_http_requests_total[5m])), 1) > 0.005
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate > 0.5%"
          description: "More than 0.5% of HTTP requests are returning 5xx errors (baseline ~0.08%)."

      - alert: GrapeHTTPErrorRateCritical
        expr: |
          sum(rate(grape_http_requests_total{status=~"5.."}[5m])) /
          clamp_min(sum(rate(grape_http_requests_total[5m])), 1) > 0.02
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate > 2%"
          description: "More than 2% of HTTP requests are returning 5xx errors; roll back the release."

      # 网关 502 告警在 Loki 侧（deploy/loki-rules.yml，Issue #3847 审查整改）：
      # nginx 产生的 502 只落在 /var/log/nginx/access.log（alloy-config.alloy 的
      # job="nginx-access" → Loki），不进应用侧 grape_http_requests_total —— 事故时段
      # （1,173 次 502）该指标恒为 0，挂在应用指标上的网关 502 规则结构上不会触发。
      # 应用侧可见的上游 5xx 由上面两条 GrapeHTTPErrorRate* 覆盖；网关 502 请用
      # deploy/loki-rules.yml 的 GrapeGateway502RateWarning / Critical（阈值同为 0.5%/2%）。

      # Issue #3969：nginx 层 /api/runtime/ 502 率 >1%/5min
      # 语义：worker 重启/不可达时网关直接 502，runtime 控制面（心跳/注册/认领/任务态/
      # 消息/完成/标签）整体不可用。应用层 5xx 告警看不到「网关根本没转发出去」的 502，
      # 故在 nginx access.log 派生指标上单独设阈值（基线事故 1,178 次/91s）。
      - alert: GrapeRuntime502RateHigh
        expr: |
          sum(rate(nginx_upstream_502_total{path=~"/api/runtime/.*"}[5m])) /
          clamp_min(sum(rate(nginx_upstream_requests_total{path=~"/api/runtime/.*"}[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "nginx /api/runtime/ 502 rate > 1%"
          description: "{{ $value | humanizePercentage }} of /api/runtime/* requests returned 502 in the last 5 minutes — worker upstream restart/unreachable or gateway failover failure. Check nginx-gateway error log and worker /readyz."

      # Issue #3969 复审 R9：短窗绝对量突发告警。上面的 5m 比率在 91s 级事故里要等
      # 窗口铺满才触发，且低流量端点会被 clamp_min(分母,1) 稀释；这里用 2m 绝对增量兜底。
      - alert: GrapeRuntime502Burst
        expr: sum(increase(nginx_upstream_502_total{path=~"/api/runtime/.*"}[2m])) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "nginx /api/runtime/ 502 burst (>50 in 2m)"
          description: "{{ $value }} /api/runtime/* requests returned 502 in the last 2 minutes — worker restart/unreachable. Check nginx-gateway error log, worker /readyz and upstream peers."

      # 队列积压
      - alert: GrapeTaskQueueBacklog
        expr: grape_task_queued > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Task queue backlog"
          description: "{{ $value }} tasks queued for more than 10 minutes."

      # Issue #3963：同仓 repo-dispatch 租约争用（task enqueue busy）连续发生
      # 语义：入队侧等待预算（≈租约 TTL）耗尽仍未抢到租约 → execution 记
      # error_code=REPO_DISPATCH_BUSY 并 requeue 下一 tick（不判 failed、定时任务不丢）。
      # 连续 busy = 同仓临界区长期超时（#3927 db_lock 长持有）或派发风暴，需人工介入。
      # 指标 grape_repo_dispatch_busy_total 未出现（旧版本/未开 METRICS_ADDR）时规则不触发。
      - alert: GrapeRepoDispatchBusyHigh
        expr: sum by (repo) (increase(grape_repo_dispatch_busy_total[5m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repo dispatch lease busy repeated (repo={{ $labels.repo }})"
          description: "{{ $value }} repo-dispatch lease waits exhausted their budget in 5m for repo {{ $labels.repo }} — enqueue is queueing behind a long-held lease (see #3927 db_lock) and autopilot runs are being requeued; check lease_wait_seconds and db_lock hold time."

      # Issue #4081：插件代理缺插件上报降级（`report-missing` 回补闭环不可用）
      # 语义：result=degraded 表示市场契约与统一确认队列都不可用，Agent 只能回帖协商
      # 文本，补装闭环静默失效（此前该结果只有 logger.debug，值守只能翻 nginx 日志）。
      # 排查：日志 grep "plugin report-missing degraded"；核对 plugin_install_requests
      # 表与 src.api.plugin_market.create_plugin_install_request 可用性。
      - alert: GrapePluginMissingReportDegraded
        expr: sum by (result) (increase(grape_plugin_missing_report_total{result="degraded"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plugin missing report degraded (comment fallback)"
          description: "{{ $value }} report-missing submissions fell back to the comment channel in the last 10 minutes — the unified install-confirmation queue / plugin market contract is unavailable, so the missing-plugin discovery-to-refill loop is silent for the reporting agent."

      # Issue #4081：插件代理端点不可用（本构建未实现 / 旧构建裸 404-405）
      # 语义：第一分支 grape_plugin_agent_unimplemented_total 由 /api/plugins/agent/*
      # 的路由级兜底自增（501 NOT_IMPLEMENTED，不再裸 404/405）；第二分支兜住未升级
      # 的旧构建——已登记路由模板上出现 404/405/501 说明「客户端在调、服务端不认」。
      # 排查：GET /api/ping 看 plugin_agent.available / missing_operations；对比发布版本
      # （生产 8081 是否包含 src/domains/mgmt/routes/plugins_agent.py）。
      - alert: GrapePluginAgentEndpointMissing
        expr: |
          sum by (method) (increase(grape_plugin_agent_unimplemented_total[10m])) > 0
          or
          sum(rate(grape_http_requests_total{route=~"/api/plugins/agent/.*", status=~"404|405|501"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plugin agent endpoint unavailable (404/405/501)"
          description: "Plugin-agent calls are being answered as not-implemented (501) or 404/405 in the last minutes — the running build does not serve /api/plugins/agent/* for the calling runtime. Risk: missing-plugin discovery and install negotiation are dead on every runtime host. Check GET /api/ping plugin_agent block and the deployed build version."

      # Issue #1938：事件回报丢失补偿频发
      # 语义：任务已终态但事件回报未落库，服务端级联收敛并自行生成/回填结论。
      # 频发 = worker 回报链路在丢消息，且事件结论已不属于 Agent 真实答复口径。
      - alert: GrapeCascadeCompensationHigh
        expr: sum by (agent_type, trigger) (increase(grape_event_cascade_compensation_total[10m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event report-missing compensation is frequent"
          description: "{{ $value }} cascade compensations in the last 10 minutes (agent={{ $labels.agent_type }}, trigger={{ $labels.trigger }}) — agent report was lost; check the worker report/callback path."
      # Issue #2085（#1297 移植）：worker contract_guard 失败信号（契约退化检出 / 缓存重建失败）
      # 语义：worker 检出 CLI 契约缓存退化（outcome=degraded），或从主控重建缓存失败
      # （outcome=rebuild_failed，worker 带退化契约继续跑，warn-only 不阻断启动）。
      # 信号经 POST /api/runtime/contract-guard/signal 落服务端指标，此前该故障仅
      # worker 日志可见，值守无从感知。
      # 排查：看 worker 日志 "contract guard" 行；~/.grape/contract-guard-alerts.jsonl
      # （上报失败兜底落点，存在即说明 worker 连不上主控/无凭据）；确认主控
      # /static/openapi.json 可达与 RUNTIME_TOKEN 有效；必要时
      # GRAPE_CONTRACT_GUARD_DISABLED=true 先停用再修复（逃生口）。
      - alert: GrapeContractGuardFailed
        expr: increase(grape_contract_guard_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker contract guard failed (contract degradation or rebuild failure)"
          description: "Contract guard reported failures in the last 10 minutes (outcome label: degraded = CLI contract cache degradation detected, rebuild_failed = full-contract rebuild from master failed). Risk: business command groups (git-repo/issues/scenes/a2a/knowledge/repos) may vanish from CLI. Check worker logs for 'contract guard', ~/.grape/contract-guard-alerts.jsonl fallback file, and master /static/openapi.json reachability."

      # Issue #4065：任务结果评论投递失败（reason 枚举：non_numeric_ident/http_4xx/
      # http_5xx/network/unknown）
      # 语义：agent 任务跑完但结果评论发不出去 → 用户与看板看不到结论（此前只有一条
      # WARNING，1 小时 7 次结果静默丢失）。任何 reason 的失败增量都要人看一眼：
      # non_numeric_ident 说明仍有非数字 ident 漏过归一（不该出现，出现即回归）；
      # http_4xx 多为 token/权限/参数形态；http_5xx 为上游故障。
      # 排查：日志 grep "failed to post result comment" / "RESULT_COMMENT_SKIPPED"。
      - alert: GrapeResultCommentPostFailed
        expr: increase(grape_comment_post_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Result comment post failed (reason={{ $labels.reason }})"
          description: "{{ $value }} result comments failed to post in the last 10 minutes (reason={{ $labels.reason }}). Risk: task results are invisible to users and the dashboard. Check worker/master logs for 'failed to post result comment' and the target repo credentials."

      # Issue #4065：同一仓库结果评论连续失败（默认阈值 5，GRAPE_COMMENT_POST_FAIL_ALERT_THRESHOLD）
      # 语义：**连续**失败 = 不是偶发抖动而是链路坏了（token 失效/仓库被删/ident 形态错），
      # 成功投递即清零。达阈值时进程内同时打 ERROR 结构化行
      # `RESULT_COMMENT_ALERT consecutive=N threshold=N reason=...`（worker 不暴露
      # /metrics，Loki 侧靠这行兜底）。
      - alert: GrapeResultCommentPostConsecutiveFailures
        expr: grape_comment_post_consecutive_failures >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Result comment posting keeps failing (repo={{ $labels.repo_key }})"
          description: "repo {{ $labels.repo_key }} has {{ $value }} consecutive result-comment post failures — not transient. Verify the repo bot credentials (bot identity token), the repo's existence/visibility, and whether the ident form is still deliverable. Check logs for 'RESULT_COMMENT_ALERT'."

      # Issue #4082：worker 标签探活连续失败（runtime 在线但拿不到标签 → 派发依据为空）
      # 语义：worker 以 host+reason 上报连续 N 次探活失败（N=RUNTIME_TAGS_PROBE_ALERT_AFTER，
      # 默认 3）；每条上报本身已代表「≥3 次连续失败」（之后每 3 次再报），故 15m 内出现
      # ≥1 次上报即告警（for: 5m 去抖），而非累计 ≥3 次上报（那需约 9 次连续失败）。
      # reason 区分 id_missing（未注册/注册回包未回填真实 id，本条缺陷主犯）/
      # unauthorized（401，凭据或归属不对，**不是**凭据吊销）/ not_found（runtime 行已删）/
      # no_tags（已注册但一个标签都没有，引擎 role_tags/scene_tags 为空）/
      # other（契约外失败如 HTTP 403/422，worker 归并桶，原始 reason 见 worker/服务端日志）。
      # 排查：worker 日志 "RUNTIME_ID_MISSING" 与 "runtime tags probe"；
      # ~/.grape/runtime-tags-probe-alerts.jsonl（存在即上报链路自身不可用）；
      # 控制台「引擎标签」是否有配置；reason=id_missing 时核对 GRAPE_RUNTIME_ID 与注册回包。
      # reason=unknown 不参与本告警：那是服务端兜底桶（连 worker 都没能归类），只计数不告警，避免噪声。
      - alert: GrapeRuntimeTagsProbeFailing
        expr: sum by (host, reason) (increase(grape_runtime_tags_probe_failure_total{reason!="unknown"}[15m])) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Runtime tags probe failing repeatedly (host={{ $labels.host }}, reason={{ $labels.reason }})"
          description: "A worker reported >=3 consecutive runtime tags probe failures in 15m (reason={{ $labels.reason }}): id_missing = no valid runtime id (registration reply not backfilled, check GRAPE_RUNTIME_ID), unauthorized = 401 on probe (config/ownership, not credential revocation), not_found = runtime row deleted or in re-derive window, no_tags = registered engine without claimable tags (empty role_tags/scene_tags breaks dispatch), other = non-contract HTTP failure bucketed by the worker (raw reason in worker/server logs). Check worker logs for RUNTIME_ID_MISSING / 'runtime tags probe', ~/.grape/runtime-tags-probe-alerts.jsonl fallback, and console engine tags."

      # Issue #3749：worker trace 中继 503 持续 5min
      # 语义：主控 OTLP_RELAY_TARGET 未配置（禁用态，确定性分支）或上游 LGTM 不可达；
      # worker 的 OTLP/HTTP span 全部被拒 → Tempo 缺根 span、跨进程调用链断裂。
      # 排查：启动日志 "[trace-relay] selfcheck"，进程环境变量 / EnvironmentFile 的
      # OTLP_RELAY_TARGET（LGTM OTLP/HTTP 基址，不含 /v1/traces），以及 LGTM :4318 可达性。
      - alert: GrapeTraceRelayRejected
        expr: sum(rate(grape_trace_relay_requests_total{status="503"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker trace relay rejected with 503 (OTLP_RELAY_TARGET unset or LGTM unreachable)"
          description: "POST /api/runtime/traces has returned 503 for 5 minutes: OTLP_RELAY_TARGET is not configured (trace relay disabled) or the LGTM OTLP endpoint is failing. Worker spans are dropped, so Tempo traces for service.name=grape-worker lose their root span. Check the master startup log line '[trace-relay] selfcheck' and the OTLP_RELAY_TARGET entry in the process environment / systemd EnvironmentFile."

      # Issue #3749：中继上游不可达（LGTM 网络/端口问题，与配置缺失区分开）
      - alert: GrapeTraceRelayUnreachable
        expr: sum(rate(grape_trace_relay_requests_total{status="relay_unreachable"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trace relay cannot reach LGTM"
          description: "The master failed to POST to <OTLP_RELAY_TARGET>/v1/traces for 5 minutes (502 lgtm unreachable). Check LGTM :4318 reachability from the master (security group / process health)."

      # Issue #3773：hermes ACP state.db 体积治理（worker 心跳上报，按 host 聚合）
      # state.db 超阈值会触发就地清理；清理失败或仍超阈值时归档重建并跳过 resume。
      # 阈值与代码默认口径对齐：50MB = ACP_STATE_DB_MAX_MB，100MB = 2x 阈值；
      # 若在 worker 上覆盖 ACP_STATE_DB_MAX_MB，请同步调整这两条 expr（Alertmanager
      # 无法读取 worker 环境变量，只能在此声明式对齐）。
      - alert: GrapeAcpStateDbTooLarge
        expr: grape_acp_state_db_bytes > 52428800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "hermes ACP state.db exceeds 50MB"
          description: "host={{ $labels.host }} state.db={{ $value }} bytes (>50MB for 10m). Cleanup should prune old sessions and VACUUM; check cleanup_total{result=\"failed\"} and worker logs for ACP_RESUME_SKIPPED."
      - alert: GrapeAcpStateDbCritical
        expr: grape_acp_state_db_bytes > 104857600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "hermes ACP state.db exceeds 100MB"
          description: "host={{ $labels.host }} state.db={{ $value }} bytes (>100MB for 5m). Immediate risk of skipped resume / disk pressure; run scripts/ops/hermes_acp_state_db_cleanup.py --dry-run then cleanup."
      - alert: GrapeAcpResumeSkipped
        # increase 窗口已覆盖 15m 判定，不再叠加 for:15m（否则最长 30m 才触发）。
        expr: increase(grape_acp_resume_skipped_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "hermes ACP resume is being skipped"
          description: "host={{ $labels.host }} skipped resume {{ $value }} times in 15m because state.db stayed too large; session context is being lost. Check cleanup_total{result} and state.db bytes."

      # Issue #3772：no_progress 无进展检测扫描连续失败
      # 语义：扫描入口异常被吞后 return 0 = 本轮不检测；若只留 WARNING，检测停摆不可见
      # （实测：MySQLCompatCursor 缺迭代协议时，多台主控每小时恒数十至数百条失败）。
      # 阈值：扫描周期 60s，5 分钟内累计 5 次失败 ≈ 连续停摆 5 个周期。
      # 排查：scheduler 日志 "no_progress: scan running tasks failed"；确认 DB 后端
      # cursor 迭代/上下文协议与 SQL 方言；修复后指标增量应归零。
      - alert: GrapeNoProgressScanFailing
        expr: increase(grape_no_progress_scan_failures_total[5m]) >= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "No-progress task scan is failing repeatedly"
          description: "The no_progress sweep has failed at least 5 times in 5 minutes, so stuck running tasks may never be auto-requeued. Check master scheduler logs for 'no_progress: scan running tasks failed', then verify the DB backend cursor iteration/context protocol and SQL dialect."
      # Issue #3905：运行时 env 契约三变量（ACCOUNT/GRAPE_ISSUE_ID/GRAPE_WORK_BRANCH）
      # 持续缺失。语义：issue 任务全程 degraded env（拿不到内部卡片 id 与场景基线，
      # A2A 交办无 account 主体）。修复后本指标增量应归零。
      # 排查：指标按 backend/agent_type/var 拆分定位丢 env 的派发路径；
      # 服务端日志 "runtime env contract missing" / "on N consecutive tasks"；
      # 核对 agent_tasks.env_extra 快照是否为空（direct/failed 快照组装，Issue #3905）。
      - alert: GrapeRuntimeEnvContractMissing
        expr: sum by (var) (increase(grape_runtime_env_contract_missing_total[30m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Runtime env contract variable {{ $labels.var }} keeps missing"
          description: "{{ $labels.var }} was missing on at least 10 task starts in 30m after the fallback chain, so issue/autopilot tasks run with a degraded env. Query grape_runtime_env_contract_missing_total by backend/agent_type to find the dispatch path, then check agent_tasks.env_extra snapshot assembly (Issue #3905)."
      # Issue #4203：内核 OOM killer 选中本机任一进程即 P1（critical，值班立即响应）。
      # 语义：<host> 曾 24h 内多次 OOM kill，前 3 次选中引擎子进程（无外显），
      # 第 4 次选中 worker 主进程才 数百次 502 + 终态/消息回执丢失。任何增量都说明
      # 进程内存失控或 cgroup 限额(MemoryMax)生效，必须当场取证。
      # 排查：dmesg -T | grep -i -E "oom|killed process" 取 victim 名称与 total-vm/rss；
      # systemctl show grape-worker-server -p MemoryMax,MemoryHigh,MemoryAccounting；
      # /metrics 的 grape_process_memory_rss_bytes / grape_engine_child_rss_bytes 定位
      # 是主进程还是引擎子进程在长。
      - alert: GrapeWorkerOOMKilled
        expr: increase(node_vmstat_oom_kill[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OOM killer killed a process on {{ $labels.instance }}"
          description: "node_vmstat_oom_kill increased on {{ $labels.instance }}: the kernel OOM killer fired within the last hour. Grab `dmesg -T | grep -i -E 'oom|killed process'` for the victim (total-vm/rss), check worker cgroup limits via `systemctl show grape-worker-server -p MemoryMax,MemoryHigh,MemoryAccounting`, and watch grape_process_memory_rss_bytes / grape_engine_child_rss_bytes to locate the growth source. See Issue #4203."

      # Issue #4203：worker 进程 RSS 距 cgroup 上限 < 20%（ratio > 0.8）持续 10 分钟。
      # 分母是 grape_process_memory_limit_bytes（cgroup memory.max）；未设限额时该序列
      # 恒为 0、ratio 恒为 0，本规则不触发（由启动日志 WARNING 与 unbounded=1 序列兜底）。
      - alert: GrapeProcessMemoryNearLimit
        expr: grape_process_memory_ratio{process="worker"} > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker process RSS near cgroup memory limit ({{ $labels.process }})"
          description: "RSS of process {{ $labels.process }} has been above 80% of its cgroup memory limit for 10 minutes — approaching MemoryMax, an OOM kill is imminent. Check grape_process_memory_rss_bytes vs grape_process_memory_limit_bytes and long-running tasks' engine children (grape_engine_child_rss_bytes). See Issue #4203."

      # Issue #4203：worker RSS 30 分钟持续增长（斜率为正且增量超 512MiB）。
      # 语义：接近上限的比值是「快撞了」，本条抓「还在一直涨」——泄漏类增长在撞限前
      # 就该被看到（004 事故 RSS 爬升数小时无人感知）。deriv>0 连续 30m + 增量阈值
      # 双条件去抖，避免正常业务波动误报。
      - alert: GrapeWorkerRSSGrowth
        expr: |
          deriv(grape_process_memory_rss_bytes{process="worker"}[30m]) > 0
          and increase(grape_process_memory_rss_bytes{process="worker"}[30m]) > (512 * 1024 * 1024)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker process RSS keeps growing ({{ $labels.process }})"
          description: "RSS of process {{ $labels.process }} grew by more than 512MiB over the last 30 minutes with a consistently positive slope — memory leak or runaway task suspected. Correlate with grape_engine_child_rss_bytes per engine and long-running agent tasks. See Issue #4203."

      # Issue #3750：同仓库 webhook 验签 token 不匹配速率 > 10/min 且持续 5 分钟。
      # 被 403 丢弃的 webhook **不会重放**（Push Hook 丢失 → PR 关联 / push 触发 / 巡检 pipeline
      # 漏事件且无补偿），典型成因是该仓库残留旧 secret / 测试 hook / 镜像 hook 仍在投递。
      # 定位：grape-webhook 日志 `Webhook rejected: token mismatch for repo=... event=...
      # token_fp=sha256:xxx expected_fp=sha256:yyy reason=mismatch ip=...`，或按 (ip, token_fp)
      # 反查 obs_webhook_rejects；处置：核查 GitCode 仓库 webhook 列表，删除/统一旧 secret。
      - alert: GrapeWebhookTokenMismatch
        expr: sum by (repo) (increase(grape_webhook_token_mismatch_total[1m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Webhook token mismatch for {{ $labels.repo }} (>10/min)"
          description: "More than 10 webhook requests per minute for repo {{ $labels.repo }} were rejected with a token mismatch for 5 minutes. Those events were dropped and will not be replayed. Correlate `token_fp=`/`expected_fp=` fingerprints in the webhook log or look up `obs_webhook_rejects` by (ip, token_fp), then remove the stale webhook secret on the platform side. See Issue #3750."
