<script>
// Early theme application — prevents flash of unstyled content (FOUC).
// Reads localStorage 'grapeTheme' before DOM renders. Default: Liquid Glass (apple).
(function(){var t=localStorage.getItem('grapeTheme');if(t!=='apple'){t='apple';localStorage.setItem('grapeTheme','apple');}document.documentElement.setAttribute('data-theme','apple');var m=localStorage.getItem('grapeThemeMode')||'light';if(m){document.documentElement.setAttribute('data-theme-mode',m);}})();
// Early auth check — prevents login/workbench flash on page load.
// Checks localStorage (returning user), URL ?token= (legacy OAuth), or ?exchange_code= (new OAuth).
(function(){var p=new URLSearchParams(location.search);if(localStorage.getItem('token')||p.get('token')||p.get('exchange_code'))document.documentElement.setAttribute('data-logged-in','1');})();
// Early i18n loading — hide [data-i18n] elements until i18n.js applies translations.
// Only for non-zh users (zh fallback text in HTML is already correct).
(function(){var lang=localStorage.getItem('grapeLang')||((location.pathname.indexOf('/en')===0)?'en':'zh');if(lang!=='zh')document.documentElement.classList.add('i18n-loading');window.__I18N_CACHE_VER__='80';})();
// i18n 加载超时兜底：5 秒后强制移除隐藏状态
setTimeout(function(){document.documentElement.classList.remove('i18n-loading');},5000);
</script>

<script>
// i18n.js is loaded with defer in <head> — it auto-inits.
// Here we only update language switch labels after DOMContentLoaded.
// ===== 启动看门狗（本地加固，内联执行：即使 app.js 加载/执行失败也能兜底）=====
// 现象：个别浏览器状态会让 #pageContent 永远停在「加载中...」且不发任何 API 请求。
// 15s 未渲染任何视图 → 首次清站点缓存重载一次；仍失败 → 明确报错 + 一键清登录态。
(function () {
  setTimeout(function () {
    try {
      if (window._currentView) return;
      var pc = document.getElementById('pageContent');
      if (!pc || !pc.querySelector('.loading')) return;
      var last = 0;
      try { last = parseInt(sessionStorage.getItem('boot_retry_at') || '0', 10) || 0; } catch (e) {}
      if (Date.now() - last > 60000) {
        try {
          sessionStorage.setItem('boot_retry_at', String(Date.now()));
          localStorage.removeItem('app_cache_ver');
          sessionStorage.removeItem('currentRepo');
        } catch (e) {}
        console.warn('[boot-watchdog] 页面初始化超时，清理站点缓存后重载');
        window.location.reload();
        return;
      }
      pc.innerHTML = '<div style="padding:32px;max-width:520px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center">' +
        '<div style="font-size:15px;font-weight:600;color:#1d1d1f;margin-bottom:8px">页面初始化超时</div>' +
        '<div style="font-size:13px;color:#6e6e73;line-height:1.6;margin-bottom:16px">前端脚本未能完成启动（已自动重试过一次）。请点下方按钮清除本地登录态后重新登录。</div>' +
        '<button onclick="try{localStorage.clear()}catch(e){};try{sessionStorage.clear()}catch(e){};location.reload()" ' +
        'style="padding:10px 18px;border:none;border-radius:10px;background:#0071e3;color:#fff;font-size:13px;font-weight:600;cursor:pointer">清除登录态并重新加载</button>' +
        '</div>';
    } catch (e) { /* 看门狗不得影响页面 */ }
  }, 15000);
})();
document.addEventListener('DOMContentLoaded', function(){
  _updateLoginLangLabel();
  _updateAppLangLabel();
});
// 语言切换按钮：根据当前语言显示"EN"或"中文"（与 auth.js _updateLangSwitch 逻辑一致）
function _updateLoginLangLabel(){
  var el=document.getElementById('langSwitchLabel');
  if(!el)return;
  var lang=I18N.getLang();
  var key='app.login.'+(lang==='zh'?'lang_switch_en':'lang_switch_zh');
  var val=I18N.t(key);
  if(!val||val===key) val=lang==='zh'?'EN':'中文';
  el.textContent=val;
}
function _toggleLoginLang(){
  var newLang=I18N.getLang()==='zh'?'en':'zh';
  I18N.setLang(newLang).then(function(){
    _updateLoginLangLabel();
  });
}
// 应用内语言切换（双按钮模式，借鉴 grape.example.com）
function _updateAppLangLabel(){
  var lang = I18N.getLang();
  // 更新所有语言切换组件的 active 状态
  ['tbLangToggle', 'lobbyLangToggle'].forEach(function(toggleId) {
    var toggle = document.getElementById(toggleId);
    if (!toggle) return;
    var btns = toggle.querySelectorAll('.lang-btn');
    btns.forEach(function(btn) {
      var btnLang = btn.textContent.trim() === '中' ? 'zh' : 'en';
      var isActive = btnLang === lang;
      btn.classList.toggle('active', isActive);
      if (isActive) {
        btn.style.background = 'var(--a)';
        btn.style.color = '#fff';
      } else {
        btn.style.background = 'none';
        btn.style.color = 'var(--t3)';
      }
    });
  });
  // 兼容登录页单按钮
  var loginLabel = document.getElementById('langSwitchLabel');
  if (loginLabel) {
    loginLabel.textContent = lang === 'zh' ? 'EN' : '中文';
  }
}
function _setAppLang(lang){
  if (lang === I18N.getLang()) return;
  // I18N.setLang 内部调 applyI18nToDOM 更新所有 [data-i18n] 元素文本
  // 引导页动态内容已加 data-i18n 标记，不需要重新渲染
  I18N.setLang(lang).then(function(){
    _updateAppLangLabel();
  });
}
function _toggleAppLang(){
  var newLang = I18N.getLang() === 'zh' ? 'en' : 'zh';
  _setAppLang(newLang);
}
// 需求3: 重置密码成功后跳转登录页时显示提示
// 等 I18N 加载完成后再显示（避免 I18N.t 返回原始 key）
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get('reset')==='1'){
    // 清理 URL 参数（防止刷新重复触发）
    if(window.history.replaceState){
      window.history.replaceState(null,'',window.location.pathname);
    }
    function _showResetNotice(){
      // 用 Toast 而不是错误元素（避免误导用户以为输入有错）
      if(typeof app!=='undefined' && app.showToast){
        app.showToast(I18N.t('app.login.toast_password_reset_notice'), '', 5000);
      } else {
        // app.js 尚未加载（登录页场景）— 用 inline toast 兜底
        var t=document.createElement('div');
        t.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:10px;background:rgba(0,0,0,0.8);color:#fff;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.2);max-width:90vw;text-align:center';
        t.textContent=I18N.t('app.login.toast_password_reset_notice');
        document.body.appendChild(t);
        setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},5000);
      }
    }
    // 等 I18N 内联 pack 就绪（init 在 DOMContentLoaded 里同步填充内联 pack）
    if(typeof I18N!=='undefined' && I18N.isLangLoaded && I18N.isLangLoaded(I18N.getLang())){
      _showResetNotice();
    } else if(typeof I18N!=='undefined'){
      // 等 DOMContentLoaded 触发 I18N.init
      document.addEventListener('DOMContentLoaded',function(){
        setTimeout(_showResetNotice, 200);
      });
    } else {
      // I18N 完全未加载 — 1 秒后兜底
      setTimeout(_showResetNotice, 1000);
    }
  }
})();
</script>
