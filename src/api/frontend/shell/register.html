<!DOCTYPE html>
<html lang="zh-CN" data-page-title="title_register">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title data-i18n="app.login.title_register">注册 — Grape</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-180.png">
<link rel="stylesheet" href="/static-vue/assets/css/app.css?v=10">
<link rel="stylesheet" href="/static-vue/assets/css/auth.css?v=1">
<script>
(function(){var t=localStorage.getItem('grapeTheme');if(t!=='apple'){t='apple';localStorage.setItem('grapeTheme','apple');}document.documentElement.setAttribute('data-theme','apple');var m=localStorage.getItem('grapeThemeMode')||'light';if(m){document.documentElement.setAttribute('data-theme-mode',m);}})();
(function(){var lang=localStorage.getItem('grapeLang')||((location.pathname.indexOf('/en')===0)?'en':'zh');if(lang!=='zh')document.documentElement.classList.add('i18n-loading');window.__I18N_CACHE_VER__='58';})();
// i18n 加载超时兜底：5 秒后强制移除隐藏状态
setTimeout(function(){document.documentElement.classList.remove('i18n-loading');},5000);
</script>
<style>
html.i18n-loading [data-i18n]{visibility:hidden}
html.i18n-loading [data-i18n-placeholder]::placeholder{color:transparent}
/* FOUC fix: CSS class drives visibility at HTML parse time (F22/F23) */
.email-not-configured #stepIndicator,
.email-not-configured #emailField { display: none !important; }
</style>
<script src="/static/js/i18n.js?v=20261117-1" defer></script>
</head>
<body>

<div class="auth-page" id="authPage">
<!-- 注册卡片 = Vue 组件宿主（RegisterView.vue）。表单 id / Auth 全局 / 分步流程契约不变。 -->
<div id="registerVueHost"></div>
</div>

<script src="/static/js/api.js?v=36"></script>
<script src="/static/js/pwd-blocklist.js?v=3" defer></script>
    <script src="/static/js/auth.js?v=8"></script>
<script>Auth.initI18n();</script>
<script type="module" src="/static-vue/viewjs/register-view.js?v=1"></script>
</body>
</html>
