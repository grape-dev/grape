kquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| Query | <code>page<\u002fcode>（默认 1）、<code>page_size<\u002fcode>（默认 20，上限 50） |<br />\n| 出参 | <code>{comments: [{id, user_id, user_name, content, created_at}], total, page, page_size}<\u002fcode>（最新在前） |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-post-apiskillsby-idskill_idcomments\">POST /api/skills/by-id/{skill_id}/comments — 发表评论<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403；需登录）<br />\noperation_id=<code>skills_comments_create<\u002fcode>（Issue #3168 D11：纯文本评论，≤1000 字）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| Body | <code>{content: string}<\u002fcode>（必填，≤1000 字） |<br />\n| 出参 | <code>{comment: {id, user_id, user_name, content, created_at}}<\u002fcode> |<br />\n| 返回 | 200；400（空/超长）；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-patch-apiskillsskill_id\">PATCH /api/skills/{skill_id} — 免传包更新元信息<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\noperation_id=<code>skills_patch_meta<\u002fcode>（Issue #3202：tags/summary/description/category/agent_type<br />\n原地更新，不产生新版本行；与 <code>POST /api/skills/by-id/{skill_id}/update<\u002fcode>（需重传 ZIP 包）<br />\n互补，权限口径一致：official 403、user 本人、repo 托管人）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| Body | <code>{tags?, summary?, description?, category_id?, cat_l1_id?, cat_l2_id?, agent_type?, clear_category?, intro?}<\u002fcode>（至少一项） |<br />\n| 出参 | <code>{message, skill_id, summary, tags, agent_type, category_id, cat_l1_id, cat_l2_id, ...}<\u002fcode>（updated_at 已刷新） |<br />\n| 返回 | 200；400（无字段/非法值）；403；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-post-apiskillsupload\">POST /api/skills/upload — 上传技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>——用户（<code>grape_<\u002fcode> API Key / JWT）可传个人或仓库技能；<br />\n会话 token（<code>tk_<\u002fcode>）仅支持 <strong>scope=repo<\u002fstrong> 且 <code>repo<\u002fcode> 必须与 token 绑定的仓库一致（越权 → 403）。<br />\nCLI：<code>grape skills upload<\u002fcode>（命令路径即端点，见 README「CLI 命令映射」）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>multipart/form-data<\u002fcode>，字段：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>file<\u002fcode><\u002ftd>\n<td>ZIP<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>技能包（校验通过后落盘/存 OBS）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scope<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td><code>user<\u002fcode>（个人技能，默认）/ <code>repo<\u002fcode>（仓库技能）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">repo 时必填<\u002ftd>\n<td>仓库技能归属仓库（<code>owner/repo<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent_type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>技能类型（vod/issue/coding/qa/sre/chat）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p><strong>owner 由服务端派生，不接受客户端传入<\u002fstrong>：<br />\n- <code>scope=user<\u002fcode> → 归属 <code>user[\"id\"]<\u002fcode>（当前登录用户）<br />\n- <code>scope=repo<\u002fcode> → 归属 <code>repo<\u002fcode>（repo_key）<\u002fp>\n<p>客户端<strong>不传 owner_id<\u002fstrong>——owner 是服务端鉴权后的身份（技能所有者），若允许客户端指定会破坏越权隔离<br />\n（他人 token 可借 owner_id 写他人段）。user 技能与 token 身份天然绑定，不存在「token 与 owner 不一致」。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"message\": \"...\", ...}<\u002fcode> |<br />\n| 返回 | 200；400 包结构非法/scope 非法/agent_type 非法；409 同名冲突；502 OBS 存储失败 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-delete-apiskillsby-idskill_id\">DELETE /api/skills/by-id/{skill_id} — 删除技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills delete --id {skill_id}<\u002fcode>（operation_id=<code>skills_delete<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| 返回 | 200/204；400 被引用；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillstemplate-zip\">GET /api/skills/template — 技能模板 ZIP<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills template<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | ZIP（含 my-skill/ 示例） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsskill_idsub\">GET /api/skills/{skill_id}/sub — 子技能列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）<br />\nCLI：<code>grape skills sub --id {skill_id}<\u002fcode>（operation_id=<code>skills_sub_list<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"05-skills-get-apiskillsskill_idsubsub_name\">GET /api/skills/{skill_id}/sub/{sub_name} — 读子技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（同左；agent 运行时按需加载子技能）<br />\nCLI：<code>grape skills sub get --id {skill_id} --name {sub_name}<\u002fcode>（operation_id=<code>skills_sub_get<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"05-skills-get-apiskillspackage-subpkg_idsub_name\">GET /api/skills/package-sub/{pkg_id}/{sub_name} — 包内子技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（同左）<br />\nCLI：<code>grape skills package-sub --package {pkg_id} --name {sub_name}<\u002fcode>（operation_id=<code>skills_package_sub_get<\u002fcode>）。<\u002fp>\n<p>子技能接口返回 SKILL.md/references 内容，供 agent 运行时按需加载（三端点 session token 均可读）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"05-skills-post-apiskillsskill_idlike\">POST /api/skills/{skill_id}/like — 点赞技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills like --id {skill_id}<\u002fcode>（operation_id=<code>skills_like_toggle<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"liked\": true, \"likes\": n}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-post-apiskillsconvert\">POST /api/skills/convert — 转换技能（跨模式）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills convert --json '{\"skill_name\":\"x\",\"repo\":\"owner/repo\"}'<\u002fcode>（operation_id=<code>skills_convert<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（ConvertSkillRequest）：<code>{\"skill_name\": \"x\", \"repo\": \"owner/repo\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200；400 |<\u002fp>", "toc": [{"level": 2, "id": "05-skills-get-apiskills", "name": "GET /api/skills — 技能列表"}, {"level": 2, "id": "05-skills-get-apiskillscategories", "name": "GET /api/skills/categories — 技能分类"}, {"level": 2, "id": "05-skills-get-apiskillstag-suggest", "name": "GET /api/skills/tag-suggest — 技能标签推荐"}, {"level": 2, "id": "05-skills-get-apiskillsagent-stats-agent", "name": "GET /api/skills/agent-stats — Agent 维度技能统计"}, {"level": 2, "id": "05-skills-get-apiskillsfeatured", "name": "GET /api/skills/featured — 精选技能"}, {"level": 2, "id": "05-skills-get-apiskillsstats", "name": "GET /api/skills/stats — 技能统计"}, {"level": 2, "id": "05-skills-get-apiskillssearch", "name": "GET /api/skills/search — 搜索技能"}, {"level": 2, "id": "05-skills-get-apiskillsby-idskill_id", "name": "GET /api/skills/by-id/{skill_id} — 技能详情"}, {"level": 2, "id": "05-skills-get-apiskillsby-idskill_iddownload-zip", "name": "GET /api/skills/by-id/{skill_id}/download — 下载技能 ZIP"}, {"level": 2, "id": "05-skills-get-apiskillsby-idskill_idversions", "name": "GET /api/skills/by-id/{skill_id}/versions — 版本历史"}, {"level": 2, "id": "05-skills-get-apiskillsby-idskill_idfiles", "name": "GET /api/skills/by-id/{skill_id}/files — 包内文件清单"}, {"level": 2, "id": "05-skills-get-apiskillsby-idskill_idrelated", "name": "GET /api/skills/by-id/{skill_id}/related — 相关技能"}, {"level": 2, "id": "05-skills-get-apiskillsby-idskill_idcomments", "name": "GET /api/skills/by-id/{skill_id}/comments — 评论列表"}, {"level": 2, "id": "05-skills-post-apiskillsby-idskill_idcomments", "name": "POST /api/skills/by-id/{skill_id}/comments — 发表评论"}, {"level": 2, "id": "05-skills-patch-apiskillsskill_id", "name": "PATCH /api/skills/{skill_id} — 免传包更新元信息"}, {"level": 2, "id": "05-skills-post-apiskillsupload", "name": "POST /api/skills/upload — 上传技能"}, {"level": 2, "id": "05-skills-delete-apiskillsby-idskill_id", "name": "DELETE /api/skills/by-id/{skill_id} — 删除技能"}, {"level": 2, "id": "05-skills-get-apiskillstemplate-zip", "name": "GET /api/skills/template — 技能模板 ZIP"}, {"level": 2, "id": "05-skills-get-apiskillsskill_idsub", "name": "GET /api/skills/{skill_id}/sub — 子技能列表"}, {"level": 2, "id": "05-skills-get-apiskillsskill_idsubsub_name", "name": "GET /api/skills/{skill_id}/sub/{sub_name} — 读子技能"}, {"level": 2, "id": "05-skills-get-apiskillspackage-subpkg_idsub_name", "name": "GET /api/skills/package-sub/{pkg_id}/{sub_name} — 包内子技能"}, {"level": 2, "id": "05-skills-post-apiskillsskill_idlike", "name": "POST /api/skills/{skill_id}/like — 点赞技能"}, {"level": 2, "id": "05-skills-post-apiskillsconvert", "name": "POST /api/skills/convert — 转换技能（跨模式）"}], "no": "", "is_overview": false}, {"id": "06-scenes", "title": "Scenes 场景接口（/api/scenes）", "html": "<h1 id=\"06-scenes-scenes-apiscenes\">Scenes 场景接口（/api/scenes）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。<br />\nscope（x-token-scope）：<strong>全部为 <code>user_only<\u002fcode>（管理/市场/应用/体验等）<\u002fstrong>，唯一例外——<br />\n<code>GET /api/scenes/{scene_id}<\u002fcode>（场景详情）为 <strong>dual<\u002fstrong>（会话 token <code>tk_<\u002fcode> 可读，供 agent 按<br />\n<code>GRAPE_SCENE_ID<\u002fcode> 按需取当前场景流水线/节点）。场景清单 <code>GET /api/scenes<\u002fcode>（list）为 user_only，<br />\nagent 不需要清单（当前场景经 env <code>GRAPE_SCENE_ID<\u002fcode> 注入）。<br />\nA2A 交办：服务端校验目标 agent 是否在当前 Issue 场景的 <code>nodes<\u002fcode> 内，不在则返回 <code>skipped: not_in_scene<\u002fcode> 且不派发（nodes=单一事实源）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"06-scenes-get-apiscenes\">GET /api/scenes — 场景列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\nagent 无需清单——当前场景经 env <code>GRAPE_SCENE_ID<\u002fcode> 注入，取详情走 <code>GET /api/scenes/{scene_id}<\u002fcode>。<br />\nCLI：<code>grape scenes list<\u002fcode>（operation_id=<code>scenes_list<\u002fcode>，命令名 ≠ 路径，见 README「CLI 命令映射」）。<br />\nIssue #534 口径结论（与 #529 联动）：<strong>维持 user_only 不放开<\u002fstrong>——<code>tk_<\u002fcode> 是 agent 任务执行凭据，<br />\nscenes list 是可指定任意 <code>--repo<\u002fcode> 的跨仓库枚举入口，放开超出会话凭据 scope 模型；<br />\n会话内取当前场景请用 <code>GET /api/scenes/{scene_id}<\u002fcode>（dual，缺省按会话仓库解析）。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（可选；带 repo 时返回仓库级场景；缺省按会话/请求上下文解析，Issue #534）；<code>page<\u002fcode>/<code>page_size<\u002fcode>（可选，Issue #501 分页——不带 <code>page<\u002fcode> 全量返回，带时 SQL LIMIT/OFFSET，total 恒返回）；<code>q<\u002fcode>（可选，Issue #501 检索——name/display_name/description 三字段 LIKE，total 为命中数）；<code>sort<\u002fcode>（可选：<code>id<\u002fcode> 稳定序默认 / <code>latest<\u002fcode> 按创建时间倒序）；<code>fields=minimal<\u002fcode>（可选，Issue #501 C——跳过 nodes_json 反序列化，供只要名字/图标的下拉类调用方） |<br />\n| 出参 | <code>{\"scenes\": [...], \"total\"}<\u002fcode>（minimal 时 items 的 nodes 为空数组） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-post-apiscenes\">POST /api/scenes — 创建场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateSceneRequest）：<code>{scene_id, name, description, scope: \"repo\"|\"user\", nodes: [SceneNodeInput], icon}<\u002fcode><\u002fp>\n<p>| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200；400 scope 非法/参数缺失 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesbranchesownerrepo\">GET /api/scenes/branches/{owner}/{repo} — 仓库分支列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<p>场景配置中「工作分支」选择器用。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | 分支名数组 |<br />\n| 返回 | 200；401 未配仓库 bot token |<\u002fp>\n<h2 id=\"06-scenes-post-apiscenesbranchesownerrepo\">POST /api/scenes/branches/{owner}/{repo} — 创建仓库分支<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateBranchRequest）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>branch_name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>新分支名<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>refs<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>源分支/引用（默认 main）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200；400 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenescheck-name\">GET /api/scenes/check-name — 校验场景名<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>name<\u002fcode>（必填）、<code>scope<\u002fcode>（必填，user/repo）、<code>repo<\u002fcode>（可选）、<code>exclude_id<\u002fcode>（可选） |<br />\n| 出参 | <code>{\"available\": bool, ...}<\u002fcode>（同 scope+用户+仓库名唯一） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apisceneswith-pipeline\">GET /api/scenes/with-pipeline — 场景列表（含流水线）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（可选；缺省按会话/请求上下文解析，Issue #534）；<code>page<\u002fcode>/<code>page_size<\u002fcode>（可选，Issue #501 分页）；<code>q<\u002fcode>（可选，Issue #501 检索——与 /scenes 同参同语义）；<code>sort<\u002fcode>（可选：<code>id<\u002fcode>/<code>latest<\u002fcode>） |<br />\n| 出参 | <code>{\"scenes\": [{scene_id, name, display_name, description, work_branch, created_by, is_active, pipeline}], \"total\"}<\u002fcode>（引擎在线字段 <code>offline_nodes<\u002fcode>/<code>sre_unbound<\u002fcode>/<code>all_offline<\u002fcode> 已移出——改走 <code>GET /api/scenes/{scene_id}/engine-status<\u002fcode> 按需探测） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesscene_idengine-status\">GET /api/scenes/{scene_id}/engine-status — 场景引擎在线状态（按需探测）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（可选，仓库级场景定位；缺省按会话/请求上下文解析，Issue #534） |<br />\n| 出参 | <code>{\"scene_id\", \"offline_nodes\": [tag...], \"sre_unbound\": bool, \"all_offline\": bool}<\u002fcode>——单场景 × 各启用节点一次引擎池探测；探测异常降级为不标记（不拦需求创建）；场景不存在/静默回退 default 时返回全 False |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apicategoriestree\">GET /api/categories/tree — 统一分类树<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape categories tree<\u002fcode>（operation_id=<code>categories_tree<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>scope<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td><code>scene<\u002fcode> / <code>skill<\u002fcode>；缺省=全部<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{scope, categories: [{id, parent_id, level, name, slug, icon, order_num, applies_to, children: [...]}]}<\u002fcode>（Issue #2761 两级分类树） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesmarketcategories\">GET /api/scenes/market/categories — 场景市场分类<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{categories: [{id, name, slug, icon, order_num}], tree: [...]}<\u002fcode>（<code>categories<\u002fcode> 保留旧一级列表，<code>tree<\u002fcode> 为 Issue #2761 统一分类树） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenestag-suggest\">GET /api/scenes/tag-suggest — 场景标签推荐<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>场景名称（关键词候选）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>场景描述（关键词候选）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{tags: [string]}<\u002fcode>（规则型候选，最多 3 个） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesmarket\">GET /api/scenes/market — 场景市场列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>q<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>关键字<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>category_id<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>旧分类 id（保留兼容）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>cat_l1_id<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>统一分类一级域 id（Issue #2761）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>cat_l2_id<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>统一分类二级子类 id（Issue #2761）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>sort<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>排序<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scope<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>official / repo（缺省=全部）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>scope=repo 时的 repo_key 过滤（owner/repo）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>featured_only<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>仅推荐<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>limit<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>limit&gt;0 且不传 page 时不翻页<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>page<\u002fcode> / <code>page_size<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>分页<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{items: [...], total}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-post-apiscenesmarket\">POST /api/scenes/market — 创建市场场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateMarketSceneRequest）：<code>{name, display_name, description, scope: \"repo\", nodes, icon, obs_icon_key, file_id, category_id, recommended_template}<\u002fcode><\u002fp>\n<p>| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200；400 参数非法 |<\u002fp>\n<h2 id=\"06-scenes-get-apiscenesmarketmarket_id\">GET /api/scenes/market/{market_id} — 市场场景详情<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| 出参 | 场景详情（含基本信息 + 推荐模板 + 可用仓库列表） |<br />\n| 返回 | 200；404 |<\u002fp>\n<h2 id=\"06-scenes-put-apiscenesmarketmarket_id\">PUT /api/scenes/market/{market_id} — 更新市场场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（UpdateMarketSceneRequest）：字段同 create（scope != 'official' 的可改）。<\u002fp>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400；404 |<\u002fp>\n<h2 id=\"06-scenes-delete-apiscenesmarketmarket_id\">DELETE /api/scenes/market/{market_id} — 删除市场场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<p>硬删除用户自定义场景（<code>scope != 'official'<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；404 |<\u002fp>\n<h2 id=\"06-scenes-post-apiscenesmarketicon-upload\">POST /api/scenes/market/icon-upload — 上传场景图标<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>multipart/form-data<\u002fcode>，字段 <code>file<\u002fcode><\u002fp>\n<blockquote>\n<p>格式 jpg/png/webp/gif/svg，大小 ≤ 2MB；产生临时文件（自定义有效期）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{file_id, icon, obs_icon_key}<\u002fcode> |<br />\n| 返回 | 200；400 格式/大小超限 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesmarketmarket_idapplied\">GET /api/scenes/market/{market_id}/applied — 是否已应用<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode> |<br />\n| 出参 | <code>{\"applied\": bool}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-post-apiscenesmarketmarket_idapply\">POST /api/scenes/market/{market_id}/apply — 应用市场场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400 冲突 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-post-apiscenesmarketmarket_idexperience\">POST /api/scenes/market/{market_id}/experience — 体验市场场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesmarketmarket_idexperience-check\">GET /api/scenes/market/{market_id}/experience-check — 体验前检查<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{market_id}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": bool, \"reason\": \"\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-post-apiscenesmarketmarket_idlike\">POST /api/scenes/market/{market_id}/like — 点赞场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"liked\": true, \"likes\": n}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesscene_id\">GET /api/scenes/{scene_id} — 场景详情<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）<br />\n会话 token 调用供 agent 按 <code>GRAPE_SCENE_ID<\u002fcode>（env 注入）取当前场景详情（nodes/onboarding 等）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{scene_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode>（可选；Issue #534 缺省按会话上下文解析：显式 <code>repo<\u002fcode> 优先 → <code>tk_<\u002fcode> 绑定仓库 → 请求中间件 repo 上下文，权限校验不放松） |<br />\n| 出参 | <code>{id, name, nodes[], onboarding, scene_type}<\u002fcode>（<code>id<\u002fcode>=传入的 scene_id；<code>nodes<\u002fcode>=技能链；<code>onboarding<\u002fcode> 默认 <code>repo-onboarding<\u002fcode>；<code>scene_type<\u002fcode> 默认 <code>standard<\u002fcode>） |<br />\n| 返回 | 200；404（报错附「跨仓库场景请附 --repo <owner/repo> 后重试」提示） |<\u002fp>\n<blockquote>\n<p>Issue #568 两级解析：<code>tk_<\u002fcode> 会话 token 未显式传 <code>repo<\u002fcode> 且仓库作用域未命中该 scene_id 的场景行时，<br />\n回落<strong>会话绑定<\u002fstrong>二级解析（session token → <code>agent_tasks<\u002fcode> → issue 绑定场景，与 a2a handoff<br />\n场景可见性口径一致，两路返回一致节点集合）；显式 <code>repo<\u002fcode> 行为不变（不放松权限）。<\u002fp>\n<\u002fblockquote>\n<p><strong>示例（<code>default<\u002fcode> 场景）<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;default&quot;,\n  &quot;name&quot;: &quot;通用开发&quot;,\n  &quot;nodes&quot;: [\n    {&quot;id&quot;: &quot;vod&quot;,    &quot;tag&quot;: &quot;需求分析&quot;, &quot;skill&quot;: &quot;vod-cli&quot;,    &quot;mode&quot;: &quot;emit&quot;, &quot;next&quot;: &quot;issue&quot;,  &quot;handoff&quot;: &quot;a2a&quot;,     &quot;enabled&quot;: true, &quot;engine_runtime_ids&quot;: []},\n    {&quot;id&quot;: &quot;issue&quot;,  &quot;tag&quot;: &quot;任务拆解&quot;, &quot;skill&quot;: &quot;issue-cli&quot;,  &quot;mode&quot;: &quot;emit&quot;, &quot;next&quot;: &quot;coding&quot;, &quot;handoff&quot;: &quot;a2a&quot;,     &quot;enabled&quot;: true, &quot;engine_runtime_ids&quot;: []},\n    {&quot;id&quot;: &quot;coding&quot;, &quot;tag&quot;: &quot;代码实现&quot;, &quot;skill&quot;: &quot;coding-cli&quot;, &quot;mode&quot;: &quot;emit&quot;, &quot;next&quot;: &quot;qa&quot;,     &quot;handoff&quot;: &quot;a2a&quot;,     &quot;enabled&quot;: true, &quot;engine_runtime_ids&quot;: []},\n    {&quot;id&quot;: &quot;qa&quot;,     &quot;tag&quot;: &quot;质量审查&quot;, &quot;skill&quot;: &quot;qa-cli&quot;,     &quot;mode&quot;: &quot;emit&quot;, &quot;next&quot;: &quot;sre&quot;,    &quot;handoff&quot;: &quot;a2a&quot;,     &quot;enabled&quot;: true, &quot;engine_runtime_ids&quot;: []},\n    {&quot;id&quot;: &quot;sre&quot;,    &quot;tag&quot;: &quot;运维部署&quot;, &quot;skill&quot;: &quot;deploy-cli&quot;, &quot;mode&quot;: &quot;emit&quot;, &quot;next&quot;: &quot;done&quot;,   &quot;handoff&quot;: &quot;complete&quot;,&quot;enabled&quot;: true, &quot;engine_runtime_ids&quot;: []}\n  ],\n  &quot;onboarding&quot;: &quot;repo-onboarding&quot;,\n  &quot;scene_type&quot;: &quot;standard&quot;\n}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p><code>nodes[]<\u002fcode> 是流水线的单一事实源：每条含 Agent 阶段（<code>id<\u002fcode>）、对应技能（<code>skill<\u002fcode>）、下游（<code>next<\u002fcode>，<code>done<\u002fcode>=结束）、交办方式（<code>handoff<\u002fcode>）。<br />\n删除某节点（如 <code>qa<\u002fcode>）后：详情不再显示、也不会执行；<strong>须同步把上游 <code>next<\u002fcode> 改到下一个存活节点<\u002fstrong>，<br />\n否则该步派发时「node not found」而 <code>failed<\u002fcode>（pipeline_executor）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesskillsagent_type-agent\">GET /api/scenes/skills/{agent_type} — Agent 可用技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{agent_type}<\u002fcode> |<br />\n| 出参 | 技能数组 |<br />\n| 说明 | Issue #978：每条技能含 <code>skill_id / skill_name / display_name / scope / owner_id<\u002fcode>；<strong><code>(skill_id, scope, skill_name)<\u002fcode> 共同构成前端选择的唯一键<\u002fstrong>——official/repo/user 三档允许同名技能共存（skill 表 <code>UNIQUE(skill_name, scope, owner_id)<\u002fcode>），消费方不得用裸 <code>skill_name<\u002fcode> 作选中/缓存 key（skill_id 优先，缺失时回退 <code>(scope, skill_name)<\u002fcode>） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-put-apiscenesscene_id\">PUT /api/scenes/{scene_id} — 更新场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（UpdateSceneRequest）：<code>{\"name\",\"description\",\"nodes\":[...]}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-delete-apiscenesscene_id\">DELETE /api/scenes/{scene_id} — 删除场景<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 返回 | 200/204；404 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesscene_idadvanced-options\">GET /api/scenes/{scene_id}/advanced-options — 获取高级选项<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{scene_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | <code>{work_branch, custom_fields: [{name, value, is_secret, has_value?, scope, preset, description}], linked_repos}<\u002fcode> |<br />\n| 说明 | Issue #885：<code>is_secret=true<\u002fcode> 字段不再明文返回——<code>value<\u002fcode> 恒为空串，<code>has_value<\u002fcode> 标记是否已配置；明文按需取回走 <code>POST /advanced-options/reveal<\u002fcode> |<br />\n| 返回 | 200；404 |<\u002fp>\n<h2 id=\"06-scenes-post-apiscenesscene_idadvanced-optionsreveal\">POST /api/scenes/{scene_id}/advanced-options/reveal — 按需取回密钥字段明文（一次性）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nIssue #885（对齐 #474 reveal 模式）：密码二次确认 + 审计日志（不落明文）+ 当次返回（<code>Cache-Control: no-store<\u002fcode>）+ 窗口高频限流（429）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（SceneAdvancedOptionsRevealBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">是<\u002ftd>\n<td>密钥字段变量名（<code>is_secret=true<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>password<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">是<\u002ftd>\n<td>二次确认：当前 Grape 密码<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| Path | <code>{scene_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode>（必填，owner/repo） |<br />\n| 出参 | <code>{name: \"...\", value: \"...\"}<\u002fcode>（明文仅当次返回） |<br />\n| 返回 | 200；400（缺 repo / 缺密码 / 密码错误 / 非密钥字段 / 未设密码）；403（非归属人）；404（场景或字段不存在）；429（高频取回） |<\u002fp>\n<h2 id=\"06-scenes-put-apiscenesscene_idadvanced-options\">PUT /api/scenes/{scene_id}/advanced-options — 保存高级选项<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（AdvancedOptionsRequest）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>work_branch<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>工作分支（默认 main）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>custom_fields<\u002fcode><\u002ftd>\n<td>list<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>自定义 key:value 数组 <code>[{key, value}]<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>custom_fields[].keep_value<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>Issue #885：密钥字段值未变更时置 <code>true<\u002fcode>，服务端保留库内旧值（不回传明文；<code>is_secret<\u002fcode> 空值或 <code>\"********\"<\u002fcode> 掩码回显同样保留旧值）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| Path | <code>{scene_id}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400；404 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-get-apiscenesscene_iddeploy-url\">GET /api/scenes/{scene_id}/deploy-url — 获取场景访问地址<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{scene_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode>（必填，owner/repo） |<br />\n| 出参 | <code>{deploy_url: \"...\"}<\u002fcode>（场景级，未登记为空串） |<br />\n| 返回 | 200；400（缺 repo）；403（非归属人）；404 |<\u002fp>\n<h2 id=\"06-scenes-put-apiscenesscene_iddeploy-url\">PUT /api/scenes/{scene_id}/deploy-url — 登记/编辑场景访问地址<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\n校验与需求中心部署 URL 一致：非空必须以 <code>http://<\u002fcode> 或 <code>https://<\u002fcode> 开头、长度 ≤512；空串=清除。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（SceneDeployUrlBody）：<code>{\"deploy_url\": \"http://1.2.3.4:5000\"}<\u002fcode><\u002fp>\n<p>| Path | <code>{scene_id}<\u002fcode> |<br />\n| Query | <code>repo<\u002fcode>（必填，owner/repo） |<br />\n| 出参 | <code>{\"deploy_url\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200；400（缺 repo / URL 非法）；403（非归属人）；404（场景不存在或未激活） |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-post-apiscenesapplyownerrepo\">POST /api/scenes/apply/{owner}/{repo} — 应用场景到仓库<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（ApplySceneRequest）：<code>{\"scene_id\": \"default\"}<\u002fcode><\u002fp>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400 |<\u002fp>\n<hr />\n<h2 id=\"06-scenes-scenenodeinput\">场景节点（SceneNodeInput）字段<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>节点 id<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>tag<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>标签<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skill<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>技能<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>mode<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>emit 等<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>next<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>下游节点（done 表示结束）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>handoff<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>a2a/complete<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skip<\u002fcode><\u002ftd>\n<td>list<\u002ftd>\n<td>跳过条件<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>enabled<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td>启用<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>engine_runtime_ids<\u002fcode><\u002ftd>\n<td>list<\u002ftd>\n<td>限定引擎<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>", "toc": [{"level": 2, "id": "06-scenes-get-apiscenes", "name": "GET /api/scenes — 场景列表"}, {"level": 2, "id": "06-scenes-post-apiscenes", "name": "POST /api/scenes — 创建场景"}, {"level": 2, "id": "06-scenes-get-apiscenesbranchesownerrepo", "name": "GET /api/scenes/branches/{owner}/{repo} — 仓库分支列表"}, {"level": 2, "id": "06-scenes-post-apiscenesbranchesownerrepo", "name": "POST /api/scenes/branches/{owner}/{repo} — 创建仓库分支"}, {"level": 2, "id": "06-scenes-get-apiscenescheck-name", "name": "GET /api/scenes/check-name — 校验场景名"}, {"level": 2, "id": "06-scenes-get-apisceneswith-pipeline", "name": "GET /api/scenes/with-pipeline — 场景列表（含流水线）"}, {"level": 2, "id": "06-scenes-get-apiscenesscene_idengine-status", "name": "GET /api/scenes/{scene_id}/engine-status — 场景引擎在线状态（按需探测）"}, {"level": 2, "id": "06-scenes-get-apicategoriestree", "name": "GET /api/categories/tree — 统一分类树"}, {"level": 2, "id": "06-scenes-get-apiscenesmarketcategories", "name": "GET /api/scenes/market/categories — 场景市场分类"}, {"level": 2, "id": "06-scenes-get-apiscenestag-suggest", "name": "GET /api/scenes/tag-suggest — 场景标签推荐"}, {"level": 2, "id": "06-scenes-get-apiscenesmarket", "name": "GET /api/scenes/market — 场景市场列表"}, {"level": 2, "id": "06-scenes-post-apiscenesmarket", "name": "POST /api/scenes/market — 创建市场场景"}, {"level": 2, "id": "06-scenes-get-apiscenesmarketmarket_id", "name": "GET /api/scenes/market/{market_id} — 市场场景详情"}, {"level": 2, "id": "06-scenes-put-apiscenesmarketmarket_id", "name": "PUT /api/scenes/market/{market_id} — 更新市场场景"}, {"level": 2, "id": "06-scenes-delete-apiscenesmarketmarket_id", "name": "DELETE /api/scenes/market/{market_id} — 删除市场场景"}, {"level": 2, "id": "06-scenes-post-apiscenesmarketicon-upload", "name": "POST /api/scenes/market/icon-upload — 上传场景图标"}, {"level": 2, "id": "06-scenes-get-apiscenesmarketmarket_idapplied", "name": "GET /api/scenes/market/{market_id}/applied — 是否已应用"}, {"level": 2, "id": "06-scenes-post-apiscenesmarketmarket_idapply", "name": "POST /api/scenes/market/{market_id}/apply — 应用市场场景"}, {"level": 2, "id": "06-scenes-post-apiscenesmarketmarket_idexperience", "name": "POST /api/scenes/market/{market_id}/experience — 体验市场场景"}, {"level": 2, "id": "06-scenes-get-apiscenesmarketmarket_idexperience-check", "name": "GET /api/scenes/market/{market_id}/experience-check — 体验前检查"}, {"level": 2, "id": "06-scenes-post-apiscenesmarketmarket_idlike", "name": "POST /api/scenes/market/{market_id}/like — 点赞场景"}, {"level": 2, "id": "06-scenes-get-apiscenesscene_id", "name": "GET /api/scenes/{scene_id} — 场景详情"}, {"level": 2, "id": "06-scenes-get-apiscenesskillsagent_type-agent", "name": "GET /api/scenes/skills/{agent_type} — Agent 可用技能"}, {"level": 2, "id": "06-scenes-put-apiscenesscene_id", "name": "PUT /api/scenes/{scene_id} — 更新场景"}, {"level": 2, "id": "06-scenes-delete-apiscenesscene_id", "name": "DELETE /api/scenes/{scene_id} — 删除场景"}, {"level": 2, "id": "06-scenes-get-apiscenesscene_idadvanced-options", "name": "GET /api/scenes/{scene_id}/advanced-options — 获取高级选项"}, {"level": 2, "id": "06-scenes-post-apiscenesscene_idadvanced-optionsreveal", "name": "POST /api/scenes/{scene_id}/advanced-options/reveal — 按需取回密钥字段明文（一次性）"}, {"level": 2, "id": "06-scenes-put-apiscenesscene_idadvanced-options", "name": "PUT /api/scenes/{scene_id}/advanced-options — 保存高级选项"}, {"level": 2, "id": "06-scenes-get-apiscenesscene_iddeploy-url", "name": "GET /api/scenes/{scene_id}/deploy-url — 获取场景访问地址"}, {"level": 2, "id": "06-scenes-put-apiscenesscene_iddeploy-url", "name": "PUT /api/scenes/{scene_id}/deploy-url — 登记/编辑场景访问地址"}, {"level": 2, "id": "06-scenes-post-apiscenesapplyownerrepo", "name": "POST /api/scenes/apply/{owner}/{repo} — 应用场景到仓库"}, {"level": 2, "id": "06-scenes-scenenodeinput", "name": "场景节点（SceneNodeInput）字段"}], "no": "", "is_overview": false}, {"id": "07-knowledge", "title": "Knowledge 知识接口（/api/knowledge）", "html": "<h1 id=\"07-knowledge-knowledge-apiknowledge\">Knowledge 知识接口（/api/knowledge）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。<br />\nscope（x-token-scope）：读接口 <code>list/stats/detail<\u002fcode> = <strong>dual<\u002fstrong>（会话 token <code>tk_<\u002fcode> 可用，要求<strong>仓库作用域匹配<\u002fstrong>——<br />\ntoken 绑定的 repo_key 与 <code>repo<\u002fcode> 一致（provider+owner/repo），不一致 403；详情按 id 读取不额外校验仓库）；<br />\n写操作（entry/refs/delete/update）= <strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\n概念：知识 = 仓库/场景/Agent 注入的说明文档。<strong>文件型<\u002fstrong>（<code>source=system/agent<\u002fcode>，按 repo+file 落 OBS/工作区）<br />\n与<strong>条目型<\u002fstrong>（<code>source=manual<\u002fcode>，用户 Web 直接录入，以 <code>knowledge_id<\u002fcode> 定位）两类并存。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"07-knowledge-_1\">概述<\u002fh2>\n<h3 id=\"07-knowledge-get-apiknowledge\">GET /api/knowledge — 知识清单（统一列表 + 分页）<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（三通道）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>repo<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>✅<\u002ftd>\n<td style=\"text-align: center;\">repo_key（无前缀亦接受）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>source<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">system / agent / manual<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>page<\u002fcode> / <code>page_size<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">分页，默认 1 / 50<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>sort<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\"><code>latest<\u002fcode> = 按更新时间倒序<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>q<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">关键字（匹配 name/description）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{items, total, page, page_size}<\u002fcode> |<br />\n| 返回 | 200；400 缺 repo |<\u002fp>\n<h3 id=\"07-knowledge-get-apiknowledgestats\">GET /api/knowledge/stats — 知识统计<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（三通道）。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（必填） |<br />\n| 出参 | 按 source（system/agent/manual/unlinked）分类的统计计数 |<br />\n| 返回 | 200；400 缺 repo |<\u002fp>\n<h3 id=\"07-knowledge-get-apiknowledgeknowledge_id\">GET /api/knowledge/{knowledge_id} — 知识详情<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（三通道）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{knowledge_id}<\u002fcode> int |<br />\n| 出参 | 知识完整对象（含 content、refs 摘要） |<br />\n| 返回 | 200；404 不存在 |<\u002fp>\n<hr />\n<h2 id=\"07-knowledge-sourcemanual\">条目（source=manual）写操作<\u002fh2>\n<h3 id=\"07-knowledge-post-apiknowledgeentry\">POST /api/knowledge/entry — 创建知识条目<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（KnowledgeEntryBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>名称（≤50）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>content<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>正文（≤10KB）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>归属仓库（repo_key / owner-repo）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>描述（≤200）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent_type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>关联 agent 类型<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"ok\": true, \"message\", \"file_path\", \"id\"}<\u002fcode> |<br />\n| 返回 | 200；400 缺 name/content/repo 或超长 |<\u002fp>\n<h3 id=\"07-knowledge-put-apiknowledgeknowledge_id\">PUT /api/knowledge/{knowledge_id} — 编辑知识<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{knowledge_id}<\u002fcode> int |<br />\n| 请求体（KnowledgeUpdateBody） | <code>name<\u002fcode> / <code>content<\u002fcode> / <code>description<\u002fcode>（source=manual 可编辑） |<br />\n| 出参 | <code>{\"ok\": true, \"message\": \"知识已更新\"}<\u002fcode> |<br />\n| 返回 | 200；400；403 系统生成不可编辑/非创建者；404 |<\u002fp>\n<h3 id=\"07-knowledge-delete-apiknowledgeknowledge_id\">DELETE /api/knowledge/{knowledge_id} — 删除知识条目<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{knowledge_id}<\u002fcode> int |<br />\n| 出参 | <code>{\"ok\": true, \"message\": \"知识已删除\"}<\u002fcode> |<br />\n| 返回 | 200；403 系统生成不可删除/非创建者；404 |<\u002fp>\n<hr />\n<h2 id=\"07-knowledge-refsagent\">关联（refs：场景/Agent）<\u002fh2>\n<h3 id=\"07-knowledge-get-apiknowledgeknowledge_idrefs\">GET /api/knowledge/{knowledge_id}/refs — 关联列表<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{knowledge_id}<\u002fcode> int |<br />\n| 出参 | <code>{refs: [{id, scene_id, agent_type, enabled, ...}]}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"07-knowledge-post-apiknowledgeknowledge_idrefs\">POST /api/knowledge/{knowledge_id}/refs — 添加关联<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{knowledge_id}<\u002fcode> int |<br />\n| 请求体（KnowledgeRefBody） | <code>{scene_id, agent_type}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400；403 非创建者/非仓库托管者；409 已存在 |<\u002fp>\n<h3 id=\"07-knowledge-post-apiknowledgeknowledge_idrefsbatch\">POST /api/knowledge/{knowledge_id}/refs/batch — 批量添加关联<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{knowledge_id}<\u002fcode> int |<br />\n| 请求体（KnowledgeRefBatchBody） | <code>{scene_ids: [], agent_types: []}<\u002fcode>（幂等，已存在跳过） |<br />\n| 出参 | <code>{\"ok\": true, \"added\": n}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"07-knowledge-put-apiknowledgerefref_id\">PUT /api/knowledge/ref/{ref_id} — 修改关联<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{ref_id}<\u002fcode> int |<br />\n| 请求体（KnowledgeRefUpdateBody） | <code>{enabled: bool}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；404 不存在 |<\u002fp>\n<h3 id=\"07-knowledge-delete-apiknowledgerefref_id\">DELETE /api/knowledge/ref/{ref_id} — 删除关联<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{ref_id}<\u002fcode> int |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；404 不存在 |<\u002fp>\n<hr />\n<h2 id=\"07-knowledge-_2\">错误返回（全端点通用）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>message（英文）<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>400<\u002ftd>\n<td>Bad Request / Invalid parameter<\u002ftd>\n<td>缺 repo / 参数校验失败<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>Unauthorized<\u002ftd>\n<td>未认证 / token 失效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>Forbidden<\u002ftd>\n<td>越权（<code>tk_<\u002fcode> 不适用、非创建者、系统生成不可编辑/删除）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>Not Found<\u002ftd>\n<td>知识/关联不存在<\u002ftd>\n<\u002ftr>\n<tr>\n<td>409<\u002ftd>\n<td>Conflict<\u002ftd>\n<td>关联已存在<\u002ftd>\n<\u002ftr>\n<tr>\n<td>500<\u002ftd>\n<td>Internal Server Error<\u002ftd>\n<td>OBS 读写失败<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>", "toc": [{"level": 2, "id": "07-knowledge-_1", "name": "概述"}, {"level": 3, "id": "07-knowledge-get-apiknowledge", "name": "GET /api/knowledge — 知识清单（统一列表 + 分页）"}, {"level": 3, "id": "07-knowledge-get-apiknowledgestats", "name": "GET /api/knowledge/stats — 知识统计"}, {"level": 3, "id": "07-knowledge-get-apiknowledgeknowledge_id", "name": "GET /api/knowledge/{knowledge_id} — 知识详情"}, {"level": 2, "id": "07-knowledge-sourcemanual", "name": "条目（source=manual）写操作"}, {"level": 3, "id": "07-knowledge-post-apiknowledgeentry", "name": "POST /api/knowledge/entry — 创建知识条目"}, {"level": 3, "id": "07-knowledge-put-apiknowledgeknowledge_id", "name": "PUT /api/knowledge/{knowledge_id} — 编辑知识"}, {"level": 3, "id": "07-knowledge-delete-apiknowledgeknowledge_id", "name": "DELETE /api/knowledge/{knowledge_id} — 删除知识条目"}, {"level": 2, "id": "07-knowledge-refsagent", "name": "关联（refs：场景/Agent）"}, {"level": 3, "id": "07-knowledge-get-apiknowledgeknowledge_idrefs", "name": "GET /api/knowledge/{knowledge_id}/refs — 关联列表"}, {"level": 3, "id": "07-knowledge-post-apiknowledgeknowledge_idrefs", "name": "POST /api/knowledge/{knowledge_id}/refs — 添加关联"}, {"level": 3, "id": "07-knowledge-post-apiknowledgeknowledge_idrefsbatch", "name": "POST /api/knowledge/{knowledge_id}/refs/batch — 批量添加关联"}, {"level": 3, "id": "07-knowledge-put-apiknowledgerefref_id", "name": "PUT /api/knowledge/ref/{ref_id} — 修改关联"}, {"level": 3, "id": "07-knowledge-delete-apiknowledgerefref_id", "name": "DELETE /api/knowledge/ref/{ref_id} — 删除关联"}, {"level": 2, "id": "07-knowledge-_2", "name": "错误返回（全端点通用）"}], "no": "", "is_overview": false}, {"id": "08-events", "title": "Events 事件接口（/api/events）", "html": "<h1 id=\"08-events-events-apievents\">Events 事件接口（/api/events）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。worker agent 结果获取核心。<br />\nscope（x-token-scope）：<code>GET /api/events/detail/{seq}<\u002fcode> = <strong>dual<\u002fstrong>；操作类<br />\n（terminate/redispatch/thread/chat/knowledge/stream） = <strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\n<strong>CLI 说明<\u002fstrong>：grape CLI 命令与 API 的 <strong><code>operation_id<\u002fcode> 精确关联<\u002fstrong>——<code>operation_id<\u002fcode> 按<br />\n<code>{根组}_{动词}<\u002fcode> 拆分：<code>_<\u002fcode> 前为 CLI 根命令组（<code>events<\u002fcode>/<code>issues<\u002fcode>/<code>tasks<\u002fcode>/<code>scenes<\u002fcode>...），<code>_<\u002fcode> 后为组内子命令。<br />\n例：<code>events_list<\u002fcode>→<code>grape events list<\u002fcode>、<code>events_detail<\u002fcode>→<code>grape events detail<\u002fcode>、<code>events_chat_task_status<\u002fcode>→<code>grape events chat task status<\u002fcode>。<br />\n查命令：<code>grape &lt;组&gt; -h<\u002fcode> / <code>grape &lt;组&gt; &lt;动词&gt; -h<\u002fcode>；认证用 <code>GRAPE_API_TOKEN<\u002fcode>/Web JWT（<code>tk_<\u002fcode> 会话 → 403 的记 user_only）。<br />\nℹ️ <strong>按 Issue 获取事件<\u002fstrong>（<code>GET /api/issues/{owner}/{repo}/{number}/events<\u002fcode>，operation_id=<code>issues_events<\u002fcode>）属<br />\nIssues 接口，文档见 <code>11-issues.md<\u002fcode>——CLI：<code>grape issues events --owner --repo --number<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"08-events-get-apieventsownerrepo-operation_idevents_list\">GET /api/events/{owner}/{repo} — 仓库事件列表（operation_id=events_list）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）；<code>tk_<\u002fcode> 限定其绑定仓库（跨仓库 → 403）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| Query | <code>page<\u002fcode>、<code>limit<\u002fcode>、<code>event_type<\u002fcode>、<code>issue_id<\u002fcode>、<code>status<\u002fcode>（可选中） |<br />\n| 出参 | <code>{items: Event[], total}<\u002fcode> |<br />\n| CLI | <code>grape events list --owner {owner} --repo {repo} [--page N --page_size N --status ...] --json-out<\u002fcode> |<\u002fp>\n<p>Event 字段：<code>seq / repo_key / issue_id / event_type / source / agent_type / title / status / created_at / started_at / completed_at / duration / summary / result / actor / runtime / skill<\u002fcode><\u002fp>\n<hr />\n<h2 id=\"08-events-get-apieventsdetailseq-operation_idevents_detail\">GET /api/events/detail/{seq} — 事件详情（operation_id=events_detail）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{seq}<\u002fcode> int |<br />\n| 出参 | Event 完整对象（含 payload、agent_logs、result、archive） |<br />\n| archive | 结构化产出段 <code>{seq, agent, event_type, status, runtime, skill, output, logs}<\u002fcode>；优先 <code>events.structured_output<\u002fcode>，无则回退 event.json（weekly-05 起） |<br />\n| 返回 | 200；404 |<br />\n| CLI | <code>grape events detail --seq {seq} --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-get-apieventsseqthreadoperation_idevents_thread\">GET /api/events/{seq}/thread（operation_id=events_thread） — 事件对话线程<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{seq}<\u002fcode> int |<br />\n| 出参 | <code>[{role, content, created_at}]<\u002fcode> |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events thread --seq {seq} --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-delete-apieventsseqknowledgescopeoperation_idevents_knowledge_delete-issue\">DELETE /api/events/{seq}/knowledge/{scope}（operation_id=events_knowledge_delete） — 删除 Issue 知识<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{seq}<\u002fcode> / <code>{scope}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；403 非 bot；400 |<br />\n| CLI | <code>grape events knowledge delete --seq {seq} --scope {scope} --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-post-apieventsseqflowreset-operation_id\">POST /api/events/{seq}/flow/reset（内部端点，无 operation_id 契约） — 流程重置<\u002fh2>\n<blockquote>\n<p>scope：worker/内部端点（不走 /api/issues 契约标注）。请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>请求体（FlowResetBody）：<code>{\"to_stage\": \"vod\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true, \"to_stage\": \"vod\"}<\u002fcode> |<br />\n| 返回 | 200；400 非关联 Issue 事件 |<br />\n| CLI | 无（内部/worker 端点，未在 CLI 暴露） |<\u002fp>\n<hr />\n<h2 id=\"08-events-post-apieventsseqterminateoperation_idevents_terminate\">POST /api/events/{seq}/terminate（operation_id=events_terminate） — 终止事件（重派）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{seq}<\u002fcode> int |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events terminate --seq {seq} --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-post-apieventsseqredispatchoperation_idevents_redispatch\">POST /api/events/{seq}/redispatch（operation_id=events_redispatch） — 重派事件<\u002fh2>\n<blockquote>\n<p>适用终态：failed / cancelled（Issue #566：用户取消与失败同权支持重新派发）；卡死 running&gt;10min 同样适用。<br />\nscope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{seq}<\u002fcode> int |<br />\n| 出参 | <code>{\"status\": \"redispatched\", \"event_seq\": n, ...}<\u002fcode> |<br />\n| 返回 | 200；409 重派失败 |<br />\n| CLI | <code>grape events redispatch --seq {seq} [--local_only 0/1] --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-post-apieventsseqchatoperation_idevents_chat_send\">POST /api/events/{seq}/chat（operation_id=events_chat_send） — 事件对话发送<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（ConversationMessage）：<code>{\"message\": \"...\"}<\u002fcode><\u002fp>\n<p>| 出参 | agent 回复 |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events chat send --seq {seq} --json '{\"message\":\"...\"}' --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-post-apieventsseqchatstreamoperation_idevents_chat_stream-sse\">POST /api/events/{seq}/chat/stream（operation_id=events_chat_stream） — 事件对话 SSE<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | SSE 流 |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events chat stream --seq {seq} --json '{\"message\":\"...\"}'<\u002fcode>（SSE，配合 --json-out 消费帧） |<\u002fp>\n<hr />\n<h2 id=\"08-events-delete-apieventsseqchatoperation_idevents_chat_delete\">DELETE /api/events/{seq}/chat（operation_id=events_chat_delete） — 删除事件对话（清理线程）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<p>Issue #100：清除该事件关联的对话消息（event_thread 记录删空）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{seq}<\u002fcode> int |<br />\n| 出参 | <code>{\"ok\": true, \"message\": \"对话已清理\"}<\u002fcode> |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events chat delete --seq {seq} --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-post-apieventsseqchatsubmitoperation_idevents_chat_submit\">POST /api/events/{seq}/chat/submit（operation_id=events_chat_submit） — 事件对话异步提交<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（ConversationMessage）：<code>{\"message\": \"...\"}<\u002fcode><\u002fp>\n<blockquote>\n<p>提交对话查询到后台异步队列，返回 task_id；随后轮询 <code>GET /api/events/chat/task/{task_id}/status<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"task_id\", \"seq\", \"status\": \"running\"}<\u002fcode> |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events chat submit --seq {seq} --json '{\"message\":\"...\"}' --json-out<\u002fcode> |<\u002fp>\n<hr />\n<h2 id=\"08-events-get-apieventschattasktask_idstatusoperation_idevents_chat_task_status\">GET /api/events/chat/task/{task_id}/status（operation_id=events_chat_task_status） — 事件对话异步状态<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| 出参 | <code>{\"task_id\", \"status\": \"processing/completed/failed/not_found\", \"result\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events chat task status --task_id {task_id} --json-out<\u002fcode> |<\u002fp>\n<h2 id=\"08-events-get-apieventschattasktask_idstreamoperation_idevents_chat_task_stream\">GET /api/events/chat/task/{task_id}/stream（operation_id=events_chat_task_stream） — 事件对话异步流<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| 出参 | SSE 流（回放历史 + 实时追帧） |<br />\n| 返回 | 200 |<br />\n| CLI | <code>grape events chat task stream --task_id {task_id}<\u002fcode>（SSE） |<\u002fp>", "toc": [{"level": 2, "id": "08-events-get-apieventsownerrepo-operation_idevents_list", "name": "GET /api/events/{owner}/{repo} — 仓库事件列表（operation_id=events_list）"}, {"level": 2, "id": "08-events-get-apieventsdetailseq-operation_idevents_detail", "name": "GET /api/events/detail/{seq} — 事件详情（operation_id=events_detail）"}, {"level": 2, "id": "08-events-get-apieventsseqthreadoperation_idevents_thread", "name": "GET /api/events/{seq}/thread（operation_id=events_thread） — 事件对话线程"}, {"level": 2, "id": "08-events-delete-apieventsseqknowledgescopeoperation_idevents_knowledge_delete-issue", "name": "DELETE /api/events/{seq}/knowledge/{scope}（operation_id=events_knowledge_delete） — 删除 Issue 知识"}, {"level": 2, "id": "08-events-post-apieventsseqflowreset-operation_id", "name": "POST /api/events/{seq}/flow/reset（内部端点，无 operation_id 契约） — 流程重置"}, {"level": 2, "id": "08-events-post-apieventsseqterminateoperation_idevents_terminate", "name": "POST /api/events/{seq}/terminate（operation_id=events_terminate） — 终止事件（重派）"}, {"level": 2, "id": "08-events-post-apieventsseqredispatchoperation_idevents_redispatch", "name": "POST /api/events/{seq}/redispatch（operation_id=events_redispatch） — 重派事件"}, {"level": 2, "id": "08-events-post-apieventsseqchatoperation_idevents_chat_send", "name": "POST /api/events/{seq}/chat（operation_id=events_chat_send） — 事件对话发送"}, {"level": 2, "id": "08-events-post-apieventsseqchatstreamoperation_idevents_chat_stream-sse", "name": "POST /api/events/{seq}/chat/stream（operation_id=events_chat_stream） — 事件对话 SSE"}, {"level": 2, "id": "08-events-delete-apieventsseqchatoperation_idevents_chat_delete", "name": "DELETE /api/events/{seq}/chat（operation_id=events_chat_delete） — 删除事件对话（清理线程）"}, {"level": 2, "id": "08-events-post-apieventsseqchatsubmitoperation_idevents_chat_submit", "name": "POST /api/events/{seq}/chat/submit（operation_id=events_chat_submit） — 事件对话异步提交"}, {"level": 2, "id": "08-events-get-apieventschattasktask_idstatusoperation_idevents_chat_task_status", "name": "GET /api/events/chat/task/{task_id}/status（operation_id=events_chat_task_status） — 事件对话异步状态"}, {"level": 2, "id": "08-events-get-apieventschattasktask_idstreamoperation_idevents_chat_task_stream", "name": "GET /api/events/chat/task/{task_id}/stream（operation_id=events_chat_task_stream） — 事件对话异步流"}], "no": "", "is_overview": false}, {"id": "09-task-logs", "title": "TaskLogs 任务日志接口（/api/task-logs）", "html": "<h1 id=\"09-task-logs-tasklogs-apitask-logs\">TaskLogs 任务日志接口（/api/task-logs）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。worker agent 结果的实时日志/消息来源。<br />\nscope（x-token-scope）：全部 = <strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"09-task-logs-get-apitask-logstask_idinfo\">GET /api/task-logs/{task_id}/info — 任务运行信息<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| 出参 | <code>{agent_name, agent_version, device_name, owner_name, prompt, prompt_full_length, status, ..., wrote_files}<\u002fcode>；<code>wrote_files<\u002fcode>：任务写过的文件清单 <code>[{path, bytes, tool, seq, first_seen_at}]<\u002fcode>（派生自 write/patch tool_use 消息入参，不扫工作区，无写入返回 <code>[]<\u002fcode>） |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"09-task-logs-get-apitask-logstask_idmessages\">GET /api/task-logs/{task_id}/messages — 任务消息列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| Query | <code>limit<\u002fcode>、<code>since<\u002fcode>、<code>ts<\u002fcode>（可选） |<br />\n| 出参 | <code>[{time, type(step_start/step_finish/tool_use/text/reasoning/done), data}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"09-task-logs-get-apitask-logstask_idstream-sse\">GET /api/task-logs/{task_id}/stream — 任务消息流（SSE）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| Query | <code>since<\u002fcode>（可选，增量游标） |<br />\n| 出参 | SSE 流 <code>data: {time, type, data}<\u002fcode>，新消息实时推送 |<br />\n| 返回 | 200（长连接） |<\u002fp>", "toc": [{"level": 2, "id": "09-task-logs-get-apitask-logstask_idinfo", "name": "GET /api/task-logs/{task_id}/info — 任务运行信息"}, {"level": 2, "id": "09-task-logs-get-apitask-logstask_idmessages", "name": "GET /api/task-logs/{task_id}/messages — 任务消息列表"}, {"level": 2, "id": "09-task-logs-get-apitask-logstask_idstream-sse", "name": "GET /api/task-logs/{task_id}/stream — 任务消息流（SSE）"}], "no": "", "is_overview": false}, {"id": "10-git-repos", "title": "10-git-repos", "html": "<p>﻿# Git 仓库统一接口（/api/git-repo）<\u002fp>\n<blockquote>\n<p>设计：技能/第三方访问 Git 仓库资源（Issue/PR/内容/分支等）时，统一走 grape 的 Git 仓库 API。<br />\n⚠️ <strong>grape <code>/api/repos<\u002fcode> 是平台业务接口<\u002fstrong>（托管/同步/成员/部署 URL 等，见 02-repos.md）；<strong>本接口 <code>/api/git-repo<\u002fcode> 是 Git 仓库透传<\u002fstrong>（Issue/PR/内容/分支等由 gitcode/github/gitlab 提供）。<br />\n<strong>不是 GitCode 代理<\u002fstrong>：grape 侧定义<strong>中性的 Git 资源契约<\u002fstrong>（入参/语义 provider 无关），平台差异由<br />\n服务端 <code>vcs/providers/<\u002fcode>（§git-repo-provider-neutral-interface-design.md 查表翻译）收敛；backend 由 token <code>repo_key<\u002fcode> 前缀区分。<br />\n<strong>契约 provider 无关：入参与语义对调用方统一，平台差异由服务端适配，调用方不感知（本文不再描述各 provider 实现细节）。<\u002fstrong><br />\n认证：<code>get_current_user_or_api_key<\u002fcode>（契约收录）+ 体内 <code>_repo_token<\u002fcode> <strong>强制 session<\u002fstrong>。<br />\nscope（x-token-scope）：<strong>全部 = <code>session_only<\u002fcode><\u002fstrong>——仅 <code>tk_<\u002fcode> 会话 token（agent 专用）可用；<br />\n<code>grape_<\u002fcode> API Key / Web JWT → <strong>403<\u002fstrong>。写操作需授权。<br />\nBase：<code>{{SERVER_URL}}/api/git-repo<\u002fcode><br />\n出参当前为 <strong>gitcode 平台实际结构<\u002fstrong>（github 逐步归一中，<code>raw<\u002fcode> 兜底保留）。<br />\nCLI：<code>grape git-repo &lt;子资源&gt;<\u002fcode>（如 <code>grape git-repo branches<\u002fcode> 对应 <code>GET /api/git-repo/{owner}/{repo}/branches<\u002fcode>；<br />\n<code>owner<\u002fcode>/<code>repo<\u002fcode> 由 CLI 参数传入，<strong>命令名 ≠ 路径<\u002fstrong>，见 README「CLI 命令映射」）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"10-git-repos-git-provider\">后端区分（Git Provider 判定）<\u002fh2>\n<p>Git provider <strong>由认证 token 的 <code>repo_key<\u002fcode> 前缀派生<\u002fstrong>（<code>gitcode:<\u002fcode> / <code>github:<\u002fcode>），不接受 <code>X-Git-Provider<\u002fcode> / <code>provider<\u002fcode> 参数<br />\n（单一信息源，见 <code>docs/weekly-02/git-repo-provider-from-token-design.md<\u002fcode>）：<\u002fp>\n<pre><code>token（tk_）repo_key = gitcode:owner/repo  → GitCode 后端\ntoken（tk_）repo_key = github:owner/repo   → GitHub 后端\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>provider<\u002fth>\n<th>内部实现（<code>src/vcs/providers/<\u002fcode> 注册表自动派生，新增 provider 只加模块）<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>gitcode<\u002fcode><\u002ftd>\n<td><code>https://gitcode.com/api/v5<\u002fcode>（原生 <code>_req<\u002fcode>）+ <code>providers/gitcode.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>github<\u002fcode><\u002ftd>\n<td><code>https://api.github.com<\u002fcode>（原生 <code>_github_req<\u002fcode>）+ <code>providers/github.py<\u002fcode><strong>（已接入；仅少数语义差异逐步归一）<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>gitlab<\u002fcode><\u002ftd>\n<td>未来：新增 <code>vcs/providers/gitlab.py<\u002fcode>（API_BASE/request/token/MAP）+ 注册<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>通用的 <code>Content-Type: application/json<\u002fcode>（有 body 时）；分页 <code>?page=1&amp;per_page=20<\u002fcode>（max 100）。<\u002fp>\n<hr />\n<h2 id=\"10-git-repos-1\">1. 仓库信息<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepo\">GET /api/git-repo/{owner}/{repo}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo repo --owner {owner} --repo {repo}<\u002fcode>（operation_id=<code>gitrepo_repo<\u002fcode>，命令名 ≠ 路径，见 README「CLI 命令映射」）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参<\u002fstrong><\u002fp>\n<table>\n<thead>\n<tr>\n<th>位置<\u002fth>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>Path<\u002ftd>\n<td><code>owner<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>仓库属主<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>repo<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>仓库名<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>返回（200）<\u002fstrong>：仓库对象<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;id&quot;: 10489208,\n  &quot;name&quot;: &quot;hello&quot;,\n  &quot;full_name&quot;: &quot;Jason7602/hello&quot;,\n  &quot;description&quot;: &quot;...&quot;,\n  &quot;default_branch&quot;: &quot;main&quot;,\n  &quot;html_url&quot;: &quot;https://gitcode.com/Jason7602/hello&quot;,\n  &quot;clone_url&quot;: &quot;...&quot;,\n  &quot;visibility_level&quot;: 20,\n  &quot;created_at&quot;: &quot;...&quot;\n}\n<\u002fcode><\u002fpre>\n<p><strong>错误<\u002fstrong>：401 / 403 / 404（仓库不存在或无权）。<\u002fp>\n<hr />\n<h2 id=\"10-git-repos-2\">2. 分支<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepobranches\">GET /api/git-repo/{owner}/{repo}/branches<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo branches --owner {owner} --repo {repo}<\u002fcode>（operation_id=<code>gitrepo_branches<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参<\u002fstrong>：Path <code>{owner}<\u002fcode>/<code>{repo}<\u002fcode>（provider 由 token 派生，不传）；Query <code>?per_page=50<\u002fcode>（技能用）。<\u002fp>\n<p><strong>返回（200）<\u002fstrong>：分支对象数组<\u002fp>\n<pre><code class=\"language-json\">[\n  {&quot;name&quot;: &quot;main&quot;, &quot;protected&quot;: false, &quot;commit&quot;: {&quot;id&quot;: &quot;sha&quot;, &quot;message&quot;: &quot;...&quot;}},\n  {&quot;name&quot;: &quot;feat/issue-7&quot;, &quot;protected&quot;: false}\n]\n<\u002fcode><\u002fpre>\n<p><strong>错误<\u002fstrong>：401 / 403 / 404。<\u002fp>\n<hr />\n<h2 id=\"10-git-repos-3\">3. 文件内容<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepotreerefbranchdepthsinglerecursive\">GET /api/git-repo/{owner}/{repo}/tree?ref={branch}&amp;depth={single|recursive}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo tree --owner {owner} --repo {repo} --ref {branch} --depth single|recursive<\u002fcode>（operation_id=<code>gitrepo_tree<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参<\u002fstrong><\u002fp>\n<table>\n<thead>\n<tr>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>ref<\u002fcode><\u002ftd>\n<td>string(Query)<\u002ftd>\n<td>分支/引用；空 → 自动解析默认分支<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>depth<\u002fcode><\u002ftd>\n<td>string(Query)<\u002ftd>\n<td><code>single<\u002fcode>（单层，默认） / <code>recursive<\u002fcode>（递归，<strong>仅 GitHub<\u002fstrong>）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>返回（200）<\u002fstrong>：底层 <code>git/trees/{ref}<\u002fcode> 结构<\u002fp>\n<pre><code class=\"language-json\">{&quot;tree&quot;: [\n  {&quot;type&quot;: &quot;tree&quot;, &quot;name&quot;: &quot;configs&quot;, &quot;path&quot;: &quot;configs&quot;, &quot;mode&quot;: &quot;040000&quot;, &quot;sha&quot;: &quot;...&quot;},\n  {&quot;type&quot;: &quot;blob&quot;, &quot;name&quot;: &quot;README.md&quot;, &quot;path&quot;: &quot;README.md&quot;, &quot;mode&quot;: &quot;100644&quot;, &quot;sha&quot;: &quot;...&quot;}\n]}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p><strong>平台差异<\u002fstrong>：GitCode 单层可用（tree+blob）；<code>depth=recursive<\u002fcode> 在 <strong>GitCode 明确不支持<\u002fstrong>（返回破碎树，<br />\n丢失 blob），会返回 <strong>400 提示<\u002fstrong>；GitHub 原生支持递归（<code>git/trees/{sha}?recursive=1<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>错误<\u002fstrong>：401 / 403 / 400（GitCode 递归）/ 404。<\u002fp>\n<hr />\n<h3 id=\"10-git-repos-get-apigit-repoownerrepocontents\">GET /api/git-repo/{owner}/{repo}/contents — 根目录列表<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo contents --owner {owner} --repo {repo}<\u002fcode>（operation_id=<code>gitrepo_contents_root<\u002fcode>）。<\u002fp>\n<p>无尾斜杠的根路由（<code>gitrepo_contents_root<\u002fcode>），等价 <code>contents/{path}<\u002fcode> 的空 path：返回根目录条目数组。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：条目数组（同目录列表结构）：<\u002fp>\n<pre><code class=\"language-json\">[{&quot;type&quot;:&quot;dir&quot;,&quot;name&quot;:&quot;configs&quot;,&quot;path&quot;:&quot;configs&quot;,&quot;sha&quot;:&quot;...&quot;},\n {&quot;type&quot;:&quot;file&quot;,&quot;name&quot;:&quot;README.md&quot;,&quot;path&quot;:&quot;README.md&quot;,&quot;sha&quot;:&quot;...&quot;}]\n<\u002fcode><\u002fpre>\n<hr />\n<h3 id=\"10-git-repos-get-apigit-repoownerrepocontentspathrefbranch\">GET /api/git-repo/{owner}/{repo}/contents/{path}?ref={branch}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo contents --owner {owner} --repo {repo} --path {path} --ref {branch}<\u002fcode>（operation_id=<code>gitrepo_contents<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参<\u002fstrong><\u002fp>\n<table>\n<thead>\n<tr>\n<th>位置<\u002fth>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>Path<\u002ftd>\n<td><code>owner<\u002fcode>/<code>repo<\u002fcode>/<code>path<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>路径。<strong>空/省略 → 根目录列表<\u002fstrong>；目录 → 该目录条目列表；文件 → 单文件 base64 内容（技能多用 <code>CODEOWNERS<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Query<\u002ftd>\n<td><code>ref<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>分支/引用（技能用 <code>ref=codeowner<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>返回（200）<\u002fstrong>：<br />\n- <strong>目录/根<\u002fstrong> → 条目数组（一接口枚举仓库结构，QA/开发 agent 一步拿目录树）：<br />\n<code>json\n  [{\"type\":\"dir\",\"name\":\"configs\",\"path\":\"configs\",\"sha\":\"...\"},\n   {\"type\":\"file\",\"name\":\"README.md\",\"path\":\"README.md\",\"sha\":\"...\"}]<\u002fcode><br />\n- <strong>文件<\u002fstrong> → 文件对象（base64 content）：<br />\n<code>json\n  {\"name\": \"CODEOWNERS\", \"path\": \"CODEOWNERS\", \"size\": 123,\n   \"sha\": \"sha\", \"content\": \"&lt;base64&gt;\", \"encoding\": \"base64\",\n   \"type\": \"file\", \"download_url\": \"...\"}<\u002fcode><\u002fp>\n<blockquote>\n<p><strong>根目录列表<\u002fstrong>：<code>GET /api/git-repo/{owner}/{repo}/contents<\u002fcode>（无尾斜杠的根路由<br />\n<code>gitrepo_contents_root<\u002fcode>）或 <code>/contents?ref=<\u002fcode> 请求根目录，平台返回条目数组。<\u002fp>\n<\u002fblockquote>\n<p><strong>错误<\u002fstrong>：401 / 403 / 404（路径不存在）。<\u002fp>\n<blockquote>\n<p>提示：路径不存在时（尤其根/目录探测），可先取根目录列表确认仓库结构，避免盲目探测吃 404。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"10-git-repos-4\">4. 提交历史<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepocommits\">GET /api/git-repo/{owner}/{repo}/commits<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo commits --owner {owner} --repo {repo}<\u002fcode>（operation_id=<code>gitrepo_commits<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参<\u002fstrong>：Path owner/repo；Query <code>?per_page=<\u002fcode>（可选）、<code>?sha=<\u002fcode>（可选，分支名/tag/commit sha；省略 = 默认分支）。<\u002fp>\n<p><strong>版本要求（Issue #2227）<\u002fstrong>：<code>--sha<\u002fcode> 需要 <strong>grape-cli &gt;= 0.3.3<\u002fstrong> 的构建。版本号相同也可能是<br />\n不同构建（离线 wheel 过旧），<strong>以能力探测为准<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-bash\">grape git-repo commits --help | grep -- --sha   # 有输出 = 支持\npython3 scripts/check_grape_cli_drift.py        # 漂移守卫：缺失时 exit 1，无 grape 时 SKIP\n<\u002fcode><\u002fpre>\n<p><strong>降级核验（部署线 CLI 无 <code>--sha<\u002fcode> 时）<\u002fstrong>：不要静默改用默认分支猜测，按下面组合旁证：<\u002fp>\n<pre><code class=\"language-bash\"># ① PR 目标分支/head sha（pulls get 返回 base/head 的 ref 与 sha）\ngrape git-repo pulls get --owner {owner} --repo {repo} --number &lt;PR&gt; --json-out\n# ② 指定 ref/view 下的文件内容（确认改动已落在目标分支）\ngrape git-repo contents --owner {owner} --repo {repo} --path &lt;file&gt; --ref &lt;branch&gt;\n# ③ 本地 worktree 的提交历史旁证（自基线所在 ref 起）\ngit log origin/&lt;branch&gt; --oneline -30\n<\u002fcode><\u002fpre>\n<p><strong>返回（200）<\u002fstrong>：提交对象数组<\u002fp>\n<pre><code class=\"language-json\">[{&quot;sha&quot;: &quot;...&quot;, &quot;message&quot;: &quot;...&quot;, &quot;author&quot;: {&quot;name&quot;: &quot;x&quot;, &quot;email&quot;: &quot;x@x&quot;},\n  &quot;committer&quot;: {&quot;name&quot;: &quot;x&quot;}, &quot;date&quot;: &quot;2026-...&quot;}]\n<\u002fcode><\u002fpre>\n<p><strong>错误<\u002fstrong>：401 / 403 / 404。<\u002fp>\n<hr />\n<h2 id=\"10-git-repos-5\">5. 标签<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepolabels\">GET /api/git-repo/{owner}/{repo}/labels<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo labels --owner {owner} --repo {repo}<\u002fcode>（operation_id=<code>gitrepo_labels_list<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：标签数组 <code>[{\"id\":1,\"name\":\"bug\",\"color\":\"#ff0000\",\"description\":\"\"}]<\u002fcode><\u002fp>\n<h3 id=\"10-git-repos-post-apigit-repoownerrepolabels\">POST /api/git-repo/{owner}/{repo}/labels<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo labels create --owner {owner} --repo {repo} --json '{\"name\":\"bug\",\"color\":\"d73a4a\"}'<\u002fcode>（operation_id=<code>gitrepo_labels_create<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>Body（form-encoded 或 JSON）<\u002fstrong>：<code>name<\u002fcode>（必填）、<code>color<\u002fcode>（如 <code>d73a4a<\u002fcode>，不带 <code>#<\u002fcode> 的 6 位 hex；带 <code>#<\u002fcode> 前缀会被自动去除）<\u002fp>\n<p><strong>返回（201）<\u002fstrong>：创建后的标签对象。<strong>错误<\u002fstrong>：400（缺 name）/ 409（已存在）/ 403。<\u002fp>\n<hr />\n<h2 id=\"10-git-repos-6\">6. 里程碑<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepomilestonesstateall\">GET /api/git-repo/{owner}/{repo}/milestones?state=all<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 toke
