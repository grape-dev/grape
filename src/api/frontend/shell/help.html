nment-variables-_9\">十二、常见组合<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>部署形态<\u002fth>\n<th>需关注变量<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>生产 HTTPS<\u002ftd>\n<td><code>JWT_SECRET<\u002fcode>、<code>COOKIE_SECURE=true<\u002fcode>、<code>TRUSTED_HOSTS<\u002fcode>、OAuth <code>redirect_uri<\u002fcode>（<code>configs/oauth-providers.json<\u002fcode>）、<code>SMTP_HOST<\u002fcode>/<code>RESEND_API_KEY<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>MySQL 后端<\u002ftd>\n<td><code>DEVOPS_DB_BACKEND=mysql<\u002fcode> + <code>DEVOPS_DB_HOST/PORT/USER/PASSWORD/NAME<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>OBS 存储<\u002ftd>\n<td><code>OBS_ENABLED=true<\u002fcode> + <code>OBS_ENDPOINT/BUCKET/ACCESS_KEY/SECRET_KEY<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>Worker 远端<\u002ftd>\n<td><code>RUNTIME_TOKEN<\u002fcode>、<code>RUNTIME_SERVER_URL<\u002fcode>、<code>RUNTIME_INSTALL_DIR<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>开发/测试<\u002ftd>\n<td><code>DEVOPS_DB_PATH<\u002fcode>（独立测试库）、<code>COOKIE_SECURE=false<\u002fcode>、<code>GRAPE_DEV_VERIFICATION_CODE<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"server-environment-variables-references\">References<\u002fh2>\n<ul>\n<li><code>src/config.py<\u002fcode>：核心配置常量（DB/OBS/邮件/租约/IM）<\u002fli>\n<li><code>src/auth/security_config.py<\u002fcode>：<code>security.json<\u002fcode>（env / JWT 池 / credential_keys）<\u002fli>\n<li><code>src/api/jwt_utils.py<\u002fcode>、<code>src/api/main.py<\u002fcode>：JWT 密钥与启动门禁<\u002fli>\n<li><code>src/auth/providers.py<\u002fcode>：OAuth 与 <code>TRUSTED_HOSTS<\u002fcode><\u002fli>\n<li><code>src/mysql_compat.py<\u002fcode>、<code>src/session_manager.py<\u002fcode>：数据库<\u002fli>\n<li><code>configs/*.example.json<\u002fcode>、<code>.env.example<\u002fcode>：配置模板<\u002fli>\n<\u002ful>", "toc": [{"level": 2, "id": "server-environment-variables-_1", "name": "〇、约定"}, {"level": 2, "id": "server-environment-variables-_2", "name": "一、核心安全类"}, {"level": 2, "id": "server-environment-variables-_3", "name": "二、邮件服务（生产门禁必需）"}, {"level": 2, "id": "server-environment-variables-_4", "name": "三、数据库"}, {"level": 2, "id": "server-environment-variables-obs", "name": "四、对象存储 OBS"}, {"level": 2, "id": "server-environment-variables-worker", "name": "五、调度 / 运行时（Worker）"}, {"level": 2, "id": "server-environment-variables-_5", "name": "六、流水线 / 事件"}, {"level": 2, "id": "server-environment-variables-im", "name": "七、IM / 飞书"}, {"level": 2, "id": "server-environment-variables-_6", "name": "八、场景 / 技能 / 知识库"}, {"level": 2, "id": "server-environment-variables-ai-vlm", "name": "九、AI 模型 / VLM / 云凭据（服务端）"}, {"level": 2, "id": "server-environment-variables-_7", "name": "十、管理 / 部署"}, {"level": 2, "id": "server-environment-variables-_8", "name": "十一、联网 / 代理"}, {"level": 2, "id": "server-environment-variables-_9", "name": "十二、常见组合"}, {"level": 2, "id": "server-environment-variables-references", "name": "References"}], "no": "", "is_overview": false}, {"id": "atomcode", "title": "14. AtomCode 安装与使用", "html": "<h1 id=\"atomcode-14-atomcode\">14. AtomCode 安装与使用<\u002fh1>\n<p>AtomCode 是<strong>基于 Rust<\u002fstrong> 的 Agent CLI。npm 是它的分发安装渠道。<\u002fp>\n<h2 id=\"atomcode-_1\">安装<\u002fh2>\n<p>在实际执行任务的机器上安装（本机直连装在 grape 服务所在机器；远程执行装在 Worker 上）：<\u002fp>\n<pre><code class=\"language-bash\">npm install -g @atomgit.com/atomcode  # 基于 Rust，通过 npm 安装\natomcode --version\n<\u002fcode><\u002fpre>\n<p>使用运行 grape/Worker 的同一系统用户启动 <code>atomcode<\u002fcode>，完成模型与认证配置。<br />\n配置和凭据由执行机器本地管理。安装后可先验证一次独立对话：<\u002fp>\n<pre><code class=\"language-bash\">atomcode -p &quot;Reply OK&quot; --ephemeral --no-tools\n<\u002fcode><\u002fpre>\n<p>该命令会调用已配置的模型；ephemeral 模式不写入会话，no-tools 模式不执行工具。<br />\n二进制版本检测通过只代表 CLI 可启动，不代表模型认证可用。<\u002fp>\n<p>Worker 安装脚本<strong>不再<\u002fstrong>安装任何 agent 引擎（<code>--engine<\u002fcode> 参数已移除）：先自行 <code>npm install -g @atomgit.com/atomcode<\u002fcode>，重启/新建 worker 后由运行态自动发现并注册，无需重启主控。<br />\n未安装引擎不会阻止 Worker 注册；运行态周期重注册会自动发现新装好的引擎（无需重启）。<\u002fp>\n<h2 id=\"atomcode-grape\">在 grape 中使用<\u002fh2>\n<ol>\n<li>确保 grape/Worker 进程的 PATH 中能找到 <code>atomcode<\u002fcode>。交互终端可找到 CLI<br />\n   不代表 systemd 等后台服务使用相同 PATH；必要时更新服务环境并重启。<\u002fli>\n<li>在引擎管理页确认 <code>atomcode<\u002fcode> 已被发现、注册且健康。<\u002fli>\n<li>在场景节点或会话的引擎选择中绑定该 AtomCode 实例。引擎角色<strong>不按引擎类型<br />\n   默认映射<\u002fstrong>（Issue #658 修订：能力与引擎类型无关，默认不限角色）；需要限定<br />\n   角色时在引擎配置中显式声明 role_tags（如 <code>[\"coding\",\"issue\",\"qa\"]<\u002fcode>）。<\u002fli>\n<li>派发任务，检查回复文本、工具事件、用量及任务完成状态。<\u002fli>\n<\u002fol>\n<p>grape 的执行适配使用 <code>--prompt-file &lt;临时文件&gt; --output-format jsonl\n--dangerously-skip-permissions<\u002fcode>。这是无人值守执行：工具审批被自动放行。<br />\n任务在既有 grape 工作目录和可选 sandbox 中运行，提示词文件在调用结束后清理。<br />\n多行提示词不会进入命令行参数或参数日志。<\u002fp>\n<p>用户级技能目录为 <code>~/.atomcode/skills<\u002fcode>；设置 <code>ATOMCODE_HOME<\u002fcode> 时使用<br />\n<code>$ATOMCODE_HOME/skills<\u002fcode>。任务下发的技能沿用 grape 既有物化和提示词引用机制。<\u002fp>\n<h2 id=\"atomcode-_2\">会话续接与版本兼容<\u002fh2>\n<p>本适配要求 CLI 支持 <code>--prompt-file<\u002fcode> 和 <code>--output-format jsonl<\u002fcode>（schema version 1）。<br />\n安装后可用 <code>atomcode --help<\u002fcode> 核对；不支持时请更新 CLI。<\u002fp>\n<p>完整的多轮续接还要求 <code>run.started<\u002fcode> 输出 <code>session_id<\u002fcode>。本次在 AtomCode 源码中<br />\n补充了该可选字段，来自原生 CodingRuntime；grape 保存该 ID 并在后续调用传入<br />\n<code>--resume &lt;id&gt;<\u002fcode>。此能力要在包含该改动的 AtomCode 构建发布/安装后才可用，<br />\n不能仅以 npm 安装成功判断。<\u002fp>\n<p>旧版 JSONL 没有 session_id 时仍可执行独立任务，但 grape 无法自动获得新会话的<br />\n续接 ID。不要使用 <code>--continue<\u002fcode> 代替：同一机器并发执行时“最近会话”不属于确定的任务。<br />\n显式恢复失败会报错，不会偷偷新建会话重跑。<br />\n成功退出但没有回复文本时同样明确失败并保留会话 ID，不会自动切换到新会话。<\u002fp>\n<p>CLI 非零退出、失败终态、会话快照写入错误或事件流缺少终态，都会判为失败。<br />\n用量按每次 usage 事件累计，turn.completed 的汇总不会重复计费。<br />\nAtomCode 的 prompt_tokens 包含缓存输入；适配层会拆为非缓存输入与 cache_read，<br />\n避免看板重复统计。取消与超时终止使用 grape 已登记的进程 PID，并精确匹配工作目录；<br />\nWindows 使用 taskkill /T /F，无需依赖 CLI 文件名或 WMIC 查询。<\u002fp>", "toc": [{"level": 2, "id": "atomcode-_1", "name": "安装"}, {"level": 2, "id": "atomcode-grape", "name": "在 grape 中使用"}, {"level": 2, "id": "atomcode-_2", "name": "会话续接与版本兼容"}], "no": "", "is_overview": false}, {"id": "grape-kit", "title": "15. grape 插件：把 grape 装进你自己的 Agent", "html": "<h1 id=\"grape-kit-15-grape-grape-agent\">15. grape 插件：把 grape 装进你自己的 Agent<\u002fh1>\n<p>grape 官方插件把 Grape 平台能力带进你的 Agent。两种形态按你使用的 Agent 二选一：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>插件<\u002fth>\n<th>适配对象<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><strong>grape-kit<\u002fstrong>（<code>@grape-dev/grape-kit<\u002fcode>）<\u002ftd>\n<td>主流 Agent：OpenCode / CodeArts / WorkBuddy / openclaw<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>grape-dsh<\u002fstrong>（<code>@grape-dev/grape-dsh<\u002fcode>）<\u002ftd>\n<td>dsh（DeepSeek Harness）的专门适配<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>凭据安全<\u002fstrong>：两种插件的 Token 都只在环境变量（<code>GRAPE_API_TOKEN<\u002fcode> / <code>GRAPE_BASE_URL<\u002fcode>）或 <code>~/.grape/config.json<\u002fcode>（权限 600）中提供，不写入任何 Agent 配置文件明文区。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"grape-kit-grape-kit\">grape-kit<\u002fh2>\n<p>面向 OpenCode / CodeArts / WorkBuddy / openclaw 等主流 Agent。装上后你的 Agent 获得 36 个工具：触发/等待流水线（A2A 唯一入口）、issue 全生命周期、事件回环、知识库与看板，并支持<strong>端云协同<\u002fstrong>——通过接管会话把云端 coding 节点原子让渡到你的 Agent 继续实施，完成后携带结构化产物交回平台，流水线链路保持完整。<\u002fp>\n<p><strong>口令安装<\u002fstrong>——把这句粘贴给你的 Agent，它按 README 步骤完成安装与配置：<\u002fp>\n<blockquote>\n<p>请阅读https://gitcode.com/grape-dev/grape-kit/blob/main/README.md，按照步骤为我安装并配置grape-kit<\u002fp>\n<p>若上面的链接被 WAF 拦截（HTTP 418），换 raw 地址：https://raw.gitcode.com/grape-dev/grape-kit/raw/main/README.md<\u002fp>\n<\u002fblockquote>\n<p><strong>npm 安装<\u002fstrong>（Node ≥ 20）：<\u002fp>\n<pre><code class=\"language-bash\">npm i @grape-dev/grape-kit\n<\u002fcode><\u002fpre>\n<p>安装后按 README 配置 <code>GRAPE_BASE_URL<\u002fcode> / <code>GRAPE_API_TOKEN<\u002fcode>（API Key 在 <a href=\"https://www.grapedev.cn/app/#account/profile\">WebUI 账户页<\u002fa> 生成）并选择目标 Agent <code>--target<\u002fcode>。<\u002fp>\n<h3 id=\"grape-kit-agent\">各 Agent 安装差异<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>Agent<\u002fth>\n<th>安装方式<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>OpenCode<\u002ftd>\n<td><code>--target opencode<\u002fcode>（写 mcp.grape 条目 + 技能拷贝，幂等带备份）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>CodeArts Agent<\u002ftd>\n<td><code>--target codearts<\u002fcode>（写 <code>codearts_cli.jsonc<\u002fcode>；凭据只走环境变量）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>WorkBuddy<\u002ftd>\n<td><code>--target workbuddy<\u002fcode>（写 <code>~/.workbuddy/mcp.json<\u002fcode>；<strong>凭据严禁写入 mcp.json<\u002fstrong>，只走环境变量）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>openclaw<\u002ftd>\n<td><code>openclaw plugins install clawhub:grape-kit@latest<\u002fcode>（ClawHub 市场）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"grape-kit-_1\">验证与排障<\u002fh3>\n<ul>\n<li><code>npx -y @grape-dev/grape-kit doctor --probe<\u002fcode>：node 版本、服务端连通、36 工具逐项自检<\u002fli>\n<li>安装后重启 Agent 会话生效；opencode 需重启当前会话<\u002fli>\n<li>401 时先检查 Token 是否为<strong>用户级 API Key<\u002fstrong>（<code>grape_<\u002fcode> 前缀，WebUI 账户页生成）<\u002fli>\n<\u002ful>\n<p>详细工具面与版本历史见<a href=\"https://gitcode.com/grape-dev/grape-kit\">源码仓库<\u002fa>。<\u002fp>\n<h2 id=\"grape-kit-grape-dsh\">grape-dsh<\u002fh2>\n<p>grape 插件对 dsh（DeepSeek Harness）的专门适配。随 dsh 获得 33 个 grape 工具——触发/等待流水线、issue 管理、端云协同接管——并可与 dsh 面板协作。<\u002fp>\n<p><strong>口令安装<\u002fstrong>：<\u002fp>\n<blockquote>\n<p>请阅读https://gitcode.com/grape-dev/grape-dsh/blob/main/README.md，按照步骤为我安装并配置grape-dsh<\u002fp>\n<\u002fblockquote>\n<p><strong>npm 安装<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-bash\">npm i @grape-dev/grape-dsh\n<\u002fcode><\u002fpre>\n<p>安装与配置步骤见<a href=\"https://gitcode.com/grape-dev/grape-dsh\">源码仓库<\u002fa>。<\u002fp>", "toc": [{"level": 2, "id": "grape-kit-grape-kit", "name": "grape-kit"}, {"level": 3, "id": "grape-kit-agent", "name": "各 Agent 安装差异"}, {"level": 3, "id": "grape-kit-_1", "name": "验证与排障"}, {"level": 2, "id": "grape-kit-grape-dsh", "name": "grape-dsh"}], "no": "", "is_overview": false}], "api": [{"id": "README", "title": "README", "html": "<p>﻿# Grape OpenAPI 接口参考<\u002fp>\n<blockquote>\n<p>基于 Issue #45 设计（<code>docs/weekly-02/issue-45-openapi-api-design.md<\u002fcode>、<code>issue-45-cli-design.md<\u002fcode>、<code>issue-45-git-repos-api-design.md<\u002fcode>）与现有代码路由整理。<br />\n覆盖：对外公开接口（Token/API Key 认证）+ Git 仓库统一接口 + A2A；Token 管理为内部（Web UI，不对外，不提供 OpenAPI 文档）。<br />\n认证方式对齐 GitCode 官方：<code>Authorization: Bearer<\u002fcode> / <code>PRIVATE-TOKEN<\u002fcode> / <code>?access_token=<\u002fcode> 三通道。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"README-_1\">全局约定（各端点文档引用，不重复展开）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>约定<\u002fth>\n<th>内容<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><strong>Base URL<\u002fstrong><\u002ftd>\n<td><code>{{SERVER_URL}}<\u002fcode> = 环境变量 <code>GRAPE_SERVER_URL<\u002fcode>，默认 <code>https://&lt;host&gt;<\u002fcode>；所有对外路径前缀 <code>/api/...<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>版本<\u002fstrong><\u002ftd>\n<td>当前无版本号（<code>/api/...<\u002fcode>）；未来破坏性变更引入 <code>/api/v1/...<\u002fcode>，旧版本返回 410 Gone<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>分页<\u002fstrong><\u002ftd>\n<td>统一 <code>page<\u002fcode>（默认 1）+ <code>page_size<\u002fcode>（默认 20，最大 100）；兼容别名 <code>per_page<\u002fcode>（git-repo 系列）；<code>limit<\u002fcode> 仅用于 stream/游标类<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>时间格式<\u002fstrong><\u002ftd>\n<td>一律 ISO 8601 UTC（如 <code>2026-09-16T08:00:00Z<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>ID 前缀口径<\u002fstrong><\u002ftd>\n<td><code>t_<\u002fcode> = Agent 执行实例 / task_id（agent_tasks.id）；<code>tk_<\u002fcode> = 会话 token；<code>grape_<\u002fcode> = 用户级 API Key；<code>rta_<\u002fcode> = 运行时凭据；<code>seq<\u002fcode> = 事件序号；<strong><code>issue_id<\u002fcode> / <code>issue.id<\u002fcode> = 需求卡片 id<\u002fstrong>（<code>/api/issues<\u002fcode> 创建与 notify 返回的 <code>task_id<\u002fcode> 即此值，主字段为 <code>issue_id<\u002fcode>）；<code>{number}<\u002fcode> = 平台 issue 编号<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>repo_key 口径<\u002fstrong><\u002ftd>\n<td>统一表达式 <code>[gitcode:|github:]owner/repo<\u002fcode>；对外入参写 <code>owner/repo<\u002fcode>（无前缀）时由服务端按托管记录判定前缀<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>CLI 命令映射<\u002fstrong><\u002ftd>\n<td>CLI 命令名由契约 <code>operation_id<\u002fcode> 派生（<code>&lt;tag&gt; &lt;verb&gt;<\u002fcode>，如 <code>scenes_list<\u002fcode> → <code>grape scenes list<\u002fcode>），<strong>并非 HTTP 路径字面量<\u002fstrong>；<code>grape &lt;cmd&gt; --help<\u002fcode> 可查实际对应路径。<strong>命令面边界（#2237，#1302 移植）<\u002fstrong>：<code>grape commands<\u002fcode> 除契约命令外，还按契约 <code>/openapi.json<\u002fcode> 的 <code>info[\"x-grape-local-cli-commands\"]<\u002fcode> 字段派生列示本地命令（<code>grape git<\u002fcode>、<code>grape refresh<\u002fcode>、<code>grape commands<\u002fcode>、<code>grape tasks wait<\u002fcode>，行尾带 <code>[local]<\u002fcode> 标注；均无 HTTP 语义、不进契约 operation 集）；本地/非契约命令以 <code>grape &lt;group&gt; --help<\u002fcode> 为准（单一事实源：<code>src/kernel/help_docs_sync.py<\u002fcode> 的 <code>KNOWN_LOCAL_CLI_COMMANDS<\u002fcode>，经契约 info 字段发布）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>SSE<\u002fstrong><\u002ftd>\n<td>事件格式 <code>data: {…}\\n\\n<\u002fcode>；流终止固定 <code>data: {\"done\": true}<\u002fcode>；异常 <code>data: {\"error\": {\"code\", \"message\"}}<\u002fcode>；请求头 <code>Accept: text/event-stream<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>限流/重试<\u002fstrong><\u002ftd>\n<td>429 时先 1s 退避，最多重试 3 次；幂等操作可无惧重放<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"README-token-x-token-scope\">Token 作用域（x-token-scope）<\u002fh2>\n<p>契约（<code>/openapi.json<\u002fcode>）每个公开 operation 含 <code>x-token-scope<\u002fcode> 扩展字段（自动推导，<code>src/api/openapi.py<\u002fcode>），<br />\n标识该接口可用的 token 类型，供 CLI/SDK 按凭证过滤命令：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>值<\u002fth>\n<th>含义<\u002fth>\n<th>认证守卫（源码）<\u002fth>\n<th>可用 Token<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>user_only<\u002fcode><\u002ftd>\n<td>仅用户级凭证<\u002ftd>\n<td><code>require_no_session_token<\u002fcode><\u002ftd>\n<td><code>grape_<\u002fcode> API Key / Web JWT ✅；<strong><code>tk_<\u002fcode> 会话 token ❌（403）<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>session_only<\u002fcode><\u002ftd>\n<td>仅会话级临时 token<\u002ftd>\n<td>认证 <code>get_current_user_or_api_key<\u002fcode> + 体内 <code>_repo_token<\u002fcode>/<code>_repo_platform_token<\u002fcode> 强制<\u002ftd>\n<td><code>tk_<\u002fcode> ✅；<strong><code>grape_<\u002fcode> API Key / JWT ❌（403）<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>dual<\u002fcode><\u002ftd>\n<td>会话 / 用户均可<\u002ftd>\n<td><code>get_current_user_or_api_key<\u002fcode><\u002ftd>\n<td>三通道全放行<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>设计：<code>docs/weekly-03/openapi-x-token-scope-design.md<\u002fcode> + <code>docs/weekly-03/token-scope-classification-design.md<\u002fcode><\u002fp>\n<\u002fblockquote>\n<h3 id=\"README-scope\">各文档 scope 一览<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>文档<\u002fth>\n<th>接口<\u002fth>\n<th style=\"text-align: center;\">scope<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><a href=\"#/api/01-tasks\">01 Tasks<\u002fa><\u002ftd>\n<td><code>notify<\u002fcode>（tk_）/ <code>current<\u002fcode>（tk_ 自省）<\u002ftd>\n<td style=\"text-align: center;\">session_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td><code>complete<\u002fcode>（Event 执行）<\u002ftd>\n<td style=\"text-align: center;\">dual<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/02-repos\">02 Repos<\u002fa><\u002ftd>\n<td><code>managed/member/sync/check-name/create/host/repair/bot-token/deploy-url/remove/project-info<\u002fcode><\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td><code>{owner}/{repo}/git-credential<\u002fcode>、<code>{owner}/{repo}/workspace<\u002fcode><\u002ftd>\n<td style=\"text-align: center;\">session_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/03-agents\">03 Agents<\u002fa><\u002ftd>\n<td>全部<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/04-chat\">04 Chat<\u002fa><\u002ftd>\n<td>全部<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/05-skills\">05 Skills<\u002fa><\u002ftd>\n<td>全部<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/06-scenes\">06 Scenes<\u002fa><\u002ftd>\n<td><code>GET /api/scenes<\u002fcode>（VOD 技能用 session，有意例外）<\u002ftd>\n<td style=\"text-align: center;\">dual<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td>其余<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/07-knowledge\">07 Knowledge<\u002fa><\u002ftd>\n<td><code>list/stats/detail/content/context<\u002fcode><\u002ftd>\n<td style=\"text-align: center;\">dual<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td>写操作（entry/refs/delete/update）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/08-events\">08 Events<\u002fa><\u002ftd>\n<td><code>GET /api/events/detail/{seq}<\u002fcode><\u002ftd>\n<td style=\"text-align: center;\">dual<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td>操作类（terminate/redispatch/thread/chat/knowledge）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/09-task-logs\">09 TaskLogs<\u002fa><\u002ftd>\n<td>全部<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/10-git-repos\">10 Git 仓库<\u002fa><\u002ftd>\n<td><strong>全部<\u002fstrong><\u002ftd>\n<td style=\"text-align: center;\">session_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/11-issues\">11 Issues<\u002fa><\u002ftd>\n<td>仓库列表 + 详情/事件/pipeline + <code>GET status<\u002fcode>（读）<\u002ftd>\n<td style=\"text-align: center;\">dual<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td><code>mine<\u002fcode>（个人维度）、<code>create<\u002fcode>（创建人=调用者）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td><code>awaiting-input<\u002fcode> / <code>pending-review<\u002fcode> / <code>review-pass<\u002fcode> / <code>review-reject<\u002fcode>（tk_，Agent 等用户双态）<\u002ftd>\n<td style=\"text-align: center;\">session_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td>操作/写类（start/<code>PUT status<\u002fcode>/confirm-done/cancel/resume/pipeline/clarify/attachments 写）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/12-a2a\">12 A2A<\u002fa><\u002ftd>\n<td><code>POST /api/a2a<\u002fcode><\u002ftd>\n<td style=\"text-align: center;\">dual<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/13-settings\">13 Settings<\u002fa><\u002ftd>\n<td>全部（凭据/API Key/通知/OAuth/引擎/rta 凭据/mode/规则）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/14-runtime\">14 Runtime<\u002fa><\u002ftd>\n<td>全部（健康度/任务/会话/标签/凭据聚合）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/15-devstage\">15 DevStage<\u002fa><\u002ftd>\n<td>全部（环境 CRUD/开机/关机）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/16-auth-and-misc\">16 Auth+Misc<\u002fa><\u002ftd>\n<td>全部（profile/logout/dashboard/pipeline/search/templates/feishu-onboard/org-audit）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/17-feedback\">17 Feedback<\u002fa><\u002ftd>\n<td><code>POST /api/feedback<\u002fcode>（Submit）<\u002ftd>\n<td style=\"text-align: center;\">dual（Agent tk_ 场景）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td><code>mine<\u002fcode> / <code>context<\u002fcode> / <code>delete<\u002fcode> / <code>upload<\u002fcode><\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<tr>\n<td><\u002ftd>\n<td><code>list<\u002fcode> / <code>stats<\u002fcode> / <code>{fid}/status<\u002fcode>（管理）<\u002ftd>\n<td style=\"text-align: center;\">admin-only（不进契约）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><a href=\"#/api/18-patrol\">18 Patrol<\u002fa><\u002ftd>\n<td>全部（findings 清单/dismiss）<\u002ftd>\n<td style=\"text-align: center;\">user_only<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"README-_2\">目录<\u002fh2>\n<ol>\n<li><a href=\"#/api/00-auth\">认证与通用约定<\u002fa><\u002fli>\n<li><a href=\"#/api/01-tasks\">Tasks 任务接口（/api/tasks）<\u002fa><\u002fli>\n<li><a href=\"#/api/02-repos\">Repos 仓库接口（/api/repos）<\u002fa><\u002fli>\n<li><a href=\"#/api/03-agents\">Agents Agent 配置接口（/api/agents）<\u002fa><\u002fli>\n<li><a href=\"#/api/04-chat\">Chat 对话接口（/api/chat）<\u002fa><\u002fli>\n<li><a href=\"#/api/05-skills\">Skills 技能接口（/api/skills）<\u002fa><\u002fli>\n<li><a href=\"#/api/06-scenes\">Scenes 场景接口（/api/scenes）<\u002fa><\u002fli>\n<li><a href=\"#/api/07-knowledge\">Knowledge 知识接口（/api/knowledge）<\u002fa><\u002fli>\n<li><a href=\"#/api/08-events\">Events 事件接口（/api/events）<\u002fa><\u002fli>\n<li><a href=\"#/api/09-task-logs\">TaskLogs 任务日志接口（/api/task-logs）<\u002fa><\u002fli>\n<li><a href=\"#/api/10-git-repos\">Git 仓库统一接口（/api/git-repo）<\u002fa><\u002fli>\n<li><a href=\"#/api/11-issues\">Issues 对外接口（/api/issues）<\u002fa><\u002fli>\n<li><a href=\"#/api/12-a2a\">A2A 协作接口（/api/a2a）<\u002fa><\u002fli>\n<li><a href=\"#/api/13-settings\">Settings 设置接口（/api/settings）<\u002fa><\u002fli>\n<li><a href=\"#/api/14-runtime\">Runtime 运行时接口（/api/runtime）<\u002fa><\u002fli>\n<li><a href=\"#/api/15-devstage\">DevStage 开发环境（/api/devstage）<\u002fa><\u002fli>\n<li><a href=\"#/api/16-auth-and-misc\">Auth/Misc 账号与全局（/api/auth · dashboard · pipeline · search · project-templates · feishu · orgs/{id}/audit）<\u002fa><\u002fli>\n<li><a href=\"#/api/17-feedback\">Feedback 意见反馈（/api/feedback）<\u002fa><\u002fli>\n<li><a href=\"#/api/18-patrol\">Patrol 巡检异常清单（/api/patrol）<\u002fa><\u002fli>\n<\u002fol>\n<h2 id=\"README-_3\">状态码约定<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>含义（message 英文，Agent 可读）<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>200<\u002ftd>\n<td>Success<\u002ftd>\n<\u002ftr>\n<tr>\n<td>201<\u002ftd>\n<td>Created<\u002ftd>\n<\u002ftr>\n<tr>\n<td>204<\u002ftd>\n<td>No Content<\u002ftd>\n<\u002ftr>\n<tr>\n<td>302<\u002ftd>\n<td>Found（OAuth 重定向回调）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>400<\u002ftd>\n<td>Bad Request（参数缺失/校验失败）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>Unauthorized<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>Forbidden<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>Not Found（资源不存在）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>409<\u002ftd>\n<td>Conflict（资源冲突）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>410<\u002ftd>\n<td>Gone（端点已移除）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>429<\u002ftd>\n<td>Too Many Requests<\u002ftd>\n<\u002ftr>\n<tr>\n<td>500<\u002ftd>\n<td>Internal Server Error<\u002ftd>\n<\u002ftr>\n<tr>\n<td>502<\u002ftd>\n<td>Bad Gateway（上游平台失败）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>503<\u002ftd>\n<td>Service Unavailable<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"README-_4\">错误响应统一格式<\u002fh2>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p><strong>约定<\u002fstrong>：<br />\n- <code>detail.code<\u002fcode> 默认等于 HTTP 状态码；业务细分用 4 位子码（如 <code>40401<\u002fcode>）。<br />\n- <code>detail.message<\u002fcode> <strong>一律英文<\u002fstrong>（主要供 Agent 读取判断）；前端展示语言由 i18n 映射，不依赖 message 原文。<br />\n- HTTP 错误用 <code>HTTPException(detail={\"code\",\"message\"})<\u002fcode>；CLI/上传类业务失败（如 <code>tasks/notify<\u002fcode>）用<br />\n<code>{\"ok\": false, \"code\": N, \"message\": \"...\"}<\u002fcode>（HTTP 200 但业务失败），两者边界 =「HTTP 层错误 vs 业务层返回」。<br />\n- 命令语义端点（grape CLI）按 <code>ok<\u002fcode>/<code>code<\u002fcode> 判失败；其余接口按 HTTP 状态码判。<\u002fp>\n<p>⚠️ 旧文档中的 <code>{\"message\":\"401 Unauthorized\"}<\u002fcode> 写法已废弃，统一为 <code>{\"detail\":{\"code\",\"message\"}}<\u002fcode>。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "README-_1", "name": "全局约定（各端点文档引用，不重复展开）"}, {"level": 2, "id": "README-token-x-token-scope", "name": "Token 作用域（x-token-scope）"}, {"level": 3, "id": "README-scope", "name": "各文档 scope 一览"}, {"level": 2, "id": "README-_2", "name": "目录"}, {"level": 2, "id": "README-_3", "name": "状态码约定"}, {"level": 2, "id": "README-_4", "name": "错误响应统一格式"}], "no": "", "is_overview": true}, {"id": "00-auth", "title": "认证与通用约定", "html": "<h1 id=\"00-auth-_1\">认证与通用约定<\u002fh1>\n<blockquote>\n<p>参考：GitCode 官方 OpenAPI 文档（<code>Authorization: Bearer<\u002fcode> / <code>PRIVATE-TOKEN<\u002fcode> / <code>access_token<\u002fcode> query 三通道）。<br />\ngrape 的 token 为 <strong>grape 自签发的用户级 API Key<\u002fstrong>，传输姿势与 GitCode 官方一致。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"00-auth-token\">认证方式（三通道，任一带有效 Token 即通过）<\u002fh2>\n<h3 id=\"00-auth-1authorization-header\">通道 1：Authorization header（推荐）<\u002fh3>\n<pre><code>Authorization: Bearer &lt;api_key&gt;\n<\u002fcode><\u002fpre>\n<h3 id=\"00-auth-2private-token-header\">通道 2：PRIVATE-TOKEN header<\u002fh3>\n<pre><code>PRIVATE-TOKEN: &lt;api_key&gt;\n<\u002fcode><\u002fpre>\n<h3 id=\"00-auth-3access_token-query\">通道 3：access_token query<\u002fh3>\n<pre><code>GET /api/...?access_token=&lt;api_key&gt;\n<\u002fcode><\u002fpre>\n<h2 id=\"00-auth-_2\">优先级<\u002fh2>\n<p><code>Authorization: Bearer<\u002fcode> &gt; <code>PRIVATE-TOKEN<\u002fcode> &gt; <code>access_token<\u002fcode>。<\u002fp>\n<h2 id=\"00-auth-api-key\">获取 API Key<\u002fh2>\n<p>通过 <strong>Web UI Settings 页「API Tokens」面板（登录会话）<\u002fstrong> 生成；明文仅创建时返回一次，落库 SHA-256。Token 管理<strong>不对外自调用<\u002fstrong><br />\n（不提供 API Key 自调用端点，创建/吊销走 Web UI 或 <code>/api/settings/api-keys<\u002fcode>，见 <a href=\"#/api/13-settings\">13-settings.md<\u002fa>）。<\u002fp>\n<h2 id=\"00-auth-_3\">请求头通用约定<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>Header<\u002fth>\n<th>必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>Authorization<\u002fcode><\u002ftd>\n<td>二选一<\u002ftd>\n<td><code>Bearer &lt;api_key&gt;<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>PRIVATE-TOKEN<\u002fcode><\u002ftd>\n<td>二选一<\u002ftd>\n<td>GitLab 风格<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Content-Type<\u002fcode><\u002ftd>\n<td>有 body 时<\u002ftd>\n<td><code>application/json<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Accept<\u002fcode><\u002ftd>\n<td>否<\u002ftd>\n<td>默认 <code>application/json<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"00-auth-_4\">响应结构约定<\u002fh2>\n<ul>\n<li>通用错误（<code>detail.message<\u002fcode> 英文，Agent 可读；格式见 <code>README.md<\u002fcode>）：<br />\n<code>json\n  {\"detail\": {\"code\": 401, \"message\": \"Not logged in\"}}<\u002fcode><\u002fli>\n<li>多数接口成功返回 JSON 对象/数组；删除类返回 <code>204<\u002fcode>。<\u002fli>\n<\u002ful>\n<h2 id=\"00-auth-x-token-scope\">接口分级（x-token-scope）<\u002fh2>\n<p>契约每个公开 operation 自带 <code>x-token-scope<\u002fcode>（见 README「Token 作用域」），按可用 token 类型分三档：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>值<\u002fth>\n<th>认证<\u002fth>\n<th>可用 Token<\u002fth>\n<th>面向<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><strong>user_only<\u002fstrong><\u002ftd>\n<td><code>require_no_session_token<\u002fcode><\u002ftd>\n<td><code>grape_<\u002fcode> API Key / Web JWT；<code>tk_<\u002fcode> → <strong>403<\u002fstrong><\u002ftd>\n<td>账户/平台管理（settings/skills/scenes 管理/chat/runtime/agents/devstage/dashboard/pipeline/search/feishu/task-logs + 用户操作类）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>session_only<\u002fstrong><\u002ftd>\n<td><code>get_current_user_or_api_key<\u002fcode> + 体内强制<\u002ftd>\n<td>仅 <code>tk_<\u002fcode>；API Key / JWT → <strong>403<\u002fstrong><\u002ftd>\n<td>Git 仓库透传（<code>/api/git-repo<\u002fcode>）+ CLI git-credential/workspace<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>dual<\u002fstrong><\u002ftd>\n<td><code>get_current_user_or_api_key<\u002fcode><\u002ftd>\n<td>三通道全放行<\u002ftd>\n<td>开放读/执行（issues 仓库列表/详情/事件、complete、knowledge 读、events detail、scenes list、a2a）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>三通道传法完全一致：<code>Authorization: Bearer<\u002fcode> / <code>PRIVATE-TOKEN<\u002fcode> / <code>?access_token=<\u002fcode>；<br />\n能否通过取决于 <strong>token 前缀<\u002fstrong>（<code>grape_<\u002fcode> API Key / <code>tk_<\u002fcode> 会话 / JWT），与传输通道无关。<br />\n各端的 scope 明细见 README「各文档 scope 一览」；详细设计见 <code>docs/weekly-03/openapi-x-token-scope-design.md<\u002fcode>。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "00-auth-token", "name": "认证方式（三通道，任一带有效 Token 即通过）"}, {"level": 3, "id": "00-auth-1authorization-header", "name": "通道 1：Authorization header（推荐）"}, {"level": 3, "id": "00-auth-2private-token-header", "name": "通道 2：PRIVATE-TOKEN header"}, {"level": 3, "id": "00-auth-3access_token-query", "name": "通道 3：access_token query"}, {"level": 2, "id": "00-auth-_2", "name": "优先级"}, {"level": 2, "id": "00-auth-api-key", "name": "获取 API Key"}, {"level": 2, "id": "00-auth-_3", "name": "请求头通用约定"}, {"level": 2, "id": "00-auth-_4", "name": "响应结构约定"}, {"level": 2, "id": "00-auth-x-token-scope", "name": "接口分级（x-token-scope）"}], "no": "", "is_overview": false}, {"id": "01-tasks", "title": "Tasks 接口（/api/tasks）— Agent 执行实例动作", "html": "<h1 id=\"01-tasks-tasks-apitasks-agent\">Tasks 接口（/api/tasks）— Agent 执行实例动作<\u002fh1>\n<blockquote>\n<p><code>/api/tasks<\u002fcode> 现仅承载「Agent 执行期动作」类接口；用户侧的<strong>需求列表与操作接口都在 <code>/api/issues<\u002fcode><\u002fstrong><br />\n（见 <a href=\"#/api/11-issues\">11-issues.md<\u002fa>）。<\u002fp>\n<table>\n<thead>\n<tr>\n<th>端点<\u002fth>\n<th>语义<\u002fth>\n<th>认证<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>POST /api/tasks/notify<\u002fcode><\u002ftd>\n<td>Agent 分配/换人/接管通知<\u002ftd>\n<td><code>tk_<\u002fcode> 会话 token（仅 <code>GRAPE_SESSION_TOKEN<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>POST /api/tasks/complete<\u002fcode><\u002ftd>\n<td>Agent 完成一次执行实例<\u002ftd>\n<td>dual（三通道）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GET /api/tasks/current<\u002fcode><\u002ftd>\n<td>Agent 自省当前任务详情（执行实例 + issue + 事件）<\u002ftd>\n<td><code>tk_<\u002fcode>（session_only）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<\u002fblockquote>\n<hr />\n<h2 id=\"01-tasks-post-apitasksnotify\">POST /api/tasks/notify — 任务分配/通知<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode>；API Key / JWT → 403）。<br />\nCLI：<code>grape tasks notify<\u002fcode>（2026-09-16 起进契约，命令名 ≠ 路径，见 README「CLI 命令映射」）。<\u002fp>\n<p>调用方：issue 系列技能（issue/issue、vod/repo-onboarding 等）在分配/换人/接管时调用。<br />\n认证：<code>Authorization: Bearer &lt;tk_ 会话 token&gt;<\u002fcode>——<strong>仅支持 <code>GRAPE_SESSION_TOKEN<\u002fcode><\u002fstrong>，仓库作用域必须与<br />\n<code>repo_key<\u002fcode> 匹配（Agent 执行期由系统注入 <code>$GRAPE_SESSION_TOKEN<\u002fcode>，见 event_pipeline 签发）。<br />\n⚠️ <strong>不再支持 <code>BOT_GITCODE_TOKEN<\u002fcode><\u002fstrong>：若使用 <code>BOT_GITCODE_TOKEN<\u002fcode> 调用，返回 <strong>403 token 无效<\u002fstrong>。<br />\n也<strong>不接受<\u002fstrong> <code>grape_<\u002fcode> API Key / WebUI JWT（契约标 session_only + 服务端体内强制）。<\u002fp>\n<\u002fblockquote>\n<p>请求体（TaskNotifyBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>assignee<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>责任人（人或葡萄机器人）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>仓库<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_number<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>Issue 编号<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>task_description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>任务描述<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>出参：<\u002fp>\n<pre><code class=\"language-json\">{&quot;ok&quot;: true, &quot;issue_id&quot;: 5, &quot;task_id&quot;: 5, &quot;conversation_id&quot;: &quot;uuid&quot;, &quot;message&quot;: &quot;任务已创建并通知责任人&quot;}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p><code>issue_id<\u002fcode>（=<code>task_id<\u002fcode> 兼容别名）为需求卡片 id（issue.id）；bot_takeover 返回 <code>{\"ok\":true,\"issue_id\":0,\"task_id\":0,...}<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>返回：200；400 责任人未注册平台；401 未认证/无效 token（契约依赖层）；<strong>403 非 <code>GRAPE_SESSION_TOKEN<\u002fcode> 或仓库作用域不匹配（含 <code>BOT_GITCODE_TOKEN<\u002fcode>）<\u002fstrong>；404 仓库未托管；bot_takeover 场景返回 <code>{\"ok\":true,\"task_id\":0,\"message\":\"任务已由 ... 接管\"}<\u002fcode>。<\u002fp>\n<hr />\n<h2 id=\"01-tasks-post-apitasksawaiting-input\">POST /api/tasks/awaiting-input — ⚠️ 已迁移<\u002fh2>\n<blockquote>\n<p><strong>已迁移至 <code>POST /api/issues/{issue_id}/awaiting-input<\u002fcode><\u002fstrong>（<code>grape issues awaiting-input<\u002fcode>，见 <code>11-issues.md<\u002fcode>）：<br />\nawaiting-input 只修改 issue 状态、与任务生命周期正交（单信号），归属澄清三件套。旧路径现返回 <strong>410 Gone<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"01-tasks-post-apitaskscomplete-grape-cli-tasks-completeevent\">POST /api/tasks/complete — 任务自报完成（grape CLI tasks complete，Event 执行实例）<\u002fh2>\n<blockquote>\n<p>CLI：<code>grape tasks complete<\u002fcode>（operation_id=<code>tasks_complete<\u002fcode>，命令名 ≠ 路径，见 README「CLI 命令映射」）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（TaskSelfCompleteBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>task_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">会话 token 时可省<\u002ftd>\n<td>会话 token（<code>tk_<\u002fcode>）下由 token 自动定位（<code>session_key<\u002fcode>）；JWT/API Key 必填<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>result_text<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">非结构化时为 ✅<\u002ftd>\n<td>结论/动作/产出摘要（写入事件 result），未结构化时兜底为「任务自报完成…」<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>next_step<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td><code>a2a_issue<\u002fcode> / <code>reply_comment<\u002fcode> / <code>a2a_need_clarify<\u002fcode> / <code>done<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>actions<\u002fcode><\u002ftd>\n<td>string[]<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>动作清单（如 `[\"修改代码修复审查意见\", \"grape git push 分支\", \"在 PR #N 评论告知重新审查\"]）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>conclusion<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>结论（如「已按审查意见完成哪些修复，测试结果，待 QA 重新审查」）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>artifacts<\u002fcode><\u002ftd>\n<td>string[]<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>产出/标识（如 <code>[\"PR #N 评论\", \"commit xxxxxx\"]<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_summary<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>一句话摘要（如「已按审查意见修复 | 修改摘要 | 待重新审查」）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_number<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">外部上报时 ✅<\u002ftd>\n<td>Issue 编号（Issue #2792：外部执行结论上报入口，用户态、无 task_id）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>node<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">外部上报时 ✅<\u002ftd>\n<td>节点标识（<code>vod<\u002fcode>/<code>issue<\u002fcode>/<code>coding<\u002fcode>/<code>qa<\u002fcode>/<code>sre<\u002fcode>），结论写成该节点的对应事件<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repository<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">外部上报时 ✅<\u002ftd>\n<td><code>owner/repo<\u002fcode> 或 <code>repo_key<\u002fcode>；Issue 号逐仓唯一，必须显式指定仓库<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>session_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>外部执行会话标识；缺省按调用者身份归并，用于 <code>(issue, node, session)<\u002fcode> 幂等<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>结构化示例（agent 收尾 <code>grape tasks complete --json<\u002fcode>）：<br />\n<code>json\n{\n  \"actions\": [\"修改代码修复审查意见\", \"grape git push 分支\", \"在 PR #N 评论告知重新审查\"],\n  \"conclusion\": \"已按审查意见完成哪些修复，测试结果，待 QA 重新审查\",\n  \"artifacts\": [\"PR #N 评论\", \"commit xxxxxx\"],\n  \"next_step\": \"QA Agent 重新审查 PR #N\",\n  \"issue_summary\": \"已按审查意见修复 | 修改摘要 | 待重新审查\"\n}<\u002fcode><br />\n传入结构化字段后，服务端组装为结构化 <code>result_text<\u002fcode>（含 <code>actions<\u002fcode>/<code>conclusion<\u002fcode>…），供事件对话与结构化解析识别；不传则用 <code>result_text<\u002fcode> 原文。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"task_id\": \"t_xxx\", \"status\": \"completed\", \"enriched\": \"attached\"}<\u002fcode>；终态幂等返回 <code>already: true<\u002fcode>；流未结束时 <code>status<\u002fcode> 为当前执行态且带 <code>pending_finalize: true<\u002fcode>（自报已记录，等待引擎流结束收敛）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；401 未认证；400 缺 task_id；403 作用域不匹配/非本人托管仓库；404 任务不存在<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>单信号语义（<code>stream-end-finalize-single-signal-design.md<\u002fcode>）：<code>tasks complete<\u002fcode> = 记录<strong>权威结构化结论<\u002fstrong>（产物），<br />\n<strong>终态由引擎流结束定案<\u002fstrong>（<code>finalize_by_stream_end<\u002fcode>）。若流结束已先定案（completed/failed）且本次自报在会话<br />\ntoken 宽限窗（<code>SESSION_TOKEN_REVOKE_GRACE=180s<\u002fcode>）内到达 → 幂等补挂结构化产出（<code>enriched<\u002fcode>）/ 受控提升<br />\n（<code>promoted<\u002fcode>，仅限 no-output 占位失败）；不再区分普通/自报技能，不再等双信号。<\u002fp>\n<p>会话 token：任务 id 由 <code>session_key<\u002fcode> 自动定位（M2 以 task_id 签发），agent 收尾直接<br />\n<code>grape tasks complete --json '{\"result_text\":\"...\",\"next_step\":\"a2a_issue\"}'<\u002fcode>，无需 <code>--task-id<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"01-tasks-issue-2792-task_id\">外部执行结论上报（Issue #2792，无 task_id 的用户态入口）<\u002fh3>\n<p>外部执行者（用户或本机 <code>tk_<\u002fcode> 会话在 GitCode 上完成 Spec/标签/负责人/QA 审查）没有<br />\nGrape 执行实例，用 JWT / API Key 携带 <code>issue_number<\u002fcode> + <code>node<\u002fcode> + <code>repository<\u002fcode><br />\n（+ 结论字段）调用本端点，<strong>结论写成该节点的对应事件<\u002fstrong>，不创建/不改变任何执行实例：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;repository&quot;: &quot;owner/repo&quot;,\n  &quot;issue_number&quot;: 2792,\n  &quot;node&quot;: &quot;issue&quot;,\n  &quot;conclusion&quot;: &quot;Spec 已确认，标签/里程碑/负责人已就绪&quot;,\n  &quot;artifacts&quot;: [&quot;评论 #201190348&quot;],\n  &quot;session_id&quot;: &quot;sess-ext-1&quot;\n}\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>落库事件<\u002ftd>\n<td><code>event_type=a2a_event<\u002fcode>、<code>agent_type=&lt;node&gt;<\u002fcode>、<code>source=external<\u002fcode>、<code>status=completed<\u002fcode>、<code>payload.external=true<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>幂等键<\u002ftd>\n<td><code>(issue, node, session)<\u002fcode> 派生 <code>external-…<\u002fcode>，撞键返回既有 seq（<code>already: true<\u002fcode>），<strong>不覆盖终态结论<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"external\": true, \"already\": false, \"seq\": 123, \"issue_number\": 2792, \"node\": \"issue\", \"session\": \"sess-ext-1\", \"task_id\": 7, \"status\": \"completed\", \"source\": \"external\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 缺 task_id / 缺 repository / 缺 node；403 非本人托管仓库（防 IDOR）；500 事件落库失败<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>判定顺序：会话 token 优先（按 <code>session_key<\u002fcode> 收尾执行实例，即便带了 issue/node 也不转外部上报）；<br />\nJWT/API Key 有 <code>task_id<\u002fcode> 时走原自报收尾；无 <code>task_id<\u002fcode> 且 <code>issue_number<\u002fcode>+<code>node<\u002fcode> 齐全才走外部上报。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"01-tasks-get-apitaskscurrent-agent\">GET /api/tasks/current — 获取当前任务详情（Agent 执行期自省）<\u002fh2>\n<blockquote>\n<p>CLI：<code>grape tasks current<\u002fcode>（operation_id=<code>tasks_current<\u002fcode>）。<\u002fp>\n<p>调用方：Agent 执行期（<code>$GRAPE_SESSION_TOKEN<\u002fcode>）。认证：<strong>仅 <code>tk_<\u002fcode> 会话 token<\u002fstrong>（scope=session_only）；<br />\n<code>grape_<\u002fcode> API Key / WebUI JWT → <strong>403<\u002fstrong>。<code>session_key<\u002fcode> 自动定位当前执行实例，客户端零入参。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode>；API Key / JWT → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>入参<\u002ftd>\n<td>无（<code>session_key<\u002fcode> 自动定位）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{task: {id, status, agent_type, skill, event_seq, result_text, errors, exit_code, 时间, repo_key, issue: {id, issue_number, title, assignee, stage, status, scene_id, url}, events_count, latest_event}}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；401 未认证；403 非 session / 仓库作用域不匹配；404 任务不存在<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<ul>\n<li><strong><code>issue<\u002fcode><\u002fstrong>：关联需求（<code>agent_tasks.issue_id<\u002fcode> → <code>issue<\u002fcode> 表）；<code>url<\u002fcode> 为 GitCode/GitHub 该 issue 链接。<\u002fli>\n<li><strong><code>latest_event<\u002fcode><\u002fstrong>：<code>events<\u002fcode> 表按 <code>repo_key + #issue_number<\u002fcode> 的最新事件（seq 升序末条）。<\u002fli>\n<li><strong>不含 <code>prompt<\u002fcode><\u002fstrong>：prompt 是指令/知识性内容，Agent 在 Worker 工作区已可读，服务端不下发。<\u002fli>\n<\u002ful>\n<\u002fblockquote>\n<hr />\n<blockquote>\n<p>迁移索引：原 <code>/api/tasks/{task_id}/*<\u002fcode> 用户操作端点已迁至 <code>/api/issues/{issue_id}/...<\u002fcode>（见 11-issues.md）；<br />\nCLI 轮询状态改用 <code>GET /api/issues/{issue_id}/status<\u002fcode>。<br />\n<code>POST /api/tasks/close<\u002fcode>、<code>POST/DELETE /api/tasks/attachments/pre-upload*<\u002fcode> 已移除——<br />\n附件统一走 <code>/api/issues/{issue_id}/attachments<\u002fcode>；Issue 关闭由平台 webhook 自动收尾。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "01-tasks-post-apitasksnotify", "name": "POST /api/tasks/notify — 任务分配/通知"}, {"level": 2, "id": "01-tasks-post-apitasksawaiting-input", "name": "POST /api/tasks/awaiting-input — ⚠️ 已迁移"}, {"level": 2, "id": "01-tasks-post-apitaskscomplete-grape-cli-tasks-completeevent", "name": "POST /api/tasks/complete — 任务自报完成（grape CLI tasks complete，Event 执行实例）"}, {"level": 3, "id": "01-tasks-issue-2792-task_id", "name": "外部执行结论上报（Issue #2792，无 task_id 的用户态入口）"}, {"level": 2, "id": "01-tasks-get-apitaskscurrent-agent", "name": "GET /api/tasks/current — 获取当前任务详情（Agent 执行期自省）"}], "no": "", "is_overview": false}, {"id": "02-repos", "title": "Repos 仓库接口（/api/repos）", "html": "<h1 id=\"02-repos-repos-apirepos\">Repos 仓库接口（/api/repos）<\u002fh1>\n<blockquote>\n<p>对外公开（部分只读），认证：<code>get_current_user_or_api_key<\u002fcode>。<br />\nscope（x-token-scope）：平台业务接口（managed/member/sync/check-name/create/host/repair/bot-token/deploy-url/remove/project-info 等）= <strong>user_only<\u002fstrong>；<br />\n<code>{owner}/{repo}/git-credential<\u002fcode>、<code>{owner}/{repo}/workspace<\u002fcode>（CLI 私有） = <strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode>）。<br />\n⚠️ <strong>与 <code>/api/git-repo<\u002fcode> 区分<\u002fstrong>：本接口（<code>/api/repos<\u002fcode>）是 <strong>grape 平台的仓库接口<\u002fstrong>，承载 grape 平**台业务属性<br />\n（托管/同步/成员/bot token/部署 URL/项目知识等）；而 <code>/api/git-repo<\u002fcode>（见 10-git-repos.md）是<br />\n<strong>Git 仓库透传接口<\u002fstrong>（Issue/PR/内容/分支等由 gitcode/github/gitlab 提供，后端由 token 的 repo_key 前缀判定）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"02-repos-get-apireposmanaged\">GET /api/repos/managed — 托管仓库列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>status<\u002fcode>（可选）等 |<br />\n| 出参 | <code>[{repo_key, repo_owner, repo_name, full_name, webhook_id, bot_username, dev_scene, host_status, deploy_url, created_at}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposmember\">GET /api/repos/member — 成员仓库列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 用户参与的仓库数组 |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-post-apirepossync\">POST /api/repos/sync — 同步仓库<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposcheck-name\">GET /api/repos/check-name — 校验仓库名<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>name<\u002fcode> / <code>owner<\u002fcode> 等 |<br />\n| 出参 | <code>{\"available\": bool, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-post-apireposcreate\">POST /api/repos/create — 创建仓库<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateRepoBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>仓库名<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>描述<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>private<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>私密<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>visibility<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>可见性<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>auto_init<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>自动初始化（默认 true）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>default_branch<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>默认分支（main）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>org<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>组织<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>host_after_create<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>创建后是否托管<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>出参：<code>{repo_key, full_name, ...}<\u002fcode><\u002fp>\n<p>返回：200/201；400。<\u002fp>\n<hr />\n<h2 id=\"02-repos-post-apireposhost\">POST /api/repos/host — 托管仓库<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（RepoAction）：<code>{\"full_name\": \"owner/repo\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"full_name\", \"webhook_id\", \"host_warning\", \"message\"}<\u002fcode> |<br />\n| 返回 | 200；托管失败不中断，返回 host_warning |<\u002fp>\n<hr />\n<h2 id=\"02-repos-post-apireposownerreporepair-host\">POST /api/repos/{owner}/{repo}/repair-host — 修复托管<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200；未托管 404 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-post-apireposownerrepovcs-healthreset-vcs-issue-3759\">POST /api/repos/{owner}/{repo}/vcs-health/reset — 清除仓库 VCS 熔断（Issue #3759）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>上游 VCS 已不存在的孤儿仓库卡被熔断（<code>vcs_missing<\u002fcode>）后，仓库内逐 issue 读不再打上游。<br />\n重绑 provider 或确认上游已恢复后调用本端点清除台账，下一次读自动重新探测。<\u002fp>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"repo_key\", \"before\": {\"vcs_status\", \"vcs_missing_since\", \"vcs_last_error_code\"}, \"after\": {\"vcs_status\", \"vcs_fail_count\"}, \"message\"}<\u002fcode> |<br />\n| 返回 | 200（幂等）；403 无仓库权限 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposbot-tokenownerrepo-bot-token\">GET /api/repos/bot-token/{owner}/{repo} — 获取仓库 bot token<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong><\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"bot_gitcode_token\": \"***\", ...}<\u002fcode>（脱敏） |<br />\n| 返回 | 200；未配置 400 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-put-apireposbot-token-bot-token\">PUT /api/repos/bot-token — 设置仓库 bot token<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（BotTokenBody）：<code>{\"full_name\": \"owner/repo\", \"bot_token\": \"...\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposdeploy-urlownerrepo-url\">GET /api/repos/deploy-url/{owner}/{repo} — 获取部署 URL<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong><\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"deploy_url\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-put-apireposdeploy-url-url\">PUT /api/repos/deploy-url — 设置部署 URL<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（DeployUrlBody）：<code>{\"full_name\": \"owner/repo\", \"deploy_url\": \"...\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-post-apireposremove\">POST /api/repos/remove — 解除托管<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（RepoAction）：<code>{\"full_name\": \"owner/repo\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposownerrepoproject-info\">GET /api/repos/{owner}/{repo}/project-info — 项目知识<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）<br />\n会话 token 调用需<strong>仓库作用域匹配<\u002fstrong>（token 绑定的 repo_key 与 <code>owner/repo<\u002fcode> 不一致 → 403）；<br />\nJWT / API Key 维持用户通道现状。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{files: {project-graph.md: \"...\", project-capabilities.md: \"...\"}, meta: {commit, branches, updated, degraded}}<\u002fcode> |<br />\n| 返回 | 200；403 会话 token 仓库作用域不匹配 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposownerreposcene-recommend-config\">GET /api/repos/{owner}/{repo}/scene-recommend-config — 获取场景推荐配置<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | 场景推荐配置（入口场景 + 路由规则） |<br />\n| 返回 | 200 |<\u002fp>\n<h2 id=\"02-repos-put-apireposownerreposcene-recommend-config\">PUT /api/repos/{owner}/{repo}/scene-recommend-config — 保存场景推荐配置<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（SceneRecommendConfigBody）：<code>{scene_id, fallback_scene, ...}<\u002fcode><\u002fp>\n<blockquote>\n<p>写入时自检：<code>scene_id<\u002fcode> 必须存在于当前场景列表中（<code>fallback_scene<\u002fcode> 同理），否则报错。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400 场景不存在 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposownerrepogit-credential-git-grape-3-cli\">GET /api/repos/{owner}/{repo}/git-credential — 一次性 git 平台凭据（grape 私有，方案③ CLI 内部使用）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<\u002fp>\n<p>⚠️ 非 any gitcode/github/gitlab 平台原生接口——是 <strong>grape 自身能力<\u002fstrong>：把平台 token 按会话身份<br />\n（chat→用户 token / devops agent→仓库 bot token）以<strong>一次性/短期凭证<\u002fstrong>形式交 CLI 本地 <code>git clone/push<\u002fcode> 用。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| Provider | 由认证 token 的 <code>repo_key<\u002fcode> 前缀派生（gitcode:/github:），不传 provider 参数 |<br />\n| 出参 | <code>{provider: \"gitcode\", username: \"x-access-token\", password: \"&lt;一次性 token&gt;\", clone_url: \"...\", expires_in: 600}<\u002fcode> |<br />\n| 返回 | 200；403 非会话级 token / provider 未接入；502 平台 token 解析失败 |<\u002fp>\n<hr />\n<h2 id=\"02-repos-get-apireposownerrepoworkspace-grape\">GET /api/repos/{owner}/{repo}/workspace — 仓库工作区路径（grape 私有）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<\u002fp>\n<p>⚠️ 非平台原生——返回 grape 管理工作区（worktree）的本地路径，供 CLI 在本地执行 git。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| Provider | 由认证 token 的 <code>repo_key<\u002fcode> 前缀派生（gitcode:/github:），不传 provider 参数 |<br />\n| 出参 | <code>{workspace: \"&lt;本地路径&gt;\", clone_url: \"https://gitcode.com/{owner}/{repo}.git\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>", "toc": [{"level": 2, "id": "02-repos-get-apireposmanaged", "name": "GET /api/repos/managed — 托管仓库列表"}, {"level": 2, "id": "02-repos-get-apireposmember", "name": "GET /api/repos/member — 成员仓库列表"}, {"level": 2, "id": "02-repos-post-apirepossync", "name": "POST /api/repos/sync — 同步仓库"}, {"level": 2, "id": "02-repos-get-apireposcheck-name", "name": "GET /api/repos/check-name — 校验仓库名"}, {"level": 2, "id": "02-repos-post-apireposcreate", "name": "POST /api/repos/create — 创建仓库"}, {"level": 2, "id": "02-repos-post-apireposhost", "name": "POST /api/repos/host — 托管仓库"}, {"level": 2, "id": "02-repos-post-apireposownerreporepair-host", "name": "POST /api/repos/{owner}/{repo}/repair-host — 修复托管"}, {"level": 2, "id": "02-repos-post-apireposownerrepovcs-healthreset-vcs-issue-3759", "name": "POST /api/repos/{owner}/{repo}/vcs-health/reset — 清除仓库 VCS 熔断（Issue #3759）"}, {"level": 2, "id": "02-repos-get-apireposbot-tokenownerrepo-bot-token", "name": "GET /api/repos/bot-token/{owner}/{repo} — 获取仓库 bot token"}, {"level": 2, "id": "02-repos-put-apireposbot-token-bot-token", "name": "PUT /api/repos/bot-token — 设置仓库 bot token"}, {"level": 2, "id": "02-repos-get-apireposdeploy-urlownerrepo-url", "name": "GET /api/repos/deploy-url/{owner}/{repo} — 获取部署 URL"}, {"level": 2, "id": "02-repos-put-apireposdeploy-url-url", "name": "PUT /api/repos/deploy-url — 设置部署 URL"}, {"level": 2, "id": "02-repos-post-apireposremove", "name": "POST /api/repos/remove — 解除托管"}, {"level": 2, "id": "02-repos-get-apireposownerrepoproject-info", "name": "GET /api/repos/{owner}/{repo}/project-info — 项目知识"}, {"level": 2, "id": "02-repos-get-apireposownerreposcene-recommend-config", "name": "GET /api/repos/{owner}/{repo}/scene-recommend-config — 获取场景推荐配置"}, {"level": 2, "id": "02-repos-put-apireposownerreposcene-recommend-config", "name": "PUT /api/repos/{owner}/{repo}/scene-recommend-config — 保存场景推荐配置"}, {"level": 2, "id": "02-repos-get-apireposownerrepogit-credential-git-grape-3-cli", "name": "GET /api/repos/{owner}/{repo}/git-credential — 一次性 git 平台凭据（grape 私有，方案③ CLI 内部使用）"}, {"level": 2, "id": "02-repos-get-apireposownerrepoworkspace-grape", "name": "GET /api/repos/{owner}/{repo}/workspace — 仓库工作区路径（grape 私有）"}], "no": "", "is_overview": false}, {"id": "03-agents", "title": "Agents Agent 配置接口（/api/agents）", "html": "<h1 id=\"03-agents-agents-agent-apiagents\">Agents Agent 配置接口（/api/agents）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。<br />\nscope（x-token-scope）：全部 = <strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"03-agents-get-apiagentstypes-agent\">GET /api/agents/types — Agent 类型列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>[{agent_type, display_name, description, icon, order_num, ...}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"03-agents-get-apiagentsnameownerrepo-agent\">GET /api/agents/{name}/{owner}/{repo} — 查询 Agent 配置<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{name}<\u002fcode>（vod/issue/coding/qa/sre/chat）<code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{id, runtime, skill, skill_id, repo_gitcode_token(脱敏), runtime_session_id, status, last_active_at, enable, subscribe_events, im_*}<\u002fcode> |<br />\n| 返回 | 200；404 未配置 |<\u002fp>\n<hr />\n<h2 id=\"03-agents-put-apiagentsnameownerrepo-agent\">PUT /api/agents/{name}/{owner}/{repo} — 更新 Agent 配置<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（AgentConfig）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>backend<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>引擎名（兼容）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>backends<\u002fcode><\u002ftd>\n<td>array<\u002ftd>\n<td>引擎集合<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skill<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>技能名（兼容旧前端）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skill_id<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>技能主键 id（新）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skill_scope<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>official/repo/user<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>enable<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td>启停<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>subscribe_events<\u002fcode><\u002ftd>\n<td>array<\u002ftd>\n<td>订阅事件<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>im_app_id<\u002fcode> / <code>im_app_secret<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>飞书配置<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"ok\": true, \"id\": ...}<\u002fcode> |<br />\n| 返回 | 200；400 skill 无效；404 |<\u002fp>\n<hr />\n<h2 id=\"03-agents-post-apiagentsnameownerrepoclean-agent\">POST /api/agents/{name}/{owner}/{repo}/clean — 清理 Agent 会话<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{name}<\u002fcode> <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | <code>{\"message\": \"Agent 会话已清理（runtime_session_id 已置空）\", \"cleaned\": true, \"agent_type\": \"vod\"}<\u002fcode> |<br />\n| 返回 | 200；400 未知 Agent |<\u002fp>", "toc": [{"level": 2, "id": "03-agents-get-apiagentstypes-agent", "name": "GET /api/agents/types — Agent 类型列表"}, {"level": 2, "id": "03-agents-get-apiagentsnameownerrepo-agent", "name": "GET /api/agents/{name}/{owner}/{repo} — 查询 Agent 配置"}, {"level": 2, "id": "03-agents-put-apiagentsnameownerrepo-agent", "name": "PUT /api/agents/{name}/{owner}/{repo} — 更新 Agent 配置"}, {"level": 2, "id": "03-agents-post-apiagentsnameownerrepoclean-agent", "name": "POST /api/agents/{name}/{owner}/{repo}/clean — 清理 Agent 会话"}], "no": "", "is_overview": false}, {"id": "04-chat", "title": "Chat 对话接口（/api/chat）", "html": "<h1 id=\"04-chat-chat-apichat\">Chat 对话接口（/api/chat）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。<br />\nscope（x-token-scope）：全部 = <strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"04-chat-get-apichatconversations\">GET /api/chat/conversations — 会话列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo_key<\u002fcode>（可选） |<br />\n| 出参 | <code>[{id, user_id, repo_key, title, conv_type, issue_number, created_at, last_active_at}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatconversations\">POST /api/chat/conversations — 新建会话<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（NewConversationBody）：<code>{\"repo_key\": \"owner/repo\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{id, repo_key, title, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-delete-apichatconversationsconv_id\">DELETE /api/chat/conversations/{conv_id} — 删除会话<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{conv_id}<\u002fcode> |<br />\n| 返回 | 200/204；404 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatconversationsensure-issue-issue\">POST /api/chat/conversations/ensure-issue — 确保 Issue 会话<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（EnsureIssueConvBody）：<code>{\"repo_key\": \"owner/repo\", \"issue_number\": 5}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{id, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-get-apichatmessagesconv_id\">GET /api/chat/messages/{conv_id} — 会话消息<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{conv_id}<\u002fcode> |<br />\n| Query | <code>limit<\u002fcode>（可选）、<code>before_ts<\u002fcode>（可选） |<br />\n| 出参 | <code>[{role, content, created_at, ...}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatmessagesmsg_idrecall\">POST /api/chat/messages/{msg_id}/recall — 撤回消息<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{msg_id}<\u002fcode>（消息 id，<code>chat_submit<\u002fcode> 响应 <code>message_id<\u002fcode> 或 <code>GET /messages<\u002fcode> 列表 <code>id<\u002fcode>） |<br />\n| 出参 | <code>{recalled: true, message_id, task_id, terminated}<\u002fcode>（软删除 + 终止该轮 agent 执行） |<br />\n| 返回 | 200；400（非 user 消息）；404（消息不存在 / 非本人会话） |<\u002fp>\n<p>说明（Issue #442）：仅限本人发送的消息；软删除保留原文供「重新编辑」；同轮 agent 回复一并软删除；direct 模式经 ChatTaskManager 终止，远端模式复用任务取消（#136）。<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatsend\">POST /api/chat/send — 发送消息（普通）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（ChatMessage）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>message<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>消息内容（必填）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>仓库<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>conversation_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>会话 ID<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>image_data<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>图片 base64（可选）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | 完整 assistant 回复（text/结构化） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatsendstream-sse\">POST /api/chat/send/stream — 发送消息（SSE 流式）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>同上请求体。返回 SSE 流：<code>data: {delta: \"...\"}<\u002fcode> … <code>data: {done: true, ...}<\u002fcode>。<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatsendasync\">POST /api/chat/send/async — 异步发送<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>同上请求体。出参：<code>{\"task_id\": \"...\", \"status\": \"accepted\"}<\u002fcode>，随后轮询 <code>GET /api/chat/task/{task_id}/status<\u002fcode>。<\u002fp>\n<hr />\n<h2 id=\"04-chat-get-apichattasktask_idstatus\">GET /api/chat/task/{task_id}/status — 异步任务状态<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| 出参 | <code>{\"status\": \"processing/completed/failed\", \"result\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-get-apichattasktask_idstream\">GET /api/chat/task/{task_id}/stream — 异步任务流式结果<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> |<br />\n| 出参 | SSE 流 |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatfeedback\">POST /api/chat/feedback — 提交反馈<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（FeedbackBody）：<code>{\"seq\": int, \"feedback_type\": \"create_issue\", \"comment\": \"...\"}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-get-apichatconfig-chat\">GET /api/chat/config — 获取 Chat 配置<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | <code>{backend, backend_name, settings, personal_engines, ...}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-put-apichatconfig-chat\">PUT /api/chat/config — 更新 Chat 配置<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"04-chat-post-apichatsubmit\">POST /api/chat/submit — 提交（任务场景）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>| 出参 | 处理结果 |<br />\n| 返回 | 200 |<\u002fp>", "toc": [{"level": 2, "id": "04-chat-get-apichatconversations", "name": "GET /api/chat/conversations — 会话列表"}, {"level": 2, "id": "04-chat-post-apichatconversations", "name": "POST /api/chat/conversations — 新建会话"}, {"level": 2, "id": "04-chat-delete-apichatconversationsconv_id", "name": "DELETE /api/chat/conversations/{conv_id} — 删除会话"}, {"level": 2, "id": "04-chat-post-apichatconversationsensure-issue-issue", "name": "POST /api/chat/conversations/ensure-issue — 确保 Issue 会话"}, {"level": 2, "id": "04-chat-get-apichatmessagesconv_id", "name": "GET /api/chat/messages/{conv_id} — 会话消息"}, {"level": 2, "id": "04-chat-post-apichatmessagesmsg_idrecall", "name": "POST /api/chat/messages/{msg_id}/recall — 撤回消息"}, {"level": 2, "id": "04-chat-post-apichatsend", "name": "POST /api/chat/send — 发送消息（普通）"}, {"level": 2, "id": "04-chat-post-apichatsendstream-sse", "name": "POST /api/chat/send/stream — 发送消息（SSE 流式）"}, {"level": 2, "id": "04-chat-post-apichatsendasync", "name": "POST /api/chat/send/async — 异步发送"}, {"level": 2, "id": "04-chat-get-apichattasktask_idstatus", "name": "GET /api/chat/task/{task_id}/status — 异步任务状态"}, {"level": 2, "id": "04-chat-get-apichattasktask_idstream", "name": "GET /api/chat/task/{task_id}/stream — 异步任务流式结果"}, {"level": 2, "id": "04-chat-post-apichatfeedback", "name": "POST /api/chat/feedback — 提交反馈"}, {"level": 2, "id": "04-chat-get-apichatconfig-chat", "name": "GET /api/chat/config — 获取 Chat 配置"}, {"level": 2, "id": "04-chat-put-apichatconfig-chat", "name": "PUT /api/chat/config — 更新 Chat 配置"}, {"level": 2, "id": "04-chat-post-apichatsubmit", "name": "POST /api/chat/submit — 提交（任务场景）"}], "no": "", "is_overview": false}, {"id": "05-skills", "title": "Skills 技能接口（/api/skills）", "html": "<h1 id=\"05-skills-skills-apiskills\">Skills 技能接口（/api/skills）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。<br />\nscope（x-token-scope）：多数 = <strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）；<br />\n<code>skills_upload<\u002fcode>、<code>skills_detail<\u002fcode> 与<strong>子技能三端点<\u002fstrong>（<code>sub<\u002fcode>/<code>sub get<\u002fcode>/<code>package-sub<\u002fcode>）为 <strong>dual<\u002fstrong><br />\n（会话 token 可调，agent 运行时按需加载）；其余（含 <code>skills_list<\u002fcode>）均为 <strong>user_only<\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"05-skills-get-apiskills\">GET /api/skills — 技能列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills list<\u002fcode>（operation_id=<code>skills_list<\u002fcode>，命令名 ≠ 路径，见 README「CLI 命令映射」）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>repo<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">仓库（scope 过滤）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scope<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">official / repo / user（缺省 = 全部；同 scope 维度过滤）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent_type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">vod/issue/coding/qa/sre/chat<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>sub_scene<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">子场景英文 id（scaffolding/feedback-loop 等）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>q<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">关键字（skill_name / display_name / description 模糊匹配）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>sort<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\"><code>latest<\u002fcode>（默认）/ <code>hot<\u002fcode>（like_count）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>page<\u002fcode> / <code>page_size<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\">分页（page_size=0 时不分页返回全量）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>扩展字段：<code>is_featured, like_count, liked_by_me, scene_count, repo_count, scenes, sub_scene, sub_scene_id<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 技能数组（见上过滤规则） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillscategories\">GET /api/skills/categories — 技能分类<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills categories<\u002fcode>（operation_id=<code>skills_categories<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{categories: [...], tree: [...]}<\u002fcode>（<code>categories<\u002fcode> 为 Issue #179 旧一级列表；<code>tree<\u002fcode> 为 Issue #2761 统一分类树） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillstag-suggest\">GET /api/skills/tag-suggest — 技能标签推荐<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>技能名称（关键词候选）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>技能描述（关键词候选）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{tags: [string]}<\u002fcode>（规则型候选，最多 3 个） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsagent-stats-agent\">GET /api/skills/agent-stats — Agent 维度技能统计<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills agent-stats<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>scope<\u002fcode>（可选）、<code>repo<\u002fcode>（可选；过滤规则与列表一致） |<br />\n| 出参 | 技能总数 + 各 agent_type 的技能数量 |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsfeatured\">GET /api/skills/featured — 精选技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills featured<\u002fcode>（operation_id=<code>skills_featured<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>limit<\u002fcode>（可选，默认 5）、<code>repo<\u002fcode>（可选，scope 过滤） |<br />\n| 出参 | 精选技能数组（is_featured=1 且 official，按 like_count 排序） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsstats\">GET /api/skills/stats — 技能统计<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills stats<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{skill_name: {scene_count: N, repo_count: N}}<\u002fcode>（scene_skill_ref 聚合） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillssearch\">GET /api/skills/search — 搜索技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills search<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>q<\u002fcode>（必填） |<br />\n| 出参 | <code>[{skill_id, name, display_name, description, match_reason}]<\u002fcode>（先 skill_name 精准，再 description+display_name+agent_type 模糊） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsby-idskill_id\">GET /api/skills/by-id/{skill_id} — 技能详情<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）<br />\nCLI：<code>grape skills detail --id {skill_id}<\u002fcode>（operation_id=<code>skills_detail<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| 出参 | <code>{id, skill_name, display_name, description, agent_type, skill_path, scope, owner_id, ...}<\u002fcode> |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsby-idskill_iddownload-zip\">GET /api/skills/by-id/{skill_id}/download — 下载技能 ZIP<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape skills download --id {skill_id}<\u002fcode>（operation_id=<code>skills_download<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| 出参 | ZIP（application/zip） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsby-idskill_idversions\">GET /api/skills/by-id/{skill_id}/versions — 版本历史<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\noperation_id=<code>skills_versions<\u002fcode>（Issue #3168 详情页「版本历史」Tab）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| Query | <code>page<\u002fcode> / <code>page_size<\u002fcode>（可选，分页，最新在前） |<br />\n| 出参 | <code>{versions: [{id, skill_id, version, change_note, uploaded_at, uploaded_by}], total, page, page_size}<\u002fcode> |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsby-idskill_idfiles\">GET /api/skills/by-id/{skill_id}/files — 包内文件清单<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\noperation_id=<code>skills_files<\u002fcode>（Issue #3168 详情页「资源」Tab）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| 出参 | <code>{files: [{path, size}], file_count}<\u002fcode>（官方技能从包内清单读取，用户技能解包枚举） |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsby-idskill_idrelated\">GET /api/skills/by-id/{skill_id}/related — 相关技能<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\noperation_id=<code>skills_related<\u002fcode>（Issue #3168 详情页「相关技能」Tab）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{skill_id}<\u002fcode> |<br />\n| 出参 | <code>{related: [{id, skill_name, display_name, description, agent_type, summary, tags, like_count}]}<\u002fcode>（共享标签优先，同 agent_type 兜底，最多 6 条；本人可见范围内过滤） |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"05-skills-get-apiskillsby-idskill_idcomments\">GET /api/skills/by-id/{skill_id}/comments — 评论列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\noperation_id=<code>skills_comments_list<\u002fcode>（Issue #3168 详情页「评论」Tab）。<\u002fp>\n<\u002fbloc
