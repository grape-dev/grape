evel": 3, "id": "16-auth-and-misc-post-apiorgsorg_idrepos-org_repos_bind", "name": "POST /api/orgs/{org_id}/repos — org_repos_bind"}, {"level": 3, "id": "16-auth-and-misc-get-apiorgsorg_idreposavailable-org_repos_available", "name": "GET /api/orgs/{org_id}/repos/available — org_repos_available"}, {"level": 3, "id": "16-auth-and-misc-post-apiorgsorg_idreposbatch-org_repos_bind_batch", "name": "POST /api/orgs/{org_id}/repos/batch — org_repos_bind_batch"}, {"level": 3, "id": "16-auth-and-misc-delete-apiorgsorg_idreposrepo_key-org_repos_unbind", "name": "DELETE /api/orgs/{org_id}/repos/{repo_key} — org_repos_unbind"}, {"level": 3, "id": "16-auth-and-misc-post-apiorgsorg_idreposrepo_keytransfer-org_repos_transfer", "name": "POST /api/orgs/{org_id}/repos/{repo_key}/transfer — org_repos_transfer"}, {"level": 2, "id": "16-auth-and-misc-ov-apiorgsorg_idov-credentials", "name": "组织 OV 凭据格子（/api/orgs/{org_id}/ov-credentials）"}, {"level": 3, "id": "16-auth-and-misc-get-apiorgsorg_idov-credentials-orgs_ov_credentials_list", "name": "GET /api/orgs/{org_id}/ov-credentials — orgs_ov_credentials_list"}, {"level": 3, "id": "16-auth-and-misc-put-apiorgsorg_idov-credentialsuser_id-orgs_ov_credential_put", "name": "PUT /api/orgs/{org_id}/ov-credentials/{user_id} — orgs_ov_credential_put"}, {"level": 3, "id": "16-auth-and-misc-delete-apiorgsorg_idov-credentialsuser_id-orgs_ov_credential_delete", "name": "DELETE /api/orgs/{org_id}/ov-credentials/{user_id} — orgs_ov_credential_delete"}, {"level": 2, "id": "16-auth-and-misc-apiorgsorg_idrepo-analysis", "name": "组织仓库分析（/api/orgs/{org_id}/repo-analysis）"}, {"level": 3, "id": "16-auth-and-misc-get-apiorgsorg_idrepo-analysistargets-org_repo_analysis_targets", "name": "GET /api/orgs/{org_id}/repo-analysis/targets — org_repo_analysis_targets"}, {"level": 3, "id": "16-auth-and-misc-get-apiorgsorg_idrepo-analysiscontextrepo_key-org_repo_analysis_context", "name": "GET /api/orgs/{org_id}/repo-analysis/context/{repo_key} — org_repo_analysis_context"}, {"level": 3, "id": "16-auth-and-misc-post-apiorgsorg_idrepo-analysisrun-org_repo_analysis_run", "name": "POST /api/orgs/{org_id}/repo-analysis/run — org_repo_analysis_run"}, {"level": 3, "id": "16-auth-and-misc-get-apiorgsorg_idrepo-analysisstatus-org_repo_analysis_status", "name": "GET /api/orgs/{org_id}/repo-analysis/status — org_repo_analysis_status"}, {"level": 3, "id": "16-auth-and-misc-post-apiorgsorg_idrepo-analysisautomationensure-org_repo_analysis_automation_ensure", "name": "POST /api/orgs/{org_id}/repo-analysis/automation/ensure — org_repo_analysis_automation_ensure"}, {"level": 3, "id": "16-auth-and-misc-get-apiorgsorg_idrepo-analysisdocs-org_repo_analysis_docs", "name": "GET /api/orgs/{org_id}/repo-analysis/docs — org_repo_analysis_docs"}, {"level": 3, "id": "16-auth-and-misc-post-apiorgsorg_idrepo-maprepo_keyai-result-org_repo_map_ai_result", "name": "POST /api/orgs/{org_id}/repo-map/{repo_key}/ai-result — org_repo_map_ai_result"}], "no": "", "is_overview": false}, {"id": "17-feedback", "title": "Feedback 意见反馈接口（/api/feedback）", "html": "<h1 id=\"17-feedback-feedback-apifeedback\">Feedback 意见反馈接口（/api/feedback）<\u002fh1>\n<blockquote>\n<p>对外公开（feedback-openapi-expose-design.md weekly-08 收录）。<br />\n认证分级：<br />\n- <code>POST /api/feedback<\u002fcode> Submit：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / Web JWT / <code>tk_<\u002fcode> 会话 token 均可）<br />\n- <code>mine<\u002fcode> / <code>context<\u002fcode> / <code>delete<\u002fcode> / <code>upload<\u002fcode>：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\n- <code>list<\u002fcode> / <code>stats<\u002fcode> / <code>status<\u002fcode>：<strong>admin-only<\u002fstrong>（JWT role=admin），<strong>不进公开契约<\u002fstrong>。<\u002fp>\n<p><strong>CLI 命令<\u002fstrong>：由契约 <code>operation_id<\u002fcode> 派生（<code>&lt;tag&gt; &lt;verb&gt;<\u002fcode>，issue-45-cli-design.md §3.1）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>operation_id<\u002fth>\n<th>CLI 命令<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>feedback_submit<\u002fcode><\u002ftd>\n<td><code>grape feedback submit<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feedback_mine<\u002fcode><\u002ftd>\n<td><code>grape feedback mine<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feedback_context<\u002fcode><\u002ftd>\n<td><code>grape feedback context &lt;event_seq&gt;<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feedback_delete<\u002fcode><\u002ftd>\n<td><code>grape feedback delete &lt;fid&gt;<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feedback_upload<\u002fcode><\u002ftd>\n<td><code>grape feedback upload<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"17-feedback-post-apifeedback\">POST /api/feedback — 提交反馈<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（JWT / API Key / <code>tk_<\u002fcode> Agent 会话均可用）<br />\nCLI：<code>grape feedback submit --json '{...}'<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（FeedbackBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>category<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>必填：bug / suggestion / question / other<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>title<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>必填：标题<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>必填：描述<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>page_url<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否：来源页面 URL<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否：仓库（仅 JWT/API Key 且无 event_seq 时生效）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>attachment_url<\u002fcode> / <code>attachment_name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否：附件（配合 <code>/upload<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>event_seq<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>否：失败事件 seq（服务端现查任务上下文落库）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feedback_kind<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否：Agent 元类别（cli_ux / skill_quality / token_waste / other）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>Agent（<code>tk_<\u002fcode>）提交说明：<br />\n- 服务端从 token <strong>权威解析<\u002fstrong>仓库/任务/agent/技能，忽略 body 的 <code>repo_key<\u002fcode>/<code>event_seq<\u002fcode>；<br />\n- 落库 <code>source='agent'<\u002fcode>；每任务（session_key）最多 2 条，超出返回 <strong>429<\u002fstrong>；<br />\n- 反馈随后由后台 reconcile worker 按技能归属自动转 Issue（见「反馈 → Issue 闭环」）。<\u002fp>\n<pre><code class=\"language-bash\"># 用户提交（API Key 三通道自动带 Authorization）\ngrape feedback submit --json '{&quot;category&quot;:&quot;bug&quot;,&quot;title&quot;:&quot;x&quot;,&quot;description&quot;:&quot;y&quot;}'\n# Agent 自动反馈（tk_ 经 GRAPE_SESSION_TOKEN 注入 → token 权威解析仓库/任务/技能）\ngrape feedback submit --json '{&quot;category&quot;:&quot;suggestion&quot;,&quot;title&quot;:&quot;CLI 不友好&quot;,&quot;description&quot;:&quot;...&quot;,&quot;feedback_kind&quot;:&quot;cli_ux&quot;}'\n<\u002fcode><\u002fpre>\n<p>| 出参 | <code>{id, status: \"open\", message}<\u002fcode> |<br />\n| 返回 | 200；401 未认证；429 超限 |<\u002fp>\n<h2 id=\"17-feedback-get-apifeedbackmine\">GET /api/feedback/mine — 我的反馈列表<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape feedback mine [--page 0] [--size 10]<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>page<\u002fcode>（默认 0）<code>size<\u002fcode>（默认 10，≤100） |<br />\n| 出参 | <code>{items:[{id,category,title,description,attachment_url,attachment_name,status,priority,handler_name,handler_remark,created_at,updated_at,source,skill_name,issue_url,issue_number}], total, page, total_pages}<\u002fcode> |<br />\n| 返回 | 200；401 未认证 |<\u002fp>\n<h2 id=\"17-feedback-get-apifeedbackcontextevent_seq\">GET /api/feedback/context/{event_seq} — 反馈上下文<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape feedback context 12345<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{event_seq}<\u002fcode> |<br />\n| 出参 | <code>{event_seq, repo_key, issue_id, issue_number, agent_type, event_status, task, engine, skill, fail_summary}<\u002fcode> |<br />\n| 返回 | 200；404 事件未找到或无权限 |<\u002fp>\n<h2 id=\"17-feedback-delete-apifeedbackfid\">DELETE /api/feedback/{fid} — 删除反馈<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape feedback delete &lt;fid&gt;<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{fid}<\u002fcode> |<br />\n| 出参 | <code>{success, message}<\u002fcode> |<br />\n| 返回 | 200；403 非本人；404 不存在 |<\u002fp>\n<h2 id=\"17-feedback-post-apifeedbackupload\">POST /api/feedback/upload — 上传附件<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\nCLI：<code>grape feedback upload --file &lt;path&gt;<\u002fcode>（multipart）<\u002fp>\n<\u002fblockquote>\n<p>| Body | multipart <code>file<\u002fcode>（jpg/png/webp/gif/svg/zip，≤5MB） |<br />\n| 出参 | <code>{url, file_key, is_zip, original_name}<\u002fcode> |<br />\n| 返回 | 200；400 类型/大小不支持；401 未认证 |<\u002fp>\n<h2 id=\"17-feedback-admin-only\">管理端点（admin-only，不进公开契约）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>端点<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>GET /api/feedback/list?status=&amp;category=&amp;search=&amp;source=user|agent<\u002fcode><\u002ftd>\n<td>管理列表（含 source 筛选、skill/issue 列）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>PUT /api/feedback/{fid}/status<\u002fcode><\u002ftd>\n<td>状态流转（handler_name 取 admin token username）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GET /api/feedback/stats<\u002fcode><\u002ftd>\n<td>统计（byStatus / byCategory / bySource）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"17-feedback-issue-agent\">反馈 → Issue 闭环（Agent 自动反馈）<\u002fh2>\n<ul>\n<li><code>tk_<\u002fcode> Agent 提交落 <code>source='agent'<\u002fcode> 后，后台 reconcile worker 周期扫描未转换行；<\u002fli>\n<li>路由：<code>skill.scope='official'<\u002fcode> → 官方技能仓库（<code>GRAPE_SKILLS_REPO<\u002fcode> 配置，全局 bot 身份）；<br />\n<code>repo<\u002fcode>/<code>user<\u002fcode> → 反馈所属仓库（仓库 bot token 身份）；<\u002fli>\n<li>幂等：同 <code>(task_id, skill_name, title)<\u002fcode> 只建一个 Issue，组内全部回写；<\u002fli>\n<li>成功回写 <code>issue_url<\u002fcode>/<code>issue_number<\u002fcode>/<code>converted_at<\u002fcode>；失败/仓库不可达/配置缺失 → 下轮重试，admin 列表可见。<\u002fli>\n<\u002ful>", "toc": [{"level": 2, "id": "17-feedback-post-apifeedback", "name": "POST /api/feedback — 提交反馈"}, {"level": 2, "id": "17-feedback-get-apifeedbackmine", "name": "GET /api/feedback/mine — 我的反馈列表"}, {"level": 2, "id": "17-feedback-get-apifeedbackcontextevent_seq", "name": "GET /api/feedback/context/{event_seq} — 反馈上下文"}, {"level": 2, "id": "17-feedback-delete-apifeedbackfid", "name": "DELETE /api/feedback/{fid} — 删除反馈"}, {"level": 2, "id": "17-feedback-post-apifeedbackupload", "name": "POST /api/feedback/upload — 上传附件"}, {"level": 2, "id": "17-feedback-admin-only", "name": "管理端点（admin-only，不进公开契约）"}, {"level": 2, "id": "17-feedback-issue-agent", "name": "反馈 → Issue 闭环（Agent 自动反馈）"}], "no": "", "is_overview": false}, {"id": "18-patrol", "title": "巡检 API（A2A 链路巡检器）", "html": "<h1 id=\"18-patrol-apia2a\">巡检 API（A2A 链路巡检器）<\u002fh1>\n<blockquote>\n<p>巡检异常清单的只读查询与人工收敛。数据源为 <code>grape_t_patrol_findings<\u002fcode> 表<br />\n（docs/weekly-09/a2a-chain-patrol-design.md）。巡检参数运行真源=DB meta<br />\n（patrol:interval_seconds / patrol:confirm_minutes / patrol:lookback_mode /<br />\npatrol:compensate_enabled / patrol:compensate_blocklist / patrol:findings_retention_days（终态行 TTL 天数，默认 90，0=永不清理）， 每周期重读改即生效，<br />\n集群共享）；Phase 2 自动补偿默认开（决策变更 2026-11-02）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"18-patrol-get-apipatrolfindings-operation_idgrape_t_patrol_findings_list\">GET /api/patrol/findings — 巡检异常清单（operation_id=grape_t_patrol_findings_list）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\n<strong>归属过滤（S38）<\u002fstrong>：admin 全量可见（unowned 置顶；其余按 created_at 倒序，id 仅兜底）；非 admin 仅见 owner=自己的行，unowned 仅 admin。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>status<\u002fcode>（可选，open/claiming/compensated/dismissed/false_positive/permanent_failure/needs_human）、<code>kind<\u002fcode>（可选）、<code>limit<\u002fcode>（默认 100，1-500） |<br />\n| 出参 | <code>{\"status\":\"ok\",\"total\":n,\"findings\":[{id,kind,task_id,event_seq,repo_key,issue_id,owner,detail,suggestion,status,action_meta,created_at,updated_at}]}<\u002fcode> |<br />\n| 返回 | 200 |<br />\n| CLI | <strong>暂未实现<\u002fstrong>（grape-cli 仓跟进落地 <code>grape patrol findings/dismiss/scan<\u002fcode>；本仓仅 API+文档侧） |<\u002fp>\n<h2 id=\"18-patrol-post-apipatrolfindingsfinding_iddismiss-operation_idgrape_t_patrol_findings_dismiss\">POST /api/patrol/findings/{finding_id}/dismiss — 误报收敛（operation_id=grape_t_patrol_findings_dismiss）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\n人工核对判定误报的收敛入口（Phase 2 放开自动补偿的\"误报=0 硬线\"数据支撑）。<br />\n仅 open 状态可 dismiss；重复扫描靠唯一约束不重插、不重置已 dismissed 的行。<br />\n<strong>归属校验（S30）<\u002fstrong>：仅 finding 归属人（owner）或 admin 可收敛；unowned（owner=0）仅 admin。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{finding_id}<\u002fcode> uuid str（grape_t_patrol_findings.id，UUID 主键） |<br />\n| 入参 | <code>{\"reason\": \"...\"}<\u002fcode>（可选） |<br />\n| 出参 | <code>{\"status\":\"ok\",\"id\":n,\"finding_status\":\"dismissed\"}<\u002fcode> |<br />\n| 返回 | 200；403 非归属人且非 admin；404 finding 不存在或已非 open |<\u002fp>\n<h2 id=\"18-patrol-post-apipatrolscan-operation_idpatrol_scan_run\">POST /api/patrol/scan — 手动触发一轮巡检（operation_id=patrol_scan_run）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<br />\n运营介入面（R12/D22）：不等 5 分钟自动周期，立即跑一轮检测。<strong>只做检测面<\u002fstrong><br />\n——检测 + findings 落库（唯一约束与自动轮幂等汇合）+ 终态行保留清理（R11）；<br />\n<strong>不补偿、不抢主<\u002fstrong>（补偿仍走选主门控的自动循环，D3/D20）。同步扫描经<br />\nasyncio.to_thread 卸载出事件循环（D23）。<\u002fp>\n<\u002fblockquote>\n<p>| 入参 | 无（扫描档用运行真源 lookback_mode） |<br />\n| 出参 | <code>{\"status\":\"ok\",\"scan\":{\"broken\":n,\"zombie\":n,\"stalled\":n,\"inserted\":n,\"purged\":n,\"duration_ms\":n}}<\u002fcode> |<br />\n| 返回 | 200；409 一轮巡检已在执行中（single-flight）；500 扫描执行异常（收口不外溢） |<\u002fp>", "toc": [{"level": 2, "id": "18-patrol-get-apipatrolfindings-operation_idgrape_t_patrol_findings_list", "name": "GET /api/patrol/findings — 巡检异常清单（operation_id=grape_t_patrol_findings_list）"}, {"level": 2, "id": "18-patrol-post-apipatrolfindingsfinding_iddismiss-operation_idgrape_t_patrol_findings_dismiss", "name": "POST /api/patrol/findings/{finding_id}/dismiss — 误报收敛（operation_id=grape_t_patrol_findings_dismiss）"}, {"level": 2, "id": "18-patrol-post-apipatrolscan-operation_idpatrol_scan_run", "name": "POST /api/patrol/scan — 手动触发一轮巡检（operation_id=patrol_scan_run）"}], "no": "", "is_overview": false}], "reference": [{"id": "event-mapping", "title": "事件类型映射参考（GitCode/GitHub → Grape 内部事件）", "html": "<h1 id=\"event-mapping-gitcodegithub-grape\">事件类型映射参考（GitCode/GitHub → Grape 内部事件）<\u002fh1>\n<blockquote>\n<p>本文档说明 GitCode、GitHub Webhook 事件如何映射到 Grape 内部统一事件类型（canonical event types），<br />\n以及 Grape 内部事件（A2A、skipped 等）的含义和触发条件。<br />\n源码定义：<code>src/vcs/event_types.py<\u002fcode>（统一类型）、<code>src/vcs/gitcode.py<\u002fcode>（GitCode 映射）、<code>src/vcs/github.py<\u002fcode>（GitHub 映射）、<br />\n<code>src/api/routing.py<\u002fcode>（路由映射）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"event-mapping-canonical-event-types\">统一事件类型（Canonical Event Types）<\u002fh2>\n<p>所有平台的 Webhook 事件在进入流水线前，先归一化为以下统一类型：<\u002fp>\n<h3 id=\"event-mapping-issue\">Issue 事件<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>统一类型<\u002fth>\n<th>说明<\u002fth>\n<th>触发条件<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issue_opened<\u002fcode><\u002ftd>\n<td>Issue 创建<\u002ftd>\n<td>Issue 首次创建（open/create）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_updated<\u002fcode><\u002ftd>\n<td>Issue 内容更新<\u002ftd>\n<td>title/description 变更（非 assignee/label）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_closed<\u002fcode><\u002ftd>\n<td>Issue 关闭<\u002ftd>\n<td>Issue 状态变为 closed<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_reopened<\u002fcode><\u002ftd>\n<td>Issue 重新打开<\u002ftd>\n<td>Issue 从 closed 重新 open<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_assigned<\u002fcode><\u002ftd>\n<td>Issue 分配负责人<\u002ftd>\n<td>assignees 字段变更<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_labeled<\u002fcode><\u002ftd>\n<td>Issue 添加/移除标签<\u002ftd>\n<td>labels 字段变更<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_comment<\u002fcode><\u002ftd>\n<td>Issue 评论<\u002ftd>\n<td>在 Issue 上发表评论<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"event-mapping-pr\">PR 事件<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>统一类型<\u002fth>\n<th>说明<\u002fth>\n<th>触发条件<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>pull_request_opened<\u002fcode><\u002ftd>\n<td>PR 创建<\u002ftd>\n<td>PR 首次创建（open/reopen）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_updated<\u002fcode><\u002ftd>\n<td>PR 更新<\u002ftd>\n<td>PR 内容编辑或新增 commit（synchronize）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_closed<\u002fcode><\u002ftd>\n<td>PR 关闭（未合并）<\u002ftd>\n<td>PR 被关闭但未合并<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_merged<\u002fcode><\u002ftd>\n<td>PR 合并<\u002ftd>\n<td>PR 合并到目标分支<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_review<\u002fcode><\u002ftd>\n<td>PR 审查<\u002ftd>\n<td>审查提交（approve/request_changes）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>note_hook_pr<\u002fcode><\u002ftd>\n<td>PR 评论<\u002ftd>\n<td>在 PR 上发表评论<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"event-mapping-_1\">其他事件<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>统一类型<\u002fth>\n<th>说明<\u002fth>\n<th>触发条件<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>push<\u002fcode><\u002ftd>\n<td>代码推送<\u002ftd>\n<td>push 到任意分支<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>tag_created<\u002fcode><\u002ftd>\n<td>Tag 创建<\u002ftd>\n<td>新建 Git Tag<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>release_created<\u002fcode><\u002ftd>\n<td>Release 发布<\u002ftd>\n<td>新建 Release<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>build_start<\u002fcode><\u002ftd>\n<td>构建开始<\u002ftd>\n<td>CI/CD 流水线启动<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>build_failure<\u002fcode><\u002ftd>\n<td>构建失败<\u002ftd>\n<td>CI/CD 构建失败<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>deploy_start<\u002fcode><\u002ftd>\n<td>部署开始<\u002ftd>\n<td>部署流程启动<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>deploy_finish<\u002fcode><\u002ftd>\n<td>部署完成<\u002ftd>\n<td>部署流程结束<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"event-mapping-gitcode-webhook\">GitCode Webhook → 统一类型映射<\u002fh2>\n<p>GitCode Webhook 通过 <code>X-GitCode-Event<\u002fcode> 请求头标识事件类型，payload 结构类似 GitLab。<\u002fp>\n<table>\n<thead>\n<tr>\n<th>GitCode 事件头<\u002fth>\n<th>payload action<\u002fth>\n<th>统一类型<\u002fth>\n<th>备注<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>Issue Hook<\u002fcode><\u002ftd>\n<td><code>open<\u002fcode>/<code>create<\u002fcode><\u002ftd>\n<td><code>issue_opened<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Issue Hook<\u002fcode><\u002ftd>\n<td><code>close<\u002fcode><\u002ftd>\n<td><code>issue_closed<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Issue Hook<\u002fcode><\u002ftd>\n<td><code>reopen<\u002fcode><\u002ftd>\n<td><code>issue_reopened<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Issue Hook<\u002fcode><\u002ftd>\n<td><code>update<\u002fcode> + assignees 变更<\u002ftd>\n<td><code>issue_assigned<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Issue Hook<\u002fcode><\u002ftd>\n<td><code>update<\u002fcode> + labels 变更<\u002ftd>\n<td><code>issue_labeled<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Issue Hook<\u002fcode><\u002ftd>\n<td><code>update<\u002fcode>（其他）<\u002ftd>\n<td><code>issue_updated<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Note Hook<\u002fcode><\u002ftd>\n<td>noteable_type=<code>MergeRequest<\u002fcode><\u002ftd>\n<td><code>note_hook_pr<\u002fcode><\u002ftd>\n<td>PR 评论<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Note Hook<\u002fcode><\u002ftd>\n<td>noteable_type≠<code>MergeRequest<\u002fcode><\u002ftd>\n<td><code>issue_comment<\u002fcode><\u002ftd>\n<td>Issue 评论<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Merge Request Hook<\u002fcode><\u002ftd>\n<td><code>open<\u002fcode><\u002ftd>\n<td><code>pull_request_opened<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Merge Request Hook<\u002fcode><\u002ftd>\n<td><code>update<\u002fcode><\u002ftd>\n<td><code>pull_request_updated<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Merge Request Hook<\u002fcode><\u002ftd>\n<td><code>merge<\u002fcode><\u002ftd>\n<td><code>pull_request_merged<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Merge Request Hook<\u002fcode><\u002ftd>\n<td><code>close<\u002fcode><\u002ftd>\n<td><code>pull_request_closed<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Merge Request Hook<\u002fcode><\u002ftd>\n<td><code>reopen<\u002fcode><\u002ftd>\n<td><code>pull_request_opened<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>Merge Request Hook<\u002fcode><\u002ftd>\n<td><code>review<\u002fcode>/<code>approve<\u002fcode><\u002ftd>\n<td><code>pull_request_review<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>push<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>push<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>tag_push<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>tag_created<\u002fcode><\u002ftd>\n<td>路由到 SRE<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>release<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>release_created<\u002fcode><\u002ftd>\n<td>路由到 SRE<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pipeline<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>build_start<\u002fcode><\u002ftd>\n<td>路由到 SRE<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>GitCode 也兼容 <code>issues<\u002fcode>、<code>pull_request<\u002fcode> 等 GitHub 风格事件头（幂等映射）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"event-mapping-github-webhook\">GitHub Webhook → 统一类型映射<\u002fh2>\n<p>GitHub Webhook 通过 <code>X-GitHub-Event<\u002fcode> 请求头标识事件类型，payload 含 <code>action<\u002fcode> 字段。<\u002fp>\n<table>\n<thead>\n<tr>\n<th>GitHub 事件头<\u002fth>\n<th>action<\u002fth>\n<th>统一类型<\u002fth>\n<th>备注<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td><code>opened<\u002fcode><\u002ftd>\n<td><code>issue_opened<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td><code>closed<\u002fcode><\u002ftd>\n<td><code>issue_closed<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td><code>reopened<\u002fcode><\u002ftd>\n<td><code>issue_reopened<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td><code>assigned<\u002fcode>/<code>unassigned<\u002fcode><\u002ftd>\n<td><code>issue_assigned<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td><code>labeled<\u002fcode>/<code>unlabeled<\u002fcode><\u002ftd>\n<td><code>issue_labeled<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td><code>edited<\u002fcode><\u002ftd>\n<td><code>issue_updated<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_comment<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>issue_comment<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request<\u002fcode><\u002ftd>\n<td><code>opened<\u002fcode>/<code>reopened<\u002fcode><\u002ftd>\n<td><code>pull_request_opened<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request<\u002fcode><\u002ftd>\n<td><code>edited<\u002fcode><\u002ftd>\n<td><code>pull_request_updated<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request<\u002fcode><\u002ftd>\n<td><code>synchronize<\u002fcode><\u002ftd>\n<td><code>pull_request_updated<\u002fcode><\u002ftd>\n<td>新增 commit<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request<\u002fcode><\u002ftd>\n<td><code>closed<\u002fcode> + merged=true<\u002ftd>\n<td><code>pull_request_merged<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request<\u002fcode><\u002ftd>\n<td><code>closed<\u002fcode> + merged=false<\u002ftd>\n<td><code>pull_request_closed<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request<\u002fcode><\u002ftd>\n<td><code>labeled<\u002fcode><\u002ftd>\n<td><code>pull_request_opened<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_review<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>pull_request_review<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_review_comment<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>note_hook_pr<\u002fcode><\u002ftd>\n<td>PR 行内评论<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>push<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>push<\u002fcode><\u002ftd>\n<td>不路由（SKIP）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>create<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>tag_created<\u002fcode><\u002ftd>\n<td>路由到 SRE<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>release<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>release_created<\u002fcode><\u002ftd>\n<td>路由到 SRE<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>workflow_run<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>build_start<\u002fcode><\u002ftd>\n<td>GitHub Actions<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>deployment<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>deploy_start<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>deployment_status<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td><code>deploy_finish<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"event-mapping-grape\">Grape 内部事件<\u002fh2>\n<p>除 VCS Webhook 事件外，Grape 流水线内部也会产生以下事件类型：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>内部事件类型<\u002fth>\n<th>说明<\u002fth>\n<th>触发条件<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>a2a_event<\u002fcode><\u002ftd>\n<td>A2A 交办事件<\u002ftd>\n<td>Agent 间通过 <code>/api/a2a<\u002fcode> 端点交办任务（如 VOD→Issue、Coding→QA、QA→SRE）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>vod_signal<\u002fcode><\u002ftd>\n<td>VOD 信号<\u002ftd>\n<td>引导式 Onboarding 触发的 VOD 信号<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>onboarding_exp<\u002fcode><\u002ftd>\n<td>Onboarding 探索<\u002ftd>\n<td>新用户 Onboarding 探索阶段<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>onboarding_issue<\u002fcode><\u002ftd>\n<td>Onboarding Issue<\u002ftd>\n<td>新用户 Onboarding Issue 阶段<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>onboarding_explore<\u002fcode><\u002ftd>\n<td>Onboarding 探索（别名）<\u002ftd>\n<td>同 onboarding_exp<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"event-mapping-a2a\">A2A 事件特点<\u002fh3>\n<ul>\n<li><strong>豁免去重<\u002fstrong>：A2A 事件不参与 Issue 级别的事件去重（同一 Issue 可多次 A2A 交办不同 Agent）<\u002fli>\n<li><strong>信任域<\u002fstrong>：A2A 鉴权支持关联仓库信任域（同场景关联仓库或相同 bot token 的仓库间可互调）<\u002fli>\n<li><strong>场景节点校验<\u002fstrong>：目标 Agent 必须在当前 Issue 场景的 pipeline nodes 内，否则跳过（<code>not_in_scene<\u002fcode>）<\u002fli>\n<li><strong>触发方式<\u002fstrong>：Agent 执行完成后通过 <code>GRAPE_SERVER_URL/api/a2a<\u002fcode> 端点提交<\u002fli>\n<\u002ful>\n<hr />\n<h2 id=\"event-mapping-event_type-agent\">事件路由（event_type → Agent）<\u002fh2>\n<p>Grape 根据统一事件类型路由到对应 Agent 处理：<\u002fp>\n<h3 id=\"event-mapping-agent\">可路由事件 → Agent 映射<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>事件类型<\u002fth>\n<th>目标 Agent<\u002fth>\n<th>路由方式<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issue_opened<\u002fcode><\u002ftd>\n<td>VOD<\u002ftd>\n<td>阶段矩阵（首次创建 → VOD 审视）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_updated<\u002fcode><\u002ftd>\n<td>Issue<\u002ftd>\n<td>阶段矩阵（已有 Issue 状态 → Issue Agent）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_comment<\u002fcode><\u002ftd>\n<td>Issue<\u002ftd>\n<td>阶段矩阵（评论触发 Issue Agent 判断）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_labeled<\u002fcode><\u002ftd>\n<td>Issue<\u002ftd>\n<td>阶段矩阵<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_opened<\u002fcode><\u002ftd>\n<td>QA<\u002ftd>\n<td>PR 订阅匹配 / 场景路由<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_updated<\u002fcode><\u002ftd>\n<td>QA<\u002ftd>\n<td>PR 订阅匹配（需有新 commit）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_merged<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>阶段矩阵（合并 → 部署）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_review<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td>PR 订阅匹配<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>note_hook_pr<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td>PR 订阅匹配<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>tag_created<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>静态映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>release_created<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>静态映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>build_start<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>静态映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>build_failure<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>静态映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>deploy_start<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>静态映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>deploy_finish<\u002fcode><\u002ftd>\n<td>SRE<\u002ftd>\n<td>静态映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>a2a_event<\u002fcode><\u002ftd>\n<td>动态<\u002ftd>\n<td>A2A payload 中 <code>agent<\u002fcode> 字段指定<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"event-mapping-skip_events\">不路由事件（SKIP_EVENTS）<\u002fh3>\n<p>以下事件被流水线直接过滤，不创建事件、不路由 Agent：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>事件类型<\u002fth>\n<th>原因<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issue_closed<\u002fcode><\u002ftd>\n<td>Issue 关闭不需要 Agent 处理<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_reopened<\u002fcode><\u002ftd>\n<td>Issue 重开不需要 Agent 处理<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_assigned<\u002fcode><\u002ftd>\n<td>分配负责人不需要 Agent 处理<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pull_request_closed<\u002fcode><\u002ftd>\n<td>PR 关闭（未合并）不需要 Agent 处理<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>push<\u002fcode><\u002ftd>\n<td>代码推送不触发流水线（防止频繁触发）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"event-mapping-side_effect_events\">副作用事件（SIDE_EFFECT_EVENTS）<\u002fh3>\n<table>\n<thead>\n<tr>\n<th>事件类型<\u002fth>\n<th>副作用<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issue_closed<\u002fcode><\u002ftd>\n<td>→ 关闭关联的 agent_tasks<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"event-mapping-skipped-reasons\">事件跳过原因（skipped reasons）<\u002fh2>\n<p>事件被跳过时会在 <code>event_skipped<\u002fcode> 表记录原因：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>跳过原因<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>unrecognized_event<\u002fcode><\u002ftd>\n<td>无法识别的事件类型（非已知统一类型）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>no_route<\u002fcode><\u002ftd>\n<td>非Issue/PR事件且无静态路由映射<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_done<\u002fcode><\u002ftd>\n<td>Issue 已标记完成，后续事件不再处理<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>self_loop<\u002fcode><\u002ftd>\n<td>自循环检测（bot 创建的事件不再触发 bot 自身）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>label_only_change<\u002fcode><\u002ftd>\n<td>Issue 仅标签变更，无实质内容变化<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>no_agent_session<\u002fcode><\u002ftd>\n<td>仓库未配置 Agent（无 devops_agent_session 绑定）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>not_in_scene<\u002fcode><\u002ftd>\n<td>目标 Agent 不在当前场景的 pipeline nodes 内<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>no_commit_on_pr_update<\u002fcode><\u002ftd>\n<td>PR 更新但无新 commit（不触发 QA 审查）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent_disabled<\u002fcode><\u002ftd>\n<td>目标 Agent 被禁用<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>no_skill_config<\u002fcode><\u002ftd>\n<td>仓库未配置 Skill<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skill_config_error<\u002fcode><\u002ftd>\n<td>Skill 配置错误<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>prompt_build_failed<\u002fcode><\u002ftd>\n<td>Prompt 构建失败<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>subscription_no_skill<\u002fcode><\u002ftd>\n<td>PR 订阅匹配但无对应 Skill<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>subscription_agent_disabled<\u002fcode><\u002ftd>\n<td>PR 订阅匹配但 Agent 被禁用<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>system_auto_comment<\u002fcode><\u002ftd>\n<td>系统自动评论（不触发流水线）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>user_cancel<\u002fcode><\u002ftd>\n<td>用户取消任务<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>user_confirm_done<\u002fcode><\u002ftd>\n<td>用户确认 Issue 完成<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>user_resume<\u002fcode><\u002ftd>\n<td>用户恢复任务<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>action_disallowed<\u002fcode><\u002ftd>\n<td>事件动作被 event_rule 规则禁止<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"event-mapping-webhook\">Webhook 端点<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>平台<\u002fth>\n<th>端点<\u002fth>\n<th>事件头<\u002fth>\n<th>Token 验证<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>GitCode<\u002ftd>\n<td><code>POST /webhook/gitcode<\u002fcode><\u002ftd>\n<td><code>X-GitCode-Event<\u002fcode><\u002ftd>\n<td><code>X-GitCode-Token<\u002fcode>（与 managed_repos.webhook_token 比对）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>GitHub<\u002ftd>\n<td><code>POST /webhook/github<\u002fcode><\u002ftd>\n<td><code>X-GitHub-Event<\u002fcode><\u002ftd>\n<td><code>X-Hub-Signature-256<\u002fcode>（HMAC SHA256 签名验证）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>GitCode Webhook 端点也兼容误入的 GitHub 事件（自动检测 <code>X-GitHub-Event<\u002fcode> 头并转发处理）。<br />\n未托管仓库（不在 managed_repos 表中）的 Webhook 会被拒绝（404）。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "event-mapping-canonical-event-types", "name": "统一事件类型（Canonical Event Types）"}, {"level": 3, "id": "event-mapping-issue", "name": "Issue 事件"}, {"level": 3, "id": "event-mapping-pr", "name": "PR 事件"}, {"level": 3, "id": "event-mapping-_1", "name": "其他事件"}, {"level": 2, "id": "event-mapping-gitcode-webhook", "name": "GitCode Webhook → 统一类型映射"}, {"level": 2, "id": "event-mapping-github-webhook", "name": "GitHub Webhook → 统一类型映射"}, {"level": 2, "id": "event-mapping-grape", "name": "Grape 内部事件"}, {"level": 3, "id": "event-mapping-a2a", "name": "A2A 事件特点"}, {"level": 2, "id": "event-mapping-event_type-agent", "name": "事件路由（event_type → Agent）"}, {"level": 3, "id": "event-mapping-agent", "name": "可路由事件 → Agent 映射"}, {"level": 3, "id": "event-mapping-skip_events", "name": "不路由事件（SKIP_EVENTS）"}, {"level": 3, "id": "event-mapping-side_effect_events", "name": "副作用事件（SIDE_EFFECT_EVENTS）"}, {"level": 2, "id": "event-mapping-skipped-reasons", "name": "事件跳过原因（skipped reasons）"}, {"level": 2, "id": "event-mapping-webhook", "name": "Webhook 端点"}], "no": "", "is_overview": false}], "developer": [{"id": "00-overview", "title": "1. 平台配置总览", "html": "<h1 id=\"00-overview-1\">1. 平台配置总览<\u002fh1>\n<blockquote>\n<p>面向自建 / 私有化部署 Grape 的运维与平台管理员：装好之后<strong>配什么、在哪配、怎么验证<\u002fstrong>。<br />\n普通用户用法见 <a href=\"#/usage/overview\">使用文档<\u002fa>，接口契约见 <a href=\"#/api/README\">API 文档<\u002fa>。<\u002fp>\n<\u002fblockquote>\n<p>Grape 的配置分布在四个层面。改对地方、用对优先级，是自建部署排障的第一步。<\u002fp>\n<h2 id=\"00-overview-_1\">四层配置面全景<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>配置面<\u002fth>\n<th>位置<\u002fth>\n<th>管什么<\u002fth>\n<th>谁可改<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><strong>Admin 控制台（DB meta）<\u002fstrong><\u002ftd>\n<td>Admin Console → 全局配置（<code>PUT /api/admin/config<\u002fcode>，写 DB meta 表）<\u002ftd>\n<td>全局 Bot Token、OAuth 凭据、webhook 地址/密钥（Issue #345 后 DB 为运行时权威）<\u002ftd>\n<td>管理员（Admin Console）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>configs/ 文件<\u002fstrong><\u002ftd>\n<td><code>configs/*.json<\u002fcode>（由 <code>*.example.json<\u002fcode> 复制而来）<\u002ftd>\n<td>数据库后端、邮件、场景同步、引擎调度、登录白名单、安全项<\u002ftd>\n<td>服务器文件（运维）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>环境变量<\u002fstrong><\u002ftd>\n<td><code>grape.env<\u002fcode>（systemd <code>EnvironmentFile=/etc/grape/grape.env<\u002fcode>）或部署平台注入<\u002ftd>\n<td>OBS 对象存储、JWT/Cookie 安全、连接池、SMTP 兜底等<\u002ftd>\n<td>服务器文件 / 部署环境<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>DB meta 表<\u002fstrong><\u002ftd>\n<td><code>meta<\u002fcode> 表（key-value）<\u002ftd>\n<td>运行期由服务写入/读取的权威值（OAuth 凭据首次启动自动迁入）<\u002ftd>\n<td>服务自身 + Admin 控制台<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"00-overview-_2\">优先级关系（谁覆盖谁）<\u002fh2>\n<ol>\n<li><strong>数据库后端开关<\u002fstrong>：环境变量 <code>DEVOPS_DB_BACKEND<\u002fcode> &gt; <code>configs/db-backend.json<\u002fcode> 的 <code>backend<\u002fcode> 字段 &gt; 默认 <code>sqlite<\u002fcode>（见 <a href=\"#/developer/05-database-and-sync\">数据库与同步<\u002fa>）。<\u002fli>\n<li><strong>场景同步<\u002fstrong>：环境变量 <code>GRAPESKILLS_REPO_URL<\u002fcode> / <code>GRAPESKILLS_REPO_BRANCH<\u002fcode> / <code>SCENE_SYNC_INTERVAL<\u002fcode> / <code>GRAPE_DEV_TOKEN<\u002fcode> &gt; <code>configs/scene-sync.json<\u002fcode>（见 <a href=\"#/developer/05-database-and-sync\">数据库与同步<\u002fa>）。<\u002fli>\n<li><strong>全局 Bot / OAuth / webhook<\u002fstrong>：首次启动把 <code>configs/global-bot-token.json<\u002fcode>、<code>configs/oauth-providers.json<\u002fcode> 迁入 DB meta；之后 <strong>DB 为运行时权威<\u002fstrong>，改文件不再生效，须走 Admin 控制台（见 <a href=\"#/developer/01-gitcode-integration\">GitCode 集成<\u002fa>、<a href=\"#/developer/02-github-integration\">GitHub 集成<\u002fa>）。<\u002fli>\n<li><strong>邮件<\u002fstrong>：<code>configs/email.json<\u002fcode> 为主，<code>SMTP_*<\u002fcode> 系列环境变量为服务端兜底（见 <a href=\"#/developer/04-storage-and-email\">存储与邮件<\u002fa>）。<\u002fli>\n<\u002fol>\n<h2 id=\"00-overview-vs\">改完怎么生效（重启 vs 热生效）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>配置项<\u002fth>\n<th>生效方式<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>configs/email.json<\u002fcode>（邮件）<\u002ftd>\n<td><strong>无需重启<\u002fstrong>（每次发送时读取）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Admin 控制台改 DB meta（Bot Token / webhook 等）<\u002ftd>\n<td>保存即生效（运行时读 DB）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>configs/db-backend.json<\u002fcode>、<code>scene-sync.json<\u002fcode>、<code>engine-selection.json<\u002fcode>、<code>login-whitelist.json<\u002fcode>、<code>security.json<\u002fcode><\u002ftd>\n<td><strong>重启服务生效<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td>环境变量（<code>OBS_*<\u002fcode>、<code>JWT_SECRET<\u002fcode>、<code>COOKIE_SECURE<\u002fcode>、<code>DB_POOL_*<\u002fcode> 等）<\u002ftd>\n<td><strong>重启服务生效<\u002fstrong><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"00-overview-configs\">配置示例：典型的 configs/ 清单<\u002fh2>\n<pre><code>configs/\n├── db-backend.json          # 复制自 db-backend.example.json\n├── email.json               # 复制自 email.example.json\n├── scene-sync.json          # 复制自 scene-sync.example.json\n├── engine-selection.json    # 复制自 engine-selection.example.json\n├── login-whitelist.json     # 复制自 login-whitelist.example.json\n├── security.json            # 复制自 security.example.json\n├── oauth-providers.json     # 复制自 oauth-providers.example.json（首次启动迁入 DB）\n└── global-bot-token.json    # 复制自 global-bot-token.example.json（首次启动迁入 DB）\n<\u002fcode><\u002fpre>\n<h2 id=\"00-overview-_3\">如何验证生效<\u002fh2>\n<ul>\n<li><strong>重启后服务健康<\u002fstrong>：<code>GET /api/health<\u002fcode>（或控制台「系统监控」页）返回正常。<\u002fli>\n<li><strong>配置被读取<\u002fstrong>：服务启动日志会打印关键配置加载信息（如 MySQL 连接池 <code>DB pool<\u002fcode> 相关日志、场景同步 interval）。<\u002fli>\n<li><strong>Admin 控制台配置<\u002fstrong>：保存后在 Admin Console 重新打开全局配置页，字段回显新值即已写入 DB meta。<\u002fli>\n<\u002ful>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>注意<\u002fstrong><\u002fp>\n<p>本篇以下各篇（01~06）按集成领域逐项给出「在哪配 → 配置示例 → 如何验证」三件套。敏感值一律用占位符表示（如 <code>&lt;your-ak&gt;<\u002fcode>、<code>&lt;your-client-secret&gt;<\u002fcode>），请替换为你自己的真实值，切勿提交到仓库。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "00-overview-_1", "name": "四层配置面全景"}, {"level": 2, "id": "00-overview-_2", "name": "优先级关系（谁覆盖谁）"}, {"level": 2, "id": "00-overview-vs", "name": "改完怎么生效（重启 vs 热生效）"}, {"level": 2, "id": "00-overview-configs", "name": "配置示例：典型的 configs/ 清单"}, {"level": 2, "id": "00-overview-_3", "name": "如何验证生效"}], "no": "", "is_overview": false}, {"id": "01-gitcode-integration", "title": "2. GitCode 集成", "html": "<h1 id=\"01-gitcode-integration-2-gitcode\">2. GitCode 集成<\u002fh1>\n<p>GitCode 集成 = <strong>登录（OAuth）<\u002fstrong> + <strong>Bot 写操作（建仓/发评论）<\u002fstrong> + <strong>事件接入（webhook）<\u002fstrong> 三件事，配齐后 Grape 才能监听 GitCode 仓库并回写操作。<\u002fp>\n<h2 id=\"01-gitcode-integration-21-oauth\">2.1 OAuth 应用（用户登录）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/oauth-providers.json<\u002fcode>（复制 <code>configs/oauth-providers.example.json<\u002fcode>）。<code>gitcode.client_id<\u002fcode> / <code>client_secret<\u002fcode> / <code>redirect_uri<\u002fcode> 在首次启动时自动迁入 DB meta，之后以 DB 为权威（Admin 控制台可改）。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;gitcode&quot;: {\n    &quot;client_id&quot;: &quot;&lt;your-gitcode-client-id&gt;&quot;,\n    &quot;client_secret&quot;: &quot;&lt;your-gitcode-client-secret&gt;&quot;,\n    &quot;redirect_uri&quot;: &quot;https://&lt;your-grape-domain&gt;/api/auth/callback/gitcode&quot;,\n    &quot;scope&quot;: &quot;all&quot;\n  }\n}\n<\u002fcode><\u002fpre>\n<blockquote class=\"card tip\">\n<p>💡 <strong>提示<\u002fstrong><\u002fp>\n<p><code>redirect_uri<\u002fcode> 固定格式为 <code>https://&lt;你的 Grape 域名&gt;/api/auth/callback/gitcode<\u002fcode>，必须与 GitCode OAuth 应用中登记的回调地址<strong>完全一致<\u002fstrong>（含协议与路径）。<\u002fp>\n<\u002fblockquote>\n<p><strong>如何验证<\u002fstrong>：访问 Grape 首页 → 点击「使用 GitCode 登录」→ 跳转 GitCode 授权页并能回跳登录成功，即 OAuth 三字段正确。<\u002fp>\n<h2 id=\"01-gitcode-integration-22-bot-token\">2.2 Bot Token（平台写操作）<\u002fh2>\n<p>Grape 以 Bot 身份在 GitCode 上执行写操作（创建/关闭/评论 Issue、建仓等）。<\u002fp>\n<p><strong>在哪配<\u002fstrong>：<code>configs/global-bot-token.json<\u002fcode> 的 <code>gitcode_api_token<\u002fcode>（首次启动迁入 DB meta）；之后在 <strong>Admin 控制台 → 全局配置<\u002fstrong>（<code>PUT /api/admin/config<\u002fcode>）修改，DB 为运行时权威。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;gitcode_api_token&quot;: &quot;&lt;your-gitcode-bot-pat&gt;&quot;,\n  &quot;bot_usernames&quot;: [&quot;&lt;your-bot-username&gt;&quot;]\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li><code>gitcode_api_token<\u002fcode>：GitCode Bot 的个人访问令牌（PAT），需要仓库/Issue 写权限。<\u002fli>\n<li><code>bot_usernames<\u002fcode>：Bot 用户名列表（用于识别「自己发的评论」，避免自回复循环）；留空可由 <code>/api/v5/user<\u002fcode> 自动获取。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：Admin 控制台全局配置页保存后，让任意 Agent 在托管仓库创建一条 Issue 评论——评论出现在 GitCode 且作者是 Bot 账号，即 Token 有效。<\u002fp>\n<h2 id=\"01-gitcode-integration-23-webhook\">2.3 Webhook（事件接入）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/global-bot-token.json<\u002fcode> / Admin 控制台的 <code>webhook_url<\u002fcode> + <code>gitcode_webhook_token<\u002fcode>（同样以 DB meta 为运行时权威）。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;webhook_url&quot;: &quot;https://&lt;your-grape-domain&gt;/webhook/gitcode&quot;,\n  &quot;gitcode_webhook_token&quot;: &quot;&lt;your-webhook-secret&gt;&quot;\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li><code>webhook_url<\u002fcode>：Grape 服务端接收 GitCode 事件的路径，固定为 <code>https://&lt;你的域名&gt;/webhook/gitcode<\u002fcode>（<code>POST /webhook/gitcode<\u002fcode>）。<\u002fli>\n<li><code>gitcode_webhook_token<\u002fcode>：webhook 签名密钥（也接受字段名 <code>webhook_secret<\u002fcode>），用于校验请求确实来自 GitCode。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>（托管仓库 → 测试 webhook → 看事件进来）：<\u002fp>\n<ol>\n<li>在 GitCode 仓库 <strong>设置 → Webhooks<\u002fstrong> 新增 webhook，URL 填上面的 <code>webhook_url<\u002fcode>，Secret 填 <code>gitcode_webhook_token<\u002fcode>。<\u002fli>\n<li>在 GitCode webhook 详情页点「测试」→ GitCode 显示 200 OK。<\u002fli>\n<li>在该仓库创建/评论一条 Issue → Grape 控制台「事件」页出现对应事件、流水线启动，即链路全通。<\u002fli>\n<\u002fol>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>注意<\u002fstrong><\u002fp>\n<p>若测试 webhook 返回 403/校验失败，优先核对 GitCode 端 Secret 与 Admin 控制台中的 <code>gitcode_webhook_token<\u002fcode> 是否一致（两端必须完全相同）。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "01-gitcode-integration-21-oauth", "name": "2.1 OAuth 应用（用户登录）"}, {"level": 2, "id": "01-gitcode-integration-22-bot-token", "name": "2.2 Bot Token（平台写操作）"}, {"level": 2, "id": "01-gitcode-integration-23-webhook", "name": "2.3 Webhook（事件接入）"}], "no": "", "is_overview": false}, {"id": "02-github-integration", "title": "3. GitHub 集成", "html": "<h1 id=\"02-github-integration-3-github\">3. GitHub 集成<\u002fh1>\n<p>与 <a href=\"#/developer/01-gitcode-integration\">GitCode 集成<\u002fa> 完全对称，只是凭据换成 GitHub OAuth App + Bot PAT，webhook 走独立路径。<\u002fp>\n<h2 id=\"02-github-integration-31-oauth-app\">3.1 OAuth App（用户登录）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/oauth-providers.json<\u002fcode> 的 <code>github<\u002fcode> 段（复制 <code>configs/oauth-providers.example.json<\u002fcode>）。首次启动迁入 DB meta，之后以 DB 为权威。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;github&quot;: {\n    &quot;client_id&quot;: &quot;&lt;your-github-client-id&gt;&quot;,\n    &quot;client_secret&quot;: &quot;&lt;your-github-client-secret&gt;&quot;,\n    &quot;redirect_uri&quot;: &quot;https://&lt;your-grape-domain&gt;/api/auth/callback/github&quot;,\n    &quot;scope&quot;: &quot;read:user user:email&quot;\n  }\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li>在 GitHub <strong>Settings → Developer settings → OAuth Apps<\u002fstrong> 创建应用，<code>Authorization callback URL<\u002fcode> 填 <code>https://&lt;你的域名&gt;/api/auth/callback/github<\u002fcode>（与 <code>redirect_uri<\u002fcode> 完全一致）。<\u002fli>\n<li>登录 <code>scope<\u002fcode> 只申请身份范围（<code>read:user user:email<\u002fcode>），不用于仓库写操作（D108-B）。仓库读写请使用 PAT，创建时勾选 <code>repo<\u002fcode> 与 <code>workflow<\u002fcode>（Issue #3386：缺 <code>workflow<\u002fcode> 会导致 <code>.github/workflows<\u002fcode> 推送被 GitHub 拒绝）。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：Grape 登录页出现 GitHub 入口 → 点击 → GitHub 授权后回跳并登录成功。<\u002fp>\n<h2 id=\"02-github-integration-32-bot-token\">3.2 Bot Token 与用户名（写操作）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/global-bot-token.json<\u002fcode>（首次启动迁入 DB meta）；之后 <strong>Admin 控制台 → 全局配置<\u002fstrong>（<code>PUT /api/admin/config<\u002fcode>）。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;github_bot_token&quot;: &quot;&lt;your-github-bot-pat&gt;&quot;,\n  &quot;github_bot_username&quot;: &quot;&lt;your-bot-username&gt;&quot;\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li><code>github_bot_token<\u002fcode>：GitHub Bot 账号的 PAT（classic，勾选 <code>repo<\u002fcode> 与 <code>workflow<\u002fcode> 权限），用于创建/关闭/评论 Issue 等写操作；需要更新 <code>.github/workflows<\u002fcode> 时必须含 <code>workflow<\u002fcode> scope。<\u002fli>\n<li><code>github_bot_username<\u002fcode>：Bot 账号用户名（协作者管理等场景使用）。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：托管一个 GitHub 仓库并触发一次 Issue 处理——Agent 的评论出现在 GitHub 且作者为 Bot 账号，即 Token 有效。<\u002fp>\n<h2 id=\"02-github-integration-33-webhook\">3.3 Webhook（事件接入）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：GitHub 仓库 <strong>Settings → Webhooks → Add webhook<\u002fstrong>；Grape 侧接收路径固定为 <code>POST /webhook/github<\u002fcode>。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<ul>\n<li><strong>Payload URL<\u002fstrong>：<code>https://&lt;your-grape-domain&gt;/webhook/github<\u002fcode><\u002fli>\n<li><strong>Content type<\u002fstrong>：<code>application/json<\u002fcode><\u002fli>\n<li><strong>Secret<\u002fstrong>：与 Grape 侧 webhook 校验密钥一致（GitCode/GitHub 事件共用服务端校验逻辑，GitHub 误发到 <code>/webhook/gitcode<\u002fcode> 也会被直接处理）<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：GitHub webhook 详情页显示绿色 ✓（Recent deliveries 有 200 记录）→ 在该仓库创建一条 Issue → Grape「事件」页出现对应事件，即接入成功。<\u002fp>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>注意<\u002fstrong><\u002fp>\n<p>GitHub PAT 与 webhook Secret 均为敏感值：文档与配置示例中一律使用 <code>&lt;placeholder&gt;<\u002fcode> 占位，真实值只存放在服务器配置 / Admin 控制台。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "02-github-integration-31-oauth-app", "name": "3.1 OAuth App（用户登录）"}, {"level": 2, "id": "02-github-integration-32-bot-token", "name": "3.2 Bot Token 与用户名（写操作）"}, {"level": 2, "id": "02-github-integration-33-webhook", "name": "3.3 Webhook（事件接入）"}], "no": "", "is_overview": false}, {"id": "03-im-bot", "title": "4. IM 机器人接入", "html": "<h1 id=\"03-im-bot-4-im\">4. IM 机器人接入<\u002fh1>\n<p>Grape 通过 IM（飞书）机器人向用户推送通知、接收指令。自建部署需要完成「扫码建应用 → 绑定 → 验证」三步。<\u002fp>\n<h2 id=\"03-im-bot-41-app_id-app_secret\">4.1 飞书扫码配置（app_id / app_secret）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：无需手工在飞书开放平台建应用——使用控制台的<strong>飞书扫码接入<\u002fstrong>流程（基于 lark-oapi <code>aregister_app<\u002fcode>）：用户扫码创建飞书应用，自动获取 <code>app_id<\u002fcode> / <code>app_secret<\u002fcode> 并绑定到当前用户。<\u002fp>\n<p><strong>配置示例<\u002fstrong>（扫码完成后系统自动写入，无需手工填写）：<\u002fp>\n<pre><code>应用凭证（自动获取，勿手工修改）：\n  app_id:     cli_xxxxxxxx（系统生成）\n  app_secret: &lt;system-generated-secret&gt;\n<\u002fcode><\u002fpre>\n<ul>\n<li>一个 <code>app_id<\u002fcode> <strong>全局唯一<\u002fstrong>：已被 VOD Agent 使用的凭证不能同时绑定 Chat Agent（强约束校验）。<\u002fli>\n<li>首次绑定后，机器人以该应用身份建立长连接接收消息。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：扫码接入页显示任务状态 <code>status=success<\u002fcode> 且回显 <code>app_id<\u002fcode>；随后在飞书中给机器人发一条消息，Grape 控制台对应会话出现消息记录。<\u002fp>\n<h2 id=\"03-im-bot-42-lease\">4.2 lease 多实例机制（一句话版）<\u002fh2>\n<p>多实例部署时，<strong>每个飞书机器人只会与「owner 实例」建立连接<\u002fstrong>：集群通过一致性哈希环 + 租约（lease）决定哪个实例持有某 <code>app_id<\u002fcode>；非 owner 实例不连接，lease 过期后自动切换（优雅让渡）。因此看到「只有一台实例连着某个 bot」是<strong>预期行为<\u002fstrong>，不是故障。<\u002fp>\n<h2 id=\"03-im-bot-43-365\">4.3 如何验证机器人在线（#365 检查清单收敛）<\u002fh2>\n<p><strong>验证 1：日志关键字（必须命中）<\u002fstrong><\u002fp>\n<p>在持有 lease 的实例上查服务日志，必须出现：<\u002fp>\n<pre><code>[lease] bot &lt;bot-name&gt; connected after acquiring lease\n<\u002fcode><\u002fpre>\n<ul>\n<li>出现该行 = 该实例拿到 lease 并成功建立 IM 长连接。<\u002fli>\n<li><strong>没有该行却「配置都正确」<\u002fstrong> → 依次排查：本实例是否是 owner（哈希环）、DB 中该 <code>app_id<\u002fcode> 的 <code>lease_owner<\u002fcode> / <code>lease_expires_at<\u002fcode> 是否过期未清理、应用凭证是否被改动。<\u002fli>\n<\u002ful>\n<p><strong>验证 2：test-notify（端到端通道验证）<\u002fstrong><\u002fp>\n<p>调用测试告警接口，向<strong>你自己的 IM 身份<\u002fstrong>发送一条测试消息（经你自己的 chat bot 投递）：<\u002fp>\n<pre><code>POST /api/obs/alerts/test-notify\n<\u002fcode><\u002fpre>\n<ul>\n<li>返回 <code>ok: true<\u002fcode> 且飞书收到消息 → 通知通道端到端可用。<\u002fli>\n<li>返回 <code>reason=no_open_id<\u002fcode>（无 IM 身份）/ <code>reason=no_bot<\u002fcode>（无可用 bot）/ <code>reason=send_failed<\u002fcode>（发送失败）→ 按对应缺失项补配置。<\u002fli>\n<\u002ful>\n<blockquote class=\"card tip\">\n<p>💡 <strong>提示<\u002fstrong><\u002fp>\n<p>排障顺序建议：先看 <code>connected after acquiring lease<\u002fcode> 日志确认连接在位，再用 <code>test-notify<\u002fcode> 验证投递通道，最后才去怀疑应用凭证本身。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "03-im-bot-41-app_id-app_secret", "name": "4.1 飞书扫码配置（app_id / app_secret）"}, {"level": 2, "id": "03-im-bot-42-lease", "name": "4.2 lease 多实例机制（一句话版）"}, {"level": 2, "id": "03-im-bot-43-365", "name": "4.3 如何验证机器人在线（#365 检查清单收敛）"}], "no": "", "is_overview": false}, {"id": "04-storage-and-email", "title": "5. 对象存储与邮件", "html": "<h1 id=\"04-storage-and-email-5\">5. 对象存储与邮件<\u002fh1>\n<h2 id=\"04-storage-and-email-51-obs\">5.1 对象存储（OBS）<\u002fh2>\n<p>技能包、图标等上传文件默认存本地；启用 OBS（华为云对象存储）后改存云端，<strong>不配置则自动降级为本地存储<\u002fstrong>，功能不中断。<\u002fp>\n<p><strong>在哪配<\u002fstrong>：环境变量（<code>grape.env<\u002fcode> / systemd <code>EnvironmentFile<\u002fcode> / 部署平台注入），重启服务生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>（<code>grape.env<\u002fcode>）：<\u002fp>\n<pre><code class=\"language-bash\">OBS_ENABLED=true\nOBS_ENDPOINT=https://obs.cn-north-4.myhuaweicloud.com\nOBS_BUCKET=&lt;your-bucket-name&gt;\nOBS_ACCESS_KEY=&lt;your-ak&gt;\nOBS_SECRET_KEY=&lt;your-sk&gt;\nOBS_PREFIX=grape/prod\n# 可选：\nOBS_URL_EXPIRES=300\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>变量<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>OBS_ENABLED<\u002fcode><\u002ftd>\n<td>总开关（<code>true<\u002fcode>/<code>1<\u002fcode>/<code>yes<\u002fcode>），默认 <code>false<\u002fcode>（本地存储）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>OBS_ENDPOINT<\u002fcode><\u002ftd>\n<td>OBS 服务端点（默认华北-北京四）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>OBS_BUCKET<\u002fcode><\u002ftd>\n<td>桶名<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>OBS_ACCESS_KEY<\u002fcode> / <code>OBS_SECRET_KEY<\u002fcode><\u002ftd>\n<td>访问密钥（AK/SK）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>OBS_PREFIX<\u002fcode><\u002ftd>\n<td>桶内对象前缀（默认 <code>grape/prod<\u002fcode>），多环境共用一桶时用于隔离<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>OBS_URL_EXPIRES<\u002fcode><\u002ftd>\n<td>预签名下载链接有效期（秒，默认 300）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>如何验证<\u002fstrong>：重启后在控制台上传一个文件（如技能包/图标）→ 下载 URL 域名指向 OBS 桶（预签名地址）→ 文件可正常下载，即已切换成功。日志无 OBS 报错、且本地存储目录不再新增该文件。<\u002fp>\n<h2 id=\"04-storage-and-email-52-smtp-resend\">5.2 邮件（SMTP / Resend）<\u002fh2>\n<p>用于注册/找回密码的验证码与通知邮件。<\u002fp>\n<p><strong>在哪配<\u002fstrong>：<code>configs/email.json<\u002fcode>（复制 <code>email.example.json<\u002fcode>）。<strong>改后无需重启<\u002fstrong>（每次发送时读取）。<\u002fp>\n<p><strong>配置示例<\u002fstrong>（QQ 邮箱 SMTP）：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;env&quot;: &quot;production&quot;,\n  &quot;mode&quot;: &quot;smtp&quot;,\n  &quot;from_email&quot;: &quot;noreply@yourdomain.com&quot;,\n  &quot;smtp&quot;: {\n    &quot;host&quot;: &quot;smtp.qq.com&quot;,\n    &quot;port&quot;: 465,\n    &quot;username&quot;: &quot;your@qq.com&quot;,\n    &quot;password&quot;: &quot;&lt;your-smtp-authorization-code&gt;&quot;,\n    &quot;use_tls&quot;: true\n  }\n}\n<\u002fcode><\u002fpre>\n<p>关键字段：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>env<\u002fcode><\u002ftd>\n<td><code>production<\u002fcode> = 强制真实邮件服务；<code>development<\u002fcode>（或留空）= 开发模式，允许固定验证码、日志降级<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>mode<\u002fcode><\u002ftd>\n<td><code>smtp<\u002fcode> = SMTP 中继；<code>resend<\u002fcode> = Resend API；留空且非生产环境时降级为<strong>日志输出<\u002fstrong>（不发真实邮件）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>smtp.password<\u002fcode><\u002ftd>\n<td>SMTP <strong>授权码<\u002fstrong>（不是邮箱登录密码）。QQ 邮箱：设置 → 账户 → POP3/SMTP 服务 → 开启 → 获取授权码<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>dev_verification_code<\u002fcode><\u002ftd>\n<td>开发环境固定验证码（生产模式自动忽略）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>常见邮箱端口：QQ <code>smtp.qq.com:465<\u002fcode> · 163 <code>smtp.163.com:465<\u002fcode> · Gmail <code>smtp.gmail.com:587<\u002fcode> · 腾讯企业邮 <code>smtp.exmail.qq.com:465<\u002fcode>。<\u002fp>\n<p><strong>如何验证<\u002fstrong>：在登录/找回密码页触发一次「发送验证码」→ 数秒内收到邮件 → 用邮件中的验证码完成校验，即链路全通。若配置为 <code>mode=resend<\u002fcode>，填 <code>resend.api_key<\u002fcode>（resend.com 创建，免费额度 100 封/天，发件域名需在 Resend 后台验证）。<\u002fp>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>注意<\u002fstrong><\u002fp>\n<p><code>env=production<\u002fcode> 时固定验证码会被强制忽略——生产环境必须配好真实邮件通道，否则验证码无法送达。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "04-storage-and-email-51-obs", "name": "5.1 对象存储（OBS）"}, {"level": 2, "id": "04-storage-and-email-52-smtp-resend", "name": "5.2 邮件（SMTP / Resend）"}], "no": "", "is_overview": false}, {"id": "05-database-and-sync", "title": "6. 数据库后端与官方同步", "html": "<h1 id=\"05-database-and-sync-6\">6. 数据库后端与官方同步<\u002fh1>\n<h2 id=\"05-database-and-sync-61-sqlite-mysql\">6.1 数据库后端（SQLite → MySQL 切换）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/db-backend.json<\u002fcode>（复制 <code>db-backend.example.json<\u002fcode>）。开关优先级：环境变量 <code>DEVOPS_DB_BACKEND<\u002fcode> &gt; 该文件 <code>backend<\u002fcode> 字段 &gt; 默认 <code>sqlite<\u002fcode>。重启服务生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;backend&quot;: &quot;mysql&quot;,\n  &quot;mysql&quot;: {\n    &quot;host&quot;: &quot;127.0.0.1&quot;,\n    &quot;port&quot;: 3306,\n    &quot;user&quot;: &quot;&lt;your_mysql_user&gt;&quot;,\n    &quot;password&quot;: &quot;&lt;your_mysql_password&gt;&quot;,\n    &quot;database&quot;: &quot;&lt;your_mysql_database&gt;&quot;\n  }\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li><code>\"backend\": \"sqlite\"<\u002fcode>（或不建该文件）= 默认本地 SQLite。<\u002fli>\n<li><code>\"backend\": \"mysql\"<\u002fcode> = 启用 MySQL 兼容层（<code>src/mysql_compat.py<\u002fcode>），连接信息取 <code>mysql<\u002fcode> 段。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：重启后启动日志出现 MySQL 连接池初始化信息（<code>DB pool (min=…, max_cached=…, max_conn=…)<\u002fcode>）且无连接报错；控制台数据（Issue/流水线历史）正常读写。<\u002fp>\n<h3 id=\"05-database-and-sync-611\">6.1.1 连接池参数（可选）<\u002fh3>\n<p><strong>在哪配<\u002fstrong>：环境变量，重启生效。<\u002fp>\n<table>\n<thead>\n<tr>\n<th>变量<\u002fth>\n<th>默认<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>DB_POOL_MIN<\u002fcode><\u002ftd>\n<td>2<\u002ftd>\n<td>预热连接数<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DB_POOL_MAX_CACHED<\u002fcode><\u002ftd>\n<td>16<\u002ftd>\n<td>最大缓存连接数<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DB_POOL_MAX_CONNECTIONS<\u002fcode><\u002ftd>\n<td>32<\u002ftd>\n<td>最大连接总数<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DB_POOL_DISABLED<\u002fcode><\u002ftd>\n<td>—<\u002ftd>\n<td>设 <code>1<\u002fcode> 回滚到旧的每线程裸连接模式（灰度安全网）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>如何验证<\u002fstrong>：启动日志回显 <code>DB pool (min=…, max_cached=…, max_conn=…)<\u002fcode> 三个值与所配一致。<\u002fp>\n<h2 id=\"05-database-and-sync-62\">6.2 官方技能 / 场景同步<\u002fh2>\n<p>Grape 定期从官方仓库（grape-skills）同步技能包与场景模板。<\u002fp>\n<p><strong>在哪配<\u002fstrong>：<code>configs/scene-sync.json<\u002fcode>（复制 <code>scene-sync.example.json<\u002fcode>）。环境变量 <code>GRAPESKILLS_REPO_URL<\u002fcode> / <code>GRAPESKILLS_REPO_BRANCH<\u002fcode> / <code>SCENE_SYNC_INTERVAL<\u002fcode> / <code>GRAPE_DEV_TOKEN<\u002fcode> <strong>优先覆盖<\u002fstrong>该文件。重启生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;repo_url&quot;: &quot;https://github.com/grape-dev/grape-skills&quot;,\n  &quot;repo_branch&quot;: &quot;main&quot;,\n  &quot;sync_interval&quot;: 1800,\n  &quot;gitcode_api_token&quot;: &quot;&lt;your-gitcode-token-if-private-repo&gt;&quot;\n}\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>repo_url<\u002fcode><\u002ftd>\n<td>官方技能仓库地址<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_branch<\u002fcode><\u002ftd>\n<td>同步分支<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>sync_interval<\u002fcode><\u002ftd>\n<td>同步间隔<strong>秒数<\u002fstrong>，默认 <code>1800<\u002fcode> = <strong>30 分钟一个周期<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>gitcode_api_token<\u002fcode><\u002ftd>\n<td>私有仓库认证 token（也可用环境变量 <code>GRAPE_DEV_TOKEN<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>如何验证<\u002fstrong>：服务运行 30 分钟内，控制台「技能/场景」列表出现官方新增条目；启动日志含 scene-sync 加载信息且无拉取报错。把 <code>sync_interval<\u002fcode> 临时调小可加快验证节奏（验证完记得改回）。<\u002fp>", "toc": [{"level": 2, "id": "05-database-and-sync-61-sqlite-mysql", "name": "6.1 数据库后端（SQLite → MySQL 切换）"}, {"level": 3, "id": "05-database-and-sync-611", "name": "6.1.1 连接池参数（可选）"}, {"level": 2, "id": "05-database-and-sync-62", "name": "6.2 官方技能 / 场景同步"}], "no": "", "is_overview": false}, {"id": "06-security-and-engine", "title": "7. 安全与引擎调度", "html": "<h1 id=\"06-security-and-engine-7\">7. 安全与引擎调度<\u002fh1>\n<h2 id=\"06-security-and-engine-71-jwt_secret\">7.1 JWT_SECRET（强制修改）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：环境变量 <code>JWT_SECRET<\u002fcode>（<code>grape.env<\u002fcode> / systemd <code>EnvironmentFile<\u002fcode>）；或 <code>configs/security.json<\u002fcode> 的 <code>jwt.secret_keys<\u002fcode>（kid 轮换格式，见下）。重启生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>（<code>grape.env<\u002fcode>）：<\u002fp>\n<pre><code class=\"language-bash\">JWT_SECRET=&lt;your-strong-random-secret&gt;\n<\u002fcode><\u002fpre>\n<ul>\n<li><strong>生产门禁<\u002fstrong>：<code>env=production<\u002fcode> 时启动会做安全检查，<code>JWT_SECRET<\u002fcode> 为空或命中不安全默认值（如 <code>change-me-in-production<\u002fcode>）将<strong>拒绝以生产模式启动<\u002fstrong>。<\u002fli>\n<li>kid 轮换（<code>security.json<\u002fcode>）：<code>jwt.secret_keys<\u002fcode> 格式 <code>kid1:secret1,kid2:secret2<\u002fcode>，<code>kid_current<\u002fcode> 指定当前签发密钥；留空则回退 <code>JWT_SECRET<\u002fcode> 环境变量（无轮换）。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：重启后登录一次 → 会话正常；将 <code>JWT_SECRET<\u002fcode> 改为默认弱值再以生产模式启动 → 启动日志出现安全门禁报错，即门禁生效。<\u002fp>\n<h2 id=\"06-security-and-engine-72-credential_keys\">7.2 第三方凭据加密（credential_keys）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/security.json<\u002fcode>（复制 <code>security.example.json<\u002fcode>）。重启生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;env&quot;: &quot;production&quot;,\n  &quot;jwt&quot;: {\n    &quot;secret_keys&quot;: &quot;&quot;,\n    &quot;kid_current&quot;: &quot;&quot;\n  },\n  &quot;credential_keys&quot;: &quot;prod:&lt;base64-32byte-key&gt;&quot;\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li><code>credential_keys<\u002fcode>：第三方凭据的 AES-256-GCM 加密密钥，格式 <code>kid:base64key<\u002fcode>（32 字节）；留空则从 <code>JWT_SECRET<\u002fcode> 派生。<\u002fli>\n<li>生成方式：<code>python3 -c \"import base64,secrets; print('prod:'+base64.b64encode(secrets.token_bytes(32)).decode())\"<\u002fcode><\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：配置后新增一个引擎凭据（控制台「引擎管理」）→ DB 中该凭据密文存储；解密使用正常即生效。<\u002fp>\n<h2 id=\"06-security-and-engine-73-cookie_securehttps\">7.3 COOKIE_SECURE（HTTPS）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：环境变量 <code>COOKIE_SECURE<\u002fcode>。重启生效。<\u002fp>\n<ul>\n<li><code>COOKIE_SECURE=true<\u002fcode>（默认）：Cookie 仅经 HTTPS 传输——生产 HTTPS 部署的正确姿势。<\u002fli>\n<li><code>COOKIE_SECURE=false<\u002fcode>：仅用于 HTTP 开发环境。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：HTTPS 域名下登录 → 浏览器开发者工具中会话 Cookie 带 <code>Secure<\u002fcode> 标记。<\u002fp>\n<h2 id=\"06-security-and-engine-74-login-whitelistjson\">7.4 登录白名单（login-whitelist.json）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/login-whitelist.json<\u002fcode>（复制 <code>login-whitelist.example.json<\u002fcode>）。重启生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;whitelist&quot;: [\n    &quot;&lt;allowed-gitcode-username&gt;&quot;,\n    &quot;&lt;allowed-github-username&gt;&quot;\n  ]\n}\n<\u002fcode><\u002fpre>\n<ul>\n<li>填 GitCode / GitHub 的<strong>用户名<\u002fstrong>（OAuth 登录后按对应用户名列校验）。<\u002fli>\n<li>与<strong>注册白名单<\u002fstrong>（邮箱/域名）相互独立：本文件只管 OAuth 登录放行；注册开放开关与注册白名单另由注册策略控制。<\u002fli>\n<\u002ful>\n<p><strong>如何验证<\u002fstrong>：白名单内用户名可正常 OAuth 登录；名单外用户名登录被拒，即生效。<\u002fp>\n<h2 id=\"06-security-and-engine-75-engine-selectionjson\">7.5 引擎调度（engine-selection.json）<\u002fh2>\n<p><strong>在哪配<\u002fstrong>：<code>configs/engine-selection.json<\u002fcode>（复制 <code>engine-selection.example.json<\u002fcode>）。重启生效。<\u002fp>\n<p><strong>配置示例<\u002fstrong>：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;enabled&quot;: true,\n  &quot;scopes&quot;: [&quot;repo&quot;, &quot;global&quot;, &quot;local&quot;],\n  &quot;rule&quot;: &quot;order&quot;,\n  &quot;filters&quot;: {\n    &quot;only_online&quot;: true,\n    &quot;only_healthy&quot;: true,\n    &quot;only_installed&quot;: true\n  },\n  &quot;local_priority&quot;: 90\n}\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>enabled<\u002fcode><\u002ftd>\n<td>引擎调度开关<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scopes<\u002fcode><\u002ftd>\n<td>参与调度的引擎来源范围（仓库级 / 全局 / 本机）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>rule<\u002fcode><\u002ftd>\n<td>选择规则（<code>order<\u002fcode> = 按序回退）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>filters.only_online<\u002fcode> / <code>only_healthy<\u002fcode> / <code>only_installed<\u002fcode><\u002ftd>\n<td>只选在线 / 健康 / 已安装的引擎（未安装引擎不会被误选）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>local_priority<\u002fcode><\u002ftd>\n<td>本机引擎优先权重（默认 90，越高越优先）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>如何验证<\u002fstrong>：控制台「系统监控 → 引擎状态」中离线/不健康引擎不再被分配任务；会话主引擎按 <code>scopes<\u002fcode> + <code>local_priority<\u002fcode> 顺序解析（启动会话的日志会打印引擎选择结果）。<\u002fp>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>注意<\u002fstrong><\u002fp>\n<p>无可用引擎时行为是<strong>明确不可用<\u002fstrong>，不会隐式回退到默认引擎——看到「无引擎」报错请先检查 <code>scopes<\u002fcode>/<code>filters<\u002fcode> 是否把可用引擎全部过滤掉了。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "06-security-and-engine-71-jwt_secret", "name": "7.1 JWT_SECRET（强制修改）"}, {"level": 2, "id": "06-security-and-engine-72-credential_keys", "name": "7.2 第三方凭据加密（credential_keys）"}, {"level": 2, "id": "06-security-and-engine-73-cookie_securehttps", "name": "7.3 COOKIE_SECURE（HTTPS）"}, {"level": 2, "id": "06-security-and-engine-74-login-whitelistjson", "name": "7.4 登录白名单（login-whitelist.json）"}, {"level": 2, "id": "06-security-and-engine-75-engine-selectionjson", "name": "7.5 引擎调度（engine-selection.json）"}], "no": "", "is_overview": false}]}</script>
<script>
(function () {
  'use strict';
  var OPENAPI_URL = '/static/openapi.json';
  var DATA = (function () { var el = document.getElementById('help-data'); try { return el ? JSON.parse(el.textContent) : {}; } catch (e) { return {}; } })();
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function setMode(m) { document.documentElement.setAttribute('data-mode', m); try { localStorage.setItem('help_theme', m); } catch (e) {} }
  function initMode() { var m = 'light'; try { m = localStorage.getItem('help_theme') || 'light'; } catch (e) {} setMode(m); }
  function docs(s) { return DATA[s] || []; }
  function docOf(s, id) { var d = docs(s); for (var i = 0; i < d.length; i++) { if (d[i].id === id) return d[i]; } return d[0] || null; }
  function subNav(d, cur) {
    var t = d.toc || [], out = '<div class="subnav' + (d.id === cur.id ? ' open' : '') + '" data-for="' + esc(d.id) + '">', i, r;
    for (i = 0; i < t.length; i++) {
      r = t[i];
      out += '<a class="ds" data-id="' + r.id + '" style="padding-left:' + (8 + 12 * (r.level - 1)) + 'px">' + esc(r.name) + '</a>';
    }
    return out + '</div>';
  }
  function sideList(sec, cur) {
    var out = '<div class="side-group">' + esc(sec === 'usage' ? '使用指南' : sec === 'reference' ? '参考文档' : sec === 'developer' ? '开发者文档' : 'API 参考') + '</div>';
    out += '<div class="search"><input id="sbox" type="text" placeholder="搜索' + esc(sec === 'usage' ? '使用指南' : sec === 'reference' ? '参考文档' : sec === 'developer' ? '开发者文档' : 'API 文档') + '..."></div>';
    var h1id = (cur && (cur.html.match(/<h1\b[^>]*id="([^"]+)"/) || [])[1]) || '';
    var d, i, has;
    for (i = 0; i < docs(sec).length; i++) {
      d = docs(sec)[i];
      has = (d.toc && d.toc.length) > 0;
      out += '<a class="dn' + (d.id === cur.id ? ' active' : '') + '" href="#/' + sec + '/' + d.id + '" data-id="' + d.id + '"' + (d.id === cur.id && h1id ? ' data-h1="' + h1id + '"' : '') + '><span class="dn-wrap">'
+ (d.is_overview ? '<span class="dov">总览</span>' : '')
          + (has ? '<span class="caret' + (d.id === cur.id ? ' open' : '') + '">\u25b8</span>' : '')
        + '<span class="dn-t">' + esc(d.title) + '</span></span></a>';
      if (has) { out += subNav(d, cur); }
    }
    return out;
  }
  function topbar(sec) {
    return '<div class="topnav"><a class="brand" href="#/">Grape 帮助中心</a>'
      + '<a class="link' + (sec === 'usage' ? ' active' : '') + '" href="#/usage">使用文档</a>'
      + '<a class="link' + (sec === 'reference' ? ' active' : '') + '" href="#/reference">Git事件统一模型</a>'
      + '<a class="link' + (sec === 'api' ? ' active' : '') + '" href="#/api">API 文档</a>'
      + '<a class="link' + (sec === 'developer' ? ' active' : '') + '" href="#/developer">开发者文档</a>'
      + '<span class="spacer"></span>'
      + '<button class="btn theme-toggle" type="button" title="切换主题">\u2600\ufe0f/\ud83c\udf19</button>'
      + '<button class="btn burger" type="button" title="目录">\u2630</button></div>';
  }
  function renderHome() {
    app.innerHTML = topbar(null)
      + '<div class="home"><h1>Grape 帮助中心</h1>'
      + '<p>帮助文档与 API 参考，按需进入。</p>'
      + '<div class="cards">'
      + '<a class="card" href="#/usage"><div class="big">\ud83d\udcd6 使用文档</div><div>快速上手 · Agent 详解 · 流水线 · 技能 · FAQ</div><div class="go">进入使用文档 \u2192</div></a>'
      + '<a class="card" href="#/reference"><div class="big">\ud83d\udd04 Git事件统一模型</div><div>GitCode/GitHub Webhook → Grape 内部事件类型映射参考</div><div class="go">进入 Git事件统一模型 \u2192</div></a>'
      + '<a class="card" href="#/api"><div class="big">\u26ed API 文档</div><div>认证与通用约定 · 任务/仓库/技能 等接口参考</div><div class="go">进入 API 文档 \u2192</div></a>'
      + '<a class="card" href="#/developer"><div class="big">\ud83d\udee0\ufe0f 开发者文档</div><div>自建/私有化部署配置指南 · 集成 · 存储 · 数据库 · 安全</div><div class="go">进入开发者文档 \u2192</div></a>'
      + '</div></div>';
  }
  function initSpy(cur) {
    if (!cur) return;
    var map = {};
    var subs = Array.prototype.slice.call(document.querySelectorAll('.side .ds'));
    for (var i = 0; i < subs.length; i++) { map[subs[i].getAttribute('data-id')] = subs[i]; }
    var main = document.querySelector('.side .dn.active');
    var h1 = document.getElementById('content') ? document.querySelector('#content h1[id]') : null;
    if (h1 && main) { map[h1.id] = main; }
    var links = Array.prototype.slice.call(document.querySelectorAll('.side .dn,.side .ds'));
    function onScroll() {
      var els = Array.prototype.slice.call(document.querySelectorAll('#content h1[id],#content h2[id],#content h3[id]'));
      var mark = 106, curId = null;
      for (var k = 0; k < els.length; k++) { if (els[k].getBoundingClientRect().top <= mark) { curId = els[k].id; } }
      for (var j = 0; j < links.length; j++) { links[j].classList.remove('active'); }
      var target = map[curId];
      if (target) { target.classList.add('active'); }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
  function bindSearch() {
    var box = document.getElementById('sbox');
    if (!box) return;
    box.addEventListener('input', function () {
      var q = (box.value || '').toLowerCase();
      var items = Array.prototype.slice.call(document.querySelectorAll('.side .dn'));
      for (var i = 0; i < items.length; i++) {
        var m = (!q || items[i].textContent.toLowerCase().indexOf(q) >= 0);
        items[i].style.display = m ? '' : 'none';
        var nav = document.querySelector('.subnav[data-for="' + items[i].getAttribute('data-id') + '"]');
        if (nav) { nav.style.display = q ? (m ? 'block' : 'none') : ''; }
      }
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var q = (box.value || '').toLowerCase();
        var items = Array.prototype.slice.call(document.querySelectorAll('.side .dn'));
        for (var i = 0; i < items.length; i++) {
          if (items[i].style.display !== 'none' && items[i].textContent.toLowerCase().indexOf(q) >= 0) { location.hash = items[i].getAttribute('href'); return; }
        }
      }
    });
  }
  function contractBar() {
    return '<div class="contract"><div class="ct-info"><b>OpenAPI 契约</b><small>OpenAPI 3.1 \u00b7 对外安全接口 \u00b7 Bearer / PRIVATE-TOKEN / access_token 三通道认证</small></div><a class="dl" href="' + OPENAPI_URL + '" download>⬇ 下载 openapi.json</a></div>';
  }
  function labelBefore(el, text) {
    var chip = document.createElement('span');
    chip.setAttribute('class', 'ep-label');
    chip.textContent = text;
    el.parentNode.insertBefore(chip, el);
  }
  function decorateApi(root) {
    var nodes = Array.prototype.slice.call(root.childNodes);
    var ep = null, descLabeled = false, paramLabeled = false, i, el, m;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      if (el.nodeType !== 1) { continue; }
      if (el.tagName === 'H2') {
        m = /^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\s+(\S+)/i.exec(el.textContent || '');
        if (m) {
          ep = document.createElement('section');
          ep.setAttribute('class', 'ep-card');
          el.parentNode.insertBefore(ep, el);
          var rest = (el.textContent || '').slice(m[0].length).replace(/^\s*[—\-–]\s*/, '');
          el.setAttribute('class', 'ep-h');
          el.innerHTML = '<span class="ep-method ' + m[1].toLowerCase() + '">' + m[1].toUpperCase() + '</span>'
            + '<code class="ep-path">' + esc(m[2]) + '</code>'
            + (rest ? '<span class="ep-title">' + esc(rest) + '</span>' : '');
          ep.appendChild(el);
          descLabeled = false;
          paramLabeled = false;
        } else { ep = null; }
        continue;
      }
      if (!ep) { continue; }
      if (el.tagName === 'BLOCKQUOTE' && !descLabeled) {
        labelBefore(el, '接口说明');
        descLabeled = true;
      } else if (el.tagName === 'TABLE') {
        labelBefore(el, paramLabeled ? '出参 / 字段说明' : '请求参数 · 类型/必填/说明');
        paramLabeled = true;
      } else if (el.tagName === 'P' && /(返回[:：]|错误码|出错|错误)/.test(el.textContent || '')) {
        el.setAttribute('class', 'ep-error');
      }
      ep.appendChild(el);
    }
    Array.prototype.slice.call(root.querySelectorAll('.ep-card')).forEach(function (card) {
      var pres = card.querySelectorAll('pre');
      if (pres.length) { labelBefore(pres[pres.length - 1], '响应示例'); }
    });
  }
  function renderSection(sec, cur) {
    var body = cur ? cur.html : '';
    if (sec === 'api') { body = contractBar() + body; }
    app.innerHTML = topbar(sec) + '<div class="body"><aside class="side" id="side">' + sideList(sec, cur) + '</aside><main class="content" id="content"></main></div>';
    var contentEl = document.getElementById('content');
    contentEl.innerHTML = body;
    if (sec === 'api') { decorateApi(contentEl); }
    window.scrollTo(0, 0);
    var sideEl = document.getElementById('side');
    if (sideEl) { sideEl.classList.remove('open'); }
    initSpy(cur);
    bindSearch();
  }
  function route() {
    var raw = (location.hash || '').replace(/^#/, '');
    var frag = '';
    var hashIdx = raw.lastIndexOf('#');
    if (hashIdx >= 0) { frag = raw.slice(hashIdx + 1); raw = raw.slice(0, hashIdx); }
    var parts = raw.split('/').filter(Boolean);
    var sec = parts[0];
    if (sec !== 'usage' && sec !== 'api' && sec !== 'reference' && sec !== 'developer') { renderHome(); return; }
    var cur = docOf(sec, parts[1]);
    renderSection(sec, cur);
    if (frag) {
      var target = document.getElementById(frag);
      if (target) { setTimeout(function () { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); }
    }
  }
  app.addEventListener('click', function (e) {
    var caret = e.target.closest ? e.target.closest('.caret') : null;
    if (caret) {
      e.preventDefault();
      var dn = caret.closest('a.dn');
      var nav = dn && document.querySelector('.subnav[data-for="' + dn.getAttribute('data-id') + '"]');
      if (nav) { nav.classList.toggle('open'); }
      caret.classList.toggle('open');
      return;
    }
    var sub = e.target.closest ? e.target.closest('a.ds') : null;
    if (sub) {
      e.preventDefault();
      var el = document.getElementById(sub.getAttribute('data-id'));
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        var links = Array.prototype.slice.call(document.querySelectorAll('.side .ds'));
        for (var i = 0; i < links.length; i++) { links[i].classList.toggle('active', links[i] === sub); }
      } else {
        var nav = sub.closest('.subnav');
        var docId = nav ? nav.getAttribute('data-for') : '';
        var sec2 = (location.hash || '').replace(/^#/, '').split('/').filter(Boolean)[0] || 'api';
        location.hash = '#/' + sec2 + '/' + docId + '#' + sub.getAttribute('data-id');
      }
      return;
    }
    if (e.target.closest('.theme-toggle')) {
      var curMode = document.documentElement.getAttribute('data-mode') || 'light';
      setMode(curMode === 'light' ? 'dark' : 'light');
      return;
    }
    if (e.target.closest('.burger')) {
      var side = document.getElementById('side');
      if (side) { side.classList.toggle('open'); }
    }
  });
  window.addEventListener('hashchange', route);
  initMode();
  route();
})();
</script>
</body>
</html>
