n；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo milestones --owner {owner} --repo {repo} --state all<\u002fcode>（operation_id=<code>gitrepo_milestones<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>Query<\u002fstrong>：<code>state<\u002fcode>（open/closed/all，技能用 all）<\u002fp>\n<p><strong>返回（200）<\u002fstrong>：里程碑数组 <code>[{\"id\":3,\"number\":850012,\"title\":\"v1.0\",\"state\":\"open\",\"description\":\"\",\"due_on\":null,\"open_issues\":3,\"closed_issues\":1,\"created_at\":\"...\"}]<\u002fcode><\u002fp>\n<blockquote>\n<p>Issue #1005：上游里程碑对象通常只有 <code>number<\u002fcode>（如 <code>850012<\u002fcode>），真实 <code>id<\u002fcode> 体现在 <code>url<\u002fcode> 尾部<br />\n（<code>…/milestones/3<\u002fcode> → <code>id=3<\u002fcode>）。本端点（以及 milestones create/update）统一补出非空 <code>id<\u002fcode>；<br />\n<code>issues update --milestone_id<\u002fcode> <strong>优先取 <code>id<\u002fcode>，同时兼容 <code>number<\u002fcode><\u002fstrong>。<\u002fp>\n<\u002fblockquote>\n<p><strong>错误<\u002fstrong>：401 / 403 / 404。<\u002fp>\n<hr />\n<h2 id=\"10-git-repos-7-issues\">7. Issues<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepoissues\">GET /api/git-repo/{owner}/{repo}/issues<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues --owner {owner} --repo {repo} --state open<\u002fcode>（operation_id=<code>gitrepo_issues_list<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参<\u002fstrong>：Query <code>?state=open&amp;page=1&amp;per_page=50<\u002fcode>（state: open/closed/all）<\u002fp>\n<p><strong>返回（200）<\u002fstrong>：Issue 对象数组<\u002fp>\n<pre><code class=\"language-json\">[{&quot;id&quot;: 4312271, &quot;number&quot;: 5, &quot;title&quot;: &quot;bug: ...&quot;, &quot;state&quot;: &quot;opened&quot;,\n  &quot;body&quot;: &quot;desc&quot;, &quot;labels&quot;: [{&quot;name&quot;:&quot;bug&quot;}],\n  &quot;assignee&quot;: {&quot;username&quot;:&quot;Jason7602&quot;}, &quot;assignees&quot;: [...],\n  &quot;closed_at&quot;: null, &quot;created_at&quot;: &quot;2026-...&quot;, &quot;milestone&quot;: null}]\n<\u002fcode><\u002fpre>\n<h3 id=\"10-git-repos-post-apigit-repoownerrepoissues\">POST /api/git-repo/{owner}/{repo}/issues<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues create --owner {owner} --repo {repo} --json '{\"title\":\"...\",\"body\":\"...\",\"assignee\":\"...\"}'<\u002fcode>（operation_id=<code>gitrepo_issues_create<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参 Body（中性，provider 无关）<\u002fstrong>：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>title<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>Issue 标题<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>body<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>Issue 正文<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>assignee<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>负责人<strong>平台登录用户名<\u002fstrong>（login，如 <code>Jason7602<\u002fcode>；非昵称/数字 id），服务端适配到各平台<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>服务端按 provider 归一（<code>vcs/providers<\u002fcode>）：gitcode 收 <code>{title,body,assignee}<\u002fcode>；github 收 <code>{title,body,assignees}<\u002fcode>。<\u002fp>\n<blockquote>\n<p><strong>发布前一致性断言（Issue #2225 P2）<\u002fstrong>：新建 Issue 无目标号可比，比对<strong>正文首个<br />\n<code>Issue #N<\u002fcode> 主语锚点<\u002fstrong>与当前会话任务 Issue；不一致返回 <strong>409<\u002fstrong>（<code>error_code=ISSUE_ASSERT_MISMATCH<\u002fcode>）<br />\n且不产生线上写入。正文无锚点放行，不阻断正常发布。该断言无放行参数；如确需为其他 Issue 建单，请在目标 Issue 自己的会话（或用户 JWT / API Key 身份）下发起。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（201）<\u002fstrong>：创建后的 Issue 对象（同 GET 单个结构）。<\u002fp>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepoissuesnumber\">GET /api/git-repo/{owner}/{repo}/issues/{number}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues get --owner {owner} --repo {repo} --number {number}<\u002fcode>（operation_id=<code>gitrepo_issues_get<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：单个 Issue 对象（结构同上）。<strong>错误<\u002fstrong>：404。<\u002fp>\n<h3 id=\"10-git-repos-patch-apigit-repoownerrepoissuesnumber\">PATCH /api/git-repo/{owner}/{repo}/issues/{number}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues update --owner {owner} --repo {repo} --number {number} --json '{...}'<\u002fcode>（operation_id=<code>gitrepo_issues_update<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参 Body（JSON，中性）<\u002fstrong>：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>labels<\u002fcode><\u002ftd>\n<td>string/array<\u002ftd>\n<td>标签<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>assignee<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>责任人<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>milestone_id<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>里程碑 <code>id<\u002fcode>（优先，取 <code>milestones list<\u002fcode> 的 <code>id<\u002fcode>）；兼容历史 <code>number<\u002fcode> 传参。GitCode 下游解析后映射为上游 <code>milestone<\u002fcode> 参数（#640/#1005）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>state<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>Issue 状态迁移（对齐 GitHub <code>state_event<\u002fcode>）：仅接受 <code>\"reopen\"<\u002fcode> / <code>\"close\"<\u002fcode>，其他取值后端返回 400<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>body<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>Issue 正文（空值忽略，不影响其他字段）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>返回（200）<\u002fstrong>：更新后的 Issue 对象。<strong>错误<\u002fstrong>：400/404/403/409/422/502。<\u002fp>\n<blockquote>\n<p><strong>发布前一致性断言（Issue #2225）<\u002fstrong>：带 <code>body<\u002fcode> 更新时，目标 Issue 号与正文主语 <code>Issue #N<\u002fcode><br />\n必须与当前会话任务 Issue 一致；不一致返回 <strong>409<\u002fstrong>（<code>error_code=ISSUE_ASSERT_MISMATCH<\u002fcode>）且<br />\n不产生线上写入。<br />\n元数据类更新（labels/assignee/milestone/state）不做标签一致性拦截。<\u002fp>\n<p><strong>里程碑（#640 / #1005 / #1076）<\u002fstrong>：<br />\n- GitCode：<code>milestone_id<\u002fcode> 服务端映射为上游 <code>milestone<\u002fcode>（int）；PATCH 必填 <code>repo<\u002fcode>+<code>title<\u002fcode> 由服务端自动补齐<br />\n  （title 缺失时 GET 回取，回取失败/为空返回 502），<strong>仅传 <code>milestone_id<\u002fcode> 也不会被上游 400 拒绝<\u002fstrong>。<br />\n- 取值口径（#1005）：<code>milestone_id<\u002fcode> <strong>优先按 <code>id<\u002fcode> 匹配<\u002fstrong>（<code>milestones list<\u002fcode> 的 <code>id<\u002fcode>，如 <code>3<\u002fcode>），<br />\n  未命中再按 <code>number<\u002fcode> 匹配（如 <code>850012<\u002fcode>）；解析后以目标里程碑的上游 <code>number<\u002fcode> 写入 PATCH。<br />\n- 失败语义（不再笼统 502）：<br />\n  - <strong>400<\u002fstrong>：可访问里程碑列表中找不到该 <code>id<\u002fcode>/<code>number<\u002fcode>（不存在或无权限查看），解析失败不会发出 PATCH；<br />\n  - <strong>403<\u002fstrong>：当前身份无权限（读取里程碑或写 Issue 时上游返回 403）；<br />\n  - <strong>422<\u002fstrong>：上游 PATCH 返回 200 但回读 <code>milestone<\u002fcode> 为空 / number 与解析目标不一致（上游忽略），<br />\n    并回滚为请求前的 milestone、回读确认；若回滚被上游静默忽略，错误文案标注「原值未恢复」。<br />\n- <strong>5xx 仅保留上游真实故障<\u002fstrong>：预校验/回读时上游不可用、网关或连接失败仍返回 5xx。<br />\n- 成功时响应回显 <code>milestone<\u002fcode>（<code>issues get<\u002fcode> 同样回显上游 milestone 字段，并补 <code>id<\u002fcode> 供 QA 断言）。<br />\n- GitHub：<code>milestone_id<\u002fcode> 语义不变（透传上游同名参数）。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"10-git-repos-post-apigit-repoownerrepoissuesnumberclose\">POST /api/git-repo/{owner}/{repo}/issues/{number}/close<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues close --owner {owner} --repo {repo} --number {number}<\u002fcode>（operation_id=<code>gitrepo_issues_close<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>关闭 Issue（对外关闭入口，供 grape-cli / agent 使用；无 Body）。平台适配由服务端完成，<strong>调用方无需区分 provider<\u002fstrong>。<\u002fp>\n<p><strong>返回（200）<\u002fstrong>：关闭后的 Issue 对象（<code>state<\u002fcode> 为 <code>closed<\u002fcode>）。<br />\n<strong>错误<\u002fstrong>：401 / 403 / 404（Issue 不存在）/ <strong>502（平台关闭未生效或 token 解析失败）<\u002fstrong>。<\u002fp>\n<h3 id=\"10-git-repos-getpost-apigit-repoownerrepoissuesnumbercomments\">GET/POST /api/git-repo/{owner}/{repo}/issues/{number}/comments<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues comments list --owner {owner} --repo {repo} --number {number}<\u002fcode> / <code>issues comments create ... --json '{\"body\":\"...\"}'<\u002fcode>（operation_id=<code>gitrepo_issues_comments_list<\u002fcode> / <code>gitrepo_issues_comments_create<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<ul>\n<li><strong>GET<\u002fstrong>：返回评论数组 <code>[{\"id\":1,\"body\":\"...\",\"user\":{\"username\":\"x\"},\"created_at\":\"...\"}]<\u002fcode><\u002fli>\n<li><strong>POST<\u002fstrong>：Body <code>{body}<\u002fcode>（必填）→ 返回（201）创建后的评论对象。<\u002fli>\n<\u002ful>\n<blockquote>\n<p><strong>发布前一致性断言（Issue #2225 P1）<\u002fstrong>：会话任务可确定时，评论目标 Issue 与正文首个<br />\n<code>Issue #N<\u002fcode> 主语锚点必须与当前任务一致；不一致返回 <strong>409<\u002fstrong>（<code>ISSUE_ASSERT_MISMATCH<\u002fcode>）<br />\n且不产生线上写入。讨论区 chat 会话代发与用户 JWT / API Key 不受影响。该断言无放行参数；确需在其他 Issue 评论区发言时，请在目标 Issue 自己的会话（或用户 JWT / API Key 身份）下发起。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"10-git-repos-patchdelete-apigit-repoownerrepoissuesnumbercommentscomment_id\">PATCH/DELETE /api/git-repo/{owner}/{repo}/issues/{number}/comments/{comment_id}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo issues comments update --owner {owner} --repo {repo} --number {number} --comment_id {id} --json '{\"body\":\"修正后的内容\"}'<\u002fcode> / <code>grape git-repo issues comments delete --owner {owner} --repo {repo} --number {number} --comment_id {id}<\u002fcode>（operation_id=<code>gitrepo_issues_comments_update<\u002fcode> / <code>gitrepo_issues_comments_delete<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<ul>\n<li><strong>PATCH<\u002fstrong>：Body <code>{body}<\u002fcode>（必填）→ 透传 <code>PATCH /issues/comments/{id}<\u002fcode> 改写 Issue 评论正文 → 返回更新后的评论对象。<\u002fli>\n<li><strong>DELETE<\u002fstrong>：透传 <code>DELETE /issues/comments/{id}<\u002fcode> 删除 Issue 评论（误发评论自纠）。<\u002fli>\n<li><strong>Issue #3821 契约说明<\u002fstrong>：<code>--comment_id<\u002fcode> 支持<strong>数字 note_id（推荐，list 响应中的 <code>id<\u002fcode>）<\u002fstrong>与 <strong>create 响应返回的十六进制 <code>id<\u002fcode>（兼容形态，服务端自动解析为 note_id）<\u002fstrong>；非法/不可解析 id 返回可读 422（含原因）。十六进制识别规则同 pulls comments：全 hex 字符且含 a-f 字母。<\u002fli>\n<\u002ful>\n<hr />\n<h2 id=\"10-git-repos-8-pull-requests\">8. Pull Requests<\u002fh2>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepopulls\">GET /api/git-repo/{owner}/{repo}/pulls<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls --owner {owner} --repo {repo}<\u002fcode>（operation_id=<code>gitrepo_pulls_list<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：PR 对象数组<\u002fp>\n<pre><code class=\"language-json\">[{&quot;id&quot;: 1, &quot;number&quot;: 1, &quot;title&quot;: &quot;feat: #7 ...&quot;, &quot;state&quot;: &quot;opened&quot;,\n  &quot;head&quot;: {&quot;ref&quot;: &quot;feat/issue-7&quot;}, &quot;base&quot;: {&quot;ref&quot;: &quot;main&quot;},\n  &quot;body&quot;: &quot;...&quot;, &quot;merged&quot;: false, &quot;mergeable&quot;: true, &quot;user&quot;: {&quot;username&quot;:&quot;x&quot;},\n  &quot;created_at&quot;: &quot;...&quot;, &quot;html_url&quot;: &quot;...&quot;}]\n<\u002fcode><\u002fpre>\n<h3 id=\"10-git-repos-post-apigit-repoownerrepopulls\">POST /api/git-repo/{owner}/{repo}/pulls<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls create --owner {owner} --repo {repo} --json '{...}'<\u002fcode>（operation_id=<code>gitrepo_pulls_create<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参 Body（JSON，中性）<\u002fstrong>：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>title<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>PR 标题（如 <code>feat: #7 标题<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>head<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>源分支（push 的分支，如 <code>feat/issue-7<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>base<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>目标分支（main/master）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>body<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>PR 正文<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>related_issue_nums<\u002fcode><\u002ftd>\n<td>array[int]<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>关联 Issue 号 <code>[7, 8]<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>auto_close_issues<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>true=合并后自动关闭关联 Issue<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>关联 Issue 的关闭由服务端按 provider 适配（gitcode 原生支持；github 自动在 body 追加 <code>Closes #N<\u002fcode>）。<br />\n<strong>发布前一致性断言（Issue #2225）<\u002fstrong>：标题首个 <code>#N<\u002fcode>、正文主语 <code>Issue #N<\u002fcode>、<code>related_issue_nums<\u002fcode><br />\n必须包含当前会话任务 Issue；不一致返回 <strong>409<\u002fstrong>（<code>ISSUE_ASSERT_MISMATCH<\u002fcode>）且不产生线上写入。该断言无放行参数。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（201）<\u002fstrong>：创建的 PR 对象。<strong>错误<\u002fstrong>：400（缺 head/base）/ 404 / 403 / 409。<\u002fp>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepopullsnumber\">GET /api/git-repo/{owner}/{repo}/pulls/{number}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls get --owner {owner} --repo {repo} --number {number}<\u002fcode>（operation_id=<code>gitrepo_pulls_get<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：单个 PR 对象（结构同上）。<strong>错误<\u002fstrong>：404。<\u002fp>\n<p><strong>Issue #2324 附加字段 <code>merge_readiness<\u002fcode><\u002fstrong>：统一合并判定结果（QA hit 判定与 <code>pulls merge<\u002fcode> 前置检查共用<br />\n同一实现），不改变存量字段：<\u002fp>\n<pre><code class=\"language-json\">&quot;merge_readiness&quot;: {\n  &quot;ready&quot;: false,\n  &quot;verdict&quot;: &quot;not_mergeable&quot;,           // ready | not_mergeable | pending_review | unknown\n  &quot;label&quot;: &quot;待评审/不可合入&quot;,             // 可合入 | 待评审/不可合入 | 无法判定\n  &quot;summary&quot;: &quot;待评审/不可合入：can_merge_check 未通过（...）；approval_reviewers 为空（待指定评审人）&quot;,\n  &quot;missing&quot;: [{&quot;code&quot;: &quot;can_merge_check&quot;, &quot;message&quot;: &quot;...&quot;}],\n  &quot;warnings&quot;: [&quot;...&quot;],\n  &quot;fields&quot;: {&quot;mergeable&quot;: true, &quot;can_merge_check&quot;: false, &quot;...&quot;: &quot;...&quot;}\n}\n<\u002fcode><\u002fpre>\n<p><strong>组合判定口径（GitCode v5 实测层级）<\u002fstrong>：<code>mergeable &amp;&amp; can_merge_check &amp;&amp;\napproval_reviewers_required_passed<\u002fcode>；仅当<br />\n<code>mergeable_state.merge_request_switch.approval_required_reviewers_count &gt;= 1<\u002fcode> 时才纳入评审人校验。<br />\n<code>None<\u002fcode>/缺失字段显式视为不可合入并告警，禁止退化为「只看 mergeable」。<\u002fp>\n<table>\n<thead>\n<tr>\n<th>mergeable<\u002fth>\n<th>can_merge_check<\u002fth>\n<th>reviewers_required_passed<\u002fth>\n<th>required_count<\u002fth>\n<th>approval_reviewers<\u002fth>\n<th>判定<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>true<\u002ftd>\n<td>true<\u002ftd>\n<td>true<\u002ftd>\n<td>1<\u002ftd>\n<td>非空<\u002ftd>\n<td>可合入<\u002ftd>\n<\u002ftr>\n<tr>\n<td>true<\u002ftd>\n<td>true<\u002ftd>\n<td>true<\u002ftd>\n<td>0<\u002ftd>\n<td>空<\u002ftd>\n<td>可合入（未开启评审人要求）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>true<\u002ftd>\n<td>false<\u002ftd>\n<td>false<\u002ftd>\n<td>1<\u002ftd>\n<td>空<\u002ftd>\n<td>待评审/不可合入：can_merge_check 未通过 + 待指定评审人<\u002ftd>\n<\u002ftr>\n<tr>\n<td>true<\u002ftd>\n<td>true<\u002ftd>\n<td>false<\u002ftd>\n<td>1<\u002ftd>\n<td>非空（pending）<\u002ftd>\n<td>待评审/不可合入：必需评审人未满足<\u002ftd>\n<\u002ftr>\n<tr>\n<td>true<\u002ftd>\n<td>true<\u002ftd>\n<td>false<\u002ftd>\n<td>1<\u002ftd>\n<td>空<\u002ftd>\n<td>待评审/不可合入：待指定评审人<\u002ftd>\n<\u002ftr>\n<tr>\n<td>false / 缺失<\u002ftd>\n<td>*<\u002ftd>\n<td>*<\u002ftd>\n<td>*<\u002ftd>\n<td>*<\u002ftd>\n<td>待评审/不可合入（缺失项告警）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>字段层级：<code>mergeable<\u002fcode>/<code>can_merge_check<\u002fcode> 在<strong>顶层<\u002fstrong>；<code>approval_reviewers_required_passed<\u002fcode> 在<br />\n<code>mergeable_state<\u002fcode>；<code>approval_required_reviewers_count<\u002fcode> 在 <code>mergeable_state.merge_request_switch<\u002fcode>。<br />\n非 GitCode provider（<code>mergeable_state<\u002fcode> 为字符串枚举）返回 <code>verdict=unknown<\u002fcode>，合入路径按原流程继续。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"10-git-repos-patch-apigit-repoownerrepopullsnumber\">PATCH /api/git-repo/{owner}/{repo}/pulls/{number}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls update --owner {owner} --repo {repo} --number {number} --json '{...}'<\u002fcode>（operation_id=<code>gitrepo_pulls_update<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>入参 Body（JSON）<\u002fstrong>：<code>title<\u002fcode> / <code>body<\u002fcode> / <code>labels<\u002fcode>（按需更新字段）。<\u002fp>\n<blockquote>\n<p><strong>发布前一致性断言（Issue #2225）<\u002fstrong>：标题首个 <code>#N<\u002fcode> / 正文主语 <code>Issue #N<\u002fcode> 与当前会话任务<br />\nIssue 不一致 → <strong>409<\u002fstrong>（<code>ISSUE_ASSERT_MISMATCH<\u002fcode>），不产生线上写入。该断言无放行参数；确需更新其他 Issue/PR 时，请在目标 Issue 自己的会话（或用户 JWT / API Key 身份）下发起。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：更新后的 PR 对象。<strong>错误<\u002fstrong>：409。<\u002fp>\n<h3 id=\"10-git-repos-put-apigit-repoownerrepopullsnumbermerge\">PUT /api/git-repo/{owner}/{repo}/pulls/{number}/merge<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls merge --owner {owner} --repo {repo} --number {number}<\u002fcode>（operation_id=<code>gitrepo_pulls_merge<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：<code>{\"merged\": true, \"sha\": \"...\"}<\u002fcode>。<strong>错误<\u002fstrong>：409（不可合并）。<\u002fp>\n<p><strong>Issue #2324 合入前置检查<\u002fstrong>：合入前按统一判定（与 <code>pulls get<\u002fcode> 的 <code>merge_readiness<\u002fcode> 同一实现）校验<br />\n<code>mergeable &amp;&amp; can_merge_check &amp;&amp; approval_reviewers_required_passed<\u002fcode>，不满足时 409：<\u002fp>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 409,\n  &quot;message&quot;: &quot;merge blocked by merge readiness gate (Issue #2324): 待评审/不可合入：...&quot;,\n  &quot;gate&quot;: {&quot;phase&quot;: &quot;pre_merge_readiness&quot;, &quot;verdict&quot;: &quot;pending_review&quot;,\n           &quot;missing&quot;: [{&quot;code&quot;: &quot;reviewers_not_assigned&quot;, &quot;message&quot;: &quot;approval_reviewers 为空（待指定评审人）&quot;}],\n           &quot;warnings&quot;: []}}}\n<\u002fcode><\u002fpre>\n<h3 id=\"10-git-repos-getpost-apigit-repoownerrepopullsnumbercomments\">GET/POST /api/git-repo/{owner}/{repo}/pulls/{number}/comments<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls comments list --owner {owner} --repo {repo} --number {number}<\u002fcode> / <code>pulls comments create ... --json '{\"body\":\"LGTM\"}'<\u002fcode>（operation_id=<code>gitrepo_pulls_comments_list<\u002fcode> / <code>gitrepo_pulls_comments_create<\u002fcode>；create 仅接受 <code>body<\u002fcode>，不支持 <code>path<\u002fcode>/<code>line<\u002fcode> 等行内定位字段）。<\u002fp>\n<\u002fblockquote>\n<ul>\n<li><strong>GET<\u002fstrong>：返回 PR 行内评论数组 <code>[{\"id\":1,\"body\":\"LGTM\",\"path\":\"a.py\",\"line\":5,\"user\":{\"username\":\"x\"},\"created_at\":\"...\"}]<\u002fcode><\u002fli>\n<li><strong>POST<\u002fstrong>：Body <code>{body}<\u002fcode>（必填）→ 返回（201）评论对象。<\u002fli>\n<li><strong>PUT /pulls/{number}/comments/{discussion_id}<\u002fstrong>：标记 resolved → 更新后的评论对象。<\u002fli>\n<\u002ful>\n<blockquote>\n<p><strong>发布前一致性断言（Issue #2225 P1）<\u002fstrong>：PR 评论正文首个 <code>Issue #N<\u002fcode> 主语锚点与当前会话<br />\n任务不一致（疑似暂存被覆写）返回 <strong>409<\u002fstrong>（<code>ISSUE_ASSERT_MISMATCH<\u002fcode>）且不产生线上写入。<br />\nPR 号与任务 Issue 号属不同号段空间，不做目标号比对；讨论区 chat 会话代发与用户<br />\nJWT / API Key 不受影响。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"10-git-repos-patchdelete-apigit-repoownerrepopullsnumbercommentscomment_id\">PATCH/DELETE /api/git-repo/{owner}/{repo}/pulls/{number}/comments/{comment_id}<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls comments update --owner {owner} --repo {repo} --number {number} --comment_id {id} --json '{\"body\":\"修正后的内容\"}'<\u002fcode> / <code>grape git-repo pulls comments delete --owner {owner} --repo {repo} --number {number} --comment_id {id}<\u002fcode>（operation_id=<code>gitrepo_pulls_comments_update<\u002fcode> / <code>gitrepo_pulls_comments_delete<\u002fcode>；comment_id 取 list 返回的评论 id，上游全局唯一，PR number 仅作上下文）。<\u002fp>\n<\u002fblockquote>\n<ul>\n<li><strong>PATCH<\u002fstrong>：Body <code>{body}<\u002fcode>（必填）→ 透传 <code>PATCH /pulls/comments/{id}<\u002fcode> 改写评论正文 → 返回更新后的评论对象。<\u002fli>\n<li><strong>Issue #623 契约说明<\u002fstrong>：<code>--comment_id<\u002fcode> 支持<strong>数字 note_id（推荐，list 响应中的 <code>id<\u002fcode>）<\u002fstrong>与 <strong>create 响应返回的十六进制 <code>id<\u002fcode>（兼容形态，服务端自动映射为 note_id）<\u002fstrong>——直接回用 create 响应主键不再 422；其余非法形态返回 422（明确错误信息）。十六进制识别规则：全 hex 字符且含 a-f 字母（纯数字串按 note_id 直传，向后兼容）。<\u002fli>\n<li><strong>DELETE<\u002fstrong>：透传 <code>DELETE /pulls/comments/{id}<\u002fcode> 删除评论（误发评论自纠，Issue #563；delete 的 comment_id 仍为数字 note_id）。<\u002fli>\n<li><strong>create --json @file 读取失败<\u002fstrong>：CLI ≥0.3.3 已显式报错 <code>cannot read --json file '...'<\u002fcode> 并以非零码退出，不再静默。<\u002fli>\n<\u002ful>\n<h3 id=\"10-git-repos-get-apigit-repoownerrepopullsnumberfiles\">GET /api/git-repo/{owner}/{repo}/pulls/{number}/files<\u002fh3>\n<blockquote>\n<p>scope（x-token-scope）：<strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode> 会话 token；API Key / JWT → 403）<br />\nCLI：<code>grape git-repo pulls files --owner {owner} --repo {repo} --number {number}<\u002fcode>（operation_id=<code>gitrepo_pulls_files<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p><strong>返回（200）<\u002fstrong>：变更文件数组<\u002fp>\n<pre><code class=\"language-json\">[{&quot;filename&quot;: &quot;src/a.py&quot;, &quot;status&quot;: &quot;modified&quot;, &quot;additions&quot;: 10, &quot;deletions&quot;: 2,\n  &quot;patch&quot;: &quot;@@ ...&quot;, &quot;raw_url&quot;: &quot;...&quot;}]\n<\u002fcode><\u002fpre>\n<hr />\n<h2 id=\"10-git-repos-_1\">通用错误（全接口一致）<\u002fh2>\n<blockquote>\n<p><code>detail.message<\u002fcode> 英文；格式见 <code>README.md<\u002fcode>「错误响应统一格式」。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>含义（message 英文）<\u002fth>\n<th>body<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>401<\u002ftd>\n<td>Unauthorized（缺失/无效 API Key）<\u002ftd>\n<td><code>{\"detail\":{\"code\":401,\"message\":\"Not logged in\"}}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>Forbidden（写操作/白名单外 path/未知 provider）<\u002ftd>\n<td><code>{\"detail\":{\"code\":403,\"message\":\"Forbidden\"}}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>Not Found（资源不存在/无权）<\u002ftd>\n<td><code>{\"detail\":{\"code\":404,\"message\":\"Not Found\"}}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>400<\u002ftd>\n<td>Bad Request（参数缺失/校验失败）<\u002ftd>\n<td><code>{\"detail\":{\"code\":400,\"message\":\"Invalid parameter\"}}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>502<\u002ftd>\n<td>Bad Gateway（平台 token 解析失败）<\u002ftd>\n<td><code>{\"detail\":{\"code\":502,\"message\":\"Git repository token resolve failed\"}}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>429<\u002ftd>\n<td>Too Many Requests（平台限流 400/min，4000/hour）<\u002ftd>\n<td>透传<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>技能迁移后：<code>gitcode-api-reference.md<\u002fcode> 中 <code>api.gitcode.com/api/v5<\u002fcode> → <code>{{SERVER_URL}}/api/git-repo/...<\u002fcode>；认证 <code>$BOT_GITCODE_TOKEN<\u002fcode> → <code>$GRAPE_API_TOKEN<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"10-git-repos-9-cli\">9. CLI 使用样例（每接口一条）<\u002fh2>\n<blockquote>\n<p>语法：<code>grape git-repo &lt;资源&gt; [&lt;动作&gt;] --owner O --repo R [--flag ...] [--json '{...}'] [--json-out]<\u002fcode>；<br />\nprovider 由会话 token 派生，无需传。具体子命令/flag 以 <code>grape git-repo &lt;资源&gt; --help<\u002fcode> 为准，以下为典型用法。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>接口<\u002fth>\n<th>CLI 样例<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>GET仓库<\u002ftd>\n<td><code>grape git-repo repo --owner Jason7602 --repo hello<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/branches<\u002ftd>\n<td><code>grape git-repo branches --owner Jason7602 --repo hello<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/tree<\u002ftd>\n<td><code>grape git-repo tree --owner Jason7602 --repo hello --ref main --depth single<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/contents 根<\u002ftd>\n<td><code>grape git-repo contents --owner Jason7602 --repo hello<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/contents/{path}<\u002ftd>\n<td><code>grape git-repo contents --owner Jason7602 --repo hello --path CODEOWNERS --ref codeowner<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/commits<\u002ftd>\n<td><code>grape git-repo commits --owner Jason7602 --repo hello --per-page 10<\u002fcode>（按分支/SHA：<code>--sha weekly-11<\u002fcode>，需 grape-cli &gt;= 0.3.3）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/labels<\u002ftd>\n<td><code>grape git-repo labels --owner Jason7602 --repo hello<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>POST/labels<\u002ftd>\n<td><code>grape git-repo labels create --owner Jason7602 --repo hello --json '{\"name\":\"bug\",\"color\":\"d73a4a\"}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/milestones<\u002ftd>\n<td><code>grape git-repo milestones --owner Jason7602 --repo hello --state all<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/issues<\u002ftd>\n<td><code>grape git-repo issues --owner Jason7602 --repo hello --state open<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>POST/issues<\u002ftd>\n<td><code>grape git-repo issues create --owner Jason7602 --repo hello --json '{\"title\":\"bug: 列表为空\",\"body\":\"复现步骤...\",\"assignee\":\"Jason7602\"}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/issues/{number}<\u002ftd>\n<td><code>grape git-repo issues get --owner Jason7602 --repo hello --number 5<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>PATCH/issues/{number}<\u002ftd>\n<td><code>grape git-repo issues update --owner Jason7602 --repo hello --number 5 --json '{\"state\":\"reopen\",\"labels\":\"bug\"}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>POST/issues/{number}/close<\u002ftd>\n<td><code>grape git-repo issues close --owner Jason7602 --repo hello --number 5<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/issues comments<\u002ftd>\n<td><code>grape git-repo issues comments list --owner Jason7602 --repo hello --number 5<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>POST/issues comments<\u002ftd>\n<td><code>grape git-repo issues comments create --owner Jason7602 --repo hello --number 5 --json '{\"body\":\"已定位原因\"}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>PATCH/issues comments<\u002ftd>\n<td><code>grape git-repo issues comments update --owner Jason7602 --repo hello --number 5 --comment_id 202860901 --json '{\"body\":\"更正后的内容\"}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>DELETE/issues comments<\u002ftd>\n<td><code>grape git-repo issues comments delete --owner Jason7602 --repo hello --number 5 --comment_id 202860901<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/pulls<\u002ftd>\n<td><code>grape git-repo pulls --owner Jason7602 --repo hello<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>POST/pulls<\u002ftd>\n<td><code>grape git-repo pulls create --owner Jason7602 --repo hello --json '{\"title\":\"feat: #7\",\"head\":\"feat/7\",\"base\":\"main\",\"related_issue_nums\":[7],\"auto_close_issues\":true}' --json-out<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/pulls/{number}<\u002ftd>\n<td><code>grape git-repo pulls get --owner Jason7602 --repo hello --number 7<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>PATCH/pulls/{number}<\u002ftd>\n<td><code>grape git-repo pulls update --owner Jason7602 --repo hello --number 7 --json '{\"title\":\"feat: #7 (v2)\",\"labels\":\"lgtm\"}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>PUT/pulls/{number}/merge<\u002ftd>\n<td><code>grape git-repo pulls merge --owner Jason7602 --repo hello --number 7<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/POST pulls comments<\u002ftd>\n<td><code>grape git-repo pulls comments list --owner Jason7602 --repo hello --number 7<\u002fcode> / <code>... comments create ... --json '{\"body\":\"LGTM\",\"path\":\"a.py\",\"line\":5}'<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>GET/pulls/{number}/files<\u002ftd>\n<td><code>grape git-repo pulls files --owner Jason7602 --repo hello --number 7<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>DELETE/pulls/{number}/issues/{issue_number}<\u002ftd>\n<td><code>grape git-repo pulls issues unlink --owner Jason7602 --repo hello --number 7 --issue-number 5<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"10-git-repos-pr-body-issue-issue-728\">PR body 提及 Issue 号的规避写法（Issue #728）<\u002fh3>\n<p><code>pulls create<\u002fcode> 在调用方未显式传 <code>related_issue_nums<\u002fcode> 时，会从 body 自动提取 Issue 号建立 PR↔Issue 关联。提取前有<strong>上下文过滤<\u002fstrong>：代码块（``` 围栏）、行内反引号、引用块（<code>&gt;<\u002fcode> 行）内的 <code>#N<\u002fcode> 属非语义语境，不会被捕获；正文自然语言 <code>#N<\u002fcode> 与 <code>Closes #<\u002fcode> / <code>Related #<\u002fcode> / <code>关联 #<\u002fcode> 显式写法正常关联。<\u002fp>\n<ul>\n<li>想在 body 里<strong>提及但不关联<\u002fstrong>某个 Issue：把编号放进代码块或用反引号包裹，如 <code>`#123`<\u002fcode>。<\u002fli>\n<li>想确保<strong>一定关联<\u002fstrong>：正文显式写 <code>Closes #N<\u002fcode> / <code>Related #N<\u002fcode> / <code>关联 #N<\u002fcode>，或 create 时直接传 <code>related_issue_nums<\u002fcode>（显式参数优先，不受过滤影响）。<\u002fli>\n<li>已误建立的关联可用 unlink 命令解除（幂等，重复调用安全）：<br />\n<code>bash\n  grape git-repo pulls issues unlink --owner Jason7602 --repo hello --number 7 --issue-number 5\n  # {\"unlinked\": true, \"pr_number\": 7, \"issue_number\": 5, \"remaining_issue_nums\": [...]}<\u002fcode><br />\n  关联不存在时返回 <code>unlinked=false<\u002fcode>（幂等 no-op）；GitHub 通道无原生 PR↔Issue 关联存储，恒为 no-op。<\u002fli>\n<\u002ful>", "toc": [{"level": 2, "id": "10-git-repos-git-provider", "name": "后端区分（Git Provider 判定）"}, {"level": 2, "id": "10-git-repos-1", "name": "1. 仓库信息"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepo", "name": "GET /api/git-repo/{owner}/{repo}"}, {"level": 2, "id": "10-git-repos-2", "name": "2. 分支"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepobranches", "name": "GET /api/git-repo/{owner}/{repo}/branches"}, {"level": 2, "id": "10-git-repos-3", "name": "3. 文件内容"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepotreerefbranchdepthsinglerecursive", "name": "GET /api/git-repo/{owner}/{repo}/tree?ref={branch}&amp;depth={single|recursive}"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepocontents", "name": "GET /api/git-repo/{owner}/{repo}/contents — 根目录列表"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepocontentspathrefbranch", "name": "GET /api/git-repo/{owner}/{repo}/contents/{path}?ref={branch}"}, {"level": 2, "id": "10-git-repos-4", "name": "4. 提交历史"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepocommits", "name": "GET /api/git-repo/{owner}/{repo}/commits"}, {"level": 2, "id": "10-git-repos-5", "name": "5. 标签"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepolabels", "name": "GET /api/git-repo/{owner}/{repo}/labels"}, {"level": 3, "id": "10-git-repos-post-apigit-repoownerrepolabels", "name": "POST /api/git-repo/{owner}/{repo}/labels"}, {"level": 2, "id": "10-git-repos-6", "name": "6. 里程碑"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepomilestonesstateall", "name": "GET /api/git-repo/{owner}/{repo}/milestones?state=all"}, {"level": 2, "id": "10-git-repos-7-issues", "name": "7. Issues"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepoissues", "name": "GET /api/git-repo/{owner}/{repo}/issues"}, {"level": 3, "id": "10-git-repos-post-apigit-repoownerrepoissues", "name": "POST /api/git-repo/{owner}/{repo}/issues"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepoissuesnumber", "name": "GET /api/git-repo/{owner}/{repo}/issues/{number}"}, {"level": 3, "id": "10-git-repos-patch-apigit-repoownerrepoissuesnumber", "name": "PATCH /api/git-repo/{owner}/{repo}/issues/{number}"}, {"level": 3, "id": "10-git-repos-post-apigit-repoownerrepoissuesnumberclose", "name": "POST /api/git-repo/{owner}/{repo}/issues/{number}/close"}, {"level": 3, "id": "10-git-repos-getpost-apigit-repoownerrepoissuesnumbercomments", "name": "GET/POST /api/git-repo/{owner}/{repo}/issues/{number}/comments"}, {"level": 3, "id": "10-git-repos-patchdelete-apigit-repoownerrepoissuesnumbercommentscomment_id", "name": "PATCH/DELETE /api/git-repo/{owner}/{repo}/issues/{number}/comments/{comment_id}"}, {"level": 2, "id": "10-git-repos-8-pull-requests", "name": "8. Pull Requests"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepopulls", "name": "GET /api/git-repo/{owner}/{repo}/pulls"}, {"level": 3, "id": "10-git-repos-post-apigit-repoownerrepopulls", "name": "POST /api/git-repo/{owner}/{repo}/pulls"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepopullsnumber", "name": "GET /api/git-repo/{owner}/{repo}/pulls/{number}"}, {"level": 3, "id": "10-git-repos-patch-apigit-repoownerrepopullsnumber", "name": "PATCH /api/git-repo/{owner}/{repo}/pulls/{number}"}, {"level": 3, "id": "10-git-repos-put-apigit-repoownerrepopullsnumbermerge", "name": "PUT /api/git-repo/{owner}/{repo}/pulls/{number}/merge"}, {"level": 3, "id": "10-git-repos-getpost-apigit-repoownerrepopullsnumbercomments", "name": "GET/POST /api/git-repo/{owner}/{repo}/pulls/{number}/comments"}, {"level": 3, "id": "10-git-repos-patchdelete-apigit-repoownerrepopullsnumbercommentscomment_id", "name": "PATCH/DELETE /api/git-repo/{owner}/{repo}/pulls/{number}/comments/{comment_id}"}, {"level": 3, "id": "10-git-repos-get-apigit-repoownerrepopullsnumberfiles", "name": "GET /api/git-repo/{owner}/{repo}/pulls/{number}/files"}, {"level": 2, "id": "10-git-repos-_1", "name": "通用错误（全接口一致）"}, {"level": 2, "id": "10-git-repos-9-cli", "name": "9. CLI 使用样例（每接口一条）"}, {"level": 3, "id": "10-git-repos-pr-body-issue-issue-728", "name": "PR body 提及 Issue 号的规避写法（Issue #728）"}], "no": "", "is_overview": false}, {"id": "11-issues", "title": "Issues 对外接口（/api/issues）", "html": "<h1 id=\"11-issues-issues-apiissues\">Issues 对外接口（/api/issues）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>（JWT 会话 / 会话 token（<code>tk_<\u002fcode>）/ API Key 任一）。<br />\nscope（x-token-scope）：仓库列表/详情/事件/pipeline/<code>GET status<\u002fcode>（读）= <strong>dual<\u002fstrong>；<br />\n<code>mine<\u002fcode>（个人维度）、<code>create<\u002fcode>（创建人=调用者）与全部<strong>操作/写类<\u002fstrong>（start/<code>PUT status<\u002fcode>/confirm-done/cancel/resume/pipeline/clarify/attachments 写）<br />\n= <strong>user_only<\u002fstrong>（<code>tk_<\u002fcode> → 403）——避免 Agent 任意改写需求状态干扰 pipeline。<br />\n以 <strong>Issue 为中心<\u002fstrong>聚合：pipeline 阶段（<code>stage<\u002fcode>）+ 需求中心状态（<code>status<\u002fcode>）+ 事件流（<code>events<\u002fcode>）+ 路线图（<code>pipeline<\u002fcode>）。<br />\n设计：<code>docs/weekly-03/issues-api-design.md<\u002fcode>。<br />\n<strong>CLI 映射<\u002fstrong>：CLI 命令由 <strong><code>operation_id<\u002fcode><\u002fstrong> 派生——<code>{根组 issues}_{动词}<\u002fcode> → <code>grape issues &lt;动词&gt;<\u002fcode>；<br />\n查命令：<code>grape issues -h<\u002fcode> / <code>grape issues &lt;动词&gt; -h<\u002fcode>。参数与 API path/query/body 对应（<code>--owner/--repo/--number/--issue_id/--json/--file/--json-out<\u002fcode>）。<br />\n<code>--json<\u002fcode> = JSON 请求体（或 <code>@file.json<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"11-issues-_1\">概念速览<\u002fh2>\n<blockquote>\n<p>参考：<code>docs/weekly-03/issues-api-design.md<\u002fcode> §一（含两个同名 Task 的澄清）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>概念<\u002fth>\n<th>本质<\u002fth>\n<th>载体<\u002fth>\n<th>判别关键<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><strong>Issue（需求）<\u002fstrong><\u002ftd>\n<td><strong>grape 的需求单元（<code>#N<\u002fcode>）<\u002fstrong>，pipeline 的<strong>主对象<\u002fstrong>；需求中心每条记录即一个 Issue，映射到 GitCode/GitHub 等平台的 issue<\u002ftd>\n<td><code>issue<\u002fcode> 表（<code>issue_number<\u002fcode> 关联平台）<\u002ftd>\n<td><strong><code>stage<\u002fcode><\u002fstrong>（pipeline 视角）+ <strong><code>status<\u002fcode><\u002fstrong>（需求中心视角）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>Event<\u002fstrong><\u002ftd>\n<td>一次触发动作（webhook/A2A），pipeline 的<strong>执行单元<\u002fstrong><\u002ftd>\n<td><code>events<\u002fcode> 表（<code>seq<\u002fcode> 唯一）<\u002ftd>\n<td><strong><code>seq<\u002fcode><\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td><strong>Task（执行实例）<\u002fstrong><\u002ftd>\n<td>一次 <strong>Agent 引擎执行<\u002fstrong>，Event 的具体落地<\u002ftd>\n<td><code>agent_tasks<\u002fcode> 表（<code>event_seq<\u002fcode> 关联）<\u002ftd>\n<td><strong><code>task_id<\u002fcode><\u002fstrong>（<code>t_<\u002fcode> 前缀）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<ul>\n<li><strong>Issue 双状态<\u002fstrong>：<code>stage<\u002fcode>（机器驱动，vod/issue/coding/qa/sre/pending_review/done）由 pipeline 推进；<br />\n<code>status<\u002fcode>（用户可读，active/processing/awaiting_input/pending_review/completed/cancelled）由 <code>stage<\u002fcode> 映射同步，<br />\n  但 <code>awaiting_input / completed / cancelled<\u002fcode> 可由用户操作直接设置（更高优先级）。两者同存 <code>issue<\u002fcode> 表。<\u002fli>\n<li><strong>task complete ≠ Issue 完结<\u002fstrong>：<code>POST /api/tasks/complete<\u002fcode> 完成的是某次引擎执行（对应 Event 的 <code>event_seq<\u002fcode>），<br />\n  不代表需求完结。<strong>Issue #656 起需求完结默认自动化<\u002fstrong>：流水线<strong>末节点完成且无阻断<\u002fstrong>（全部节点最新事件<br />\n  completed、无 failed）时服务端自动结单——<code>stage=done<\u002fcode>、<code>status=completed<\u002fcode>、<code>completed_at<\u002fcode> 落库，并联动<br />\n  关闭 VCS Issue（bot token，降级不阻断）；存在 failed 阻断时回退 <code>pending_review<\u002fcode>。人工确认<br />\n  （<code>confirm-done<\u002fcode> / <code>status<\u002fcode> 操作）仅用于显式待确认场景（见下方 confirm-done 说明）。<\u002fli>\n<li>接口中的 <code>task_status<\u002fcode> 字段即 <code>issue.status<\u002fcode>（需求中心状态）。<\u002fli>\n<\u002ful>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-get-apiissuesmine\">GET /api/issues/mine — 我的需求列表（需求中心·个人维度）<\u002fh2>\n<blockquote>\n<p>CLI：<code>grape issues mine<\u002fcode>（operation_id=<code>issues_mine<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Query<\u002ftd>\n<td><code>status<\u002fcode>（active/processing/awaiting_input/pending_review/completed）、<code>repo_key<\u002fcode>（可选，按仓库过滤）、<code>sort_order<\u002fcode>（可选，desc/asc）、<code>mode<\u002fcode>（可选，default=状态优先/time=纯时间序）、<code>created_by_me<\u002fcode>（可选）、<code>assignees<\u002fcode>（可选，逗号分隔创建人）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{issues: Issue[], sort_order, mode}<\u002fcode>（跨仓库，user_id=当前用户）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；401 未认证；403 session token<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>富化字段：<code>scene_id/scene_name/stage/is_running/agent_statuses<\u002fcode>。若响应含 <code>statuses<\u002fcode>/<code>node_status<\u002fcode> 数值码：0=pending 1=running 2=completed 3=failed 4=cancelled 5=skipped（详见 <code>GET /api/issues/{issue_id}/pipeline<\u002fcode> 说明）。<br />\n个人维度查询依赖调用者身份（<code>user_id<\u002fcode> 过滤）——session token（<code>tk_<\u002fcode>）无个人语义，故禁。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-get-apiissuesownerrepo-issue\">GET /api/issues/{owner}/{repo} — 仓库 Issue 列表（含阶段/状态/富化聚合）<\u002fh2>\n<blockquote>\n<p>CLI：<code>grape issues list<\u002fcode>（operation_id=<code>issues_list<\u002fcode>，仓库参数由 CLI <code>--owner/--repo<\u002fcode> 传入）。<\u002fp>\n<p>归一：仓库「全部」视图的<strong>唯一入口<\u002fstrong>（收编原 <code>/api/issues/repo/{owner}/{repo}<\u002fcode>，见 <code>issues-list-merge-design.md<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>dual<\u002fstrong>（三通道）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{owner}<\u002fcode> / <code>{repo}<\u002fcode> 仓库<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Query<\u002ftd>\n<td><code>status<\u002fcode>（active/processing/awaiting_input/pending_review/completed/cancelled）、<code>sort_order<\u002fcode>（desc/asc）、<code>mode<\u002fcode>（default=状态优先/time=纯时间序）、<code>assignees<\u002fcode>（逗号分隔创建人）、<code>include_deleted<\u002fcode>（可选，默认 false；<code>1<\u002fcode>/<code>true<\u002fcode> 时返回 VCS 侧已删除的台账卡片供审计，见 Issue #995）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{issues: Issue[], total: int}<\u002fcode>（不限 user_id；默认不含 VCS 侧已删除卡片）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；401 未认证<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>仓库列表为公开只读聚合（对齐原 <code>issues_list<\u002fcode> 行为，无仓库权限门禁）。<\u002fp>\n<p><strong>Issue #995：VCS 存在性过滤<\u002fstrong>——服务端按 provider（<code>gitcode:<\u002fcode>/<code>github:<\u002fcode> 分别对齐）批量拉取 VCS issue 编号<br />\n（进程内 TTL 缓存 300s）并回写 <code>issue.vcs_exists<\u002fcode>，默认隐藏 <code>vcs_exists=0<\u002fcode>（VCS 侧 404）的卡片；<br />\n分页模式 <code>total<\u002fcode>/<code>has_more<\u002fcode> 与过滤后集合一致。VCS 校验失败时 fail-open：卡片照常返回并标<br />\n<code>vcs_check=unavailable<\u002fcode>。传 <code>include_deleted=1<\u002fcode> 可返回被隐藏卡片并标 <code>is_vcs_deleted=true<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>Issue 对象字段：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>number<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>VCS Issue 编号（等同 <code>issue_number<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>id<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td><strong>台账卡片 id<\u002fstrong>（<code>issue.id<\u002fcode>，即 <code>/api/issues/{issue_id}/...<\u002fcode> 操作入参），<strong>不是<\u002fstrong> VCS 编号<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_number<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td><strong>VCS 侧 Issue 编号<\u002fstrong>（GitCode/GitHub），与 <code>grape git-repo issues get --number<\u002fcode> 同口径；与 <code>id<\u002fcode> 不可互用<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>vcs_exists<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td>VCS 侧是否仍存在该编号（<code>false<\u002fcode>=已删除）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>is_vcs_deleted<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td><code>= !vcs_exists<\u002fcode>，便于前端/Agent 直接判定<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>vcs_check<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>卡片级校验结果：<code>ok<\u002fcode>=已确认存在/已确认删除；<code>unavailable<\u002fcode>=该校验失败或单卡复核 unknown（fail-open，卡片未隐藏）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>title<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>标题<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>status<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>需求中心状态（active/processing/awaiting_input/pending_review/completed/cancelled）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>stage<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>pipeline 阶段（vod/issue/coding/qa/sre/pending_review/done）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>assignee<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>责任人（GitCode 用户名）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scene_id<\u002fcode> / <code>scene_name<\u002fcode> / <code>scene_source<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>开发场景（vod / repo_default）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>is_running<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td>是否有运行中的 agent<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent_statuses<\u002fcode><\u002ftd>\n<td>array<\u002ftd>\n<td>各 agent 状态摘要<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>is_subtask_mode<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>0/1 多任务模式<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>parent_issue_id<\u002fcode> / <code>parent_issue_number<\u002fcode><\u002ftd>\n<td>string/int<\u002ftd>\n<td>父任务<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>events_count<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>该 Issue 事件数<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>latest_event<\u002fcode><\u002ftd>\n<td>object?<\u002ftd>\n<td>最新事件（seq 升序末条）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>空仓库返回 <code>{\"issues\": [], \"total\": 0}<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-post-apiissuesownerrepo-issue\">POST /api/issues/{owner}/{repo} — 创建 Issue（对外统一创建入口）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\nCLI：<code>grape issues create<\u002fcode>（operation_id=<code>issues_create<\u002fcode>；<strong>并非 <code>/api/issues/create<\u002fcode><\u002fstrong>，见 README「CLI 命令映射」）。<br />\n创建 GitCode Issue + 建档 + 触发 pipeline（创建人 = 调用者本人，故 session token 不适用）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>title<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>任务/Issue 标题<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>description<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>任务描述（将成为 Issue body）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>仓库（缺省按 <code>{owner}/{repo}<\u002fcode> 拼）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>assignee<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>责任人 GitCode 用户名，默认当前用户<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scene_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>关联场景 ID<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>is_subtask_mode<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>0/1 多任务模式<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>出参：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;ok&quot;: true,\n  &quot;issue_id&quot;: 101,\n  &quot;task_id&quot;: 101,\n  &quot;issue_number&quot;: 5,\n  &quot;created&quot;: true,\n  &quot;assignee&quot;: &quot;Jason7602&quot;,\n  &quot;is_subtask_mode&quot;: 0,\n  &quot;message&quot;: &quot;任务已创建（Issue 已同步）&quot;\n}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p><code>issue_id<\u002fcode>（= <code>task_id<\u002fcode> 兼容别名）为<strong>需求卡片 id（issue.id）<\u002fstrong>，非执行实例 id。返回：200 成功；400 仓库/标题/描述缺失；409 同标题 Issue 已存在；502 建 GitCode Issue 失败。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-get-apiissuesownerreponumber-issue\">GET /api/issues/{owner}/{repo}/{number} — 单个 Issue 详情<\u002fh2>\n<blockquote>\n<p>CLI：grape issues detail --owner {owner} --repo {repo} --number {number} --json-out（operation_id=issues_detail）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>dual<\u002fstrong>（三通道）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{owner}<\u002fcode> / <code>{repo}<\u002fcode> / <code>{number}<\u002fcode> 仓库 + Issue 编号<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{...Issue 字段, events: Event[], pipeline: Pipeline, synced_by_fallback?}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200 成功；404 Issue 不存在（含语义区分，见下）；401 未认证<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p><strong>404 语义区分与兜底解析（Issue #667）<\u002fstrong>：内部三表（issue/issue_state/events）未命中时，服务端按<br />\n<code>owner/repo + number<\u002fcode> 调 VCS API 核实 Issue 存在性：存在 → 自动补建内部需求卡行并正常返回<br />\n（出参带 <code>synced_by_fallback: true<\u002fcode>）；404 detail 含 <code>reason<\u002fcode> 字段——<br />\n<code>reason=issue_not_found<\u002fcode>（VCS 侧亦无此 Issue，可能已删除，属预期 404）与<br />\n<code>reason=internal_sync_missing<\u002fcode>（VCS 无法核实且内部缺行，<code>suggestion<\u002fcode> 提示稍后重试/检查 webhook 同步链路）。<br />\nAgent 侧降级指引：命中 <code>issue_not_found<\u002fcode> 不再重试；命中 <code>internal_sync_missing<\u002fcode> 可短暂重试一次，<br />\n持续失败再走人工排查。<\u002fp>\n<p><strong><code>issue_id<\u002fcode> 字段与两套 id 体系（Issue #569）<\u002fstrong>：出参含 <code>issue_id<\u002fcode>（issue 表主键，<strong>平台内部需求卡片 id<\u002fstrong>），<br />\n可直接作 <code>awaiting-input<\u002fcode> / <code>pending-review<\u002fcode> / <code>review-pass<\u002fcode> 等的 <code>--issue_id<\u002fcode>（首选服务端注入的<br />\n<code>$GRAPE_ISSUE_ID<\u002fcode>，与本字段同源）；<code>number<\u002fcode> 是 <strong>GitCode 侧 Issue 编号<\u002fstrong>，与内部卡片 id 不同；<br />\n<code>grape git-repo issues get<\u002fcode> 返回的 <code>id<\u002fcode> 是 <strong>GitCode 侧 id<\u002fstrong>，与平台内部 id <strong>不可混用<\u002fstrong>——<br />\n严禁把 <code>number<\u002fcode> 或 GitCode 侧 <code>id<\u002fcode> 传入 <code>--issue_id<\u002fcode>（否则 404/403）。无 issue 卡片行（过渡期兜底）时<br />\n<code>issue_id<\u002fcode> 为 null，此时用 <code>$GRAPE_ISSUE_ID<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p><code>events<\u002fcode> 结构（seq 升序）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>seq<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td>事件唯一序号<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>event_type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>issue_opened / issue_comment / pull_request_updated / ...<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent_type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>vod / issue / coding / qa / sre<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>title<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>事件标题（缺省取 event_type）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>actor<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>触发人<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>summary<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>摘要<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>status<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>completed / running / failed / skipped<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>created_at<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>事件时间（已格式化）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><code>pipeline<\u002fcode> 结构：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issue<\u002fcode><\u002ftd>\n<td>object<\u002ftd>\n<td>关联 Issue（number）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>summary<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>pipeline 汇总<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>status<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>终态<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>segments<\u002fcode><\u002ftd>\n<td>Segment[]<\u002ftd>\n<td>分段链（seq/agent/event_type/status/runtime/skill/output）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>无 event.json 档案时降级由 <code>events<\u002fcode> 表重构（summary/status 降级）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-get-apiissuesownerreponumberevents-issue\">GET /api/issues/{owner}/{repo}/{number}/events — 该 Issue 的事件列表<\u002fh2>\n<blockquote>\n<p>CLI：grape issues events --owner {owner} --repo {repo} --number {number} --json-out（operation_id=issues_events）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>dual<\u002fstrong>（<code>grape_<\u002fcode>/JWT/<code>tk_<\u002fcode>）；<code>tk_<\u002fcode> 限定其绑定仓库（跨仓库 → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{owner}<\u002fcode> / <code>{repo}<\u002fcode> / <code>{number}<\u002fcode>（<code>5<\u002fcode> 或 <code>#5<\u002fcode> 均可，<code>#<\u002fcode> 需 URL 编码 <code>%23<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{events: Event[], segments: 同 events, total: int}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>segments[].output<\u002ftd>\n<td><code>{actions, conclusion, artifacts, next_step, issue_summary}<\u002fcode>（来自 events.structured_output，无则省略）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>segments[].logs<\u002ftd>\n<td>执行消息列表（来自 events.agent_logs）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200（含空列表 → segments=[]）；403（tk_ 跨仓库）；404 Issue 不存在；401 未认证<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>仅返回该 Issue 的事件，seq 升序；只读聚合，不影响 issue_state/events。该接口是事件数据在<br />\nIssues 主题下的按 Issue 聚合视图（operation_id=<code>issues_events<\u002fcode>，CLI 根组为 <code>issues<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-get-apiissuesownerreponumberpipeline-issue-pipeline\">GET /api/issues/{owner}/{repo}/{number}/pipeline — Issue pipeline 路线图<\u002fh2>\n<blockquote>\n<p>CLI：grape issues pipeline --owner {owner} --repo {repo} --number {number} --json-out（operation_id=issues_pipeline）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>dual<\u002fstrong>（三通道）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{owner}<\u002fcode> / <code>{repo}<\u002fcode> / <code>{number}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{issue: object, summary: string, status: string, segments: Segment[]}<\u002fcode> + Issue #539 可选业务状态字段（见下）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200 成功；404 Issue 不存在；401 未认证<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><code>segments[].output<\u002fcode>：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>conclusion<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>结论<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>next_step<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>下一步<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>actions<\u002fcode><\u002ftd>\n<td>string[]<\u002ftd>\n<td>动作清单<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>artifacts<\u002fcode><\u002ftd>\n<td>string[]<\u002ftd>\n<td>产出/标识<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_summary<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>一句话摘要<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>task_ref<\u002fcode><\u002ftd>\n<td>object<\u002ftd>\n<td>Issue #539 可选：阶段关联 runtime 任务引用 <code>{task_id, task_status, query_path}<\u002fcode>；无关联任务 → <code>{task_id: null, task_status: \"unavailable\", query_path: \"\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>result_ref<\u002fcode><\u002ftd>\n<td>object<\u002ftd>\n<td>Issue #539 可选：阶段结果引用 <code>{status}<\u002fcode>，<code>status<\u002fcode> 枚举：<code>available<\u002fcode>（附脱敏 <code>summary<\u002fcode>）/ <code>pending<\u002fcode>（任务在途）/ <code>unavailable<\u002fcode>（无结果或不可读）。<code>query_path<\u002fcode> 指向 <code>GET /api/runtime/tasks/{task_id}/status<\u002fcode>（授权后可查全量）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>Issue #539 语义澄清与新增顶层字段<\u002fstrong>：顶层 <code>status<\u002fcode> 仅表示<strong>事件执行结束<\u002fstrong>（如 <code>completed<\u002fcode> = 最后一个事件执行完毕），不代表需求已确认或生产发布完成。需求级业务状态由以下可选字段独立暴露：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>issue_stage<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>需求当前阶段（issue.stage，issue_state 兜底）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_task_status<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>需求中心状态（issue.status）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>review_status<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>需求级业务状态枚举：<code>pending_review<\u002fcode>（待人工确认）/ <code>completed<\u002fcode>（含生产发布完成）/ <code>cancelled<\u002fcode> / <code>awaiting_input<\u002fcode> / <code>in_progress<\u002fcode>（流水线执行中，生产尚未开始）/ <code>unknown<\u002fcode>（无法判定，显式标注）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>典型场景：SRE（末节点）执行完成后需求进入 <code>pending_review<\u002fcode> 待人工确认，此时顶层 <code>status=completed<\u002fcode> 仅表示事件执行结束，<code>review_status=pending_review<\u002fcode> 才表示需求仍等待人审/发布（真实样本 #428）。旧字段语义与结构不变，新增字段均为可选，旧客户端无破坏；摘要仅含脱敏 conclusion，不透出受限日志与凭据。<\u002fp>\n<p>优先读 event.json 档案；无档案时降级由 <code>events<\u002fcode> 重构。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"11-issues-issue-issue_id\">Issue 操作（按 <code>{issue_id}<\u002fcode> 定位）<\u002fh2>\n<blockquote>\n<p>CLI：<code>grape issues &lt;动词&gt;<\u002fcode>（<code>grape issues start / status / confirm-done / cancel / resume / clarify ...<\u002fcode>，<br />\n由 operation_id 派生，见 README「CLI 命令映射」）。<br />\n<code>{issue_id}<\u002fcode> = <code>issue.id<\u002fcode>（需求中心列表返回的 <code>id<\u002fcode> 字段）。<br />\nscope：<code>status 读（GET）<\u002fcode> = <strong>dual<\u002fstrong>；<code>start<\u002fcode> / <code>status 写（PUT）<\u002fcode> / <code>attachments 读<\u002fcode> = <strong>user_only<\u002fstrong>；<br />\n<code>confirm-done<\u002fcode> / <code>cancel<\u002fcode> / <code>resume<\u002fcode> / <code>pipeline<\u002fcode> / <code>clarifications<\u002fcode> / <code>clarify<\u002fcode> / <code>attachments 写<\u002fcode> = <strong>user_only<\u002fstrong>（<code>tk_<\u002fcode> → 403）。<br />\n⚠️ 操作/写类端点一律 <strong>user_only<\u002fstrong>：<code>issue.status<\u002fcode> 是需求中心用户可读状态（awaiting_input/completed/cancelled<br />\n可用户直接设置，高优先级），放行 Agent（<code>tk_<\u002fcode>）任意改动会与 pipeline 驱动的 <code>stage<\u002fcode> 脱钩、干扰任务执行。<br />\n通用错误：404 需求不存在 / 403 无权 / 401 未认证。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idstart\">POST /api/issues/{issue_id}/start — 打开会话<\u002fh3>\n<blockquote>\n<p>CLI：grape issues start --issue_id {issue_id} --json-out（operation_id=issues_start）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"status\": \"active\"}<\u002fcode>（仅校验归属并返回当前状态，不翻转状态）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；403 非本人需求；404 需求不存在；401<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>「去对话」入口：跳转 Chat 前调用，确认可访问并取当前状态。纯前端导航预检，Agent 执行期无此场景，故不对外放开 <code>tk_<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-get-apiissuesissue_idstatus\">GET /api/issues/{issue_id}/status — 查询状态（轮询）<\u002fh3>\n<blockquote>\n<p><strong>GET 轮询（issues_status_get）无独立 CLI 子命令<\u002fstrong>：grape issues status 仅暴露 PUT 迁移（issues_status）——轮询用 grape issues detail/grape issues events 的 status 段或前端。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>dual<\u002fstrong>（三通道）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"id\", \"status\", \"repo_key\", \"issue_number\", \"title\", \"completed_reason\", \"completed_at\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；404 需求不存在；401<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>供轮询至终态（completed/cancelled）：调用 <code>grape issues status --issue_id {issue_id}<\u002fcode>（GET 无 body 分支）或 <code>grape issues detail<\u002fcode> 查看。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-put-apiissuesissue_idstatus\">PUT /api/issues/{issue_id}/status — 状态迁移<\u002fh3>\n<blockquote>\n<p>CLI：grape issues status --issue_id {issue_id} --json '{\"status\":\"processing\"}' --json-out（operation_id=issues_status）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"status\": \"processing\"}<\u002fcode>（active/processing/awaiting_input/pending_review/completed/cancelled 按流转规则）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": ..., \"status\": \"processing\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 非法迁移；403 无权；404 需求不存在<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>流转：active→processing→awaiting_input→pending_review→completed/cancelled；终态不可改。<br />\n<strong>写状态仅限用户本人（JWT / <code>grape_<\u002fcode>）<\u002fstrong>：<code>status<\u002fcode> 是可被用户高优先级覆盖的「需求中心状态」，若允许 <code>tk_<\u002fcode><br />\n会话 token（Agent 执行期）修改，可能与 pipeline 推进的 <code>stage<\u002fcode> 冲突，造成状态不一致、干扰任务执行。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idconfirm-done\">POST /api/issues/{issue_id}/confirm-done — 确认完成<\u002fh3>\n<blockquote>\n<p>CLI：grape issues confirm done --issue_id {issue_id} [--json '{\"confirmation\":\"user_confirmed\"}'] --json-out（operation_id=issues_confirm_done）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"confirmation\": \"user_confirmed\"}<\u002fcode>（可选）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": ..., \"status\": \"completed\", \"stage\": \"done\"}<\u002fcode>；终态幂等 <code>already_done: true<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 已取消；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>任意阶段可确认完成（stage→done）；开发者确认需求完结。<\u002fp>\n<p><strong>Issue #656 人工确认触发条件<\u002fstrong>：末节点完成且无阻断的 Issue 已由流水线<strong>自动结单<\u002fstrong>（无需本接口）。<br />\n<code>confirm done<\u002fcode> 仅用于以下显式需人工确认场景：<br />\n1. issue 处于 <code>pending_review<\u002fcode>（Agent 显式审核点 / 末节点 failed 阻断回退 / Issue 关闭待审核）；<br />\n2. 用户侧提前收口仍处 active/processing/awaiting_input 的 Issue（如 PR 已合入、卡流转）。<br />\n幂等：已 completed 再次调用返回 <code>already_done<\u002fcode>，不重复关闭 VCS Issue。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idcancel\">POST /api/issues/{issue_id}/cancel — 取消<\u002fh3>\n<blockquote>\n<p>CLI：grape issues cancel --issue_id {issue_id} --json-out（operation_id=issues_cancel）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": ..., \"status\": \"cancelled\", \"agents_cancelled\": n}<\u002fcode>；终态幂等 <code>already_cancelled: true<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 已完成不可取消；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>取消即终止运行中 agent + 停流水线。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idresume\">POST /api/issues/{issue_id}/resume — 恢复<\u002fh3>\n<blockquote>\n<p>CLI：grape issues resume --issue_id {issue_id} --json-out（operation_id=issues_resume）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": ..., \"status\": \"processing\"}<\u002fcode>（回到取消前 stage 继续流转）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 仅已取消可恢复；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"11-issues-get-apiissuesissue_idpipeline\">GET /api/issues/{issue_id}/pipeline — 流水线路线图<\u002fh3>\n<blockquote>\n<p>CLI：grape issues detail --owner {owner} --repo {repo} --number {number} 更常用；或按 op issues_pipeline_detail（无独立命令，CLI 合并到 detail/pipeline）——查 grape issues -h。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"scene_id\", \"scene_name\", \"current_stage\", \"nodes\", \"events\"}<\u002fcode> + Issue #539 可选：<code>{\"issue_stage\", \"issue_task_status\", \"review_status\", \"sre_result\"}<\u002fcode>（nodes 含 <code>node_status<\u002fcode> 数值码 0-5 + <code>latest_event<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>节点状态由 <code>compute_node_statuses<\u002fcode> 统一计算（与流水线菜单页一致）；<code>node_status<\u002fcode>：0=pending 1=running 2=completed 3=failed 4=cancelled 5=skipped。<br />\nIssue #539：<code>review_status<\u002fcode> 为需求级业务状态（<code>pending_review<\u002fcode>=待人工确认，节点全 ✓ 仅表示事件执行结束）；<code>sre_result<\u002fcode> = <code>{task_ref, result_ref}<\u002fcode>（SRE 最新任务的引用与脱敏结论摘要，<code>result_ref.status<\u002fcode> 枚举 available/pending/unavailable），供详情页区分「阶段执行完成」与「待人工确认」。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-get-apiissuesissue_idclarifications\">GET /api/issues/{issue_id}/clarifications — 澄清历史<\u002fh3>\n<blockquote>\n<p>CLI：grape issues clarifications --issue_id {issue_id} --json-out（operation_id=issues_clarifications）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"messages\": [...], \"conversation_id\": \"...\", \"issue_url\": \"...\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"11-issues-post-apiissuesissue_idclarify\">POST /api/issues/{issue_id}/clarify — 回复澄清<\u002fh3>\n<blockquote>\n<p>CLI：grape issues clarify --issue_id {issue_id} --json '{\"message\":\"...\"}' --json-out（operation_id=issues_clarify）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"message\": \"...\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"message\": \"澄清已发送到 Issue 并同步到任务会话\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 message 空；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>同步发 GitCode Issue 评论（<code>💬 开发者澄清<\u002fcode> 前缀）+ 写入任务会话；awaiting_input 自动恢复 processing。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idawaiting-input-agent\">POST /api/issues/{issue_id}/awaiting-input — Agent 声明需求待澄清（澄清三件套·发起）<\u002fh3>\n<blockquote>\n<p>原 <code>/api/tasks/awaiting-input<\u002fcode> 迁移而来（<code>issue-explicit-awaiting-input-api-design.md<\u002fcode>）：awaiting-input 只修改<br />\n<strong>issue 状态<\u002fstrong>、与任务生命周期正交（单信号），故归属 issues，与 <code>clarifications<\u002fcode>（历史）、<code>clarify<\u002fcode>（用户回复）同组。<br />\nCLI：<code>grape issues awaiting-input --issue_id {issue_id} --json '{\"questions\":\"...\"}' --json-out<\u002fcode>（operation_id=<code>issues_awaiting-input<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode>；<code>grape_<\u002fcode>/JWT/<code>BOT_GITCODE_TOKEN<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int（需求卡片 id）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"questions\": \"...\", \"reason\": \"...\", \"issue_number\": 0?}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": 210, \"status\": \"awaiting_input\", \"changed\": true}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 questions 缺失；403 非会话 token / 仓库作用域不匹配 / 非 vod·issue agent；404 需求不存在（含语义区分，见下）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p><strong>卡片缺行兜底（Issue #667）<\u002fstrong>：<code>{issue_id}<\u002fcode> 无对应卡片行时，可在 Body 附 <code>issue_number<\u002fcode><br />\n（GitCode 侧编号，须落在会话 token 的仓库作用域内）——服务端按该编号复用既有卡行；<br />\n无卡行则经 VCS 核实存在后自动补建（<code>ensure_issue_task<\u002fcode>）再执行状态迁移。404 detail 的 <code>reason<\u002fcode>：<br />\n<code>issue_not_found<\u002fcode>（VCS 侧无此 Issue）/ <code>internal_card_missing<\u002fcode>（卡片 id 与 issue_number 兜底均未命中，<br />\n<code>hint<\u002fcode> 给出 <code>grape issues detail<\u002fcode> 解析指引）。<code>GRAPE_ISSUE_ID<\u002fcode> 注入侧同步修复：事件链路注入时发现<br />\n卡片行缺失会先补建再注入，消除「同步时序未到 → 空 id」缺口。<\u002fp>\n<p>鉴权：会话 token 的 <code>(repo_key, agent_type)<\u002fcode> 作用域——须与需求的 repo_key 一致且 <code>agent_type∈{vod,issue}<\u002fcode><br />\n（与 <code>tasks notify<\u002fcode> 同源信任模型）。效果：<code>active/processing → awaiting_input<\u002fcode> 原子迁移（<code>changed<\u002fcode> 可观测）、<br />\n写入澄清问题到会话（<code>clarifications<\u002fcode> 可直接看到）、向本人飞书 bot 发静态卡片（无配置则跳过）；<br />\n与 <code>clarify<\u002fcode> 回复闭环（awaiting_input → processing）。不终态化、不钉住任务（C 单信号）。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idpending-review-agent\">POST /api/issues/{issue_id}/pending-review — Agent 提交阶段审核点（等用户双态·待审核）<\u002fh3>\n<blockquote>\n<p>与 <code>awaiting-input<\u002fcode> 对称：<code>awaiting_input<\u002fcode>=「我要你的输入/澄清」，<code>pending_review<\u002fcode>=「我交付这个决策点，请你审核/拍板」。<br />\n<strong>任意 devops agent<\u002fstrong>（vod/issue/coding/qa/sre）可在<strong>任意阶段<\u002fstrong>显式将 issue 置为待审核，不改 stage。<br />\nCLI：<code>grape issues pending-review --issue_id {issue_id} --json '{\"review_points\":\"...\",\"references\":\"...\"}' --json-out<\u002fcode>（operation_id=<code>issues_pending-review<\u002fcode>）。<\u002fp>\n<p><strong><code>--issue_id<\u002fcode> 只能传纯数字内部 id（Issue #2695，#2695 移植）<\u002fstrong>：取值来自 <code>grape issues detail --json-out<\u002fcode> 返回体的<br />\n<code>issue_id<\u002fcode> 字段（首选服务端注入的 <code>$GRAPE_ISSUE_ID<\u002fcode>，同源）——它是平台内部需求卡片 id，<br />\n<strong>不是 GitCode issue number<\u002fstrong>（<code>number<\u002fcode>）也不是 GitCode 侧 <code>id<\u002fcode>。传空/非数字时服务端在路由入口前置返回<br />\n<strong>400 <code>{\"detail\":{\"code\":400,\"message\":\"invalid issue_id\"}}<\u002fcode><\u002fstrong>（平台统一信封，见本文件「错误返回」与 <code>README.md<\u002fcode><br />\n「错误响应统一格式」）；空 id 拼出的 <code>/api/issues//pending-review<\u002fcode> 同口径，不再落 method-mismatch 兜底 405<br />\n（历史症状：<code>HTTP 405: request failed<\u002fcode> 且无 detail，调用方无法自诊断）。<br />\n<strong>仅 POST<\u002fstrong>：上面的收敛只作用于本端点（<code>POST<\u002fcode>）；<code>GET/PUT/DELETE<\u002fcode> 对空路径段的行为保持不变，<br />\n不会返回 <code>invalid issue_id<\u002fcode>。<br />\n新版 grape CLI 对非数字 <code>--issue_id<\u002fcode> 已在本地拦截（grape-cli #1634，随 grape-cli 发版生效）；<br />\nworker 启动会核对 CLI 版本，版本线陈旧时提示升级（不阻断启动）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>session_only<\u002fstrong>（仅 <code>tk_<\u002fcode>；<code>grape_<\u002fcode>/JWT → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"review_points\": \"...\", \"references\": \"...(可选，如 PR#/设计文档)\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": 217, \"status\": \"pending_review\", \"changed\": true, \"idempotent\": false}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200（重复调用幂等，见下）；400 review_points 缺失；403 非会话 / 仓库作用域不匹配 / 非 devops agent；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>鉴权：<code>agent_type∈{vod,issue,coding,qa,sre}<\u002fcode> 且 <code>issue.repo_key == token.repo_key<\u002fcode>。效果：<br />\n<code>active/processing/awaiting_input → pending_review<\u002fcode> 原子迁移（<code>changed<\u002fcode> 可观测）、审核点写入任务会话、<br />\n向本人飞书 bot 发静态卡片「需要你审核确认」（缺配置则跳过）、不改 stage、不终态化（与任务生命周期正交）。<br />\n用户评论（非 bot）会自动恢复为 processing。<\u002fp>\n<p><strong>重复调用幂等（Issue #725）<\u002fstrong>：Issue 已处于 <code>pending_review<\u002fcode> 时再次调用 → <strong>200 幂等短路<\u002fstrong>，<br />\n出参 <code>{\"ok\": true, \"status\": \"pending_review\", \"changed\": false, \"idempotent\": true}<\u002fcode>；<br />\n不重复写会话审核点、不重复发通知。<code>completed/cancelled<\u002fcode> 终态重复调用同样 200 + <code>idempotent: true<\u002fcode>。<br />\nCLI/Agent 重复调用处理指引：收到 <code>idempotent: true<\u002fcode> 视为提交已被接受（此前审核点已生效），<br />\n无需重试、无需换 <code>issue_id<\u002fcode> 兜底；切勿将其当作失败走 405/重试路径。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idreview-pass-agent\">POST /api/issues/{issue_id}/review-pass — Agent 判定审核通过<\u002fh3>\n<blockquote>\n<p>CLI：<code>grape issues review-pass --issue_id {issue_id} --json '{\"target\":\"processing|done\",\"evidence\":\"...\"}' --json-out<\u002fcode>（operation_id=<code>issues_review-pass<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope<\u002ftd>\n<td><strong>session_only<\u002fstrong>（<code>tk_<\u002fcode>；devops agent）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"target\":\"processing\"\\|\"done\", \"evidence\":\"用户确认引用\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": 217, \"status\": \"completed\"\\|\"processing\", \"result\": \"passed_done\"\\|\"passed_processing\"\\|\"noop\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；403 鉴权；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>仅 <code>pending_review<\u002fcode> 可退出；<code>target=processing<\u002fcode> → 继续流水线；<code>target=done<\u002fcode> → <code>completed<\u002fcode> + <code>stage=done<\u002fcode>（合入/收尾）。幂等。<br />\n归一兜底：<code>target=processing<\u002fcode> 但当前 <code>stage<\u002fcode> 已是流水线末节点（<code>next=done<\u002fcode>）时，无下游可续 → 自动按 <code>done<\u002fcode> 处理（<code>completed<\u002fcode> + <code>stage=done<\u002fcode>）。<code>target=done<\u002fcode> 在<strong>末节点<\u002fstrong>且 <code>status<\u002fcode> 为 <code>active/processing/awaiting_input<\u002fcode>（CLI 流水线可能从未进入待审核）时同样放行 <code>completed<\u002fcode>+<code>stage=done<\u002fcode>；非末节点仍仅 <code>pending_review<\u002fcode> 可退出。<code>review-reject<\u002fcode> 的 <code>processing<\u002fcode>（打回继续改）不归一。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idreview-reject-agent\">POST /api/issues/{issue_id}/review-reject — Agent 判定审核未通过<\u002fh3>\n<blockquote>\n<p>CLI：<code>grape issues review-reject --issue_id {issue_id} --json '{\"target\":\"processing|awaiting_input\",\"reason\":\"...\"}' --json-out<\u002fcode>（operation_id=<code>issues_review-reject<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope<\u002ftd>\n<td><strong>session_only<\u002fstrong>（<code>tk_<\u002fcode>；devops agent）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>{\"target\":\"processing\"\\|\"awaiting_input\", \"reason\":\"打回原因\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"issue_id\": 217, \"status\": \"processing\"\\|\"awaiting_input\", \"result\": \"rejected_processing\"\\|\"rejected_awaiting_input\"\\|\"noop\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；403 鉴权；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>仅 <code>pending_review<\u002fcode> 可退出；默认 <code>processing<\u002fcode>（打回继续改）；<code>awaiting_input<\u002fcode>（转澄清）。幂等。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"11-issues-post-apiissuesissue_idattachments\">POST /api/issues/{issue_id}/attachments — 上传附件<\u002fh3>\n<blockquote>\n<p>CLI：grape issues upload attachment --issue_id {issue_id} --file {path} --json-out（operation_id=issues_upload_attachment）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Body<\u002ftd>\n<td><code>multipart/form-data<\u002fcode>，字段 <code>file<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"url\": \"...\", \"filename\": \"...\", \"size\": N}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 类型/大小超限；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3 id=\"11-issues-get-apiissuesissue_idattachments\">GET /api/issues/{issue_id}/attachments — 列出附件<\u002fh3>\n<blockquote>\n<p>CLI：grape issues delete attachment 同组；列出附件无独立命令（API/前端使用），或经 detail 富化字段。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>dual<\u002fstrong>（三通道）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"attachments\": [{\"filename\", \"url\", \"size\", ...}]}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；403；404<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h3
