<script type="application/json" id="help-data">{"usage": [{"id": "overview", "title": "1. Grape 使用指导文档", "html": "<h1 id=\"overview-1-grape\">1. Grape 使用指导文档<\u002fh1>\n<p>Grape 是一个多 Agent 协作的 DevOps 平台，通过 VOD/Issue/Coding/QA/SRE 五类 Agent 覆盖从需求分析到部署运维的全生命周期。平台对接 GitCode 代码托管，通过 Webhook 自动触发流水线，由 AI Agent 自主完成任务并提交 PR。<\u002fp>\n<blockquote class=\"card tip\">\n<p>💡 <strong>核心概念<\u002fstrong><\u002fp>\n<ul>\n<li><strong>仓库（Repo）<\u002fstrong>：GitCode 上的代码仓库，是所有任务的工作空间<\u002fli>\n<li><strong>Agent<\u002fstrong>：AI 驱动的自主代理，按职责分为 VOD/Issue/Coding/QA/SRE 五类<\u002fli>\n<li><strong>技能（Skill）<\u002fstrong>：Agent 的能力包，定义了执行特定任务的指令和工具<\u002fli>\n<li><strong>运行时（Runtime）<\u002fstrong>：执行 Agent 的引擎实例（opencode/hermes/codearts），部署在 Worker 机器上<\u002fli>\n<li><strong>流水线（Pipeline）<\u002fstrong>：Issue 从创建到关闭的全流程，Agent 按 VOD→Issue→Coding→QA→SRE 链路协作<\u002fli>\n<\u002ful>\n<p>📖 <strong>部署参考<\u002fstrong>：服务端支持的环境变量见 <a href=\"#/usage/server-environment-variables\">server-environment-variables.md<\u002fa>；Agent 执行环境变量见 <a href=\"#/usage/agent-environment-variables\">agent-environment-variables.md<\u002fa>。<\u002fp>\n<p>🧩 <strong>把 grape 装进你自己的 Agent<\u002fstrong>：grape 插件（grape-kit / grape-dsh）安装指南见 <a href=\"#/usage/grape-kit\">grape-kit.md<\u002fa>。<\u002fp>\n<\u002fblockquote>", "toc": [], "no": "", "is_overview": false}, {"id": "quickstart", "title": "2. 快速上手", "html": "<h1 id=\"quickstart-2\">2. 快速上手<\u002fh1>\n<h2 id=\"quickstart-_1\">登录与仓库选择<\u002fh2>\n<ol>\n<li>使用 GitCode 账号登录（OAuth 自动授权）<\u002fli>\n<li>登录后在左侧选择已授权的仓库<\u002fli>\n<li>选择仓库后进入工作台，顶部显示仓库名<\u002fli>\n<\u002fol>\n<h2 id=\"quickstart-issue\">创建第一个 Issue<\u002fh2>\n<ol>\n<li>在 GitCode 仓库中创建一个 Issue（如\"开发一个 Hello World 页面\"）<\u002fli>\n<li>Grape 通过 Webhook 自动接收 Issue 事件并启动流水线<\u002fli>\n<li>在 Grape 控制台的 <strong>流水线<\u002fstrong> 页面可以看到 Issue 的处理进度<\u002fli>\n<li>VOD Agent 首先分析需求，然后 Issue Agent 细化任务，Coding Agent 编写代码并提交 PR<\u002fli>\n<\u002fol>\n<blockquote class=\"card tip\">\n<p>💡 <strong>提示<\u002fstrong><\u002fp>\n<p>也可以在 Grape 控制台的 <strong>VOD Agent<\u002fstrong> 页面直接输入需求，手动触发处理流程。VOD Agent 会分析需求并自动路由到合适的下游 Agent。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"quickstart-_2\">查看任务进度<\u002fh2>\n<ul>\n<li><strong>任务中心<\u002fstrong>：查看所有任务的执行状态（排队/运行中/已完成/失败）<\u002fli>\n<li><strong>流水线<\u002fstrong>：按 Issue 查看全链路进度，包含每个 Agent 的执行状态和结果<\u002fli>\n<li><strong>系统监控<\u002fstrong>：查看 Worker 负载、引擎健康状态、探活延迟<\u002fli>\n<li>点击任意任务可查看详细执行日志（Agent 每一步的思考过程和工具调用）<\u002fli>\n<\u002ful>\n<h2 id=\"quickstart-pr\">评审与合并 PR<\u002fh2>\n<p>Coding Agent 完成代码编写后会自动在 GitCode 创建 PR。你可以：<\u002fp>\n<ol>\n<li>在 GitCode 上查看 PR 的代码变更<\u002fli>\n<li>QA Agent 会自动审查 PR 并给出评审意见<\u002fli>\n<li>确认无误后在 GitCode 合并 PR<\u002fli>\n<li>Grape 会感知 PR 合并事件并更新 Issue 状态<\u002fli>\n<\u002fol>", "toc": [{"level": 2, "id": "quickstart-_1", "name": "登录与仓库选择"}, {"level": 2, "id": "quickstart-issue", "name": "创建第一个 Issue"}, {"level": 2, "id": "quickstart-_2", "name": "查看任务进度"}, {"level": 2, "id": "quickstart-pr", "name": "评审与合并 PR"}], "no": "", "is_overview": false}, {"id": "cli", "title": "3. CLI 命令行（grape）", "html": "<h1 id=\"cli-3-cli-grape\">3. CLI 命令行（grape）<\u002fh1>\n<blockquote>\n<p>Grape 官方 CLI 读取服务端 OpenAPI 契约，自动生成 <code>grape &lt;group&gt; &lt;verb&gt;<\u002fcode> 命令；<br />\n同时在本地跑原生 <code>git<\u002fcode> 并把凭据注入子进程 —— 平台凭据不进命令行、不写 <code>.git/config<\u002fcode>。<br />\n它主要面向 <strong>Agent<\u002fstrong> 设计，也适合人和脚本调用：输出可机器解析，退出码可判定。<\u002fp>\n<\u002fblockquote>\n<p>当前版本 <strong>0.3.4<\u002fstrong>（PyPI <code>grape-cli<\u002fcode>，要求 Python &gt;= 3.10，distribution 名是 <code>grape-cli<\u002fcode>，<br />\n命令始终是 <code>grape<\u002fcode>）。<\u002fp>\n<h2 id=\"cli-_1\">安装<\u002fh2>\n<pre><code class=\"language-bash\">pip install grape-cli          # 推荐：PyPI\ngrape --version                # 验证安装\npip install -U grape-cli       # 升级\n<\u002fcode><\u002fpre>\n<p>源码或内网环境可以用 git 直装：<\u002fp>\n<pre><code class=\"language-bash\">pip install &quot;git+https://gitcode.com/grape-dev/grape-cli.git@main&quot;\n<\u002fcode><\u002fpre>\n<p>开发调试用 editable 安装：<\u002fp>\n<pre><code class=\"language-bash\">git clone https://gitcode.com/grape-dev/grape-cli.git\ncd grape-cli &amp;&amp; pip install -e .\n<\u002fcode><\u002fpre>\n<blockquote class=\"card tip\">\n<p>💡 <strong>提示<\u002fstrong><\u002fp>\n<p>命令结束后若发现新版本，<code>grape<\u002fcode> 会向 stderr 打一行升级提示。检查在后台线程进行<br />\n（连接 0.5s / 总 1.5s 超时），结果缓存 24 小时于 <code>~/.grape/version-check.json<\u002fcode>；<br />\n非 TTY 与 <code>CI=1<\u002fcode> 场景自动关闭。可用 <code>--no-version-check<\u002fcode> 或 <code>GRAPE_NO_VERSION_CHECK=1<\u002fcode> 显式关闭。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"cli-_2\">连接服务端<\u002fh2>\n<p>所有请求都要知道<strong>服务端地址<\u002fstrong>和<strong>token<\u002fstrong>。优先级从高到低：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>来源<\u002fth>\n<th>示例<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>一次性参数<\u002ftd>\n<td><code>grape --base-url https://grape.example.com tasks current<\u002fcode><\u002ftd>\n<td>仅本次进程生效，不落盘；<code>--token<\u002fcode> 同理，但会留痕于 shell history 与进程列表<\u002ftd>\n<\u002ftr>\n<tr>\n<td>环境变量<\u002ftd>\n<td><code>export GRAPE_BASE_URL=...<\u002fcode>（回退 <code>GRAPE_SERVER_URL<\u002fcode>）、<code>export GRAPE_SESSION_TOKEN=tk_xxx<\u002fcode>、<code>export GRAPE_API_TOKEN=grape_xxx<\u002fcode><\u002ftd>\n<td>推荐给 Agent 与 CI 用<\u002ftd>\n<\u002ftr>\n<tr>\n<td>配置文件<\u002ftd>\n<td><code>~/.grape/config.json<\u002fcode>：<code>{\"base_url\": \"...\", \"token\": \"\"}<\u002fcode><\u002ftd>\n<td>持久默认值<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<ul>\n<li><code>tk_<\u002fcode> 是会话 token（任务/会话结束时自动失效）；<code>grape_<\u002fcode> 是长期用户 key（可在 Web UI 生成、可吊销）。<\u002fli>\n<li>地址优先级：<code>--base-url<\u002fcode> &gt; <code>GRAPE_BASE_URL<\u002fcode>（回退 <code>GRAPE_SERVER_URL<\u002fcode>）&gt; <code>~/.grape/config.json<\u002fcode> &gt; 默认。<br />\n  Agent 运行时注入的通常只有 <code>GRAPE_SERVER_URL<\u002fcode>，排障时别漏这一级。<\u002fli>\n<li>不带任何配置时，<code>base_url<\u002fcode> 默认 <code>http://localhost:8000<\u002fcode>（自托管本机场景）。<\u002fli>\n<li>自签证书或代理环境可加 <code>--no-proxy<\u002fcode>（等价 <code>GRAPE_TRUST_ENV=0<\u002fcode>）忽略 <code>*_proxy<\u002fcode> / <code>NO_PROXY<\u002fcode>。<\u002fli>\n<\u002ful>\n<pre><code class=\"language-bash\"># 一次性调用：只临时覆盖地址，token 走环境变量（避免写进 shell history）\nexport GRAPE_SESSION_TOKEN=tk_xxx\ngrape --base-url https://grape.example.com skills list --json-out\n\n# 配好环境变量后，命令就是 grape &lt;group&gt; &lt;verb&gt;\nexport GRAPE_BASE_URL=https://grape.example.com\nexport GRAPE_SESSION_TOKEN=tk_xxx\ngrape doctor                    # 自检：token 通道、base_url、契约缓存\ngrape commands                  # 列出当前服务端契约对应的全部命令\n<\u002fcode><\u002fpre>\n<h2 id=\"cli-_3\">三条命令上手<\u002fh2>\n<pre><code class=\"language-bash\"># 1. 看看平台上有哪些技能\ngrape skills list --json-out\n\n# 2. 取当前 Agent 任务（在 Agent 运行时里最常用）\ngrape tasks current --json-out\n\n# 3. 用平台凭据跑原生 git（凭据由 GIT_CONFIG 注入子进程）\ngrape git status\ngrape git log --oneline -5\n<\u002fcode><\u002fpre>\n<p><code>--json-out<\u002fcode> 输出单行 JSON，直接喂给脚本或 Agent；不加时是人类可读的多行文本。<\u002fp>\n<h2 id=\"cli-_4\">命令组一览<\u002fh2>\n<p>命令集合由<strong>所连服务端的契约<\u002fstrong>决定，因此不同部署可能略有差异。<code>grape commands<\u002fcode> 列出全部<br />\n（当前 0.3.4 对默认契约是 <strong>26 个组、311 条命令<\u002fstrong>），<code>grape &lt;group&gt; --help<\u002fcode> 看组内动词；<br />\n被 <code>GRAPE_CLI_MODE<\u002fcode> 作用域隐藏的命令用 <code>grape commands --all<\u002fcode> 查看（带 <code>[scope]<\u002fcode> 标注，只列不执行）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>组<\u002fth>\n<th>条数<\u002fth>\n<th>用途<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>settings<\u002fcode><\u002ftd>\n<td>38<\u002ftd>\n<td>平台与 Agent 设置、凭据、引擎、事件配置<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scenes<\u002fcode><\u002ftd>\n<td>31<\u002ftd>\n<td>场景模板与套用（含 advanced）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>git-repo<\u002fcode><\u002ftd>\n<td>30<\u002ftd>\n<td>平台侧仓库 API：分支、提交、文件、Issue/PR、标签、里程碑<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issues<\u002fcode><\u002ftd>\n<td>27<\u002ftd>\n<td>Issue 卡片、状态流转、待输入/待评审<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>obs<\u002fcode><\u002ftd>\n<td>22<\u002ftd>\n<td>可观测性：告警、日志源、探活<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>runtime<\u002fcode><\u002ftd>\n<td>21<\u002ftd>\n<td>Worker runtime：机器、引擎、凭据、批量操作<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repos<\u002fcode><\u002ftd>\n<td>19<\u002ftd>\n<td>仓库注册、检查、机器人配置<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>chat<\u002fcode><\u002ftd>\n<td>17<\u002ftd>\n<td>对话、会话、消息、微信登录<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>skills<\u002fcode><\u002ftd>\n<td>16<\u002ftd>\n<td>技能上传、分类、转换、Agent 绑定<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>events<\u002fcode><\u002ftd>\n<td>14<\u002ftd>\n<td>事件列表、详情、重派、终止、thread<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>dashboard<\u002fcode><\u002ftd>\n<td>12<\u002ftd>\n<td>效率看板、Ops 总览、仓库看板<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>orgs<\u002fcode><\u002ftd>\n<td>11<\u002ftd>\n<td>组织创建、成员、详情<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>knowledge<\u002fcode><\u002ftd>\n<td>11<\u002ftd>\n<td>知识库条目增删查<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>devstage<\u002fcode><\u002ftd>\n<td>8<\u002ftd>\n<td>开发阶段环境与规格<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feedback<\u002fcode><\u002ftd>\n<td>5<\u002ftd>\n<td>反馈提交、上传、上下文<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>grape<\u002fcode><\u002ftd>\n<td>5<\u002ftd>\n<td>CLI 自身管理（auth 等）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>project<\u002fcode><\u002ftd>\n<td>4<\u002ftd>\n<td>项目模板<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>tasks<\u002fcode> / <code>task<\u002fcode><\u002ftd>\n<td>3 / 3<\u002ftd>\n<td>任务自报完成、详情、通知、<code>wait<\u002fcode> 轮询、日志<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>feishu<\u002fcode><\u002ftd>\n<td>3<\u002ftd>\n<td>飞书 onboard<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agents<\u002fcode><\u002ftd>\n<td>3<\u002ftd>\n<td>Agent 配置、会话清理<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>pipeline<\u002fcode><\u002ftd>\n<td>2<\u002ftd>\n<td>流水线路线图与交接<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>auth<\u002fcode><\u002ftd>\n<td>2<\u002ftd>\n<td>登录态、<code>profile<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>a2a<\u002fcode><\u002ftd>\n<td>2<\u002ftd>\n<td>Agent 间交接（handoff / status）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>search<\u002fcode> / <code>patrol<\u002fcode><\u002ftd>\n<td>1 / 1<\u002ftd>\n<td>全局搜索 / 巡检扫描<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>git<\u002fcode><\u002ftd>\n<td>透传<\u002ftd>\n<td>原生 git（任意子命令）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>commands<\u002fcode> / <code>doctor<\u002fcode> / <code>refresh<\u002fcode><\u002ftd>\n<td>内置<\u002ftd>\n<td>列命令 / 自检 / 重拉契约<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"cli-_5\">契约驱动：接口一变，命令就到位<\u002fh2>\n<pre><code class=\"language-bash\"># 服务端新增/修改接口后，重拉契约并刷新缓存\ngrape refresh\n\n# 新命令随即出现，不需要升级 CLI\ngrape commands | grep &lt;新关键词&gt;\ngrape &lt;group&gt; &lt;verb&gt; --help\n<\u002fcode><\u002fpre>\n<p>命令形态由 OpenAPI 的 <code>operationId<\u002fcode> 推导：<code>tasks_current<\u002fcode> → <code>grape tasks current<\u002fcode>；<br />\nquery/path 参数变成 <code>--&lt;name&gt;<\u002fcode>，<code>requestBody<\u002fcode> 变成 <code>--json '&lt;JSON&gt;'<\u002fcode>。<br />\n这也是为什么 CLI 能覆盖平台的全部 API，而不需要为每个接口手写客户端。<\u002fp>\n<h2 id=\"cli-agent\">给 Agent 用<\u002fh2>\n<ul>\n<li><strong>机器可读<\u002fstrong>：<code>--json-out<\u002fcode> 单行 JSON；失败时退出码非 0，不用解析报错文本。<\u002fli>\n<li><strong>轮询任务<\u002fstrong>：<code>grape tasks wait --task-id 56 --timeout 120 --interval 3<\u002fcode>，直到<br />\n<code>completed<\u002fcode> / <code>failed<\u002fcode> / <code>cancelled<\u002fcode> 才返回。<\u002fli>\n<li><strong>按 token 作用域裁剪命令<\u002fstrong>：<code>GRAPE_CLI_MODE=WORKER<\u002fcode> 只暴露会话 token 能打的命令<br />\n  （<code>USER<\u002fcode> / <code>ALL<\u002fcode> 可选）；持 <code>tk_<\u002fcode> 的 Agent 不会看到会 403 的用户级命令。<\u002fli>\n<li><strong>凭据零暴露<\u002fstrong>：<code>grape git<\u002fcode> 用进程内 <code>GIT_CONFIG<\u002fcode> 注入，token 不出现在命令行、<br />\n  不写进 <code>.git/config<\u002fcode>、不进日志。<\u002fli>\n<li>平台侧还有配套技能 <code>grape-cli-guidance<\u002fcode> 与 <code>issue-cli<\u002fcode>，装进 Agent 技能库后可直接调用。<\u002fli>\n<\u002ful>\n<h2 id=\"cli-_6\">退出码与安全约定<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>退出码<\u002fth>\n<th>含义<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>0<\u002fcode><\u002ftd>\n<td>成功<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>1<\u002fcode><\u002ftd>\n<td>通用/配置错误（地址、token、网络）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>2<\u002fcode><\u002ftd>\n<td>用法错误（参数缺漏、未知子命令）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>&gt;=400<\u002fcode><\u002ftd>\n<td>HTTP 状态透传（如 <code>401<\u002fcode> token 失效、<code>403<\u002fcode> 越权）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>130<\u002fcode><\u002ftd>\n<td>Ctrl+C 中断<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<ul>\n<li>CLI <strong>不提供<\u002fstrong> create/revoke token 的子命令（防止自举越权）；用户级 key 在 Web UI 生成。<\u002fli>\n<li>token 不出现在输出与错误信息里；<code>grape git<\u002fcode> 注入的 git 凭据同样不外泄、不落盘。<\u002fli>\n<li>换券失败时 <code>grape git<\u002fcode> 降级为本机原生 git，并给出告警。<\u002fli>\n<li><code>--token<\u002fcode> 一次性参数会留在 shell history 与进程列表（<code>ps<\u002fcode>）中，仅限临时调试；自动化场景改用环境变量或 <code>~/.grape/config.json<\u002fcode>。<\u002fli>\n<\u002ful>\n<h2 id=\"cli-_7\">常见问题<\u002fh2>\n<p><strong><code>401<\u002fcode> / token 失效<\u002fstrong><br />\n<code>tk_<\u002fcode> 会话 token 随任务结束失效。重新取会话 token，或改用 <code>grape_<\u002fcode> 用户 key。<\u002fp>\n<p><strong>连不上、超时<\u002fstrong><br />\n先 <code>grape doctor<\u002fcode> 看 base_url 与 token 通道；代理干扰时加 <code>--no-proxy<\u002fcode>；<br />\n自签证书环境确认服务端地址用的是实际可达的 scheme + host。<\u002fp>\n<p><strong>命令列表和文档对不上<\u002fstrong><br />\n先 <code>grape refresh<\u002fcode>；仍不一致说明服务端契约版本不同 —— <code>grape commands<\u002fcode> 才是当前部署的权威清单。<\u002fp>\n<p><strong>想限定在某次调用上<\u002fstrong><br />\n一次性参数优先于环境变量与配置文件，适合在脚本里临时覆盖：<\u002fp>\n<pre><code class=\"language-bash\">grape --base-url https://other.example.com --timeout 300 tasks current --json-out\n<\u002fcode><\u002fpre>", "toc": [{"level": 2, "id": "cli-_1", "name": "安装"}, {"level": 2, "id": "cli-_2", "name": "连接服务端"}, {"level": 2, "id": "cli-_3", "name": "三条命令上手"}, {"level": 2, "id": "cli-_4", "name": "命令组一览"}, {"level": 2, "id": "cli-_5", "name": "契约驱动：接口一变，命令就到位"}, {"level": 2, "id": "cli-agent", "name": "给 Agent 用"}, {"level": 2, "id": "cli-_6", "name": "退出码与安全约定"}, {"level": 2, "id": "cli-_7", "name": "常见问题"}], "no": "", "is_overview": false}, {"id": "agents", "title": "4. DevOps Agent 详解", "html": "<h1 id=\"agents-4-devops-agent\">4. DevOps Agent 详解<\u002fh1>\n<h2 id=\"agents-vod-agent\">VOD Agent — 需求分析<\u002fh2>\n<blockquote>\n<p><strong>职责<\u002fstrong>：接收用户需求（Issue 评论或直接输入），分析需求类型，路由到合适的下游 Agent。<\u002fp>\n<p><strong>触发方式<\u002fstrong>：GitCode Issue 创建/评论事件，或控制台手动输入<\u002fp>\n<p><strong>典型场景<\u002fstrong>：<br />\n- 用户创建 Issue \"优化前端UI样式\" → VOD 分析为开发类需求 → 路由到 Issue Agent<br />\n- 用户创建 Issue \"销毁云资源\" → VOD 分析为运维类需求 → 路由到 SRE Agent<br />\n- 用户在评论区补充需求 → VOD 重新分析并路由<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agents-issue-agent\">Issue Agent — 任务拆解<\u002fh2>\n<blockquote>\n<p><strong>职责<\u002fstrong>：将 VOD 分析后的需求细化为可执行的 Spec 文档，打标签、分配负责人，交办给 Coding/QA/SRE Agent。<\u002fp>\n<p><strong>输出<\u002fstrong>：Issue 评论中的 Spec 文档（含技术方案、文件清单、验收标准）<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agents-coding-agent\">Coding Agent — 代码实现<\u002fh2>\n<blockquote>\n<p><strong>职责<\u002fstrong>：根据 Spec 文档编写代码，本地构建验证，自审查后提交 PR。<\u002fp>\n<p><strong>引擎<\u002fstrong>：opencode 或 hermes（在 Worker 上执行）<\u002fp>\n<p><strong>工作目录<\u002fstrong>：<code>/opt/grape-workspaces/&lt;owner&gt;/&lt;repo&gt;/issues/&lt;n&gt;/coding<\u002fcode><\u002fp>\n<p><strong>典型流程<\u002fstrong>：克隆仓库 → 阅读项目知识基线 → 按需求编码 → 构建+测试 → 代码自审查 → 推送分支 → 创建 PR<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agents-qa-agent\">QA Agent — 质量审查<\u002fh2>\n<blockquote>\n<p><strong>职责<\u002fstrong>：审查 Coding Agent 提交的 PR，检查代码质量、安全性、测试覆盖，给出 Approve/Request Changes 意见。<\u002fp>\n<p><strong>触发<\u002fstrong>：PR 创建事件自动触发，或 Coding Agent 完成后 A2A 交办<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agents-sre-agent\">SRE Agent — 运维部署<\u002fh2>\n<blockquote>\n<p><strong>职责<\u002fstrong>：云资源管理（创建/查询/销毁）、CI/CD 配置、部署执行、故障排查。<\u002fp>\n<p><strong>能力<\u002fstrong>：华为云 ECS/VPC/EIP/安全组/RDS/OBS 管理，Terraform IaC，部署脚本执行<\u002fp>\n<p><strong>安全机制<\u002fstrong>：销毁类操作需用户在 Issue 评论区确认后才执行<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "agents-vod-agent", "name": "VOD Agent — 需求分析"}, {"level": 2, "id": "agents-issue-agent", "name": "Issue Agent — 任务拆解"}, {"level": 2, "id": "agents-coding-agent", "name": "Coding Agent — 代码实现"}, {"level": 2, "id": "agents-qa-agent", "name": "QA Agent — 质量审查"}, {"level": 2, "id": "agents-sre-agent", "name": "SRE Agent — 运维部署"}], "no": "", "is_overview": false}, {"id": "agent-environment-variables", "title": "5. Agent 执行环境变量", "html": "<h1 id=\"agent-environment-variables-5-agent\">5. Agent 执行环境变量<\u002fh1>\n<blockquote>\n<p>Grape 将任务调度给不同类型的 Agent（VOD / Issue / Coding / QA / SRE / Chat）时，<br />\n会在 Agent 的<strong>执行环境<\u002fstrong>中注入一组环境变量（<code>env<\u002fcode>），供 Skill 脚本 / Agent 读取。<br />\n本页汇总这些变量的<strong>来源、语义、适用 Agent 类型<\u002fstrong>，方便开发者编写 Skill 时正确使用。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agent-environment-variables-_1\">注入链路概览<\u002fh2>\n<pre><code>GitCode 事件（Issue/PR/评论）\n   → webhook → event_pipeline（_execute_agent）组装 env_extra\n   → enqueue_task 落 agent_tasks.env_extra（JSON 列）\n   → Worker claim 任务 → stream_agent/_stream_runtime_async\n   → 引擎 get_env（opencode/codearts/hermes 基础环境）\n   → env_extra.update() / _assemble_env()（token 互斥注入）\n   → Skill 进程内可 printenv 读取\n<\u002fcode><\u002fpre>\n<ul>\n<li><strong>env_extra<\u002fstrong>：任务级注入（主控端组装，见 <code>event_pipeline.py<\u002fcode> / <code>service.py<\u002fcode>）<\u002fli>\n<li><strong>引擎 get_env<\u002fstrong>：引擎侧基础环境（<code>opencode.py<\u002fcode> / <code>codearts.py<\u002fcode> / <code>hermes.py<\u002fcode> / <code>codex.py<\u002fcode>）<\u002fli>\n<li><strong>_assemble_env<\u002fstrong>：GitCode/GitHub token 互斥注入（<code>agent/executor.py<\u002fcode>）<\u002fli>\n<\u002ful>\n<h2 id=\"agent-environment-variables-_2\">核心注入变量总表<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>语义<\u002fth>\n<th>适用 Agent<\u002fth>\n<th>注入来源<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>GRAPE_SERVER_URL<\u002fcode><\u002ftd>\n<td><strong>主控业务 API 基址<\u002fstrong>（issues / git-repo 等全量端点，skill 调业务 API / <code>grape<\u002fcode> 业务命令用；<strong>不是<\u002fstrong> worker runtime 地址）。来源：<code>task_business_api_url<\u002fcode> 显式配置 &gt; 本机 runtime 回退 <code>127.0.0.1:{port}<\u002fcode> &gt; <code>server_base_url<\u002fcode>（本机 runtime 未显式配置时走回环，远程 runtime 用 <code>server_base_url<\u002fcode>）<\u002ftd>\n<td>全部<\u002ftd>\n<td><code>event_pipeline.py<\u002fcode>（<code>_enqueue_pipeline_task<\u002fcode> / <code>build_task_env<\u002fcode>）/ 对话入队（<code>routes/chat.py<\u002fcode>、<code>im/handler_async.py<\u002fcode>、<code>im/vod_handler_async.py<\u002fcode>、<code>runtime/scheduler.py<\u002fcode>，均经 <code>resolve_task_server_env<\u002fcode>）/ <code>agent.py<\u002fcode> 本机或单地址部署覆盖<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>RUNTIME_SERVER_URL<\u002fcode><\u002ftd>\n<td><strong>worker runtime / A2A 回连基址<\u002fstrong>（任务 server_url 同语义；<code>grape<\u002fcode> 的 runtime 绑定命令用）。来源：<code>worker_connect_url<\u002fcode>（未配置回退 <code>server_base_url<\u002fcode>）<\u002ftd>\n<td>全部<\u002ftd>\n<td><code>event_pipeline.py<\u002fcode>（<code>_enqueue_pipeline_task<\u002fcode> / <code>build_task_env<\u002fcode>）/ 对话入队（<code>routes/chat.py<\u002fcode>、<code>im/handler_async.py<\u002fcode>、<code>im/vod_handler_async.py<\u002fcode>、<code>runtime/scheduler.py<\u002fcode>，均经 <code>resolve_task_server_env<\u002fcode>）/ <code>agent.py<\u002fcode> 本机或内网 worker 覆盖<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_SESSION_TOKEN<\u002fcode><\u002ftd>\n<td>会话级临时 token（<code>tk_<\u002fcode>，task 生命周期内有效，终态失效）<\u002ftd>\n<td>全部<\u002ftd>\n<td><code>service.py<\u002fcode> <code>issue_session_token<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_CLI_MODE<\u002fcode><\u002ftd>\n<td>CLI 命令过滤模式：<code>WORKER<\u002fcode> = 只显示会话 token（<code>tk_<\u002fcode>）可用的命令（dual + session_only），隐藏 user_only（agent 持 <code>tk_<\u002fcode> 打了也 403）<\u002ftd>\n<td>全部（注入 session token 的任务）<\u002ftd>\n<td>随 <code>GRAPE_SESSION_TOKEN<\u002fcode> 注入（<code>service.py<\u002fcode> / <code>event_pipeline.py<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>TASK_TMPDIR<\u002fcode> / <code>SESSION_DIR<\u002fcode><\u002ftd>\n<td><strong>会话级唯一暂存目录<\u002fstrong>（两者同值，形如 <code>/tmp/opencode/{task_id}<\u002fcode>）。技能写临时 body/req/spec 文件必须用该目录，禁止固定名 <code>/tmp/opencode/body.md<\u002fcode>；worker 侧缺失或不可写时回退 <code>mktemp -d<\u002fcode> 并告警（Issue #2225）<\u002ftd>\n<td>全部<\u002ftd>\n<td><code>service.py<\u002fcode> <code>enqueue_task<\u002fcode> 下发；<code>agent.py<\u002fcode> / <code>direct_executor.py<\u002fcode> / <code>scheduler.py<\u002fcode> 创建校验<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_SESSION_TMPDIR_FALLBACK<\u002fcode><\u002ftd>\n<td><code>0<\u002fcode> = 使用平台下发路径；<code>1<\u002fcode> = 平台变量缺失/不可写，已回退 mktemp（日志有告警）<\u002ftd>\n<td>全部<\u002ftd>\n<td>worker / direct 执行前 <code>ensure_session_tmpdir<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>REPO_FULL_NAME<\u002fcode><\u002ftd>\n<td><code>owner/repo<\u002fcode> 仓库全名（服务端注入，原始语义）。<strong>格式契约（#721）<\u002fstrong>：形如 <code>GTDTeam/CodeArts<\u002fcode>——<strong>无 host 前缀、无 provider 前缀（<code>gitcode:<\u002fcode>/<code>github:<\u002fcode>）、无 <code>.git<\u002fcode> 后缀<\u002fstrong>；注入侧统一 <code>from_repo_key<\u002fcode> 归一（幂等），runbook 拼接 clone URL 前仍应做一次归一兜底（见下「runbook clone URL 模板」）<\u002ftd>\n<td>全部（devops 事件）<\u002ftd>\n<td><code>_execute_agent<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>REPO_OWNER<\u002fcode><\u002ftd>\n<td><strong>仓库属主（owner，组织或个人的泛化概念）<\u002fstrong>；从 repository 拆分，始终不含 <code>/repo<\u002fcode><\u002ftd>\n<td>全部（devops 事件）<\u002ftd>\n<td><code>_execute_agent<\u002fcode>（<code>split_owner_repo<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>REPO_NAME<\u002fcode><\u002ftd>\n<td>仓库名（repo，如 <code>grape<\u002fcode>，即 <code>${REPO_FULL_NAME#*/}<\u002fcode>）<\u002ftd>\n<td>全部（devops 事件）<\u002ftd>\n<td><code>_execute_agent<\u002fcode>（<code>split_owner_repo<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>ACCOUNT<\u002fcode><\u002ftd>\n<td><strong>个人账号（webhook 触发人 / A2A 触发人，如 <code>Jason7602<\u002fcode>）<\u002fstrong>；与仓库属主解耦，<strong>解析为空时不会回退为仓库属主<\u002fstrong><\u002ftd>\n<td>全部（devops 事件）<\u002ftd>\n<td><code>_execute_agent<\u002fcode> / <code>_enqueue_pipeline_task<\u002fcode>（<code>resolve_actor_account<\u002fcode>：a2a_event 为 <code>payload.account<\u002fcode> → <code>actor<\u002fcode> → Issue <code>created_by<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>ISSUE_NUMBER<\u002fcode><\u002ftd>\n<td>Issue 编号（去 # 前缀的数字）<\u002ftd>\n<td>事件任务（有 Issue）<\u002ftd>\n<td><code>_execute_agent<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_ISSUE_ID<\u002fcode><\u002ftd>\n<td><strong>需求卡片 id（issue 表主键，整数<\u002fstrong>；awaiting-input / pending-review / review-pass 的 <code>--issue_id<\u002fcode> 用此值，<strong>非 ISSUE_NUMBER<\u002fstrong>）<\u002ftd>\n<td>事件任务（有 Issue）<\u002ftd>\n<td><code>_execute_agent<\u002fcode>（按 <code>(repo_key, issue_number)<\u002fcode> 查卡片）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>PR_NUMBER<\u002fcode><\u002ftd>\n<td>PR 编号<\u002ftd>\n<td>事件任务（有真实 PR）<\u002ftd>\n<td><code>_execute_agent<\u002fcode>（<code>_inject_issue_pr_env<\u002fcode> → <code>_extract_pr_number<\u002fcode>）：<code>payload.pr_number<\u002fcode> → <code>evt._pr_sub_pr_number<\u002fcode> 为显式来源、始终可信；仅 <strong>PR/MR 实体事件<\u002fstrong>才开放对象结构来源（<code>payload.pull_request.{number,iid}<\u002fcode> / <code>payload.merge_request.{number,iid}<\u002fcode> / <code>payload.object_attributes.iid<\u002fcode>），均为去 <code>#<\u002fcode> 后纯数字，Issue #595。<strong>note_hook_pr<\u002fstrong>：payload 优先（<code>noteable_iid<\u002fcode> / <code>merge_request<\u002fcode> / <code>pull_request<\u002fcode>），缺失时从结构化 URL（<code>object_attributes.url<\u002fcode> / <code>merge_request<\u002fcode>、<code>pull_request<\u002fcode> 的 <code>web_url<\u002fcode>，形如 .../merge_requests/<N>）兜底，不从事件标题猜号，Issue #1579。<strong>Issue #1802 口径<\u002fstrong>：Issue 实体事件的 <code>object_attributes.iid<\u002fcode> 是 Issue 自身编号，<strong>永不作 PR 号来源<\u002fstrong>；无真实关联 PR 时<strong>静默不注入<\u002fstrong> <code>PR_NUMBER<\u002fcode>（不写占位值、不用 <code>ISSUE_NUMBER<\u002fcode> 顶替）；仅 PR/MR 实体解析失败才注入 <code>PR_NUMBER_PARSE_FAILED=1<\u002fcode> 告警。<strong>URL 兜底取到的号会先做一次存在性校验<\u002fstrong>（<code>_pr_number_exists<\u002fcode>，60s 缓存；明确 404 才丢弃，查询异常按存在处理）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>BOT_USERNAME<\u002fcode><\u002ftd>\n<td>全局 bot 用户名（grape_bot）——<strong>作者过滤/幂等查重必须用它<\u002fstrong>，缺失时不得退化为「按评论形态判定」<\u002ftd>\n<td>全部 devops 事件 + 定时调度（autopilot）<\u002ftd>\n<td>四条执行路径统一 <code>_inject_bot_agent_env<\u002fcode>（<code>event_pipeline<\u002fcode> ×2 / <code>direct_executor<\u002fcode> / <code>runtime/scheduler<\u002fcode>）；<code>_resolve_bot_username<\u002fcode> 解析为空时<strong>打 warning 而非静默降级<\u002fstrong><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_WORK_BRANCH<\u002fcode><\u002ftd>\n<td>场景工作基线分支<\u002ftd>\n<td>Coding/QA/SRE（git 类）<\u002ftd>\n<td><code>_read_scene_work_branch<\u002fcode> → env_extra<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_SCENE_ID<\u002fcode><\u002ftd>\n<td>当前 Issue 绑定的场景标识（issue-219：统一 env 注入；未选定=空串，不回落 default）。<strong>#1745<\u002fstrong>：跨场景转交后以 Issue 当前归属场景为真值；重派/执行前会按 <code>issues detail.scene_id<\u002fcode> 校正陈旧快照（PR 订阅任务保留订阅场景）。未绑定场景时本机执行与远端 worker <strong>同源回退仓库默认场景 <code>dev_scene<\u002fcode><\u002fstrong>（不再一边给 dev_scene、一边清空）；绑定的场景已被删除时按「未绑定」处理，不注入幽灵 scene_id<\u002ftd>\n<td>全部（devops 事件，含注入场景的任务）<\u002ftd>\n<td><code>_inject_scene_env<\u002fcode> → env_extra；执行前 <code>reconcile_task_scene_env<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_SCENE_SCOPE_ON_ERROR<\u002fcode><\u002ftd>\n<td>场景技能 scope 判定降级开关（服务端读，非注入给 agent）：<code>deny<\u002fcode>（默认）= 查询异常 fail-closed；<code>allow<\u002fcode> = 查询异常按放行并标 source=db_error，仅在 DB 抖动阻断派发时临时打开<\u002ftd>\n<td>平台进程<\u002ftd>\n<td><code>scene_skill_scope._env_error_policy<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>场景自定义变量（<code>custom_fields<\u002fcode>）<\u002ftd>\n<td>场景高级选项配置的自定义环境变量，<strong>以变量名直接注入<\u002fstrong>（如 <code>MY_API_KEY<\u002fcode>、<code>HUAWEI_AK<\u002fcode>），技能 <code>os.environ.get('VAR_NAME')<\u002fcode> 直接读取；支持 <code>is_secret<\u002fcode>（页面掩码）与 <code>scope<\u002fcode>（按 agent 过滤，默认 all）<\u002ftd>\n<td>配置了 custom_fields 的场景（按 scope 匹配的 agent）<\u002ftd>\n<td><code>_inject_scene_env<\u002fcode> → env_extra<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>BOT_GITCODE_TOKEN<\u002fcode><\u002ftd>\n<td>仓库 bot token（仓库身份，事件任务）<\u002ftd>\n<td><strong>非 chat<\u002fstrong>（devops 事件）<\u002ftd>\n<td><code>_assemble_env<\u002fcode>（互斥）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>BOT_GITHUB_TOKEN<\u002fcode><\u002ftd>\n<td>GitHub 仓库 bot token<\u002ftd>\n<td>非 chat（GitHub 仓库）<\u002ftd>\n<td><code>_assemble_env<\u002fcode>（互斥）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>USER_GITCODE_TOKEN<\u002fcode><\u002ftd>\n<td>当前用户 GitCode token（用户身份）<\u002ftd>\n<td><strong>Chat 专用<\u002fstrong><\u002ftd>\n<td><code>_assemble_env<\u002fcode>（互斥）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>USER_GITHUB_TOKEN<\u002fcode><\u002ftd>\n<td>当前用户 GitHub token<\u002ftd>\n<td>Chat（GitHub 关联）<\u002ftd>\n<td><code>_assemble_env<\u002fcode>（互斥）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DEVOPS_SKILLS_DIR<\u002fcode><\u002ftd>\n<td>技能目录<\u002ftd>\n<td>全部<\u002ftd>\n<td>各引擎 get_env<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DEVOPS_EVENT_TYPE<\u002fcode><\u002ftd>\n<td><strong>触发事件类型<\u002fstrong>（<code>issue_opened<\u002fcode> / <code>issue_comment<\u002fcode> / <code>push<\u002fcode> / <code>pr_merge<\u002fcode> / <code>vod_signal<\u002fcode> 等）——「在响应什么事件」<\u002ftd>\n<td>全部<\u002ftd>\n<td>引擎 get_env 默认空，<code>stream_agent<\u002fcode> 覆写为 event_type<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>AGENT_NAME<\u002fcode><\u002ftd>\n<td><strong>Agent 角色显示名<\u002fstrong>（<code>Issue Agent<\u002fcode> / <code>QA Agent<\u002fcode> / <code>Coding Agent<\u002fcode> / <code>VOD Agent<\u002fcode>…）——「我是谁」，skill 评论前缀 <code>[$AGENT_NAME]<\u002fcode> 用；<strong>它不是账号，禁止当评论作者过滤依据<\u002fstrong>（作者过滤用 <code>BOT_USERNAME<\u002fcode>）<\u002ftd>\n<td>全部<\u002ftd>\n<td><code>_inject_bot_agent_env<\u002fcode> → <code>get_agent_display_name(agent_type)<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GIT_ASKPASS<\u002fcode><\u002ftd>\n<td>git 凭据辅助脚本（BOT_GITCODE_TOKEN）<\u002ftd>\n<td>Coding/QA/SRE（git workflow）<\u002ftd>\n<td><code>repogit.askpass_path<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>注：<code>HUAWEICLOUD_SDK_AK/SK<\u002fcode>、<code>CODEARTS_CLI_AK/SK<\u002fcode>、<code>GITHUB_PUBLISH_REPO<\u002fcode>、<code>GITCODE_PUBLISH_REPO<\u002fcode>、<br />\n<code>CLAWHUB_OWNER_HANDLE<\u002fcode> <strong>已不再经环境变量注入<\u002fstrong>（#219 按需获取）——技能需要时通过自定义场景变量（场景高级选项 custom_fields，变量名直接注入）<br />\n或按需 API 获取。<\u002fp>\n<p><strong><code>ACCOUNT<\u002fcode> 取值优先级（Issue #1668）<\u002fstrong>：<br />\n1. <code>a2a_event<\u002fcode>：<code>payload.account<\u002fcode>（A2A 交办方显式携带的触发人）→ 事件 <code>actor<\u002fcode>；<br />\n   - <code>/api/a2a<\u002fcode> 入口的事件 <code>actor<\u002fcode> 取<strong>已认证调用方登录名<\u002fstrong>（JWT / API Key 可提供；会话 token 无登录名时为空）；<br />\n   - 内部派生的 a2a_event（订阅 / PR 订阅 / VOD 重派）继承来源事件的 <code>actor<\u002fcode>；<br />\n2. 其余事件：事件 <code>actor<\u002fcode>（webhook 触发人）→ <code>payload.account<\u002fcode>；<br />\n3. 仅 <code>a2a_event<\u002fcode>：上述为空时按 <code>issue_number<\u002fcode> 查 <code>issue.created_by<\u002fcode>（Issue 创建人）；<br />\n4. 仍为空 → 注入空串，并在服务端事件日志输出结构化告警 <code>ACCOUNT_MISSING<\u002fcode>（含 <code>event_type<\u002fcode> / <code>issue_number<\u002fcode> / <code>repository<\u002fcode> / 实际回退链 <code>fallback<\u002fcode>）。<\u002fp>\n<p><strong>禁止回退为仓库属主（<code>REPO_OWNER<\u002fcode>）<\u002fstrong>——个人账号与仓库属主解耦；A2A payload 的 <code>account<\u002fcode> 与事件记录 <code>actor<\u002fcode> 同步使用该解析结果。<br />\n订阅 / PR 订阅 / VOD 重派等派生的 a2a_event 会把解析结果同时写入事件 <code>actor<\u002fcode> 与落库 <code>payload.account<\u002fcode>，保证下游任务与事件查询一致。<br />\n<code>issue_opened<\u002fcode> / PR 等非 A2A 事件的 <code>ACCOUNT<\u002fcode> 仍取 webhook 触发人 <code>actor<\u002fcode>，行为不变。<\u002fp>\n<p><strong><code>AGENT_NAME<\u002fcode> 与 <code>DEVOPS_EVENT_TYPE<\u002fcode> 的区别<\u002fstrong>：两者是正交的两个维度——<br />\n<code>AGENT_NAME<\u002fcode> = <strong>身份<\u002fstrong>（谁在执行，按 agent_type 的角色显示名，如 <code>QA Agent<\u002fcode>，用于 <code>[$AGENT_NAME]<\u002fcode> 评论前缀）；<br />\n<code>DEVOPS_EVENT_TYPE<\u002fcode> = <strong>时机<\u002fstrong>（在响应什么触发事件，如 <code>issue_comment<\u002fcode>/<code>push<\u002fcode>，技能据此分派分支）。<br />\n例：同一 <code>QA Agent<\u002fcode>（名字恒为 <code>QA Agent<\u002fcode>）可以在 <code>pr_opened<\u002fcode>、<code>issue_comment<\u002fcode> 等不同事件类型下被触发。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agent-environment-variables-issue-2225\">会话级暂存目录（Issue #2225）<\u002fh2>\n<p>共享 worker 上并发 Agent 会话共用固定名暂存文件会互相覆写，可能把其他 Issue 的正文写进线上 Issue/PR。<br />\n平台为每个任务下发唯一暂存目录，技能应统一使用：<\u002fp>\n<pre><code class=\"language-bash\">TMP=&quot;${TASK_TMPDIR:-${SESSION_DIR:-$(mktemp -d)}}&quot;\nprintf '%s' &quot;$BODY&quot; &gt; &quot;$TMP/body.md&quot;\n<\u002fcode><\u002fpre>\n<ul>\n<li>平台只下发路径，worker/direct 执行前创建并做可写探针；目录名由 task_id 派生。<\u002fli>\n<li>平台变量缺失或路径不可写 → 回退 <code>mktemp -d<\u002fcode> 并输出告警（<code>GRAPE_SESSION_TMPDIR_FALLBACK=1<\u002fcode>），<br />\n  不静默退回固定名。<\u002fli>\n<li>会话结束由执行器清理自身子目录；sweeper 另按 TTL 兜底清理 <code>/tmp/opencode<\u002fcode> 存量平铺文件与<br />\n  超时会话子目录（<code>SWEEPER_TASK_TMPDIR_TTL_SECONDS<\u002fcode>，默认 7200 秒）。<\u002fli>\n<\u002ful>\n<h2 id=\"agent-environment-variables-issue-issue-2225\">发布前 Issue 号一致性断言（Issue #2225）<\u002fh2>\n<p><code>grape git-repo issues update<\u002fcode>（正文写入）、<code>grape git-repo pulls create<\u002fcode> / <code>pulls update<\u002fcode><br />\n在落上游前校验正文主语 <code>Issue #N<\u002fcode>、PR 标题首个 <code>#N<\u002fcode>、<code>related_issue_nums<\u002fcode> 与当前会话任务 Issue<br />\n是否一致；不一致返回 409 且不产生线上写入。该断言无放行参数，仅会话 token 启用；用户 JWT / API Key（非会话 token）不启用该断言。<\u002fp>\n<blockquote>\n<p><strong><code>GRAPE_SERVER_URL<\u002fcode> 注入守护（Issue #3766）<\u002fstrong>：注入前按候选链（<code>task_business_api_url<\u002fcode> → 本机业务端口 → <code>server_base_url<\u002fcode>）探测业务 API，依次尝试 <code>/api/health<\u002fcode>（要求 <code>server=ok<\u002fcode>）、<code>/openapi.json<\u002fcode>（含 <code>/api/issues<\u002fcode>、<code>/api/git-repo<\u002fcode> 路由）、<code>/api/issues/mine<\u002fcode>（2xx JSON 或 401/403 鉴权挑战）。命中 301/302/404 等 admin 前端接管签名时判为不可用并回退到下一个可用候选；全部不可用时默认 <code>warn<\u002fcode>（保留运维声明值并 <code>error<\u002fcode> 告警），<code>GRAPE_BUSINESS_API_GUARD=strict<\u002fcode> 可阻断注入，<code>=off<\u002fcode> 保留 Issue #1731 旧行为。<code>task_business_api_url<\u002fcode> 必须指向业务 API，不能填 admin 前端域名。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agent-environment-variables-gitcode-token\">GitCode Token 互斥注入（关键）<\u002fh2>\n<p><code>_assemble_env<\u002fcode>（<code>agent/executor.py<\u002fcode>）按执行类型<strong>互斥注入<\u002fstrong> token：<\u002fp>\n<pre><code>Chat 任务  → 只注入 USER_GITCODE_TOKEN（用户身份；不用 bot token 冒充用户）\n事件任务  → 只注入 BOT_GITCODE_TOKEN（仓库身份；不注入用户 token）\n<\u002fcode><\u002fpre>\n<ul>\n<li>二者<strong>不同时注入<\u002fstrong>（防用户对话上下文暴露仓库 bot token）。<\u002fli>\n<li>GitHub 仓库额外注入 <code>BOT_GITHUB_TOKEN<\u002fcode> / <code>USER_GITHUB_TOKEN<\u002fcode>。<\u002fli>\n<li>自定义 provider 凭据（openai 等，按 <code>get_credentials<\u002fcode>）与 GITCODE token 无关，chat 与 devops <strong>都按 user_id 注入<\u002fstrong>。<\u002fli>\n<\u002ful>\n<h2 id=\"agent-environment-variables-agent\">按 Agent 类型的可用性<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>Agent<\u002fth>\n<th>仓库身份 token<\u002fth>\n<th>用户身份 token<\u002fth>\n<th>场景字段<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>VOD<\u002ftd>\n<td>BOT_GITCODE_TOKEN<\u002ftd>\n<td>—<\u002ftd>\n<td>✓<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Issue<\u002ftd>\n<td>BOT_GITCODE_TOKEN<\u002ftd>\n<td>—<\u002ftd>\n<td>✓<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Coding<\u002ftd>\n<td>BOT_GITCODE_TOKEN<\u002ftd>\n<td>—<\u002ftd>\n<td>✓（工作分支）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>QA<\u002ftd>\n<td>BOT_GITCODE_TOKEN<\u002ftd>\n<td>—<\u002ftd>\n<td>✓<\u002ftd>\n<\u002ftr>\n<tr>\n<td>SRE<\u002ftd>\n<td>BOT_GITCODE_TOKEN<\u002ftd>\n<td>—<\u002ftd>\n<td>✓<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Chat<\u002ftd>\n<td>—<\u002ftd>\n<td>USER_GITCODE_TOKEN<\u002ftd>\n<td>—<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>Chat 用当前登录用户身份；事件任务用仓库 bot 身份。<br />\n华为云/CodeArts AK-SK 与发布目标（gitcode/github publish repo、ClawHub handle）<strong>不再 env 注入<\u002fstrong>（#219），<br />\n技能需要时走<strong>自定义场景变量<\u002fstrong>（场景高级选项 custom_fields，变量名直接注入）或按需 API。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"agent-environment-variables-skill\">Skill 开发建议<\u002fh2>\n<ol>\n<li><strong>读 GitCode 仓库信息<\u002fstrong>：<br />\n<code>bash\n   echo \"repo=$REPO_FULL_NAME issue=$ISSUE_NUMBER\"\n   curl -sH \"Authorization: Bearer $BOT_GITCODE_TOKEN\" \\\n     \"https://api.gitcode.com/api/v5/repos/$REPO_FULL_NAME\"<\u002fcode><\u002fli>\n<li><strong>调 Grape 内部 API<\u002fstrong>：用 <code>GRAPE_SERVER_URL<\u002fcode> + <code>GRAPE_SESSION_TOKEN<\u002fcode>（鉴权 Bearer）。<\u002fli>\n<li><strong>CLI 命令范围<\u002fstrong>：环境已注入 <code>GRAPE_CLI_MODE=WORKER<\u002fcode>——<code>grape --help<\u002fcode> / <code>grape commands<\u002fcode> 只会列出<br />\n<strong>会话 token（<code>tk_<\u002fcode>）可用的命令<\u002fstrong>（dual + session_only，含 git-repo / issues 读 / a2a / tasks 等）；<br />\n   user_only（skills 管理 / settings / repos 平台管理 等）已被过滤——agent 不要尝试调用它们（服务端仍会 403）。<\u002fli>\n<li><strong>华为云/CodeArts 凭据<\u002fstrong>：不再经 env 注入——需要云能力的 SRE/skill 通过<strong>自定义场景变量<\u002fstrong>（场景高级选项<br />\n<code>custom_fields<\u002fcode>，变量名直接注入）读取，或在技能 SKILL.md 中声明按需获取方式。<\u002fli>\n<li><strong>场景读取<\u002fstrong>：<code>printenv GRAPE_SCENE_ID<\u002fcode> 确认当前 Issue 绑定的场景（空串=尚未判定）；<br />\n   自定义字段以<strong>变量名直接注入<\u002fstrong>——<code>printenv &lt;NAME&gt;<\u002fcode> / <code>os.environ.get('&lt;NAME&gt;')<\u002fcode> 直接读值。<br />\n<strong>跨场景转交/重入时以 <code>issues detail<\u002fcode> 返回的 <code>scene_id<\u002fcode> 为权威<\u002fstrong>，<code>GRAPE_SCENE_ID<\u002fcode> 作兜底：<br />\n   两者不一致时按真实值执行 <code>scenes detail --scene_id &lt;真实值&gt;<\u002fcode> 重取节点后重试，<br />\n   仅当真实场景确实不含目标节点时才进入待确认（Issue #1745）。<\u002fli>\n<li><strong>git 操作<\u002fstrong>：用 <code>GRAPE_WORK_BRANCH<\u002fcode> 作工作基线；<code>GIT_ASKPASS<\u002fcode> 已注入 <code>$BOT_GITCODE_TOKEN<\u002fcode>。<\u002fli>\n<li><strong>token 安全<\u002fstrong>：<code>BOT_GITCODE_TOKEN<\u002fcode>/<code>USER_GITCODE_TOKEN<\u002fcode> 是敏感变量——<strong>不要 printenv 打印/写入日志<\u002fstrong>；<br />\n   平台已有脱敏（[REDACTED]）。token 仅在进程内有效、删除即失效（GRAPE_SESSION_TOKEN 生命周期=任务）。<\u002fli>\n<\u002fol>\n<h3 id=\"agent-environment-variables-1-runbook-clone-url-721\">五.1 runbook clone URL 模板（规范写法，#721）<\u002fh3>\n<p>runbook 需要本地 clone 仓库时，<strong>先归一再拼接<\u002fstrong>，禁止把 <code>$REPO_FULL_NAME<\u002fcode> 直通进 URL<br />\n（直通在注入值带 provider 前缀/为空时会拼出错误地址，见用户反馈 488 / Issue #721）：<\u002fp>\n<pre><code class=\"language-bash\"># 1) 归一 + 校验（owner/repo 两段、无前缀、无 .git）\nREPO_URL_PATH=&quot;$(printf '%s' &quot;${REPO_FULL_NAME:-}&quot; | sed 's#^[a-z]*:##; s#\\.git$##')&quot;\ncase &quot;$REPO_URL_PATH&quot; in */*) : ;; *) echo &quot;REPO_FULL_NAME 非法（应为 owner/repo）: ${REPO_URL_PATH:-&lt;空&gt;}&quot; &gt;&amp;2; exit 1 ;; esac\n\n# 2) 拼接（host 按仓库 provider 选择；gitcode 仓库固定如下）\nCLONE_URL=&quot;https://gitcode.com/${REPO_URL_PATH}.git&quot;\n\n# 3) clone（不要 2&gt;/dev/null 吞错；也不要 clone 失败后盲目 || git pull 掩盖根因）\ngrape git clone &quot;$CLONE_URL&quot; &quot;$repo_dir&quot; || { echo &quot;clone 失败: $CLONE_URL&quot; &gt;&amp;2; exit 1; }\n<\u002fcode><\u002fpre>\n<h3 id=\"agent-environment-variables-2-clone-721\">五.2 clone 失败排查指引（#721）<\u002fh3>\n<p><strong>第一步：校验变量值<\u002fstrong>（只回显非敏感仓库变量）：<\u002fp>\n<pre><code class=\"language-bash\">echo &quot;REPO_FULL_NAME=[${REPO_FULL_NAME:-}] REPO_OWNER=[${REPO_OWNER:-}] REPO_NAME=[${REPO_NAME:-}]&quot;\ntest -n &quot;$REPO_FULL_NAME&quot; &amp;&amp; test -n &quot;$REPO_OWNER&quot; &amp;&amp; test -n &quot;$REPO_NAME&quot; || echo &quot;存在空值：漏注入（同族 #584 BOT_USERNAME / #595 PR_NUMBER），如实报错勿猜&quot;\n<\u002fcode><\u002fpre>\n<p><strong>常见错误模式对照<\u002fstrong>：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>症状<\u002fth>\n<th>典型错误 URL<\u002fth>\n<th>根因<\u002fth>\n<th>处理<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>clone 404 / repository not found<\u002ftd>\n<td><code>https://gitcode.com/gitcode:owner/repo.git<\u002fcode><\u002ftd>\n<td><code>$REPO_FULL_NAME<\u002fcode> 带 provider 前缀直通拼接<\u002ftd>\n<td>按五.1 归一后再拼；上报注入侧异常<\u002ftd>\n<\u002ftr>\n<tr>\n<td>clone 404 / repository not found<\u002ftd>\n<td><code>https://gitcode.com/.git<\u002fcode><\u002ftd>\n<td><code>$REPO_FULL_NAME<\u002fcode> 为空（漏注入）<\u002ftd>\n<td>排查任务 env_extra；勿猜仓库名<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404 / repository not found<\u002ftd>\n<td><code>https://gitcode.com/owner/repo<\u002fcode>（缺 <code>.git<\u002fcode>）<\u002ftd>\n<td>模板漏 <code>.git<\u002fcode> 后缀<\u002ftd>\n<td>模板补 <code>.git<\u002fcode>（部分 provider 必需）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Could not resolve host<\u002ftd>\n<td><code>https://gitcode.com/owner/repo.git<\u002fcode> 用于 GitHub 仓库<\u002ftd>\n<td>host 与 provider 不匹配<\u002ftd>\n<td>GitHub 仓用 <code>https://github.com/owner/repo.git<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>Authentication failed<\u002ftd>\n<td>URL 正确<\u002ftd>\n<td>凭据/权限（401 token 失效；403 需维护者权限）<\u002ftd>\n<td>401 说明凭据失效；403 需管理员配置，不换 token<\u002ftd>\n<\u002ftr>\n<tr>\n<td>拼接正确仍 clone 失败<\u002ftd>\n<td>—<\u002ftd>\n<td>网络/远端临时故障<\u002ftd>\n<td>重试 1 次，仍失败如实报错（附手工命令）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><strong>同族一致性核对结论（#584/#595/#721）<\u002fstrong>：三者的根因形态一致——「runbook 依赖的环境变量与实际注入值/格式不匹配」。<br />\n<code>BOT_USERNAME<\u002fcode>（#584，<code>_resolve_bot_username<\u002fcode>）、<code>PR_NUMBER<\u002fcode>（#595，<code>_inject_issue_pr_env<\u002fcode>）、<br />\n<code>REPO_FULL_NAME<\u002fcode>（#721，<code>from_repo_key<\u002fcode> 归一）均已纳入注入侧统一口径与保留名清单<br />\n（<code>src/scene_custom_env.py<\u002fcode> <code>_RESERVED_ENV_NAMES<\u002fcode>，场景自定义变量不可覆盖）；<br />\n测试见 <code>tests/runtime/test_issue_573_bot_agent_env_injection.py<\u002fcode>、<code>tests/runtime/test_issue_528_pr_sub_env_injection.py<\u002fcode>、<br />\n<code>tests/runtime/test_issue_721_repo_full_name_env.py<\u002fcode>。<\u002fp>\n<h3 id=\"agent-environment-variables-3\">五.3 技能如何使用自定义场景变量<\u002fh3>\n<p>场景高级选项 <code>custom_fields<\u002fcode>（<code>[{name, value, is_secret?, scope?}, ...]<\u002fcode>）<strong>以变量名直接注入<\u002fstrong>——<code>name<\u002fcode> 即环境变量名，技能直接读取，无序号/映射。<\u002fp>\n<pre><code class=\"language-bash\"># 直接读取（printenv / os.environ.get）\nprintenv HUAWEI_AK\n# 或\npython3 -c 'import os; print(os.environ.get(&quot;HUAWEI_AK&quot;,&quot;&quot;))'\n<\u002fcode><\u002fpre>\n<p>对齐场景（例：把原 <code>HUAWEICLOUD_SDK_AK/SK<\u002fcode> 改为场景自定义字段）：<\u002fp>\n<pre><code class=\"language-json\">{&quot;custom_fields&quot;: [\n  {&quot;name&quot;: &quot;HUAWEI_AK&quot;, &quot;value&quot;: &quot;LTAxxx&quot;},\n  {&quot;name&quot;: &quot;HUAWEI_SK&quot;, &quot;value&quot;: &quot;xxxyyy&quot;, &quot;is_secret&quot;: true},\n  {&quot;name&quot;: &quot;DEPLOY_ENV&quot;, &quot;value&quot;: &quot;prod&quot;, &quot;scope&quot;: [&quot;all&quot;]}\n]}\n<\u002fcode><\u002fpre>\n<p>注意：值只进 env、不进 prompt；技能 PRINTENV 时<strong>不要回显敏感值到日志/评论<\u002fstrong>。<\u002fp>\n<h2 id=\"agent-environment-variables-_3\">关键代码位置<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环节<\u002fth>\n<th>位置<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>env_extra 组装<\u002ftd>\n<td><code>src/api/event_pipeline.py<\u002fcode> <code>_execute_agent<\u002fcode>（~L1653 起）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>场景字段注入<\u002ftd>\n<td><code>_inject_scene_env<\u002fcode>（<code>src/api/event_pipeline.py<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>会话级 token<\u002ftd>\n<td><code>src/api/auth_token.py<\u002fcode> <code>issue_session_token<\u002fcode>（TTL 6h）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>token 互斥注入<\u002ftd>\n<td><code>src/agent/executor.py<\u002fcode> <code>_assemble_env<\u002fcode>（L212-254）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>env 落库<\u002ftd>\n<td><code>src/runtime/service.py<\u002fcode> <code>enqueue_task<\u002fcode> env_extra（L574-591）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Worker 侧加载<\u002ftd>\n<td><code>src/runtime/agent.py<\u002fcode> <code>_execute_task<\u002fcode>（~L950）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>引擎 get_env<\u002ftd>\n<td><code>src/runtime/opencode.py<\u002fcode> / <code>codearts.py<\u002fcode> / <code>hermes.py<\u002fcode> / <code>codex.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>", "toc": [{"level": 2, "id": "agent-environment-variables-_1", "name": "注入链路概览"}, {"level": 2, "id": "agent-environment-variables-_2", "name": "核心注入变量总表"}, {"level": 2, "id": "agent-environment-variables-issue-2225", "name": "会话级暂存目录（Issue #2225）"}, {"level": 2, "id": "agent-environment-variables-issue-issue-2225", "name": "发布前 Issue 号一致性断言（Issue #2225）"}, {"level": 2, "id": "agent-environment-variables-gitcode-token", "name": "GitCode Token 互斥注入（关键）"}, {"level": 2, "id": "agent-environment-variables-agent", "name": "按 Agent 类型的可用性"}, {"level": 2, "id": "agent-environment-variables-skill", "name": "Skill 开发建议"}, {"level": 3, "id": "agent-environment-variables-1-runbook-clone-url-721", "name": "五.1 runbook clone URL 模板（规范写法，#721）"}, {"level": 3, "id": "agent-environment-variables-2-clone-721", "name": "五.2 clone 失败排查指引（#721）"}, {"level": 3, "id": "agent-environment-variables-3", "name": "五.3 技能如何使用自定义场景变量"}, {"level": 2, "id": "agent-environment-variables-_3", "name": "关键代码位置"}], "no": "", "is_overview": false}, {"id": "pipeline", "title": "6. 流水线机制", "html": "<h1 id=\"pipeline-6\">6. 流水线机制<\u002fh1>\n<h2 id=\"pipeline-_1\">自动流水线<\u002fh2>\n<p>当 GitCode Issue 被创建时，Grape 自动启动流水线：<\u002fp>\n<pre><code>Issue 创建\n  → VOD Agent 分析需求、判断类型\n    → Issue Agent 细化 Spec、打标签\n      → Coding Agent 编写代码、提交 PR\n        → QA Agent 审查 PR\n          → 等待维护者合并 PR\n            → Issue 关闭（流水线完成）\n<\u002fcode><\u002fpre>\n<h2 id=\"pipeline-a2aagent-to-agent\">A2A（Agent-to-Agent）通信<\u002fh2>\n<p>Agent 之间通过 A2A 事件传递上下文。例如 Issue Agent 完成后会产生 <code>a2a_event<\u002fcode>，携带 Spec 上下文交给 Coding Agent。每次 A2A 交接都会在流水线中显示为一个节点。<\u002fp>\n<h2 id=\"pipeline-_2\">手动触发<\u002fh2>\n<ul>\n<li>在 <strong>VOD Agent<\u002fstrong> 页面输入需求文本，手动触发分析<\u002fli>\n<li>在 <strong>流水线<\u002fstrong> 页面点击\"重试\"可重新执行失败的节点<\u002fli>\n<li>在 Issue 评论区 @bot 可以触发特定 Agent<\u002fli>\n<\u002ful>", "toc": [{"level": 2, "id": "pipeline-_1", "name": "自动流水线"}, {"level": 2, "id": "pipeline-a2aagent-to-agent", "name": "A2A（Agent-to-Agent）通信"}, {"level": 2, "id": "pipeline-_2", "name": "手动触发"}], "no": "", "is_overview": false}, {"id": "skills", "title": "7. 技能管理", "html": "<h1 id=\"skills-7\">7. 技能管理<\u002fh1>\n<h2 id=\"skills-_1\">官方技能<\u002fh2>\n<p>Grape 内置 60+ 官方技能（SKILL.md），涵盖代码审查、部署、监控、文档生成等场景。在 <strong>DevOps 技能<\u002fstrong> 页面查看所有技能。<\u002fp>\n<h2 id=\"skills-_2\">自定义技能<\u002fh2>\n<p>用户可以为仓库创建自定义技能：<\u002fp>\n<ol>\n<li>在 <strong>DevOps 技能<\u002fstrong> 页面点击\"创建技能\"<\u002fli>\n<li>编写 SKILL.md（包含触发条件、执行步骤、工具列表）<\u002fli>\n<li>技能作用域：仓库级（仅当前仓库可用）或全局（所有仓库可用）<\u002fli>\n<\u002fol>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>技能分发机制<\u002fstrong><\u002fp>\n<p>技能文件存储在主服务器的 <code>skills/<\u002fcode> 目录（OBS 模式下同步到 OBS 桶）。Worker 执行任务时，技能文件随任务下发到工作区的 <code>.skills/<\u002fcode> 目录——Worker 不需要本地维护技能文件。<\u002fp>\n<\u002fblockquote>", "toc": [{"level": 2, "id": "skills-_1", "name": "官方技能"}, {"level": 2, "id": "skills-_2", "name": "自定义技能"}], "no": "", "is_overview": false}, {"id": "runtimes", "title": "8. 运行时与引擎", "html": "<h1 id=\"runtimes-8\">8. 运行时与引擎<\u002fh1>\n<h2 id=\"runtimes-_1\">引擎类型<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>引擎<\u002fth>\n<th>说明<\u002fth>\n<th>适用场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>opencode<\u002ftd>\n<td>OpenCode CLI，AI 编码助手<\u002ftd>\n<td>Coding/Issue/QA Agent<\u002ftd>\n<\u002ftr>\n<tr>\n<td>hermes<\u002ftd>\n<td>Hermes Agent，支持 ACP 协议<\u002ftd>\n<td>VOD/Chat/SRE Agent<\u002ftd>\n<\u002ftr>\n<tr>\n<td>codearts<\u002ftd>\n<td>华为云 CodeArts CLI<\u002ftd>\n<td>特定 CI/CD 场景<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>hermes 引擎部署硬性约定：模型名必须与 key 所属网关 <code>/v1/models<\u002fcode> 可用列表对齐<br />\n（换 key/换网关须同步换模型名并自检），详见仓库内文档<br />\n<code>docs/deployment/model-gateway-alignment.md<\u002fcode>（Issue #2545）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"runtimes-worker\">Worker 管理<\u002fh2>\n<ul>\n<li>在 <strong>Agent 运行时<\u002fstrong> 页面查看所有 Worker 设备和引擎状态<\u002fli>\n<li>每个 Worker 可以运行多个引擎实例（如同时运行 opencode + hermes + codearts）<\u002fli>\n<li>Worker 自动注册并定期心跳上报（CPU/内存/磁盘/探活结果）<\u002fli>\n<li>系统监控页面展示每个引擎的探活状态（CLI 测试对话延迟）<\u002fli>\n<\u002ful>\n<h2 id=\"runtimes-engine_runtime_ids\">指定引擎执行（场景节点 engine_runtime_ids）<\u002fh2>\n<p>在场景（流水线）的节点配置中，<code>engine_runtime_ids<\u002fcode> 是<strong>派发硬约束<\u002fstrong>：为某个 Agent 节点配置引擎 ID 列表后，该节点的任务只会派发给列表中的引擎（自建/专用 Worker 的\"指定机器执行\"能力）。<\u002fp>\n<pre><code class=\"language-json\">{&quot;id&quot;: &quot;vod&quot;, &quot;tag&quot;: &quot;vod&quot;, &quot;skill&quot;: &quot;vod-cli&quot;, &quot;mode&quot;: &quot;emit&quot;, &quot;next&quot;: &quot;issue&quot;, &quot;engine_runtime_ids&quot;: [17042]}\n<\u002fcode><\u002fpre>\n<p>语义（Issue #653）：<\u002fp>\n<ul>\n<li><strong>已配置<\u002fstrong>（列表非空）：任务只允许被列表内引擎认领；列表内引擎全部离线/心跳超时/已注销时，任务<strong>显式失败并给出原因<\u002fstrong>（含场景、Agent、引擎清单），不会回退到全局池 ECS。<\u002fli>\n<li><strong>未配置<\u002fstrong>（空列表或缺失）：保持全量广播——任务可被任意符合标签的在线引擎认领（存量行为不变）。<\u002fli>\n<li>所有派发通道（issue 触发、A2A 交办、手动重派、智能推荐重派）行为一致。<\u002fli>\n<\u002ful>\n<h3 id=\"runtimes-strict_scene_engines\">严格模式开关（strict_scene_engines）<\u002fh3>\n<p><code>configs/engine-selection.json<\u002fcode>：<\u002fp>\n<pre><code class=\"language-json\">{&quot;strict_scene_engines&quot;: true}\n<\u002fcode><\u002fpre>\n<ul>\n<li><code>true<\u002fcode>（默认）：已配置节点候选为空时任务失败（宁失败不跑飞）。<\u002fli>\n<li><code>false<\u002fcode>：兼容旧语义——候选为空时回退全量广播，但每次回退都会输出告警日志（可审计）。依赖全局池兜底的存量场景可显式关闭。<\u002fli>\n<\u002ful>", "toc": [{"level": 2, "id": "runtimes-_1", "name": "引擎类型"}, {"level": 2, "id": "runtimes-worker", "name": "Worker 管理"}, {"level": 2, "id": "runtimes-engine_runtime_ids", "name": "指定引擎执行（场景节点 engine_runtime_ids）"}, {"level": 3, "id": "runtimes-strict_scene_engines", "name": "严格模式开关（strict_scene_engines）"}], "no": "", "is_overview": false}, {"id": "monitoring", "title": "9. 系统监控", "html": "<h1 id=\"monitoring-9\">9. 系统监控<\u002fh1>\n<h2 id=\"monitoring-_1\">运维概览<\u002fh2>\n<p><strong>系统监控<\u002fstrong> 页面提供实时运维数据：<\u002fp>\n<ul>\n<li>任务队列深度（排队/运行中/已完成/失败）<\u002fli>\n<li>卡住检测（运行超过 22 分钟的任务预警）<\u002fli>\n<li>Runtime 引擎负载（运行任务数/最大并发数）<\u002fli>\n<li>引擎探活（每 10 分钟 CLI 测试，显示延迟和状态）<\u002fli>\n<li>Worker 设备健康（CPU/内存/磁盘/tmp 使用率）<\u002fli>\n<\u002ful>\n<h2 id=\"monitoring-_2\">引擎探活<\u002fh2>\n<p>系统每 10 分钟对每个引擎发起测试对话（如 <code>opencode run \"hello\"<\u002fcode>），记录响应延迟和成功/失败状态。探活结果在 Runtime 引擎表格中以图标显示：<\u002fp>\n<ul>\n<li>✅ ok + 延迟（秒）— 引擎正常<\u002fli>\n<li>❌ fail + 错误信息 — 引擎异常<\u002fli>\n<li>⏳ pending — 等待首次探活<\u002fli>\n<li>⏭ skip — 引擎未安装<\u002fli>\n<\u002ful>\n<h2 id=\"monitoring-502-issue-3969\">网关 502 指标与告警（Issue #3969）<\u002fh2>\n<p>Alloy 从 <code>nginx access.log<\u002fcode> 派生以下 Prometheus 指标（由 Alloy 自身 <code>/metrics<\u002fcode><br />\n暴露并自抓取；见 <code>deploy/alloy-config.alloy<\u002fcode>）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>指标<\u002fth>\n<th>含义<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>nginx_upstream_requests_total{path,status}<\u002fcode><\u002ftd>\n<td>发往 worker runtime 控制面的请求数<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>nginx_upstream_502_total{path,status}<\u002fcode><\u002ftd>\n<td>网关层 502 数（按 <code>status=\"502\"<\u002fcode> label 过滤）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p><code>path<\u002fcode> label 中的 runtime_id/task_id 已归一为 <code>&lt;id&gt;<\u002fcode>，避免基数随业务增长。<\u002fp>\n<p>告警（<code>deploy/alerts.yml<\u002fcode>）：<\u002fp>\n<ul>\n<li><code>GrapeRuntime502RateHigh<\u002fcode>：<code>/api/runtime/*<\u002fcode> 5 分钟 502 率 &gt;1%，<code>for: 5m<\u002fcode>。<\u002fli>\n<li><code>GrapeRuntime502Burst<\u002fcode>：<code>/api/runtime/*<\u002fcode> 2 分钟 502 增量 &gt;50，<code>for: 1m<\u002fcode>（短窗绝对量，<br />\n  覆盖 91s 级事故与低流量端点被 <code>clamp_min<\u002fcode> 稀释的漏报）。<\u002fli>\n<\u002ful>\n<p>验证：<code>promtool check rules deploy/alerts.yml<\u002fcode>；自抓取可达性<br />\n<code>curl -s http://127.0.0.1:12345/metrics | grep nginx_upstream_<\u002fcode>。<\u002fp>", "toc": [{"level": 2, "id": "monitoring-_1", "name": "运维概览"}, {"level": 2, "id": "monitoring-_2", "name": "引擎探活"}, {"level": 2, "id": "monitoring-502-issue-3969", "name": "网关 502 指标与告警（Issue #3969）"}], "no": "", "is_overview": false}, {"id": "knowledge-base", "title": "10. 项目知识库", "html": "<h1 id=\"knowledge-base-10\">10. 项目知识库<\u002fh1>\n<h2 id=\"knowledge-base-_1\">概述<\u002fh2>\n<p>Grape 为每个仓库自动维护项目知识基线（Project Graph），包含：<\u002fp>\n<ul>\n<li>项目结构和技术栈分析<\u002fli>\n<li>代码能力和依赖关系<\u002fli>\n<li>历史 Issue 和 PR 的处理记录<\u002fli>\n<\u002ful>\n<p>在 <strong>项目知识库<\u002fstrong> 页面查看和编辑。知识基线在 Agent 执行任务时作为上下文注入，帮助 Agent 更准确地理解项目。<\u002fp>\n<p>OBS 存储模式下，知识基线文件自动同步到 OBS 桶，支持多节点共享。<\u002fp>", "toc": [{"level": 2, "id": "knowledge-base-_1", "name": "概述"}], "no": "", "is_overview": false}, {"id": "faq", "title": "11. 常见问题 (FAQ)", "html": "<h1 id=\"faq-11-faq\">11. 常见问题 (FAQ)<\u002fh1>\n<h3 id=\"faq-q0\">Q0: 创建任务前需要做什么准备？为什么任务报\"无可用引擎\"？<\u002fh3>\n<blockquote class=\"card tip\">\n<p>💡 <strong>创建任务前必须先在场景中心配置并应用场景<\u002fstrong><\u002fp>\n<p>新建 Issue 触发流水线之前，必须先完成以下步骤，否则 Agent 会报 <code>engine_unavailable（无可用引擎）<\u002fcode> 导致任务失败：<\u002fp>\n<\u002fblockquote>\n<ol>\n<li><strong>进入场景中心<\u002fstrong>：选择仓库后，点击左侧导航栏的 <strong>场景中心<\u002fstrong><\u002fli>\n<li><strong>选择场景<\u002fstrong>：在下拉框中选择一个场景（默认场景 <code>default<\u002fcode> 已预置 VOD→Issue→Coding→QA→SRE 全链路 Agent 节点）<\u002fli>\n<li><strong>配置引擎<\u002fstrong>：点击 <strong>配置引擎<\u002fstrong> 按钮，为每个 Agent 节点选择要使用的引擎实例（从已注册的 Worker 引擎中选择）：<br />\n   - VOD Agent → 选择 hermes 引擎实例<br />\n   - Issue Agent → 选择 opencode 引擎实例<br />\n   - Coding Agent → 选择 opencode 引擎实例<br />\n   - QA Agent → 选择 opencode 引擎实例<br />\n   - SRE Agent → 选择 hermes 引擎实例<\u002fli>\n<li><strong>保存引擎配置<\u002fstrong>：配置完成后点击 <strong>保存引擎<\u002fstrong> 按钮<\u002fli>\n<li><strong>应用场景<\u002fstrong>：点击 <strong>应用<\u002fstrong> 按钮，将场景配置绑定到当前仓库<\u002fli>\n<\u002fol>\n<blockquote class=\"card warn\">\n<p>⚠️ <strong>注意事项<\u002fstrong><\u002fp>\n<ul>\n<li>如果没有点击\"应用\"，场景配置不会生效，Webhook 事件仍使用默认配置<\u002fli>\n<li>如果引擎未配置（engine_runtime_ids 为空），Agent 会报\"无可用引擎\"并失败<\u002fli>\n<li>配置了 engine_runtime_ids 的节点为派发硬约束：任务只落配置的引擎；候选引擎全部离线/注销时任务显式失败（不回退全局池），详见「运行时与引擎 → 指定引擎执行」（Issue #653）<\u002fli>\n<li>新增 Worker 后需要回到场景中心重新配置引擎，将新引擎分配给 Agent<\u002fli>\n<li>不同仓库可以应用不同场景（如开发仓库用 default 场景，运维仓库用自定义 SRE 场景）<\u002fli>\n<li>自定义场景：在下拉框选择\"创建自定义场景\"，配置每个 Agent 的技能（skill）、触发模式（mode）、下游路由（next）等<\u002fli>\n<\u002ful>\n<\u002fblockquote>\n<h3 id=\"faq-q1-issue\">Q1: Issue 创建后没有触发流水线？<\u002fh3>\n<p><strong>可能原因及排查：<\u002fstrong><\u002fp>\n<ol>\n<li><strong>Webhook 未配置<\u002fstrong>：检查 GitCode 仓库的 Webhook 设置，确认已配置指向 Grape 的 webhook URL（<code>https://webhook.grape.example.com/webhook/gitcode<\u002fcode>）<\u002fli>\n<li><strong>仓库未授权<\u002fstrong>：在 Grape 控制台\"GitCode 仓库\"页面确认仓库已导入<\u002fli>\n<li><strong>Webhook Secret 不匹配<\u002fstrong>：在 GitCode Webhook 设置中确认 Secret 与 Grape 配置一致<\u002fli>\n<li><strong>事件类型未勾选<\u002fstrong>：GitCode Webhook 需勾选 Issue 和 PR 相关事件<\u002fli>\n<li><strong>查看 webhook 日志<\u002fstrong>：在 GitCode Webhook 管理页面查看推送结果（HTTP 200 表示成功）<\u002fli>\n<\u002fol>\n<h3 id=\"faq-q2\">Q2: 任务状态显示\"失败\"，如何排查？<\u002fh3>\n<ol>\n<li>在 <strong>任务中心<\u002fstrong> 或 <strong>流水线<\u002fstrong> 页面点击失败的任务，查看详细日志<\u002fli>\n<li>常见失败原因：<br />\n   - <strong>exit_code=-1, duration=30s<\u002fstrong>：引擎启动失败（如 Hermes ACP 依赖缺失、CLI 路径错误）<br />\n   - <strong>exit_code=-15<\u002fstrong>：任务被信号终止（服务重启、超时 kill）<br />\n   - <strong>exit_code=1<\u002fstrong>：Agent 执行出错（代码编译失败、API 调用失败）<br />\n   - <strong>\"无可用引擎\"<\u002fstrong>：没有在线的 Worker 运行所需引擎，检查 Agent 运行时页面<\u002fli>\n<li>在 <strong>系统监控<\u002fstrong> 页面检查对应 Worker 的引擎探活状态<\u002fli>\n<li>SSH 到对应 Worker 查看 <code>journalctl -u runtime-agent<\u002fcode> 日志<\u002fli>\n<\u002fol>\n<h3 id=\"faq-q3-worker\">Q3: Worker 已安装但接不进来 / 引擎相关问题（安装、目录信任）<\u002fh3>\n<p><strong>Worker 无引擎也能注册上线（正常状态）：<\u002fstrong><\u002fp>\n<blockquote>\n<p>全新 worker 未安装任何引擎时，注册依然成功（日志 <code>RuntimeAgent registered: []<\u002fcode> 属正常）。<br />\n之后安装引擎<strong>无需重启 worker<\u002fstrong>——worker 周期性重新发现本机引擎并自动注册（≤5 分钟）。<\u002fp>\n<\u002fblockquote>\n<p><strong>安装引擎（由用户自行安装，worker 启动自动发现并注册；运行中装好引擎无需重启，周期重注册 ≤5 分钟内生效）：<\u002fstrong><\u002fp>\n<ol>\n<li><strong>opencode<\u002fstrong>：安装 Node.js 后执行 <code>npm install -g opencode-ai<\u002fcode><\u002fli>\n<li><strong>hermes<\u002fstrong>：按 Hermes Agent 官方渠道自行安装（注意：PyPI 上的 <code>hermes<\u002fcode> 包为同名无关项目，不要通过 <code>pip install hermes<\u002fcode> 安装）<\u002fli>\n<li>codearts 引擎由华为云 CodeArts CLI 提供，按官方渠道安装<\u002fli>\n<\u002fol>\n<blockquote>\n<p>一键安装脚本不安装任何执行引擎（Issue #1884）：<code>install-worker.sh<\u002fcode> 仅负责 worker 自身安装与注册。<\u002fp>\n<\u002fblockquote>\n<p><strong>目录信任（codearts，无 TTY 致命退出）：<\u002fstrong><\u002fp>\n<blockquote>\n<p>codearts CLI 的 folder-trust 闸门在 systemd/nohup 等无终端环境下，对未信任目录会直接退出（exit 1）。<\u002fp>\n<\u002fblockquote>\n<ul>\n<li>grape worker 已自动处理：per-task 数据目录与引擎探测均预写 <code>settings.json<\u002fcode> 信任配置；一行式安装脚本也会把 worker 目录合并进 <code>~/.codeartsdoer/cli-data/settings.json<\u002fcode> 的 <code>trustedFolders<\u002fcode><\u002fli>\n<li>手动安装 codearts 后如仍报\"目录不受信任\"，执行：<\u002fli>\n<\u002ful>\n<pre><code class=\"language-bash\">python3 - ~/.codeartsdoer/cli-data/settings.json ~/grape /var/cache/codearts-tasks &lt;&lt;'EOF'\nimport json, os, sys\npath, dirs = sys.argv[1], sys.argv[2:]\ns = {}\ntry:\n    s = json.load(open(path, encoding=&quot;utf-8&quot;))\nexcept Exception:\n    pass\nsec = s.get(&quot;security&quot;) if isinstance(s.get(&quot;security&quot;), dict) else {}\nft = sec.get(&quot;folderTrust&quot;) if isinstance(sec.get(&quot;folderTrust&quot;), dict) else {}\nft.setdefault(&quot;enabled&quot;, True)\nfolders = sec.get(&quot;trustedFolders&quot;) if isinstance(sec.get(&quot;trustedFolders&quot;), list) else []\nfor d in dirs:\n    if d and d not in folders:\n        folders.append(d)\nsec[&quot;folderTrust&quot;], sec[&quot;trustedFolders&quot;] = ft, folders\ns[&quot;security&quot;] = sec\njson.dump(s, open(path, &quot;w&quot;, encoding=&quot;utf-8&quot;), indent=2)\nEOF\n<\u002fcode><\u002fpre>\n<p><strong>worker 接不进来（server_base_url 双语义，Issue #471 E1）：<\u002fstrong><\u002fp>\n<blockquote>\n<p>单一 <code>server_base_url<\u002fcode> 同时承担\"浏览器回调地址\"与\"worker 回连地址\"两个语义，双地址部署（浏览器公网域名 ≠ worker 可达地址）时必然配错。<\u002fp>\n<\u002fblockquote>\n<p>在 <code>configs/server-config.json<\u002fcode> 分别配置（未配置回退 <code>server_base_url<\u002fcode>）：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;browser_callback_url&quot;: &quot;https://grape.example.com&quot;,\n  &quot;worker_connect_url&quot;: &quot;https://worker.grape.example.com&quot;\n}\n<\u002fcode><\u002fpre>\n<p>配置后重启服务；<code>GET /api/health<\u002fcode> 返回两个字段与 <code>url_split_warning<\u002fcode> 告警可用于自检。只配这两个拆分项（不配 <code>server_base_url<\u002fcode>）即视为基址已配置，健康检查与启动日志不会误报「server_base_url 未配置」；拆分项指向 localhost 等回环地址时按对应面（浏览器回调 / worker 回连）给出告警。<\u002fp>\n<h3 id=\"faq-q4\">Q4: 控制台页面显示\"加载中...\"不消失？<\u002fh3>\n<p><strong>排查步骤：<\u002fstrong><\u002fp>\n<ol>\n<li><strong>强制刷新<\u002fstrong>：按 Ctrl+Shift+R 强制刷新页面，清除浏览器缓存的旧版 JS<\u002fli>\n<li><strong>检查网络<\u002fstrong>：确认能访问 Grape 域名（如 <code>grape.example.com<\u002fcode>）<\u002fli>\n<li><strong>检查登录状态<\u002fstrong>：如果 token 过期，页面会跳转到登录页<\u002fli>\n<li><strong>检查后端服务<\u002fstrong>：直接访问 <code>https://&lt;域名&gt;/health<\u002fcode> 确认服务在线<\u002fli>\n<li><strong>查看浏览器控制台<\u002fstrong>：F12 打开开发者工具，查看 Network 标签中是否有请求超时<\u002fli>\n<\u002fol>\n<h3 id=\"faq-q5-agent\">Q5: Agent 执行的任务一直卡在\"运行中\"？<\u002fh3>\n<ol>\n<li><strong>任务超时<\u002fstrong>：Worker 默认任务超时 30 分钟，超时后自动标记失败<\u002fli>\n<li><strong>Worker 离线<\u002fstrong>：检查系统监控中对应 Worker 是否在线（心跳是否正常）<\u002fli>\n<li><strong>引擎卡死<\u002fstrong>：可能是 AI 模型 API 限流或网络中断，检查 Worker 日志<\u002fli>\n<li><strong>手动处理<\u002fstrong>：在流水线页面点击\"重试\"重新执行，或在 Issue 评论区重新触发<\u002fli>\n<li><strong>清理僵尸任务<\u002fstrong>：联系管理员在数据库中执行 <code>UPDATE events SET status='failed', exit_code=-15 WHERE status='running' AND started_at &lt; ...<\u002fcode><\u002fli>\n<\u002fol>\n<h3 id=\"faq-q6-worker\">Q6: 如何添加新的 Worker 机器？<\u002fh3>\n<ol>\n<li>在目标机器上安装 Python 3.10+ 和所需 AI CLI（opencode/hermes/codearts）<\u002fli>\n<li>在 Grape 控制台 <strong>Agent 运行时<\u002fstrong> → <strong>通用设置<\u002fstrong> 中创建新的 Worker 凭据<\u002fli>\n<li>在目标机器执行一键安装命令：<\u002fli>\n<\u002fol>\n<p><code>bash\n   curl -fsSL https://&lt;grape域名&gt;/api/runtime/install | bash -s -- --token &lt;rta_...&gt; --server https://&lt;grape域名&gt;<\u002fcode><\u002fp>\n<ol start=\"4\">\n<li>安装完成后 Worker 自动注册，在运行时页面可见<\u002fli>\n<li>确认引擎探活状态为 ✅<\u002fli>\n<\u002fol>\n<h3 id=\"faq-q7-pendingfail\">Q7: 引擎探活显示\"pending\"或\"fail\"？<\u002fh3>\n<p><strong>pending（等待）<\u002fstrong>：引擎刚注册，等待首次探活（每 10 分钟执行一次）。等待几分钟后刷新即可。<\u002fp>\n<p><strong>fail（失败）<\u002fstrong>：<\u002fp>\n<ul>\n<li>检查引擎 CLI 是否已安装：<code>which opencode<\u002fcode> / <code>which hermes<\u002fcode><\u002fli>\n<li>手动测试：<code>opencode run \"hello\"<\u002fcode> 或 <code>hermes chat -q \"hello\" --yolo<\u002fcode><\u002fli>\n<li>检查 AI 模型 API Key 是否配置正确（<code>/etc/grape/grape.env<\u002fcode> 或 <code>~/.hermes/.env<\u002fcode>）<\u002fli>\n<li>如果使用 hermes 引擎，确认已安装 ACP 依赖：<code>hermes acp<\u002fcode> 应输出 \"ACP client connected\"<\u002fli>\n<\u002ful>\n<h3 id=\"faq-q8-sre-agent\">Q8: SRE Agent 销毁云资源时需要注意什么？<\u002fh3>\n<blockquote class=\"card warn\">\n<p>🚨 <strong>⚠️ 安全提示<\u002fstrong><\u002fp>\n<p>SRE Agent 执行资源销毁前<strong>必须经过用户确认<\u002fstrong>。流程如下：<\u002fp>\n<\u002fblockquote>\n<ol>\n<li>用户创建 Issue 要求销毁资源<\u002fli>\n<li>SRE Agent 查询并列出所有待销毁资源清单，在 Issue 评论区发布<\u002fli>\n<li>用户在评论区回复\"全部销毁\"或指定资源确认<\u002fli>\n<li>SRE Agent 确认后执行销毁操作<\u002fli>\n<li>销毁完成后在 Issue 评论区发布验证结果<\u002fli>\n<\u002fol>\n<p>如果需要中止销毁，在确认前关闭 Issue 或在评论区回复\"取消\"即可。<\u002fp>\n<h3 id=\"faq-q9-agent\">Q9: 如何查看 Agent 的详细执行日志？<\u002fh3>\n<ul>\n<li><strong>控制台<\u002fstrong>：在任务中心/流水线页面点击任务行，弹出日志详情弹窗，显示每一步的思考和工具调用<\u002fli>\n<li><strong>Worker 日志<\u002fstrong>：SSH 到 Worker 机器执行 <code>journalctl -u runtime-agent -n 100 --no-pager<\u002fcode><\u002fli>\n<li><strong>服务端日志<\u002fstrong>：在系统监控页面查看错误日志来源，或 SSH 到主服务器查看 <code>/opt/grape/data/main.log<\u002fcode><\u002fli>\n<li><strong>数据库<\u002fstrong>：事件的 <code>result<\u002fcode> 字段包含 Agent 的最终输出摘要<\u002fli>\n<\u002ful>\n<h3 id=\"faq-q10-coding-agent-pr\">Q10: Coding Agent 提交的 PR 需要手动合并吗？<\u002fh3>\n<p>是的。Coding Agent 提交 PR 后，QA Agent 会自动审查并给出意见，但<strong>PR 合并需要仓库维护者手动操作<\u002fstrong>。这是设计上的安全机制——AI 可以编写代码和提交 PR，但代码合入主线需要人工确认。<\u002fp>\n<p>在 GitCode 的 PR 页面可以查看 QA Agent 的审查意见和代码变更，确认后点击\"合并\"即可。<\u002fp>\n<h3 id=\"faq-q11-ai-api-key\">Q11: 如何配置 AI 模型的 API Key？<\u002fh3>\n<p>AI 模型配置在以下位置：<\u002fp>\n<ul>\n<li><strong>主服务器<\u002fstrong>：<code>/etc/grape/grape.env<\u002fcode> 中的 <code>HERMES_CUSTOM_API_DEEPSEEK_COM_API_KEY<\u002fcode><\u002fli>\n<li><strong>Worker<\u002fstrong>：<code>~/.hermes/.env<\u002fcode> 中的 <code>HERMES_CUSTOM_OPENGW_CLOUDDEVELOPER_CLUB_API_KEY<\u002fcode><\u002fli>\n<li><strong>opencode<\u002fstrong>：<code>~/.config/opencode/opencode.json<\u002fcode> 中的 <code>apiKey<\u002fcode><\u002fli>\n<\u002ful>\n<p>修改后需重启对应服务（主服务器：grape-main/grape-webhook；Worker：runtime-agent）。<\u002fp>\n<h3 id=\"faq-q12\">Q12: 如何为仓库配置自定义技能？<\u002fh3>\n<ol>\n<li>在 <strong>DevOps 技能<\u002fstrong> 页面点击\"创建技能\"<\u002fli>\n<li>选择作用域：仓库级（选择目标仓库）或全局<\u002fli>\n<li>编写 SKILL.md：包含 <code>name<\u002fcode>、<code>description<\u002fcode>（触发条件）、<code>steps<\u002fcode>（执行步骤）<\u002fli>\n<li>可选：添加 <code>references/<\u002fcode>（参考文档）、<code>scripts/<\u002fcode>（脚本）、<code>templates/<\u002fcode>（模板）<\u002fli>\n<li>保存后技能自动分发到 OBS（如已启用），Worker 执行时自动下载<\u002fli>\n<\u002fol>\n<h3 id=\"faq-q13-worker-tmp\">Q13: 系统监控中 Worker 的 tmp 百分比很高怎么办？<\u002fh3>\n<p>Worker 的 <code>/tmp<\u002fcode> 目录可能被 AI 引擎运行时生成的 JIT 缓存文件（隐藏 <code>.so<\u002fcode> 文件）占满。症状：scp 传输文件报 \"No space left on device\"，但 Worker 运行正常。<\u002fp>\n<p><strong>清理方法<\u002fstrong>（在 Worker 上执行）：<\u002fp>\n<pre><code class=\"language-bash\">find /tmp -maxdepth 1 -name &quot;.*.so&quot; -delete\n<\u002fcode><\u002fpre>\n<p>建议定期清理所有 Worker 的 /tmp 目录。如果频繁占满，可以在 crontab 中添加定时清理任务。<\u002fp>", "toc": [{"level": 3, "id": "faq-q0", "name": "Q0: 创建任务前需要做什么准备？为什么任务报\"无可用引擎\"？"}, {"level": 3, "id": "faq-q1-issue", "name": "Q1: Issue 创建后没有触发流水线？"}, {"level": 3, "id": "faq-q2", "name": "Q2: 任务状态显示\"失败\"，如何排查？"}, {"level": 3, "id": "faq-q3-worker", "name": "Q3: Worker 已安装但接不进来 / 引擎相关问题（安装、目录信任）"}, {"level": 3, "id": "faq-q4", "name": "Q4: 控制台页面显示\"加载中...\"不消失？"}, {"level": 3, "id": "faq-q5-agent", "name": "Q5: Agent 执行的任务一直卡在\"运行中\"？"}, {"level": 3, "id": "faq-q6-worker", "name": "Q6: 如何添加新的 Worker 机器？"}, {"level": 3, "id": "faq-q7-pendingfail", "name": "Q7: 引擎探活显示\"pending\"或\"fail\"？"}, {"level": 3, "id": "faq-q8-sre-agent", "name": "Q8: SRE Agent 销毁云资源时需要注意什么？"}, {"level": 3, "id": "faq-q9-agent", "name": "Q9: 如何查看 Agent 的详细执行日志？"}, {"level": 3, "id": "faq-q10-coding-agent-pr", "name": "Q10: Coding Agent 提交的 PR 需要手动合并吗？"}, {"level": 3, "id": "faq-q11-ai-api-key", "name": "Q11: 如何配置 AI 模型的 API Key？"}, {"level": 3, "id": "faq-q12", "name": "Q12: 如何为仓库配置自定义技能？"}, {"level": 3, "id": "faq-q13-worker-tmp", "name": "Q13: 系统监控中 Worker 的 tmp 百分比很高怎么办？"}], "no": "", "is_overview": false}, {"id": "ai-shell-devbridge-deploy", "title": "12. AI Shell + DevBridge 快速部署", "html": "<h1 id=\"ai-shell-devbridge-deploy-12-ai-shell-devbridge\">12. AI Shell + DevBridge 快速部署<\u002fh1>\n<blockquote>\n<p>目标：30 分钟内跑通「提交一个部署需求 → AI 自动部署 → 拿到公网链接」的完整体验。<br />\n适合首次体验 Grape 部署能力的用户，无需准备任何服务器。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"ai-shell-devbridge-deploy-_1\">整体流程<\u002fh2>\n<pre><code>配置 AK/SK → 创建 AI DevSpace 设备 → 设备接入（AI Shell 引擎上线）\n→ 场景中心应用「Hello World 部署」场景 → 需求中心下部署需求\n→ 流水线执行 → SRE 通过 DevBridge 部署 → 返回公网链接\n<\u002fcode><\u002fpre>\n<h2 id=\"ai-shell-devbridge-deploy-1-aksk\">1. 配置华为云 AK/SK<\u002fh2>\n<p>DevBridge 公网访问依赖华为云凭据，先在平台完成配置。<\u002fp>\n<ol>\n<li>登录 Grape 平台，进入 <strong>账户设置 → 凭据<\u002fstrong>（Credentials）页签。<\u002fli>\n<li>填写华为云 <strong>Access Key Id（AK）<\u002fstrong> 与 <strong>Secret Access Key（SK）<\u002fstrong>，保存。<br />\n   - 获取入口：<a href=\"https://console.huaweicloud.com/iam/?locale=zh-cn#/mine/accessKey\">华为云控制台 → 我的凭证 → 访问密钥<\u002fa><br />\n   - 没有密钥就点「新增访问密钥」，下载的 CSV 文件里包含 AK/SK。<\u002fli>\n<li>保存成功后凭据仅对你本人生效（存储加密，页面回显掩码）。<\u002fli>\n<\u002fol>\n<blockquote class=\"card tip\">\n<p>💡 AK/SK 只用于 SRE 部署环节申请临时凭据（STS），不会下发给 Coding/QA 等其他 Agent。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"ai-shell-devbridge-deploy-2-ai-devspace\">2. 创建 AI DevSpace 设备<\u002fh2>\n<p>AI DevSpace 是华为云云开发环境，创建后自动注册为 Grape 的 Worker 设备，无需自备机器。<\u002fp>\n<ol>\n<li>进入 <strong>运行时<\u002fstrong> 页面，切换到 <strong>AI DevSpace<\u002fstrong> 标签。<\u002fli>\n<li>点击右上角 <strong>创建<\u002fstrong> 按钮。<\u002fli>\n<li>等待环境状态变为 <strong>运行中<\u002fstrong>（首次创建约 1-3 分钟；账号首次使用需签署 CodeArts 开发环境服务协议，页面会给出指引链接）。<\u002fli>\n<li>环境就绪后，安装脚本会自动执行：设备以你的账号注册为个人级（user scope）Worker，并自动注册其内置引擎。<\u002fli>\n<\u002fol>\n<blockquote class=\"card tip\">\n<p>💡 数量上限与计费遵循华为云 CodeArts 开发环境服务的账号配额；不再使用时可在同一页面停止/删除环境。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"ai-shell-devbridge-deploy-3-ai-shell\">3. 确认 AI Shell 引擎已接入<\u002fh2>\n<p>设备接入后，它携带的引擎会出现在平台引擎列表中。<\u002fp>\n<ol>\n<li>进入 <strong>运行时 → 引擎<\u002fstrong> 列表（或系统监控）。<\u002fli>\n<li>找到你的 DevSpace 设备名下的 <strong>AI Shell<\u002fstrong> 引擎，确认状态为 <strong>在线<\u002fstrong>。<\u002fli>\n<li>在线即代表该引擎已可承接 SRE 任务（DevBridge 部署由 AI Shell 引擎执行）。<\u002fli>\n<\u002fol>\n<blockquote class=\"card tip\">\n<p>💡 引擎 15 秒内自动上报心跳；若长时间不在线，回到 AI DevSpace 页面确认环境处于运行中状态。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"ai-shell-devbridge-deploy-4-hello-world\">4. 在场景中心应用「Hello World 部署」场景<\u002fh2>\n<ol>\n<li>进入 <strong>场景中心<\u002fstrong>（Scene Market）。<\u002fli>\n<li>找到 <strong>Hello World 部署<\u002fstrong> 场景——从需求到部署的完整流水线演示，SRE 环节使用华为云 DevBridge 部署技能，适合首次体验。<\u002fli>\n<li>点击 <strong>应用<\u002fstrong>，选择目标仓库（示例模板推荐 <code>hello-flask<\u002fcode>，也可以用你自己的 Web 项目仓库）。<\u002fli>\n<li>应用后该仓库的流水线即按此场景执行：VOD → Issue → Coding → QA → SRE。<\u002fli>\n<\u002fol>\n<blockquote class=\"card tip\">\n<p>💡 应用场景只影响当前仓库；其他仓库不受影响，可随时在场景中心更换。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"ai-shell-devbridge-deploy-5\">5. 在需求中心下发部署需求<\u002fh2>\n<ol>\n<li>进入 <strong>需求中心<\u002fstrong>（Issues），选择已应用场景的仓库。<\u002fli>\n<li>新建一个需求，标题示例：<\u002fli>\n<\u002fol>\n<blockquote>\n<p>帮我部署本项目，并可公网访问<\u002fp>\n<\u002fblockquote>\n<ol start=\"3\">\n<li>提交后流水线自动启动：<br />\n   - <strong>VOD<\u002fstrong>：分析需求，路由为部署类任务<br />\n   - <strong>Issue<\u002fstrong>：细化执行方案<br />\n   - <strong>Coding<\u002fstrong>：准备项目（如需构建则完成构建）<br />\n   - <strong>QA<\u002fstrong>：快速校验<br />\n   - <strong>SRE<\u002fstrong>：AI Shell 引擎执行 DevBridge 部署——拉取代码、识别项目类型（Flask / Node.js / 静态页面）、安装依赖、启动服务、建立公网隧道<\u002fli>\n<li>每个阶段可在任务详情中查看执行过程与日志。<\u002fli>\n<\u002fol>\n<h2 id=\"ai-shell-devbridge-deploy-6\">6. 获取公网链接<\u002fh2>\n<p>SRE 阶段执行完成后，任务结果中会返回一个 <strong>公网访问链接<\u002fstrong>（形如 <code>https://xxxx.devbridge-s2.hwtunnel.com<\u002fcode>）。<\u002fp>\n<ul>\n<li>点击链接即可在浏览器中访问并体验部署成果。<\u002fli>\n<li>链接有效期以隧道配置为准，到期后可重新下发部署需求再次获取。<\u002fli>\n<\u002ful>\n<h2 id=\"ai-shell-devbridge-deploy-_2\">常见问题<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>问题<\u002fth>\n<th>处理<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>创建 DevSpace 提示未签署协议<\u002ftd>\n<td>按页面指引签署 CodeArts 开发环境服务协议后重试<\u002ftd>\n<\u002ftr>\n<tr>\n<td>AI Shell 引擎不在线<\u002ftd>\n<td>确认 DevSpace 环境运行中；等待 15 秒心跳刷新<\u002ftd>\n<\u002ftr>\n<tr>\n<td>SRE 阶段失败提示凭据问题<\u002ftd>\n<td>回到账户设置检查 AK/SK 是否有效、是否有足够权限<\u002ftd>\n<\u002ftr>\n<tr>\n<td>公网链接打不开<\u002ftd>\n<td>链接可能已过期，重新下发一次部署需求<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>", "toc": [{"level": 2, "id": "ai-shell-devbridge-deploy-_1", "name": "整体流程"}, {"level": 2, "id": "ai-shell-devbridge-deploy-1-aksk", "name": "1. 配置华为云 AK/SK"}, {"level": 2, "id": "ai-shell-devbridge-deploy-2-ai-devspace", "name": "2. 创建 AI DevSpace 设备"}, {"level": 2, "id": "ai-shell-devbridge-deploy-3-ai-shell", "name": "3. 确认 AI Shell 引擎已接入"}, {"level": 2, "id": "ai-shell-devbridge-deploy-4-hello-world", "name": "4. 在场景中心应用「Hello World 部署」场景"}, {"level": 2, "id": "ai-shell-devbridge-deploy-5", "name": "5. 在需求中心下发部署需求"}, {"level": 2, "id": "ai-shell-devbridge-deploy-6", "name": "6. 获取公网链接"}, {"level": 2, "id": "ai-shell-devbridge-deploy-_2", "name": "常见问题"}], "no": "", "is_overview": false}, {"id": "server-environment-variables", "title": "13. 服务端环境变量速查表", "html": "<h1 id=\"server-environment-variables-13\">13. 服务端环境变量速查表<\u002fh1>\n<blockquote>\n<p>面向：Grape 服务端部署与运维。列出服务端读取的环境变量、含义、默认值与出处。<br />\n敏感信息：本文只列<strong>变量名与功能语义<\u002fstrong>，不含任何真实密钥值；示例一律 <code>&lt;xxx&gt;<\u002fcode> 占位。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"server-environment-variables-_1\">〇、约定<\u002fh2>\n<ul>\n<li><strong>默认值<\u002fstrong>：来自代码（<code>config.py<\u002fcode> 等）的 <code>os.environ.get(\"X\", &lt;默认&gt;)<\u002fcode>，未设置时取其默认。<\u002fli>\n<li><strong>出处<\u002fstrong>：变量在代码中读取的模块（如 <code>config.py<\u002fcode>、<code>auth/providers.py<\u002fcode>），供排查定位。<\u002fli>\n<li><strong>注入方式<\u002fstrong>：systemd <code>Environment=<\u002fcode>、<code>configs/security.json<\u002fcode>（安全类）、<code>configs/*.json<\u002fcode>、根目录 <code>.env<\u002fcode>（<code>src/api/run.py<\u002fcode> 用 <code>os.environ.setdefault<\u002fcode> 加载，<strong>不覆盖已存在的环境变量<\u002fstrong>）。<\u002fli>\n<li>完整清单以代码为准；本文覆盖 <code>src/<\u002fcode> 全部 <code>os.environ.get/getenv<\u002fcode> 读取点（审计于 <code>2026-10-20<\u002fcode>）。<\u002fli>\n<\u002ful>\n<hr />\n<h2 id=\"server-environment-variables-_2\">一、核心安全类<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>作用<\u002fth>\n<th>默认<\u002fth>\n<th>出处<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>JWT_SECRET<\u002fcode><\u002ftd>\n<td>JWT 签名密钥（HS256）。未配置时生产拒绝启动（fail-closed）；开发/测试回退进程内随机密钥<\u002ftd>\n<td>空<\u002ftd>\n<td><code>api/jwt_utils.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>COOKIE_SECURE<\u002fcode><\u002ftd>\n<td>refresh_token cookie 的 Secure 标志。生产 HTTPS 必须 <code>true<\u002fcode>；开发 HTTP 配 <code>false<\u002fcode><\u002ftd>\n<td><code>true<\u002fcode><\u002ftd>\n<td><code>config.py<\u002fcode>、<code>api/main.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>TRUSTED_HOSTS<\u002fcode><\u002ftd>\n<td>Host 白名单（逗号分隔）。OAuth redirect_uri fallback 时校验 Host header，防开放重定向；不在白名单回退首个可信 Host<\u002ftd>\n<td>空（不校验）<\u002ftd>\n<td><code>auth/providers.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>TRUSTED_PROXY_IPS<\u002fcode><\u002ftd>\n<td>可信反向代理 IP（用于客户端来源判定）<\u002ftd>\n<td>空<\u002ftd>\n<td><code>api/routes/grape_auth.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_DEV_VERIFICATION_CODE<\u002fcode><\u002ftd>\n<td>开发/测试固定验证码（非生产可用）；生产启用会绕过真实邮件验证码<\u002ftd>\n<td>空<\u002ftd>\n<td><code>config.py<\u002fcode>、<code>auth/email_service.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote class=\"card warn\">\n<p>生产安全门禁（<code>api/main.py<\u002fcode>）按 <code>configs/security.json<\u002fcode> 的 <code>env<\u002fcode> 字段判定：仅字面 <code>production<\u002fcode> 触发全量检查（JWT 强密钥 + 密钥轮换池 + 邮件 + 凭据加密 + COOKIE_SECURE + OAuth redirect_uri）。<code>JWT_SECRET<\u002fcode> 与 <code>security.json<\u002fcode> 相互独立：前者决定签名密钥是否稳定，后者决定门禁开关。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"server-environment-variables-_3\">二、邮件服务（生产门禁必需）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>作用<\u002fth>\n<th>默认<\u002fth>\n<th>出处<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>SMTP_HOST<\u002fcode><\u002ftd>\n<td>SMTP 服务器地址（与 <code>configs/email.json<\u002fcode> 二选一）<\u002ftd>\n<td>空<\u002ftd>\n<td><code>config.py<\u002fcode>、<code>api/main.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>SMTP_PORT<\u002fcode><\u002ftd>\n<td>SMTP 端口<\u002ftd>\n<td><code>25<\u002fcode><\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>SMTP_USERNAME<\u002fcode><\u002ftd>\n<td>SMTP 认证用户名<\u002ftd>\n<td>空<\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>SMTP_PASSWORD<\u002fcode><\u002ftd>\n<td>SMTP 认证密码<\u002ftd>\n<td>空<\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>SMTP_TLS<\u002fcode><\u002ftd>\n<td>SMTP 是否启用 TLS<\u002ftd>\n<td><code>true<\u002fcode><\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>SMTP_FROM_EMAIL<\u002fcode><\u002ftd>\n<td>发件人地址（默认见 <code>config.py<\u002fcode>）<\u002ftd>\n<td>代码默认<\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>RESEND_API_KEY<\u002fcode><\u002ftd>\n<td>Resend 邮件 API Key（与 SMTP 二选一）<\u002ftd>\n<td>空<\u002ftd>\n<td><code>config.py<\u002fcode>、<code>api/main.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"server-environment-variables-_4\">三、数据库<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>作用<\u002fth>\n<th>默认<\u002fth>\n<th>出处<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>DEVOPS_DB_BACKEND<\u002fcode><\u002ftd>\n<td>后端类型 <code>sqlite<\u002fcode> / <code>mysql<\u002fcode><\u002ftd>\n<td>读 <code>configs/db-backend.json<\u002fcode><\u002ftd>\n<td><code>mysql_compat.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DEVOPS_DB_URL<\u002fcode><\u002ftd>\n<td>MySQL 连接 URL（可含用户名密码）<\u002ftd>\n<td>空<\u002ftd>\n<td><code>mysql_compat.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DEVOPS_DB_HOST<\u002fcode> / <code>PORT<\u002fcode> / <code>USER<\u002fcode> / <code>PASSWORD<\u002fcode> / <code>NAME<\u002fcode><\u002ftd>\n<td>MySQL 连接拆分参数<\u002ftd>\n<td>从配置文件取默认<\u002ftd>\n<td><code>mysql_compat.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DEVOPS_DB_PATH<\u002fcode><\u002ftd>\n<td>SQLite 库路径<\u002ftd>\n<td><code>data/sessions.db<\u002fcode><\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DB_POOL_MIN<\u002fcode> / <code>MAX_CACHED<\u002fcode> / <code>MAX_CONNECTIONS<\u002fcode><\u002ftd>\n<td>DB 连接池参数<\u002ftd>\n<td><code>2<\u002fcode>/<code>16<\u002fcode>/<code>32<\u002fcode><\u002ftd>\n<td><code>mysql_compat.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DB_POOL_DISABLED<\u002fcode><\u002ftd>\n<td>禁用连接池<\u002ftd>\n<td>继承环境<\u002ftd>\n<td><code>mysql_compat.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DB_BACKUP_KEEP<\u002fcode><\u002ftd>\n<td>保留 DB 备份份数<\u002ftd>\n<td>代码默认<\u002ftd>\n<td><code>session_manager.py< <code>api/knowledge.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>KNOWLEDGE_MAX_CONTENT_BYTES<\u002fcode><\u002ftd>\n<td>知识正文大小上限（默认 100KB）<\u002ftd>\n<td><code>102400<\u002fcode><\u002ftd>\n<td><code>api/routes/knowledge.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_LINKED_REPOS<\u002fcode><\u002ftd>\n<td>关联仓库信任域配置<\u002ftd>\n<td>空<\u002ftd>\n<td><code>prompt_builder.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"server-environment-variables-ai-vlm\">九、AI 模型 / VLM / 云凭据（服务端）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>作用<\u002fth>\n<th>默认<\u002fth>\n<th>出处<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>VLM_BASE_URL<\u002fcode> / <code>VLM_API_KEY<\u002fcode> / <code>VLM_MODEL<\u002fcode> / <code>VLM_MAX_TOKENS<\u002fcode><\u002ftd>\n<td>图片理解 VLM 配置<\u002ftd>\n<td>空/代码默认<\u002ftd>\n<td><code>agent/image_understanding.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>HWCLOUD_PROVIDER_BASE_URL<\u002fcode> / <code>API_KEY<\u002fcode> / <code>MODELS<\u002fcode><\u002ftd>\n<td>华为云 provider<\u002ftd>\n<td>空<\u002ftd>\n<td><code>agent/hwcloud_acp.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>CODEARTS_MODEL<\u002fcode><\u002ftd>\n<td>CodeArts 模型<\u002ftd>\n<td>空<\u002ftd>\n<td><code>runtime/codearts.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_DEVSTAGE_FLAVOR_ID<\u002fcode> / <code>CORES<\u002fcode> / <code>MEMORY<\u002fcode><\u002ftd>\n<td>DevStage 模板规格<\u002ftd>\n<td>代码默认<\u002ftd>\n<td><code>api/routes/devstage.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>DEVOPS_DEVSTAGE_BASE_URL<\u002fcode><\u002ftd>\n<td>DevStage 服务地址<\u002ftd>\n<td>空<\u002ftd>\n<td><code>im/devstage_client.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"server-environment-variables-_7\">十、管理 / 部署<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>作用<\u002fth>\n<th>默认<\u002fth>\n<th>出处<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>GRAPE_ADMIN_PASSWORD<\u002fcode><\u002ftd>\n<td>admin 初始化密码（首启）<\u002ftd>\n<td>代码默认提示<\u002ftd>\n<td><code>api/db_setup.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>ADMIN_CONSOLE_URL<\u002fcode> / <code>ADMIN_BETA_APPLY_API_KEY<\u002fcode><\u002ftd>\n<td>管理台地址 / 申请 API key<\u002ftd>\n<td>空<\u002ftd>\n<td><code>config.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>ADMIN_DB_HOST<\u002fcode> / <code>PORT<\u002fcode> / <code>USER<\u002fcode> / <code>PASSWORD<\u002fcode> / <code>NAME<\u002fcode><\u002ftd>\n<td>管理台独立库（admin-db-split）<\u002ftd>\n<td>空<\u002ftd>\n<td><code>featured_order.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GIT_COMMIT<\u002fcode><\u002ftd>\n<td>构建时注入的提交号（监控展示）<\u002ftd>\n<td>空<\u002ftd>\n<td><code>observability/__init__.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>METRICS_ADDR<\u002fcode><\u002ftd>\n<td>监控指标暴露地址<\u002ftd>\n<td>代码默认<\u002ftd>\n<td><code>observability/__init__.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_DRAIN_FILE<\u002fcode><\u002ftd>\n<td>worker 停机摘流标记路径（存在即 <code>/readyz<\u002fcode> 503）<\u002ftd>\n<td><code>/tmp/grape-worker-draining<\u002fcode><\u002ftd>\n<td><code>api/drain_state.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_MAIN_DRAIN_FILE<\u002fcode><\u002ftd>\n<td>main+webhook 停机摘流标记路径（与 worker 隔离）<\u002ftd>\n<td><code>/tmp/grape-main-webhook-draining<\u002fcode><\u002ftd>\n<td><code>api/drain_state.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_DRAIN_SECONDS<\u002fcode><\u002ftd>\n<td>摘流后等待排空秒数（负数归零）<\u002ftd>\n<td><code>5<\u002fcode><\u002ftd>\n<td><code>api/drain_state.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_WORKER_PORT<\u002fcode><\u002ftd>\n<td>worker 端口（systemd 摘流/readiness 脚本使用）<\u002ftd>\n<td><code>38082<\u002fcode><\u002ftd>\n<td><code>deploy/systemd/grape-worker-*.sh<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_READY_TIMEOUT<\u002fcode><\u002ftd>\n<td>启动 readiness 轮询超时秒数<\u002ftd>\n<td><code>60<\u002fcode><\u002ftd>\n<td><code>deploy/systemd/grape-worker-ready.sh<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_CLIENT_RETRY_JITTER<\u002fcode><\u002ftd>\n<td>客户端指数退避抖动比例（0~0.5）<\u002ftd>\n<td><code>0.2<\u002fcode><\u002ftd>\n<td><code>domains/runtime/engine/client.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_CLIENT_RETRY_BUDGET_SECONDS<\u002fcode><\u002ftd>\n<td>单次请求重试总时长上限（0=不限）<\u002ftd>\n<td><code>90<\u002fcode><\u002ftd>\n<td><code>domains/runtime/engine/client.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>HEALTH_HEARTBEAT_MISSES_THRESHOLD<\u002fcode><\u002ftd>\n<td>连续错过 N 个心跳间隔判离线（与静态阈值取大）<\u002ftd>\n<td><code>3<\u002fcode><\u002ftd>\n<td><code>domains/runtime/engine/health_scorer.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<h2 id=\"server-environment-variables-_8\">十一、联网 / 代理<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>环境变量<\u002fth>\n<th>作用<\u002fth>\n<th>默认<\u002fth>\n<th>出处<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>HTTPS_PROXY<\u002fcode> / <code>https_proxy<\u002fcode><\u002ftd>\n<td>OAuth / 配置拉取的 HTTPS 代理<\u002ftd>\n<td>空<\u002ftd>\n<td><code>auth/providers.py<\u002fcode>、<code>admin/config_store.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>PIP_INDEX_URL<\u002fcode><\u002ftd>\n<td>worker 打包时 pip 源<\u002ftd>\n<td>空<\u002ftd>\n<td><code>worker_package.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>UV_PYTHON_DIR<\u002fcode><\u002ftd>\n<td>uv python 目录<\u002ftd>\n<td>空<\u002ftd>\n<td><code>worker_package.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GRAPE_CLI_REPO<\u002fcode><\u002ftd>\n<td>worker CLI 仓库地址<\u002ftd>\n<td>代码默认<\u002ftd>\n<td><code>worker_package.py<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>GITHUB_TOKEN<\u002fcode> / <code>GITCODE_PAT<\u002fcode><\u002ftd>\n<td>模板拉取用 GitHub/GitCode 个人 token<\u002ftd>\n<td>空<\u002ftd>\n<td><code>api/routes/templates.py,110<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"server-enviro
