全系统唯一持明文处，不落明文文件），格子行只存 vault 句柄；重置同格时句柄引用稳定。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-delete-apiorgsorg_idov-credentialsuser_id-orgs_ov_credential_delete\">DELETE /api/orgs/{org_id}/ov-credentials/{user_id} — orgs_ov_credential_delete<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>吊销一格（user_id×org）：格子行与 vault 明文行同事务删除，吊销台账落一笔；执行期兑换每次实时解析、无缓存副本——吊销即刻生效、不可复活。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h2 id=\"16-auth-and-misc-apiorgsorg_idrepo-analysis\">组织仓库分析（/api/orgs/{org_id}/repo-analysis）<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apiorgsorg_idrepo-analysistargets-org_repo_analysis_targets\">GET /api/orgs/{org_id}/repo-analysis/targets — org_repo_analysis_targets<\u002fh3>\n<blockquote>\n<p>scope：<code>dual<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>列出组织内可用于 AI 分析的仓库目标（含可分析性判定），组织看板与 CLI 共用。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiorgsorg_idrepo-analysiscontextrepo_key-org_repo_analysis_context\">GET /api/orgs/{org_id}/repo-analysis/context/{repo_key} — org_repo_analysis_context<\u002fh3>\n<blockquote>\n<p>scope：<code>dual<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>取某仓库的组织上下文快照（成员/项目/仓库关系），供组织分析流水线拼提示词。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apiorgsorg_idrepo-analysisrun-org_repo_analysis_run\">POST /api/orgs/{org_id}/repo-analysis/run — org_repo_analysis_run<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>发起一次组织分析（异步）：落分析任务并派发，返回 task_id；进度用 status 端点查。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiorgsorg_idrepo-analysisstatus-org_repo_analysis_status\">GET /api/orgs/{org_id}/repo-analysis/status — org_repo_analysis_status<\u002fh3>\n<blockquote>\n<p>scope：<code>dual<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>查组织分析任务进度（排队/执行/完成/失败），失败回原因，不吞异常。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apiorgsorg_idrepo-analysisautomationensure-org_repo_analysis_automation_ensure\">POST /api/orgs/{org_id}/repo-analysis/automation/ensure — org_repo_analysis_automation_ensure<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>确保组织分析自动化已配置（定时任务/流水线挂点幂等创建）。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiorgsorg_idrepo-analysisdocs-org_repo_analysis_docs\">GET /api/orgs/{org_id}/repo-analysis/docs — org_repo_analysis_docs<\u002fh3>\n<blockquote>\n<p>scope：<code>dual<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>列出组织分析产出文档（设计说明/报告）及索引。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apiorgsorg_idrepo-maprepo_keyai-result-org_repo_map_ai_result\">POST /api/orgs/{org_id}/repo-map/{repo_key}/ai-result — org_repo_map_ai_result<\u002fh3>\n<blockquote>\n<p>scope：<code>dual<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>接收某仓库的 AI 仓库地图生成结果（写入组织仓库地图，供看板可视化）。<\u002fp>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>", "toc": [{"level": 2, "id": "16-auth-and-misc-_1", "name": "认证"}, {"level": 3, "id": "16-auth-and-misc-get-apiauthprofile", "name": "GET /api/auth/profile — 用户信息"}, {"level": 3, "id": "16-auth-and-misc-post-apiauthlogout", "name": "POST /api/auth/logout — 登出"}, {"level": 2, "id": "16-auth-and-misc-dashboard", "name": "Dashboard 运维看板"}, {"level": 3, "id": "16-auth-and-misc-get-apidashboardopsovervi
