id=\"11-issues-delete-apiissuesissue_idattachmentsfilename\">DELETE /api/issues/{issue_id}/attachments/{filename} — 删除附件<\u002fh3>\n<blockquote>\n<p>CLI：grape issues delete attachment --issue_id {issue_id} --filename {filename} --json-out（operation_id=issues_delete_attachment）。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>项<\u002fth>\n<th>值<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>scope（x-token-scope）<\u002ftd>\n<td><strong>user_only<\u002fstrong>（<code>grape_<\u002fcode>/JWT；<code>tk_<\u002fcode> → 403）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>Path<\u002ftd>\n<td><code>{issue_id}<\u002fcode> int、<code>{filename}<\u002fcode>（UUID 名）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>出参<\u002ftd>\n<td><code>{\"ok\": true, \"message\": \"已删除\"}<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td>返回<\u002ftd>\n<td>200；400 非法文件名；404 附件/需求不存在；403<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<hr />\n<h2 id=\"11-issues-_2\">错误返回（全端点通用）<\u002fh2>\n<blockquote>\n<p>格式与全量状态码契约见 <code>README.md<\u002fcode>「错误响应统一格式」；<code>detail.message<\u002fcode> 英文。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>message（英文）<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>400<\u002ftd>\n<td>Bad Request / Invalid parameter<\u002ftd>\n<td>创建时仓库/标题/描述缺失等参数错误<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>Unauthorized<\u002ftd>\n<td>未认证 / token 失效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>Forbidden<\u002ftd>\n<td>无权限（含 session token 不适用于账户类端点）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>Not Found<\u002ftd>\n<td>Issue #N 不存在<\u002ftd>\n<\u002ftr>\n<tr>\n<td>409<\u002ftd>\n<td>Conflict<\u002ftd>\n<td>创建时同标题 Issue 已存在<\u002ftd>\n<\u002ftr>\n<tr>\n<td>502<\u002ftd>\n<td>Bad Gateway<\u002ftd>\n<td>GitCode 创建 Issue 失败<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>", "toc": [{"level": 2, "id": "11-issues-_1", "name": "概念速览"}, {"level": 2, "id": "11-issues-get-apiissuesmine", "name": "GET /api/issues/mine — 我的需求列表（需求中心·个人维度）"}, {"level": 2, "id": "11-issues-get-apiissuesownerrepo-issue", "name": "GET /api/issues/{owner}/{repo} — 仓库 Issue 列表（含阶段/状态/富化聚合）"}, {"level": 2, "id": "11-issues-post-apiissuesownerrepo-issue", "name": "POST /api/issues/{owner}/{repo} — 创建 Issue（对外统一创建入口）"}, {"level": 2, "id": "11-issues-get-apiissuesownerreponumber-issue", "name": "GET /api/issues/{owner}/{repo}/{number} — 单个 Issue 详情"}, {"level": 2, "id": "11-issues-get-apiissuesownerreponumberevents-issue", "name": "GET /api/issues/{owner}/{repo}/{number}/events — 该 Issue 的事件列表"}, {"level": 2, "id": "11-issues-get-apiissuesownerreponumberpipeline-issue-pipeline", "name": "GET /api/issues/{owner}/{repo}/{number}/pipeline — Issue pipeline 路线图"}, {"level": 2, "id": "11-issues-issue-issue_id", "name": "Issue 操作（按 {issue_id} 定位）"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idstart", "name": "POST /api/issues/{issue_id}/start — 打开会话"}, {"level": 3, "id": "11-issues-get-apiissuesissue_idstatus", "name": "GET /api/issues/{issue_id}/status — 查询状态（轮询）"}, {"level": 3, "id": "11-issues-put-apiissuesissue_idstatus", "name": "PUT /api/issues/{issue_id}/status — 状态迁移"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idconfirm-done", "name": "POST /api/issues/{issue_id}/confirm-done — 确认完成"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idcancel", "name": "POST /api/issues/{issue_id}/cancel — 取消"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idresume", "name": "POST /api/issues/{issue_id}/resume — 恢复"}, {"level": 3, "id": "11-issues-get-apiissuesissue_idpipeline", "name": "GET /api/issues/{issue_id}/pipeline — 流水线路线图"}, {"level": 3, "id": "11-issues-get-apiissuesissue_idclarifications", "name": "GET /api/issues/{issue_id}/clarifications — 澄清历史"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idclarify", "name": "POST /api/issues/{issue_id}/clarify — 回复澄清"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idawaiting-input-agent", "name": "POST /api/issues/{issue_id}/awaiting-input — Agent 声明需求待澄清（澄清三件套·发起）"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idpending-review-agent", "name": "POST /api/issues/{issue_id}/pending-review — Agent 提交阶段审核点（等用户双态·待审核）"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idreview-pass-agent", "name": "POST /api/issues/{issue_id}/review-pass — Agent 判定审核通过"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idreview-reject-agent", "name": "POST /api/issues/{issue_id}/review-reject — Agent 判定审核未通过"}, {"level": 3, "id": "11-issues-post-apiissuesissue_idattachments", "name": "POST /api/issues/{issue_id}/attachments — 上传附件"}, {"level": 3, "id": "11-issues-get-apiissuesissue_idattachments", "name": "GET /api/issues/{issue_id}/attachments — 列出附件"}, {"level": 3, "id": "11-issues-delete-apiissuesissue_idattachmentsfilename", "name": "DELETE /api/issues/{issue_id}/attachments/{filename} — 删除附件"}, {"level": 2, "id": "11-issues-_2", "name": "错误返回（全端点通用）"}], "no": "", "is_overview": false}, {"id": "12-a2a", "title": "A2A 协作接口（/api/a2a）", "html": "<h1 id=\"12-a2a-a2a-apia2a\">A2A 协作接口（/api/a2a）<\u002fh1>\n<blockquote>\n<p>对外公开，认证：<code>get_current_user_or_api_key<\u002fcode>。Agent 间交办协作的核心端点（各技能最依赖：45 次引用）。<br />\nscope（x-token-scope）：<strong>dual<\u002fstrong>（三通道全放行；无效 token 走 <code>get_user_or_none<\u002fcode> 软认证后交内部 bot 鉴权）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"12-a2a-post-apia2a-agent\">POST /api/a2a — 交办其他 Agent<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）<br />\nCLI：<code>grape a2a handoff<\u002fcode>（operation_id=<code>a2a_handoff<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Authorization: Bearer &lt;api_key&gt;<\u002fcode> + <code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;agent&quot;: &quot;coding&quot;,\n  &quot;idempotency_key&quot;: &quot;task-42:qa&quot;,\n  &quot;payload&quot;: {\n    &quot;repository&quot;: &quot;owner/repo&quot;,\n    &quot;account&quot;: &quot;owner/repo&quot;,\n    &quot;issue_number&quot;: &quot;5&quot;,\n    &quot;pr_number&quot;: &quot;&quot;,\n    &quot;context&quot;: &quot;当前处理摘要&quot;\n  }\n}\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>agent<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>目标 Agent：vod/issue/coding/qa/sre<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>idempotency_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>幂等键（Issue #544）：由来源 task_id + 目标角色派生（如 <code>task-42:qa<\u002fcode>），1-128 位 <code>[A-Za-z0-9_:.-]<\u002fcode>；也可放 <code>payload.idempotency_key<\u002fcode>（body 顶层优先）。同仓同键重复请求返回已有事件，不创建新事件。Issue #2248：修复轮应使用带轮次/PR head sha 的新键（如 <code>issue-5-a2a-qa-r2-&lt;sha7&gt;<\u002fcode>）；命中终态旧事件时 <code>force=true<\u002fcode> 可越过命中短路按新轮次键落库<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.repository<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>仓库（owner/repo）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.account<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>账户<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.issue_number<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td><strong>必填<\u002fstrong>，严禁填 PR 编号<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.pr_number<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>有则填 PR 编号，无则省略<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.context<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>接力说明（原始需求/分析结论/建议下一步）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.target_scene_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>Issue #2427：目标场景 ID。跨流水线接续时指定目标场景，服务端校验存在后重定向到该场景的 <code>target_node<\u002fcode>（不走多跳）；缺省按 Issue 绑定场景派发<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.target_node<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>Issue #2427：目标场景内入口节点（缺省 <code>vod<\u002fcode>）。与 <code>target_scene_id<\u002fcode> 搭配可直达场景链后继节点（如 <code>coding<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>source_event_seq<\u002fcode><\u002ftd>\n<td>int<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>Issue #2050：源段事件 seq（顶层优先，兼容 <code>payload.source_event_seq<\u002fcode> / <code>payload.source_seq<\u002fcode>）。结构化 handoff 主触发源；缺省时服务端从调用方会话反查源段 event_seq 兜底<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>force<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>Issue #1942 / #2248：立即派发，越过 <code>downstream_running<\u002fcode> / <code>duplicate_key<\u002fcode> / <code>active_dispatch<\u002fcode> 三类门禁；<code>idempotency_key<\u002fcode> 命中终态旧事件（completed/failed/cancelled/timeout）时同样越过幂等命中短路，按派生新轮次键落库（活跃事件命中仍返回原事件）。<strong>顶层 <code>force<\u002fcode> 与 <code>payload.force=true<\u002fcode> 语义等价<\u002fstrong>，任一处为 true 即生效；对派发门禁（issue+scene+agent 时间窗）更换 <code>idempotency_key<\u002fcode> 无效<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>queue<\u002fcode><\u002ftd>\n<td>bool<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>Issue #1667：仅排队，前序事件终态后自动派发，不越过 <code>downstream_running<\u002fcode> 门禁；也可放 <code>payload.queue<\u002fcode>（body 顶层优先）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>出参：<\u002fp>\n<pre><code class=\"language-json\">{&quot;status&quot;: &quot;ok&quot;, &quot;seq&quot;: 2048, &quot;agent&quot;: &quot;coding&quot;, &quot;task_id&quot;: &quot;t_xxx&quot;,\n &quot;handoff_result&quot;: &quot;ok&quot;, &quot;source_seq&quot;: 42,\n &quot;event&quot;: {&quot;seq&quot;: 2048, &quot;status&quot;: &quot;running&quot;, &quot;agent&quot;: &quot;coding&quot;, &quot;issue_id&quot;: &quot;#5&quot;}}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p>Issue #2050：响应新增 <code>handoff_result<\u002fcode>（<code>ok<\u002fcode>/<code>failed<\u002fcode>/<code>rejected<\u002fcode>）与 <code>source_seq<\u002fcode>。<br />\n调用方必须校验 <code>handoff_result<\u002fcode>：<code>rejected<\u002fcode> 为门禁/场景主动拦截，<code>failed<\u002fcode> 为派发链路失败；<br />\n不要仅凭 <code>status=ok<\u002fcode> 判定交棒成功。契约见 <code>contracts/a2a_handoff.schema.json<\u002fcode> 与<br />\n<code>contracts/a2a_handoff_response.schema.json<\u002fcode>。<\u002fp>\n<p>Issue #1691：成功派发响应带 <code>event<\u002fcode>（与实际建事件同口径），CLI 据此校验 <code>seq&gt;0<\u002fcode><br />\n与下游派发状态；<code>status=failed<\u002fcode> 或 <code>seq=0<\u002fcode>（且无 <code>skipped<\u002fcode>/<code>queued<\u002fcode>）时调用方必须<br />\n显式报错，不得静默当作成功。派发结果 <code>seq=0<\u002fcode>（如无可用引擎、事件已置 failed）时<br />\n不补 <code>event<\u002fcode>，避免把失败事件误标为 running。<\u002fp>\n<p><strong>前向跳步披露（Issue #2792，Spec 案 2，零语义变更）<\u002fstrong>：A2A 层仍<strong>不干预<\u002fstrong>跳步<br />\n（agent 有权交办到任意目标 agent，含 <code>qa→coding<\u002fcode> 回滚），但当目标节点位于当前<br />\nIssue 阶段<strong>之后且不相邻<\u002fstrong>时，被越过的节点会：<br />\n1. 写入事件 payload 的 <code>skipped_nodes<\u002fcode>（如 <code>[\"issue\",\"coding\"]<\u002fcode>）——空集合不落键；<br />\n2. 在响应体回传同名 <code>skipped_nodes<\u002fcode>（如 vod→qa 返回 <code>\"skipped_nodes\": [\"issue\",\"coding\"]<\u002fcode>）；<br />\n3. 在 Issue 上发一条用户提醒评论（列出被跳过的节点），<strong>投递失败只告警、不阻断交办<\u002fstrong>。<\u002fp>\n<p>回滚/重派（<code>qa→coding<\u002fcode>、<code>qa→vod<\u002fcode>）、相邻顺推、当前阶段不可解析（空 / <code>pending_review<\u002fcode> /<br />\n<code>done<\u002fcode>）、以及场景节点显式 <code>skip<\u002fcode> 声明（<code>configs/pipelines.json<\u002fcode> 中 blog-publish 的<br />\n<code>coding→sre<\u002fcode> 跳过 qa）<strong>一律不标注<\u002fstrong>，语义与现状完全一致。<\u002fp>\n<p>案 1（前向越站直接 <code>422<\u002fcode> 拒绝）开关位 = <code>src/api/a2a_skip_nodes.REJECT_FORWARD_SKIP<\u002fcode><br />\n（默认 <code>False<\u002fcode>）。采纳案 1 只需置 <code>True<\u002fcode>，端点即把非空 <code>skipped_nodes<\u002fcode> 转成<br />\n<code>422 {\"skipped\": \"forward_skip_rejected\", \"skipped_nodes\": [...]}<\u002fcode>（不建事件、不发提醒）；<br />\n回滚方向不受该开关限制。<\u002fp>\n<\u002fblockquote>\n<p>幂等命中（同键重复请求）时返回已有事件（Issue #2248：补 <code>existing_status<\u002fcode> / <code>replayable<\u002fcode>）：<\u002fp>\n<pre><code class=\"language-json\">{&quot;status&quot;: &quot;ok&quot;, &quot;seq&quot;: 2048, &quot;agent&quot;: &quot;coding&quot;, &quot;idempotent&quot;: true,\n     &quot;handoff_result&quot;: &quot;ok&quot;, &quot;source_seq&quot;: 42, &quot;existing_status&quot;: &quot;completed&quot;, &quot;replayable&quot;: true,\n &quot;message&quot;: &quot;duplicate idempotency_key, existing event returned&quot;,\n &quot;event&quot;: {&quot;seq&quot;: 2048, &quot;status&quot;: &quot;completed&quot;, &quot;agent&quot;: &quot;coding&quot;, &quot;issue_id&quot;: &quot;#5&quot;, &quot;created_at&quot;: &quot;...&quot;}}\n<\u002fcode><\u002fpre>\n<blockquote>\n<p><strong>幂等命中判定表（Issue #2248）<\u002fstrong><\u002fp>\n<table>\n<thead>\n<tr>\n<th>命中事件状态<\u002fth>\n<th><code>force<\u002fcode><\u002fth>\n<th>服务端行为<\u002fth>\n<th>调用方动作<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>running / dispatched / queued<\u002ftd>\n<td>任意<\u002ftd>\n<td>返回原事件（<code>idempotent:true<\u002fcode>, <code>replayable:false<\u002fcode>）<\u002ftd>\n<td>轮询 <code>GET /api/a2a/status<\u002fcode> 或等待前序终态<\u002ftd>\n<\u002ftr>\n<tr>\n<td>completed / failed / cancelled / timeout<\u002ftd>\n<td>false<\u002ftd>\n<td>返回原事件（<code>idempotent:true<\u002fcode>, <code>replayable:true<\u002fcode>）<\u002ftd>\n<td>修复轮需重派时带 <code>force=true<\u002fcode>，或改用新轮次键<\u002ftd>\n<\u002ftr>\n<tr>\n<td>completed / failed / cancelled / timeout<\u002ftd>\n<td>true<\u002ftd>\n<td>越过幂等命中短路，按派生新轮次键新建事件<\u002ftd>\n<td>校验新 <code>seq&gt;0<\u002fcode> 且 <code>handoff_result=ok<\u002fcode><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>修复轮幂等键建议：<code>issue-&lt;N&gt;-a2a-qa-r&lt;轮次&gt;-&lt;sha7&gt;<\u002fcode>（<code>&lt;sha7&gt;<\u002fcode> = PR head sha 前 7 位）。<br />\n命中终态事件说明本轮已结束，<strong>不得停摆<\u002fstrong>：带 <code>force=true<\u002fcode> 或新轮次键重派即可。<\u002fp>\n<\u002fblockquote>\n<p>处理异常且未建成事件时返回 500 + 请求指纹（事件表已留失败痕迹，可用核对接口查询）：<\u002fp>\n<pre><code class=\"language-json\">{&quot;code&quot;: 500, &quot;message&quot;: &quot;a2a processing failed: ...&quot;,\n &quot;handoff_result&quot;: &quot;failed&quot;, &quot;source_seq&quot;: 42,\n &quot;fingerprint&quot;: &quot;9af3c2e18b0d47f6&quot;,\n &quot;hint&quot;: &quot;retry with the same idempotency_key, or verify via GET /api/a2a/status&quot;}\n<\u002fcode><\u002fpre>\n<h2 id=\"12-a2a-duplicate_key-downstream_running-active_dispatch\">重复交办与恢复（duplicate_key / downstream_running / active_dispatch）<\u002fh2>\n<blockquote>\n<p>Issue #1942：被门禁跳过时响应 <code>status=ok<\u002fcode>、<code>seq=0<\u002fcode>、<code>skipped=&lt;kind&gt;<\u002fcode>、<code>reason=&lt;kind&gt;:&lt;existing_seq&gt;<\u002fcode>；<br />\n按响应 <code>message<\u002fcode> 一次调用即可恢复，无需试错。<br />\nIssue #2555 兼容例外：既有去重/派发门禁码（<code>duplicate_a2a<\u002fcode> 的 <code>active_a2a_event<\u002fcode>、<code>downstream_running<\u002fcode> / <code>duplicate_key<\u002fcode> / <code>active_dispatch<\u002fcode> 的 <code>&lt;kind&gt;:&lt;existing_seq&gt;<\u002fcode>）保留英文机读 reason 格式以向后兼容，不套用跳过码的中文 reason 模板；这些响应同时补齐 <code>ok=false<\u002fcode> 与 <code>detail<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>幂等窗口键 = <code>issue+scene+agent<\u002fcode>（与 <code>idempotency_key<\u002fcode> 无关）。三条恢复路径：<\u002fp>\n<ol>\n<li><strong>立即重发（force）<\u002fstrong>——顶层 <code>force<\u002fcode> 与 <code>payload.force<\u002fcode> 完全等价，任一处为 true 即越过门禁：<\u002fli>\n<\u002fol>\n<p><code>json\n   {\"agent\": \"coding\", \"force\": true, \"payload\": {\"repository\": \"owner/repo\", \"issue_number\": \"5\", \"context\": \"...\"}}<\u002fcode><\u002fp>\n<p><code>json\n   {\"agent\": \"coding\", \"payload\": {\"repository\": \"owner/repo\", \"issue_number\": \"5\", \"context\": \"...\", \"force\": true}}<\u002fcode><\u002fp>\n<ol start=\"2\">\n<li><strong>排队（queue）<\u002fstrong>——不立即派发，前序事件终态后自动派发；不越过 <code>downstream_running<\u002fcode>：<\u002fli>\n<\u002fol>\n<p><code>json\n   {\"agent\": \"coding\", \"queue\": true, \"payload\": {\"repository\": \"owner/repo\", \"issue_number\": \"5\", \"context\": \"...\"}}<\u002fcode><\u002fp>\n<ol start=\"3\">\n<li><strong>非必要不重发<\u002fstrong>——若 <code>existing_seq<\u002fcode> 对应任务仍在执行，直接 <code>GET /api/a2a/status<\u002fcode> 核对即可；<br />\n<strong>更换 <code>idempotency_key<\u002fcode> 无效<\u002fstrong>（窗口键不含 idempotency_key）。<\u002fli>\n<\u002fol>\n<blockquote>\n<p>提示文案保留关键子串 <code>force=true to dispatch immediately<\u002fcode>，便于日志检索与 runbook 引用。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"12-a2a-get-apia2astatus-issue-544-l3\">GET /api/a2a/status — 交接核对（Issue #544 L3）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（与 POST /api/a2a 同口径）<\u002fp>\n<\u002fblockquote>\n<p>查询某次 A2A 交接是否已建事件（含失败留痕）。<code>idempotency_key<\u002fcode> 非空按键精确查；<br />\n否则按请求指纹（<code>repository<\u002fcode>+<code>issue_number<\u002fcode>+<code>agent<\u002fcode> 派生 sha256 前 16 位）查。<\u002fp>\n<pre><code>GET /api/a2a/status?repository=owner/repo&amp;issue_number=5&amp;agent=coding\nGET /api/a2a/status?repository=owner/repo&amp;issue_number=5&amp;idempotency_key=task-42:qa\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>repository<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>仓库（owner/repo）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>issue_number<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>Issue 编号（纯数字）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>agent<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>目标 Agent（指纹维度）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>idempotency_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>幂等键（精确查）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>出参：<\u002fp>\n<pre><code class=\"language-json\">{&quot;found&quot;: true, &quot;repository&quot;: &quot;owner/repo&quot;, &quot;issue_number&quot;: &quot;5&quot;, &quot;agent&quot;: &quot;coding&quot;,\n &quot;events&quot;: [{&quot;seq&quot;: 2048, &quot;status&quot;: &quot;running&quot;, &quot;agent&quot;: &quot;coding&quot;, &quot;created_at&quot;: &quot;...&quot;,\n             &quot;a2a_trace&quot;: false, &quot;fingerprint&quot;: &quot;9af3c2e18b0d47f6&quot;, &quot;idempotency_key&quot;: &quot;task-42:qa&quot;}]}\n<\u002fcode><\u002fpre>\n<p>返回：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>200<\u002ftd>\n<td>交办成功（seq 为新建事件编号）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>200 + skipped<\u002ftd>\n<td>sre 订阅去重跳过（<code>{\"status\":\"ok\",\"ok\":false,\"seq\":0,\"skipped\":\"sre_subscribed\",\"reason\":\"SRE 已订阅 PR 合并事件，该 A2A 交办视为重复；无需重复派发，已由订阅链路处理。\",\"detail\":{\"issue_number\":5}}<\u002fcode>；Issue #2555 起所有跳过响应统一带 <code>ok=false<\u002fcode> + <code>reason<\u002fcode> + <code>detail<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>200 + skipped<\u002ftd>\n<td>仓库归属不匹配（<code>repo_mismatch<\u002fcode>）：本仓 DB 无该单号 + 他仓 DB 存在同号 + <strong>本仓 VCS 复核 404<\u002fstrong> 三条同时成立（Issue #2555 第 2 轮收紧）。<code>detail<\u002fcode> 为 <code>issue_number<\u002fcode> / <code>expected_repository<\u002fcode> / <code>actual_repository<\u002fcode>。新建单未同步进 DB 但本仓 VCS 命中时不返回该码（继续正常派发）；VCS 不可判定（无 token / 网络）不返回该码，沿用既有 400/派发口径。<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>token 无效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>400<\u002ftd>\n<td><code>issue_number<\u002fcode> 缺失/非法<\u002ftd>\n<\u002ftr>\n<tr>\n<td>400<\u002ftd>\n<td>仓库归属校验失败（Issue #671）：注册表（<code>managed_repos<\u002fcode>）未命中时按 Git 平台可达性回退——<code>not found<\u002fcode>（仓库不存在/拼写错误）、<code>no access<\u002fcode>（仓库存在但无权限）、<code>not hosted<\u002fcode>（无法判定/未托管，未认证调用方不触发回退，直接 <code>not hosted<\u002fcode>）。回退放行后服务端自动幂等补录 <code>managed_repos<\u002fcode>（自愈注册缺口），同一仓库与 git-repo 命令判定一致<\u002ftd>\n<\u002ftr>\n<tr>\n<td>409<\u002ftd>\n<td>目标 agent 不在当前 Issue 绑定场景 nodes 内（<code>{\"status\":\"skipped\",\"ok\":false,\"skipped\":\"not_in_scene\",\"reason\":\"目标 Agent 不在当前场景流水线节点中，A2A 被拦截；请确认场景已配置 &lt;agent&gt; 节点后重试。\",\"detail\":{\"agent\":\"&lt;agent&gt;\"},\"scene\":\"&lt;scene_id&gt;\",\"message\":\"...scene=&lt;scene_id&gt; nodes=[...]\"}<\u002fcode>；Issue #2427：message 与响应体 <code>scene<\u002fcode> 同源携带 scene_id，可自证解析依据；跨流水线接续请显式传 <code>payload.target_scene_id<\u002fcode>/<code>target_node<\u002fcode>；Issue #568：节点集合与 <code>scenes detail<\u002fcode> 同源 <code>get_pipeline_config<\u002fcode>，两路口径一致；Issue #2555：<code>detail.agent<\u002fcode> 为被拦截的目标 Agent）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>Issue #568：跨流水线移交（<code>payload.target_scene_id<\u002fcode>/<code>target_node<\u002fcode>）时校验目标场景存在<br />\n（不存在 → 200 + <code>skipped: \"target_scene_not_found\"<\u002fcode>，并带 <code>ok=false<\u002fcode>、中文 <code>reason<\u002fcode> 与<br />\n<code>detail: {\"target_node\": \"&lt;node&gt;\"}<\u002fcode>；节点不在目标场景 → 200 + <code>skipped: \"target_scene_missing_node\"<\u002fcode>，<br />\n同样带 <code>detail.target_node<\u002fcode>），并将 issue 绑定场景刷新为<br />\n目标场景有效 ID（后续注入的 <code>GRAPE_SCENE_ID<\u002fcode> 可经 <code>scenes detail<\u002fcode> 查询且节点有效）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"12-a2a-_1\">约束<\u002fh2>\n<ul>\n<li><code>issue_number<\u002fcode> 服务端强制校验，不得与 <code>pr_number<\u002fcode> 混填。<\u002fli>\n<li>context 要简洁完整，让下游 Agent 无需重复分析。<\u002fli>\n<li><strong>超时/失败重试指引（Issue #544）<\u002fstrong>：客户端超时建议放宽至 60s+；超时后<strong>先调<br />\n<code>GET /api/a2a/status<\u002fcode> 核对<\u002fstrong>（带同一幂等键/指纹），确认未建事件再带<strong>同一幂等键<\u002fstrong>重试<br />\n  （≤2 次）；同键重试天然幂等，不会重复建事件。无键请求失败重试最多 3 次，<br />\n  仍失败在 Issue 评论标注需人工介入。<\u002fli>\n<li><strong>400 <code>repo not hosted<\u002fcode> 降级路径（Issue #671，对齐后台反馈 319 口径）<\u002fstrong>：<br />\n  1. 先校正 <code>payload.repository<\u002fcode> 的 owner/repo 拼写（二段格式、勿只传仓库名）；<br />\n  2. 确认该仓库已在平台托管（或 GitCode 上实际存在且服务端 token 可达——<br />\n     注册表未命中时服务端会自动做 GitCode 可达性回退并补录，正常无需人工处理）；<br />\n  3. 带同一幂等键重试 <strong>≤3 次<\u002fstrong>；<br />\n  4. 仍失败 → 在当前 Issue 评论说明「A2A 交办失败（repo not hosted）+ 已重试次数」，<br />\n     并<strong>人工交办<\u002fstrong>目标 Agent（在 Issue 中 @ 负责人或手工指派），不得静默跳过交办。<\u002fli>\n<\u002ful>\n<h2 id=\"12-a2a-post-apipipelinehandoff\">POST /api/pipeline/handoff — 跨流水线移交（必填目标场景）<\u002fh2>\n<blockquote>\n<p>scope（x-token-scope）：<strong>dual<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT / <code>tk_<\u002fcode> 会话 token 均可）。<br />\nCLI：<code>grape pipeline handoff<\u002fcode>（operation_id=<code>pipeline_handoff<\u002fcode>）。<\u002fp>\n<\u002fblockquote>\n<p>语义与 <code>POST /api/a2a<\u002fcode> 完全一致（同一实现、同一鉴权、同一幂等键），<strong>唯一差异<\u002fstrong>：<br />\n<code>payload.target_scene_id<\u002fcode> 必填，缺失或为空白 → 同步 400。这样命令名承诺的<br />\n「跨流水线」不会静默退化成当前场景内的普通派发；场内派发请继续用 <code>/api/a2a<\u002fcode>。<\u002fp>\n<p>请求体：<\u002fp>\n<pre><code class=\"language-json\">{\n  &quot;agent&quot;: &quot;coding&quot;,\n  &quot;idempotency_key&quot;: &quot;task-42:coding&quot;,\n  &quot;payload&quot;: {\n    &quot;repository&quot;: &quot;owner/repo&quot;,\n    &quot;issue_number&quot;: &quot;5&quot;,\n    &quot;context&quot;: &quot;接力说明&quot;,\n    &quot;target_scene_id&quot;: &quot;custom-696e35a0&quot;,\n    &quot;target_node&quot;: &quot;coding&quot;,\n    &quot;target_assignee&quot;: &quot;&quot;,\n    &quot;carried_context&quot;: {}\n  }\n}\n<\u002fcode><\u002fpre>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>agent<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>目标 Agent：vod/issue/coding/qa/sre<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.repository<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>仓库，必须 <code>owner/repo<\u002fcode> 二段格式<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.issue_number<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>纯数字；不得与 PR 编号混填<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.target_scene_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td><strong>目标场景 ID<\u002fstrong>（缺省 → 400 <code>missing payload.target_scene_id<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.target_node<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>目标场景内起始节点，缺省 <code>vod<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>payload.carried_context<\u002fcode><\u002ftd>\n<td>object<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>跨仓/跨场景携带的上下文（含 <code>target_issue_number<\u002fcode> 回填依据）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>idempotency_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>同 <code>/api/a2a<\u002fcode>：1-128 位 <code>[A-Za-z0-9_:.-]<\u002fcode>，同仓同键幂等<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>出参：与 <code>/api/a2a<\u002fcode> 相同（<code>{\"status\":\"ok\",\"seq\":N,\"agent\":\"...\"}<\u002fcode>）；目标场景不存在时<br />\n返回 200 + <code>skipped: \"target_scene_not_found\"<\u002fcode>（<code>ok=false<\u002fcode> + <code>reason<\u002fcode> + <code>detail: {\"target_node\": \"&lt;node&gt;\"}<\u002fcode>），场景节点不匹配时 200 + <code>skipped: \"target_scene_missing_node\"<\u002fcode>（语义同 <code>/api/a2a<\u002fcode>）。<\u002fp>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>200<\u002ftd>\n<td>移交成功（<code>seq<\u002fcode> 为目标场景内新建事件编号）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>200 + skipped<\u002ftd>\n<td>目标场景不存在（<code>target_scene_not_found<\u002fcode>）/ 目标节点不在场景 nodes 内（<code>target_scene_missing_node<\u002fcode>）；均带 <code>ok=false<\u002fcode> + <code>reason<\u002fcode> + <code>detail.target_node<\u002fcode>（语义同 <code>/api/a2a<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>400<\u002ftd>\n<td>缺 <code>payload.target_scene_id<\u002fcode>，或 <code>/api/a2a<\u002fcode> 的既有参数校验失败（agent 白名单、单号纯数字、仓库二段格式）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>token 无效<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>", "toc": [{"level": 2, "id": "12-a2a-post-apia2a-agent", "name": "POST /api/a2a — 交办其他 Agent"}, {"level": 2, "id": "12-a2a-duplicate_key-downstream_running-active_dispatch", "name": "重复交办与恢复（duplicate_key / downstream_running / active_dispatch）"}, {"level": 2, "id": "12-a2a-get-apia2astatus-issue-544-l3", "name": "GET /api/a2a/status — 交接核对（Issue #544 L3）"}, {"level": 2, "id": "12-a2a-_1", "name": "约束"}, {"level": 2, "id": "12-a2a-post-apipipelinehandoff", "name": "POST /api/pipeline/handoff — 跨流水线移交（必填目标场景）"}], "no": "", "is_overview": false}, {"id": "13-settings", "title": "Settings 设置接口（/api/settings）", "html": "<h1 id=\"13-settings-settings-apisettings\">Settings 设置接口（/api/settings）<\u002fh1>\n<blockquote>\n<p>对外公开（openapi-full-coverage-design.md B/D 批收录），认证：<code>require_no_session_token<\u002fcode>。<br />\nscope（x-token-scope）：<strong>全部 = user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\n面向：当前登录用户的账号配置（凭据 / API Key / 通知 / OAuth / 引擎 / 规则 / mode）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"13-settings-credentials\">凭据 Credentials<\u002fh2>\n<h3 id=\"13-settings-get-apisettingscredentials\">GET /api/settings/credentials — 获取第三方平台凭据状态<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo_key<\u002fcode>（可选，确定仓库前缀） |<br />\n| 出参 | <code>{gitcode: {api_token_exists, account, auto_filled}, github: {token_exists, login}, huawei_cloud: {ak_exists, sk_exists, ak, sk}, codearts: {ak_exists, sk_exists}}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingscredentials\">PUT /api/settings/credentials — 更新第三方平台凭据<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（UpdateCredentials）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>huawei_cloud_ak<\u002fcode> / <code>huawei_cloud_sk<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>华为云 AK/SK<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>codearts_ak<\u002fcode> / <code>codearts_sk<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>CodeArts 凭据<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>github_token<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>GitHub PAT（保存时联网校验并绑定 github_login）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>仓库前缀<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>占位符/空值不写入（<code>AK-demo-*<\u002fcode>/<code>SK-demo-*<\u002fcode>/<code>xxxx<\u002fcode> 一律拒绝，防覆盖真实凭据）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-api-key-issue-69\">API Key 管理（Issue #69）<\u002fh2>\n<h3 id=\"13-settings-post-apisettingsapi-keys-api-key\">POST /api/settings/api-keys — 生成 API Key<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateApiKeyBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>Key 名称（≤64 字符）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"id\", \"key\": \"grape_xxx\", \"name\", \"message\"}<\u002fcode>（<strong>明文仅此一次返回<\u002fstrong>，DB 存 SHA-256） |<br />\n| 返回 | 200；400 name 空/超长；500 生成失败（同名已存在） |<\u002fp>\n<h3 id=\"13-settings-get-apisettingsapi-keys-api-key\">GET /api/settings/api-keys — 列出我的 API Key<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{keys: [{id, name, prefix, created_at, last_used_at}]}<\u002fcode>（不含明文） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-delete-apisettingsapi-keyskey_id-api-key\">DELETE /api/settings/api-keys/{key_id} — 吊销 API Key<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{key_id}<\u002fcode> int |<br />\n| 出参 | <code>{\"message\": \"...\"}<\u002fcode>（软删除 revoked=1，立即失效，保审计） |<br />\n| 返回 | 200；404 不存在/已吊销 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-_1\">通知偏好<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsnotifications\">GET /api/settings/notifications — 获取通知配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{issues, pr, build, release, vod, notifications_enabled}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsnotifications\">PUT /api/settings/notifications — 更新通知配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求体（NotificationPrefs）：<code>{vod: bool, notifications_enabled: bool}<\u002fcode><\u002fp>\n<p>| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-oauth-meta\">OAuth 配置（平台级 meta）<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsoauth-gitcode-oauth\">GET /api/settings/oauth — 获取 GitCode OAuth 配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{gitcode_oauth_client_id: bool, gitcode_oauth_redirect_uri: str}<\u002fcode>（不泄露 secret） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsoauth-gitcode-oauth\">PUT /api/settings/oauth — 更新 GitCode OAuth 配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求体（OAuthConfig）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>gitcode_oauth_client_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>客户端 id<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>gitcode_oauth_client_secret<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>客户端 secret<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>gitcode_oauth_redirect_uri<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>回调地址<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-get-apisettingsoauth-github-github-oauth\">GET /api/settings/oauth-github — 获取 GitHub OAuth 配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{github_oauth_client_id: bool, github_oauth_redirect_uri: str}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsoauth-github-github-oauth\">PUT /api/settings/oauth-github — 更新 GitHub OAuth 配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求体（GitHubOAuthConfig，字段同 OAuthConfig：<code>github_oauth_client_id<\u002fcode> / <code>github_oauth_client_secret<\u002fcode> / <code>github_oauth_redirect_uri<\u002fcode>）。<\u002fp>\n<p>| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-gitcode\">GitCode 仓库配置<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsgitcode-repoownerrepo-gitcode\">GET /api/settings/gitcode-repo/{owner}/{repo} — 获取仓库 GitCode 配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | 该仓库的 GitCode 相关配置 |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsgitcode-repoownerrepo-gitcode\">PUT /api/settings/gitcode-repo/{owner}/{repo} — 更新仓库 GitCode 配置<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（GitCodeRepoConfig）：仓库级配置对象。<\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-runtimes\">引擎 Runtimes<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsagent-runtimes\">GET /api/settings/agent-runtimes — 引擎列表<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<p>从 DB 读取 Agent 执行引擎列表，含健康态派生与唯一引擎名。可见性：全局 + 个人（owner=当前用户）+ 我所在仓库的仓库级。支持分页参数 page/page_size（Issue #185）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{runtimes: [...], devices: [...], total: N, page?: P, page_size?: S}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-get-apisettingsruntime-devices\">GET /api/settings/runtime-devices — 设备列表（分页）<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<p>按 credential_id 分组返回设备列表及其承载引擎。支持分页参数 page/page_size（Issue #185）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{devices: [...], total: N, page: P, page_size: S}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-post-apisettingsagent-runtimesrefresh\">POST /api/settings/agent-runtimes/refresh — 手动刷新引擎<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"runtimes\": [...]}<\u002fcode>（发现本地引擎 + 子进程检测后写 DB） |<br />\n| 返回 | 200；503 刷新失败 |<\u002fp>\n<h3 id=\"13-settings-get-apisettingsbackend-agents-agent\">GET /api/settings/backend-agents — 后端 Agent 列表（兼容别名）<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 同 <code>agent-runtimes<\u002fcode>（兼容旧路径） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-post-apisettingsbackend-agentsrefresh-agent\">POST /api/settings/backend-agents/refresh — 刷新后端 Agent（兼容别名）<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 同 <code>agent-runtimes/refresh<\u002fcode> |<br />\n| 返回 | 200；503 |<\u002fp>\n<h3 id=\"13-settings-get-apisettingsagent-runtimesrid\">GET /api/settings/agent-runtimes/{rid} — 单引擎详情<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<p>按 id 返回单个引擎详情（含 health/health_score/tags/local_skills/alias/worker_name/worker_ip/scope/owner 等弹窗字段）。可见性校验复用引擎列表口径（credential scope + 组织隔离 + repo 过滤），不存在或不可见返回 404（Issue #364）。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{rid}<\u002fcode> int |<br />\n| 出参 | 引擎详情对象（字段同 <code>agent-runtimes<\u002fcode> 列表项） |<br />\n| 返回 | 200；404 不存在或不可见 |<\u002fp>\n<h3 id=\"13-settings-get-apisettingsagent-runtimesridtags\">GET /api/settings/agent-runtimes/{rid}/tags — 引擎标签列表<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{rid}<\u002fcode> int |<br />\n| 出参 | 标签数组 |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-post-apisettingsagent-runtimesridtags\">POST /api/settings/agent-runtimes/{rid}/tags — 添加引擎标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（EngineTagBody）：标签对象（幂等：已有则更新）。<\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsagent-runtimesridtagstag\">PUT /api/settings/agent-runtimes/{rid}/tags/{tag} — 修改引擎标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{rid}<\u002fcode> int、<code>{tag}<\u002fcode> |<br />\n| 请求体（EngineTagUpdateBody） | 新标签配置 |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-delete-apisettingsagent-runtimesridtagstag\">DELETE /api/settings/agent-runtimes/{rid}/tags/{tag} — 删除引擎标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{rid}<\u002fcode> int、<code>{tag}<\u002fcode> |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-runtime-rta_-token\">Runtime 凭据（rta_ token）<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsruntime-credentials\">GET /api/settings/runtime-credentials — 凭据列表<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>[{id, name, scope, owner, repo_key, created_at}]<\u002fcode>（不含 token_hash / 明文） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-post-apisettingsruntime-credentials\">POST /api/settings/runtime-credentials — 创建运行时凭据<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（RuntimeCredBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>worker 名（全局唯一）<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>scope<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td><code>user<\u002fcode>（默认）/ <code>repo<\u002fcode> / <code>global<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">repo 时必填<\u002ftd>\n<td><code>owner/repo<\u002fcode> 归属仓库<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"token\": \"rta_xxx\", \"id\", \"name\", \"scope\", \"owner\", \"message\"}<\u002fcode>（<strong>明文仅一次<\u002fstrong>，DB 存 sha256；owner=当前登录用户不可选） |<br />\n| 返回 | 200；400 缺 name / scope 非法 / 重名；500 生成失败 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsruntime-credentialscid\">PUT /api/settings/runtime-credentials/{cid} — 改名凭据<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{cid}<\u002fcode> int |<br />\n| 请求体（RuntimeCredBody） | <code>name<\u002fcode>（owner/scope 不可改） |<br />\n| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200；400 重名/非 active；404 不存在 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsruntime-credentialscidscope-scope\">PUT /api/settings/runtime-credentials/{cid}/scope — 切换凭据 scope<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{cid}<\u002fcode> int |<br />\n| 请求体（CredScopeBody） | 目标 scope（不得为 global） |<br />\n| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200；400 非法/非 active；403 非 owner；404 |<\u002fp>\n<h3 id=\"13-settings-post-apisettingsruntime-credentialscidrevoke\">POST /api/settings/runtime-credentials/{cid}/revoke — 吊销凭据<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{cid}<\u002fcode> int |<\u002fp>\n<blockquote>\n<p>吊销=删除：删 runtime_credentials 行 + 级联删其 agent_runtimes 行；devops_agent_session.runtime_id 置 0；历史任务恢复走 <code>/api/events/{seq}/redispatch<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；404 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-_2\">执行模式 / 流水线模式<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsexecution-mode\">GET /api/settings/execution-mode — 获取执行模式<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 当前执行模式配置 |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsexecution-mode\">PUT /api/settings/execution-mode — 设置执行模式<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求体（ExecModeBody）：执行模式配置。<\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-get-apisettingspipeline-mode\">GET /api/settings/pipeline-mode — 获取流水线模式<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 当前流水线模式 |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingspipeline-mode\">PUT /api/settings/pipeline-mode — 设置流水线模式<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体：流水线模式配置。<\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-action-30s\">事件 Action 过滤规则（热生效 ≤30s）<\u002fh2>\n<h3 id=\"13-settings-get-apisettingsevent-action-filters\">GET /api/settings/event-action-filters — 全部过滤规则<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>[{rule_id, event_type, action, allow, actor, changes, side_effect, priority, enabled}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-post-apisettingsevent-action-filters\">POST /api/settings/event-action-filters — 新增过滤规则<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（EventActionFilterBody）：<code>event_type<\u002fcode> × <code>action<\u002fcode> 规则（幂等：同组合已存在则跳过）。<\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-put-apisettingsevent-action-filtersrule_id\">PUT /api/settings/event-action-filters/{rule_id} — 修改过滤规则<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{rule_id}<\u002fcode> int |<br />\n| 请求体（EventActionFilterUpdateBody） | 修改 allow/actor/changes/副作用/优先级/启用（热生效 ≤30s） |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"13-settings-delete-apisettingsevent-action-filtersrule_id\">DELETE /api/settings/event-action-filters/{rule_id} — 删除过滤规则<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{rule_id}<\u002fcode> int |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode>（删除后无规则=放行） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"13-settings-_3\">错误返回（全端点通用）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>message（英文）<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>400<\u002ftd>\n<td>Bad Request / Invalid parameter<\u002ftd>\n<td>name 空、scope 非法、凭据重名（全局唯一）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>Unauthorized<\u002ftd>\n<td>未认证 / token 无效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td>Forbidden<\u002ftd>\n<td><code>tk_<\u002fcode> 会话 token 不适用（user_only）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>Not Found<\u002ftd>\n<td>key/cid/rule 不存在<\u002ftd>\n<\u002ftr>\n<tr>\n<td>500<\u002ftd>\n<td>Internal Server Error<\u002ftd>\n<td>生成/刷新失败<\u002ftd>\n<\u002ftr>\n<tr>\n<td>503<\u002ftd>\n<td>Service Unavailable<\u002ftd>\n<td>引擎刷新失败<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>", "toc": [{"level": 2, "id": "13-settings-credentials", "name": "凭据 Credentials"}, {"level": 3, "id": "13-settings-get-apisettingscredentials", "name": "GET /api/settings/credentials — 获取第三方平台凭据状态"}, {"level": 3, "id": "13-settings-put-apisettingscredentials", "name": "PUT /api/settings/credentials — 更新第三方平台凭据"}, {"level": 2, "id": "13-settings-api-key-issue-69", "name": "API Key 管理（Issue #69）"}, {"level": 3, "id": "13-settings-post-apisettingsapi-keys-api-key", "name": "POST /api/settings/api-keys — 生成 API Key"}, {"level": 3, "id": "13-settings-get-apisettingsapi-keys-api-key", "name": "GET /api/settings/api-keys — 列出我的 API Key"}, {"level": 3, "id": "13-settings-delete-apisettingsapi-keyskey_id-api-key", "name": "DELETE /api/settings/api-keys/{key_id} — 吊销 API Key"}, {"level": 2, "id": "13-settings-_1", "name": "通知偏好"}, {"level": 3, "id": "13-settings-get-apisettingsnotifications", "name": "GET /api/settings/notifications — 获取通知配置"}, {"level": 3, "id": "13-settings-put-apisettingsnotifications", "name": "PUT /api/settings/notifications — 更新通知配置"}, {"level": 2, "id": "13-settings-oauth-meta", "name": "OAuth 配置（平台级 meta）"}, {"level": 3, "id": "13-settings-get-apisettingsoauth-gitcode-oauth", "name": "GET /api/settings/oauth — 获取 GitCode OAuth 配置"}, {"level": 3, "id": "13-settings-put-apisettingsoauth-gitcode-oauth", "name": "PUT /api/settings/oauth — 更新 GitCode OAuth 配置"}, {"level": 3, "id": "13-settings-get-apisettingsoauth-github-github-oauth", "name": "GET /api/settings/oauth-github — 获取 GitHub OAuth 配置"}, {"level": 3, "id": "13-settings-put-apisettingsoauth-github-github-oauth", "name": "PUT /api/settings/oauth-github — 更新 GitHub OAuth 配置"}, {"level": 2, "id": "13-settings-gitcode", "name": "GitCode 仓库配置"}, {"level": 3, "id": "13-settings-get-apisettingsgitcode-repoownerrepo-gitcode", "name": "GET /api/settings/gitcode-repo/{owner}/{repo} — 获取仓库 GitCode 配置"}, {"level": 3, "id": "13-settings-put-apisettingsgitcode-repoownerrepo-gitcode", "name": "PUT /api/settings/gitcode-repo/{owner}/{repo} — 更新仓库 GitCode 配置"}, {"level": 2, "id": "13-settings-runtimes", "name": "引擎 Runtimes"}, {"level": 3, "id": "13-settings-get-apisettingsagent-runtimes", "name": "GET /api/settings/agent-runtimes — 引擎列表"}, {"level": 3, "id": "13-settings-get-apisettingsruntime-devices", "name": "GET /api/settings/runtime-devices — 设备列表（分页）"}, {"level": 3, "id": "13-settings-post-apisettingsagent-runtimesrefresh", "name": "POST /api/settings/agent-runtimes/refresh — 手动刷新引擎"}, {"level": 3, "id": "13-settings-get-apisettingsbackend-agents-agent", "name": "GET /api/settings/backend-agents — 后端 Agent 列表（兼容别名）"}, {"level": 3, "id": "13-settings-post-apisettingsbackend-agentsrefresh-agent", "name": "POST /api/settings/backend-agents/refresh — 刷新后端 Agent（兼容别名）"}, {"level": 3, "id": "13-settings-get-apisettingsagent-runtimesrid", "name": "GET /api/settings/agent-runtimes/{rid} — 单引擎详情"}, {"level": 3, "id": "13-settings-get-apisettingsagent-runtimesridtags", "name": "GET /api/settings/agent-runtimes/{rid}/tags — 引擎标签列表"}, {"level": 3, "id": "13-settings-post-apisettingsagent-runtimesridtags", "name": "POST /api/settings/agent-runtimes/{rid}/tags — 添加引擎标签"}, {"level": 3, "id": "13-settings-put-apisettingsagent-runtimesridtagstag", "name": "PUT /api/settings/agent-runtimes/{rid}/tags/{tag} — 修改引擎标签"}, {"level": 3, "id": "13-settings-delete-apisettingsagent-runtimesridtagstag", "name": "DELETE /api/settings/agent-runtimes/{rid}/tags/{tag} — 删除引擎标签"}, {"level": 2, "id": "13-settings-runtime-rta_-token", "name": "Runtime 凭据（rta_ token）"}, {"level": 3, "id": "13-settings-get-apisettingsruntime-credentials", "name": "GET /api/settings/runtime-credentials — 凭据列表"}, {"level": 3, "id": "13-settings-post-apisettingsruntime-credentials", "name": "POST /api/settings/runtime-credentials — 创建运行时凭据"}, {"level": 3, "id": "13-settings-put-apisettingsruntime-credentialscid", "name": "PUT /api/settings/runtime-credentials/{cid} — 改名凭据"}, {"level": 3, "id": "13-settings-put-apisettingsruntime-credentialscidscope-scope", "name": "PUT /api/settings/runtime-credentials/{cid}/scope — 切换凭据 scope"}, {"level": 3, "id": "13-settings-post-apisettingsruntime-credentialscidrevoke", "name": "POST /api/settings/runtime-credentials/{cid}/revoke — 吊销凭据"}, {"level": 2, "id": "13-settings-_2", "name": "执行模式 / 流水线模式"}, {"level": 3, "id": "13-settings-get-apisettingsexecution-mode", "name": "GET /api/settings/execution-mode — 获取执行模式"}, {"level": 3, "id": "13-settings-put-apisettingsexecution-mode", "name": "PUT /api/settings/execution-mode — 设置执行模式"}, {"level": 3, "id": "13-settings-get-apisettingspipeline-mode", "name": "GET /api/settings/pipeline-mode — 获取流水线模式"}, {"level": 3, "id": "13-settings-put-apisettingspipeline-mode", "name": "PUT /api/settings/pipeline-mode — 设置流水线模式"}, {"level": 2, "id": "13-settings-action-30s", "name": "事件 Action 过滤规则（热生效 ≤30s）"}, {"level": 3, "id": "13-settings-get-apisettingsevent-action-filters", "name": "GET /api/settings/event-action-filters — 全部过滤规则"}, {"level": 3, "id": "13-settings-post-apisettingsevent-action-filters", "name": "POST /api/settings/event-action-filters — 新增过滤规则"}, {"level": 3, "id": "13-settings-put-apisettingsevent-action-filtersrule_id", "name": "PUT /api/settings/event-action-filters/{rule_id} — 修改过滤规则"}, {"level": 3, "id": "13-settings-delete-apisettingsevent-action-filtersrule_id", "name": "DELETE /api/settings/event-action-filters/{rule_id} — 删除过滤规则"}, {"level": 2, "id": "13-settings-_3", "name": "错误返回（全端点通用）"}], "no": "", "is_overview": false}, {"id": "14-runtime", "title": "Runtime 运行时接口（/api/runtime）", "html": "<h1 id=\"14-runtime-runtime-apiruntime\">Runtime 运行时接口（/api/runtime）<\u002fh1>\n<blockquote>\n<p>对外公开（openapi-full-coverage-design.md C/D 批收录），认证：<code>require_no_session_token<\u002fcode>。<br />\nscope（x-token-scope）：<strong>全部 = user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\n面向：引擎（runtime/worker）运维管理——健康度 / 任务 / 会话 / 标签 / 凭据聚合。<br />\n与 <code>/api/settings/agent-runtimes<\u002fcode> 的差异：本接口聚合「每个引擎实例」的运行视角（任务/会话/健康/标签），<br />\nsettings 侧重「凭据管理 + 引擎列表」。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"14-runtime-_1\">机器健康度<\u002fh2>\n<h3 id=\"14-runtime-get-apiruntimeadminmachine-health\">GET /api/runtime/admin/machine-health — 机器健康度概览<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>[{runtime_id, name, health_score, total_tasks, failed_tasks, consecutive_failures, failure_rate, ...}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimeadminmachine-healthruntime_id\">GET /api/runtime/admin/machine-health/{runtime_id} — 单引擎健康详情<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 出参 | 单引擎健康度详情 |<br />\n| 返回 | 200；404 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimeadminevent-bus\">GET /api/runtime/admin/event-bus — 事件总线调试<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 事件总线历史与监听器列表（debug） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-post-apiruntimeadminbatch-recover\">POST /api/runtime/admin/batch-recover — 批量恢复陈旧任务<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<p>手动触发批量陈旧任务恢复（Phase 5）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 恢复结果摘要 |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"14-runtime-_2\">任务（运行时执行实例）<\u002fh2>\n<h3 id=\"14-runtime-get-apiruntimetaskstask_idstatus\">GET /api/runtime/tasks/{task_id}/status — 任务状态轮询<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> string |<br />\n| 出参 | 任务状态（chat 前端 D5 打字机降级用） |<br />\n| 返回 | 200；404 |<\u002fp>\n<h3 id=\"14-runtime-post-apiruntimetaskstask_idcancel\">POST /api/runtime/tasks/{task_id}/cancel — 取消任务<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{task_id}<\u002fcode> string |<br />\n| 出参 | <code>{\"status\": \"cancelled\", ...}<\u002fcode>（置 cancelled；worker 感知退出） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"14-runtime-runtimes\">引擎实例（runtimes）<\u002fh2>\n<h3 id=\"14-runtime-get-apiruntimeruntimesruntime_idtasks\">GET /api/runtime/runtimes/{runtime_id}/tasks — 引擎任务列表<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| Query | <code>status<\u002fcode>（可选）、<code>limit<\u002fcode>（可选）、<code>repo<\u002fcode>（可选） |<br />\n| 出参 | 该引擎执行的任务列表（M4 前端设备「查看任务」） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimeruntimesruntime_idsessions\">GET /api/runtime/runtimes/{runtime_id}/sessions — 引擎会话列表<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | 有匹配任务的 session 列表（按 agent_tasks.runtime_id 过滤） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimecredentialscidtasks\">GET /api/runtime/credentials/{cid}/tasks — 凭据聚合任务<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{cid}<\u002fcode> int |<br />\n| Query | <code>status<\u002fcode>（可选）、<code>limit<\u002fcode>（可选） |<br />\n| 出参 | 该凭据全部引擎实例的 agent_tasks 聚合 |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-post-apiruntimeruntimesruntime_idrefresh-skills\">POST /api/runtime/runtimes/{runtime_id}/refresh-skills — 重新扫描引擎技能<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| Query | <code>force<\u002fcode>（可选，bool） |<\u002fp>\n<blockquote>\n<p>本机直连引擎（credential_id=0）直接扫描立即返回；远端 worker 标记 <code>pending_skill_scan=1<\u002fcode>，<br />\n下次 claim 扫描后回报——前端轮询本接口直至 <code>status != pending<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"status\": \"pending|done\", \"skills\": [...]}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"14-runtime-_3\">引擎属性（别名 / 并发 / 标签）<\u002fh2>\n<h3 id=\"14-runtime-put-apiruntimeruntimesruntime_idalias\">PUT /api/runtime/runtimes/{runtime_id}/alias — 设置引擎别名<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 请求体（AliasBody） | <code>alias<\u002fcode>（空串=清除） |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-put-apiruntimeruntimesruntime_idmax-concurrent\">PUT /api/runtime/runtimes/{runtime_id}/max-concurrent — 设置最大并发<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 请求体（MaxConcurrentBody） | <code>max_concurrent<\u002fcode> int |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimeruntimesruntime_idrole-tags\">GET /api/runtime/runtimes/{runtime_id}/role-tags — 引擎角色标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 出参 | 角色标签列表（web 管理视图；worker 取 tags 用 <code>GET /runtimes/{id}/tags<\u002fcode>） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-put-apiruntimeruntimesruntime_idtags\">PUT /api/runtime/runtimes/{runtime_id}/tags — 设置角色标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 请求头：<code>Content-Type: application/json<\u002fcode> | 标签数组（应用互斥规则后写入；以 engine_capabilities 为单一数据源） |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimeruntimesruntime_idscene-tags\">GET /api/runtime/runtimes/{runtime_id}/scene-tags — 引擎场景标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 出参 | 场景标签列表 |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-put-apiruntimeruntimesruntime_idscene-tags\">PUT /api/runtime/runtimes/{runtime_id}/scene-tags — 设置场景标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{runtime_id}<\u002fcode> int |<br />\n| 请求体（SceneTagsBody） | 场景标签数组（元数据，约束可选角色标签范围） |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"14-runtime-get-apiruntimescene-tags\">GET /api/runtime/scene-tags — 场景市场场景及可用角色标签<\u002fh3>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>[{name, display_name, roles: [\"vod\",\"issue\",\"coding\",\"qa\",\"sre\"]}, ...]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"14-runtime-_4\">错误返回（全端点通用）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>400<\u002ftd>\n<td>参数非法<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>未认证 / token 无效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td><code>tk_<\u002fcode> 会话 token 不适用（user_only）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>runtime_id / task_id / cid 不存在<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>", "toc": [{"level": 2, "id": "14-runtime-_1", "name": "机器健康度"}, {"level": 3, "id": "14-runtime-get-apiruntimeadminmachine-health", "name": "GET /api/runtime/admin/machine-health — 机器健康度概览"}, {"level": 3, "id": "14-runtime-get-apiruntimeadminmachine-healthruntime_id", "name": "GET /api/runtime/admin/machine-health/{runtime_id} — 单引擎健康详情"}, {"level": 3, "id": "14-runtime-get-apiruntimeadminevent-bus", "name": "GET /api/runtime/admin/event-bus — 事件总线调试"}, {"level": 3, "id": "14-runtime-post-apiruntimeadminbatch-recover", "name": "POST /api/runtime/admin/batch-recover — 批量恢复陈旧任务"}, {"level": 2, "id": "14-runtime-_2", "name": "任务（运行时执行实例）"}, {"level": 3, "id": "14-runtime-get-apiruntimetaskstask_idstatus", "name": "GET /api/runtime/tasks/{task_id}/status — 任务状态轮询"}, {"level": 3, "id": "14-runtime-post-apiruntimetaskstask_idcancel", "name": "POST /api/runtime/tasks/{task_id}/cancel — 取消任务"}, {"level": 2, "id": "14-runtime-runtimes", "name": "引擎实例（runtimes）"}, {"level": 3, "id": "14-runtime-get-apiruntimeruntimesruntime_idtasks", "name": "GET /api/runtime/runtimes/{runtime_id}/tasks — 引擎任务列表"}, {"level": 3, "id": "14-runtime-get-apiruntimeruntimesruntime_idsessions", "name": "GET /api/runtime/runtimes/{runtime_id}/sessions — 引擎会话列表"}, {"level": 3, "id": "14-runtime-get-apiruntimecredentialscidtasks", "name": "GET /api/runtime/credentials/{cid}/tasks — 凭据聚合任务"}, {"level": 3, "id": "14-runtime-post-apiruntimeruntimesruntime_idrefresh-skills", "name": "POST /api/runtime/runtimes/{runtime_id}/refresh-skills — 重新扫描引擎技能"}, {"level": 2, "id": "14-runtime-_3", "name": "引擎属性（别名 / 并发 / 标签）"}, {"level": 3, "id": "14-runtime-put-apiruntimeruntimesruntime_idalias", "name": "PUT /api/runtime/runtimes/{runtime_id}/alias — 设置引擎别名"}, {"level": 3, "id": "14-runtime-put-apiruntimeruntimesruntime_idmax-concurrent", "name": "PUT /api/runtime/runtimes/{runtime_id}/max-concurrent — 设置最大并发"}, {"level": 3, "id": "14-runtime-get-apiruntimeruntimesruntime_idrole-tags", "name": "GET /api/runtime/runtimes/{runtime_id}/role-tags — 引擎角色标签"}, {"level": 3, "id": "14-runtime-put-apiruntimeruntimesruntime_idtags", "name": "PUT /api/runtime/runtimes/{runtime_id}/tags — 设置角色标签"}, {"level": 3, "id": "14-runtime-get-apiruntimeruntimesruntime_idscene-tags", "name": "GET /api/runtime/runtimes/{runtime_id}/scene-tags — 引擎场景标签"}, {"level": 3, "id": "14-runtime-put-apiruntimeruntimesruntime_idscene-tags", "name": "PUT /api/runtime/runtimes/{runtime_id}/scene-tags — 设置场景标签"}, {"level": 3, "id": "14-runtime-get-apiruntimescene-tags", "name": "GET /api/runtime/scene-tags — 场景市场场景及可用角色标签"}, {"level": 2, "id": "14-runtime-_4", "name": "错误返回（全端点通用）"}], "no": "", "is_overview": false}, {"id": "15-devstage", "title": "DevStage 开发环境接口（/api/devstage）", "html": "<h1 id=\"15-devstage-devstage-apidevstage\">DevStage 开发环境接口（/api/devstage）<\u002fh1>\n<blockquote>\n<p>对外公开（openapi-full-coverage-design.md D 批收录），认证：<code>require_no_session_token<\u002fcode>。<br />\nscope（x-token-scope）：<strong>全部 = user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<br />\n面向：Grape AI Devspace 模板创建的开发环境管理（查询 / 创建 / 开机 / 关机 / 删除）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"15-devstage-get-apidevstageconfig-devstage\">GET /api/devstage/config — 获取 DevStage 配置状态<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | DevStage 配置状态 |<br />\n| 返回 | 200 |<\u002fp>\n<h2 id=\"15-devstage-put-apidevstageconfig-devstage\">PUT /api/devstage/config — 更新 DevStage 配置<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体：DevStage 配置对象。<\u002fp>\n<p>| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"15-devstage-get-apidevstagetemplates\">GET /api/devstage/templates — 可用模板列表<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 可用模板数组 |<br />\n| 返回 | 200 |<\u002fp>\n<h2 id=\"15-devstage-get-apidevstagespecs\">GET /api/devstage/specs — 可用规格<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>template_id<\u002fcode>（可选） |<br />\n| 出参 | 可用规格数组 |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"15-devstage-get-apidevstageenvironments\">GET /api/devstage/environments — 开发环境列表<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<p>仅返回 Grape AI Devspace 模板创建的环境；附带 <code>worker_online<\u002fcode> 字段（对应 Worker <code>device_name=env.name<\u002fcode> 是否上线）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>[{id, name, template, spec, status, worker_online, ...}]<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<h2 id=\"15-devstage-post-apidevstageenvironments\">POST /api/devstage/environments — 创建开发环境<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateEnvBody）：环境创建参数（默认 AI DEVSPACE 模板，自动查规格、自动开机、自动注入凭据）。<\u002fp>\n<p>| 出参 | 创建后的环境对象 |<br />\n| 返回 | 200/201；400 参数非法 |<\u002fp>\n<h2 id=\"15-devstage-post-apidevstageenvironmentsaction\">POST /api/devstage/environments/{action} — 环境开机/关机<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{action}<\u002fcode>（<code>start<\u002fcode> / <code>stop<\u002fcode> 等） |<br />\n| 请求头：<code>Content-Type: application/json<\u002fcode> | 动作参数 |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；400 动作非法 |<\u002fp>\n<h2 id=\"15-devstage-delete-apidevstageenvironmentsdevstage_id\">DELETE /api/devstage/environments/{devstage_id} — 删除开发环境<\u002fh2>\n<blockquote>\n<p>scope：user_only<\u002fp>\n<p>同时删除对应的 Worker 凭据。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{devstage_id}<\u002fcode> string |<br />\n| 出参 | <code>{\"ok\": true}<\u002fcode> |<br />\n| 返回 | 200；404 不存在 |<\u002fp>\n<hr />\n<h2 id=\"15-devstage-_1\">错误返回（全端点通用）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>400<\u002ftd>\n<td>参数/动作非法<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>未认证 / token 无效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td><code>tk_<\u002fcode> 会话 token 不适用（user_only）<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>环境不存在<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>", "toc": [{"level": 2, "id": "15-devstage-get-apidevstageconfig-devstage", "name": "GET /api/devstage/config — 获取 DevStage 配置状态"}, {"level": 2, "id": "15-devstage-put-apidevstageconfig-devstage", "name": "PUT /api/devstage/config — 更新 DevStage 配置"}, {"level": 2, "id": "15-devstage-get-apidevstagetemplates", "name": "GET /api/devstage/templates — 可用模板列表"}, {"level": 2, "id": "15-devstage-get-apidevstagespecs", "name": "GET /api/devstage/specs — 可用规格"}, {"level": 2, "id": "15-devstage-get-apidevstageenvironments", "name": "GET /api/devstage/environments — 开发环境列表"}, {"level": 2, "id": "15-devstage-post-apidevstageenvironments", "name": "POST /api/devstage/environments — 创建开发环境"}, {"level": 2, "id": "15-devstage-post-apidevstageenvironmentsaction", "name": "POST /api/devstage/environments/{action} — 环境开机/关机"}, {"level": 2, "id": "15-devstage-delete-apidevstageenvironmentsdevstage_id", "name": "DELETE /api/devstage/environments/{devstage_id} — 删除开发环境"}, {"level": 2, "id": "15-devstage-_1", "name": "错误返回（全端点通用）"}], "no": "", "is_overview": false}, {"id": "16-auth-and-misc", "title": "Auth / Dashboard / Pipeline / Search / 模板 / 飞书 Onboard / 组织审计接口", "html": "<h1 id=\"16-auth-and-misc-auth-dashboard-pipeline-search-onboard\">Auth / Dashboard / Pipeline / Search / 模板 / 飞书 Onboard / 组织审计接口<\u002fh1>\n<blockquote>\n<p>对外公开（openapi-full-coverage-design.md A/D 批收录），认证：<code>require_no_session_token<\u002fcode>。<br />\nscope（x-token-scope）：<strong>全部 = user_only<\u002fstrong>（<code>grape_<\u002fcode> API Key / JWT；<code>tk_<\u002fcode> → 403）。<\u002fp>\n<\u002fblockquote>\n<h2 id=\"16-auth-and-misc-_1\">认证<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apiauthprofile\">GET /api/auth/profile — 用户信息<\u002fh3>\n<blockquote>\n<p>scope：user_only。支持 JWT 会话 / <code>grape_<\u002fcode> API Key / <code>tk_<\u002fcode> 会话 token（Issue #69）。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{username, nickname, status: \"online\", managed_repos: [{key, full_name, is_admin}], gitcode_bound, github_bound}<\u002fcode> |<br />\n| 返回 | 200；401 未认证 |<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apiauthlogout\">POST /api/auth/logout — 登出<\u002fh3>\n<blockquote>\n<p>scope：user_only。<code>token_version+1<\u002fcode> 撤销所有 token + 清 cookie。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{\"message\": \"...\"}<\u002fcode> |<br />\n| 返回 | 200 |<\u002fp>\n<blockquote>\n<p>注：<code>/api/auth/login<\u002fcode>、<code>/api/auth/refresh<\u002fcode>、OAuth 登录/回调为<strong>无 Token 公共入口<\u002fstrong>，不收录契约（<code>help/api/openapi.json<\u002fcode> 之外）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"16-auth-and-misc-dashboard\">Dashboard 运维看板<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apidashboardopsoverview\">GET /api/dashboard/ops/overview — 运维概览<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | 实时运维指标（任务总量/成功/失败、引擎运行状态等聚合） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apidashboardopsprobe-now\">GET /api/dashboard/ops/probe-now — 手动触发引擎探测<\u002fh3>\n<blockquote>\n<p>scope：dual。需登录：组织成员可见。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>throttled<\u002fcode>（防抖窗口内返回上次结果）/ <code>accepted<\u002fcode>（后台线程异步探测） |<br />\n| 返回 | 200；401 未登录 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apidashboardopserror-logssources\">GET /api/dashboard/ops/error-logs/sources — 日志来源列表<\u002fh3>\n<blockquote>\n<p>scope：dual。需登录：组织成员可见。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 主控 + 各 worker 日志来源列表 |<br />\n| 返回 | 200；401 未登录 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apidashboardopserror-logs\">GET /api/dashboard/ops/error-logs — 错误/警告日志<\u002fh3>\n<blockquote>\n<p>scope：dual。需登录：组织成员可见。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>limit<\u002fcode> <code>level<\u002fcode> <code>repo<\u002fcode> <code>user_id<\u002fcode> <code>source<\u002fcode>（可选） |<br />\n| 出参 | 最近错误/警告日志条目 |<br />\n| 返回 | 200；401 未登录 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apidashboardopstimeline\">GET /api/dashboard/ops/timeline — 任务时序图<\u002fh3>\n<blockquote>\n<p>scope：dual。需登录：组织成员可见。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>repo<\u002fcode>（可选） |<br />\n| 出参 | 按 issue 分组的事件链 |<br />\n| 返回 | 200；401 未登录 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apidashboardopsa2a-health-a2a\">GET /api/dashboard/ops/a2a-health — A2A 健康检查<\u002fh3>\n<blockquote>\n<p>scope：dual。需登录：组织成员可见。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | server_base_url 可达性 + 最近 A2A 调用记录 |<br />\n| 返回 | 200；401 未登录 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apidashboardownerrepo\">GET /api/dashboard/{owner}/{repo} — 仓库看板<\u002fh3>\n<blockquote>\n<p>scope：user_only。权限：<code>check_repo_access<\u002fcode> 当前用户可访问该仓库。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | 仓库维度看板数据 |<br />\n| 返回 | 200；403 无仓库权限 |<\u002fp>\n<hr />\n<h2 id=\"16-auth-and-misc-pipeline\">Pipeline 流水线<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apipipelineownerrepo\">GET /api/pipeline/{owner}/{repo} — 仓库流水线路线图<\u002fh3>\n<blockquote>\n<p>scope：user_only。权限：<code>check_repo_access<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{owner}<\u002fcode> <code>{repo}<\u002fcode> |<br />\n| 出参 | 该仓库 pipeline 路线图（阶段/节点/事件）。条目含 <code>statuses<\u002fcode> 数组——与 nodes 一一对应的<strong>节点状态数值码<\u002fstrong>：0=pending 1=running 2=completed 3=failed 4=cancelled 5=skipped（由 <code>compute_node_statuses<\u002fcode> 统一计算，与流水线菜单页同源） |<br />\n| 返回 | 200；403 无仓库权限 |<\u002fp>\n<blockquote>\n<p>与 <code>GET /api/issues/{owner}/{repo}/{number}/pipeline<\u002fcode>（Issue 维度，dual）的差异：本接口为<strong>仓库全局<\u002fstrong>流水线视图；Issue 维度接口的 <code>node_status<\u002fcode> 同一套数值码（见 help/api/11-issues.md「节点状态」说明）。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"16-auth-and-misc-search\">Search 全局搜索<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apisearch\">GET /api/search — 全局搜索<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<table>\n<thead>\n<tr>\n<th>Query<\u002fth>\n<th>参数<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>q<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>✅<\u002ftd>\n<td style=\"text-align: center;\">搜索关键字（≥1 字符）<\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td>否<\u002ftd>\n<td style=\"text-align: center;\"><code>all<\u002fcode>（默认）/ <code>event<\u002fcode> / <code>repo<\u002fcode> / <code>agent<\u002fcode><\u002ftd>\n<td><\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{events: [], repos: [], agents: []}<\u002fcode>（仅当前用户有权限访问的仓库事件） |<br />\n| 返回 | 200 |<\u002fp>\n<hr />\n<h2 id=\"16-auth-and-misc-project-templates\">Project Templates 项目模板<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apiproject-templates\">GET /api/project-templates — 模板分类列表<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | <code>{categories: [...]}<\u002fcode>（模板分类） |<br />\n| 返回 | 200 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiproject-templatestemplate_idreadme-readme\">GET /api/project-templates/{template_id}/readme — 模板 README<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{template_id}<\u002fcode> string |<br />\n| 出参 | <code>{content, source: local|git|gitcode|github}<\u002fcode>（git 源按模板配置从 GitCode/GitHub API 拉取） |<br />\n| 返回 | 200；404 模板不存在 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiproject-templatestemplate_idpreview-html\">GET /api/project-templates/{template_id}/preview — 模板预览 HTML<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{template_id}<\u002fcode> string |<br />\n| 出参 | <code>{content, source}<\u002fcode>（local 模板读 <code>examples/{id}/preview.html<\u002fcode>） |<br />\n| 返回 | 200；404 模板不存在 |<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apiproject-templatescreate\">POST /api/project-templates/create — 一键创建项目<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CreateTemplateRequest）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>template_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>模板 id<\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_name<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">否<\u002ftd>\n<td>目标仓库名<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<blockquote>\n<p>流程：建仓库 → 写模板文件 → 自动托管 → 应用开发场景。<\u002fp>\n<\u002fblockquote>\n<p>| 出参 | 创建结果（仓库 full_name / scene 应用结果） |<br />\n| 返回 | 200/201；400 未配平台 token；404 模板不存在 |<\u002fp>\n<hr />\n<h2 id=\"16-auth-and-misc-feishu-onboard-rfc-8628\">Feishu Onboard 飞书扫码建应用（RFC 8628）<\u002fh2>\n<blockquote>\n<p>流程：<code>start<\u002fcode> → 前端轮询 <code>status<\u002fcode>（拿 <code>qr_url<\u002fcode> 展示二维码）→ 用户扫码确认 → <code>connected<\u002fcode>。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"16-auth-and-misc-post-apifeishuonboardstart\">POST /api/feishu/onboard/start — 创建扫码任务<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（StartBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>bot_type<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td><code>chat_bot<\u002fcode>（默认）/ <code>vod_bot<\u002fcode><\u002ftd>\n<\u002ftr>\n<tr>\n<td><code>repo_key<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">vod_bot 时必填<\u002ftd>\n<td>绑定仓库（<code>owner/repo<\u002fcode>）<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"task_id\", \"status\": \"pending\"}<\u002fcode> |<br />\n| 返回 | 200；400 bot_type 非法 / vod_bot 缺 repo_key；409 已有进行中任务 |<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apifeishuonboardstatus\">GET /api/feishu/onboard/status — 查询扫码任务状态<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>| Query | <code>task_id<\u002fcode>（必填） |<br />\n| 出参 | <code>{task_id, status (pending|waiting_confirm|connected|failed), qr_url, expire_in, app_id, app_secret_exists, error}<\u002fcode> |<br />\n| 返回 | 200；403 非本人任务；404 任务不存在 |<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apifeishuonboardcancel\">POST /api/feishu/onboard/cancel — 取消扫码任务<\u002fh3>\n<blockquote>\n<p>scope：user_only。<\u002fp>\n<\u002fblockquote>\n<p>请求头：<code>Content-Type: application/json<\u002fcode><\u002fp>\n<p>请求体（CancelBody）：<\u002fp>\n<table>\n<thead>\n<tr>\n<th>字段<\u002fth>\n<th>类型<\u002fth>\n<th style=\"text-align: center;\">必填<\u002fth>\n<th>说明<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td><code>task_id<\u002fcode><\u002ftd>\n<td>string<\u002ftd>\n<td style=\"text-align: center;\">✅<\u002ftd>\n<td>待取消任务<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<p>| 出参 | <code>{\"message\", \"status\"}<\u002fcode>（connected/failed 任务幂等返回「无需取消」） |<br />\n| 返回 | 200；404 任务不存在 |<\u002fp>\n<hr />\n<h2 id=\"16-auth-and-misc-_2\">组织审计<\u002fh2>\n<h3 id=\"16-auth-and-misc-get-apiorgsorg_idaudit-issue-2260\">GET /api/orgs/{org_id}/audit — 查询组织审计日志（Issue #2260）<\u002fh3>\n<blockquote>\n<p>scope：user_only。权限：仅组织 owner/admin；member 与非成员 403。<\u002fp>\n<\u002fblockquote>\n<p>| Path | <code>{org_id}<\u002fcode> 组织 ID |<br />\n| Query | <code>event_type<\u002fcode>（事件名或前缀，如 <code>org_repo_bind<\u002fcode> / <code>org_repo_<\u002fcode> / <code>org_dispatch_<\u002fcode>；空=全部组织相关事件）、<code>limit<\u002fcode>（默认 50，最大 200，越界夹取）、<code>offset<\u002fcode>（默认 0，负数夹取为 0）、<code>since<\u002fcode>（<code>YYYY-MM-DD<\u002fcode> 或 <code>YYYY-MM-DD HH:MM:SS<\u002fcode>，含边界） |<br />\n| 出参 | <code>{items: [{id, seq, event_type, user_id, operator_id, ip, detail, created_at}], total, limit, offset}<\u002fcode>：<code>items<\u002fcode> 按 <code>id<\u002fcode> 倒序，<code>detail<\u002fcode> 递归脱敏（敏感键 → <code>[REDACTED]<\u002fcode>，正文键剔除，超出深度上限的子树整棵丢弃），<code>total<\u002fcode> 为全量匹配数 |<br />\n| 返回 | 200；400 <code>INVALID_SINCE<\u002fcode>（格式非法或含时区）；404 <code>ORG_NOT_FOUND<\u002fcode>；403 <code>PERMISSION_DENIED<\u002fcode>（含 <code>tk_<\u002fcode> 会话凭据） |<\u002fp>\n<blockquote>\n<p>事件白名单固定为组织相关事件（<code>org_repo_*<\u002fcode> / <code>org_context_*<\u002fcode> / <code>org_knowledge_*<\u002fcode>）与跨仓下派事件（<code>dispatch_*<\u002fcode> / <code>target_*<\u002fcode>）；<code>org_dispatch_<\u002fcode> 是下派事件的语义别名。<code>org_provision_<\u002fcode> 当前无对应审计写入，返回空页。日志本身不可变（哈希链），接口只读。<\u002fp>\n<\u002fblockquote>\n<hr />\n<h2 id=\"16-auth-and-misc-_3\">错误返回（全端点通用）<\u002fh2>\n<table>\n<thead>\n<tr>\n<th>码<\u002fth>\n<th>场景<\u002fth>\n<\u002ftr>\n<\u002fthead>\n<tbody>\n<tr>\n<td>400<\u002ftd>\n<td>参数缺失/校验失败<\u002ftd>\n<\u002ftr>\n<tr>\n<td>401<\u002ftd>\n<td>未认证 / token 无效<\u002ftd>\n<\u002ftr>\n<tr>\n<td>403<\u002ftd>\n<td><code>tk_<\u002fcode> 不适用（user_only）+ 仓库无权限<\u002ftd>\n<\u002ftr>\n<tr>\n<td>404<\u002ftd>\n<td>资源不存在<\u002ftd>\n<\u002ftr>\n<tr>\n<td>409<\u002ftd>\n<td>进行中任务冲突<\u002ftd>\n<\u002ftr>\n<\u002ftbody>\n<\u002ftable>\n<pre><code class=\"language-json\">{&quot;detail&quot;: {&quot;code&quot;: 404, &quot;message&quot;: &quot;Not Found&quot;}}\n<\u002fcode><\u002fpre>\n<hr />\n<h2 id=\"16-auth-and-misc-apiorgs\">组织管理（/api/orgs）<\u002fh2>\n<blockquote>\n<p>组织上下文、关联仓库、仓库地图、跨仓下派、组织知识与审计。<br />\n认证与 scope 以 OpenAPI 的 <code>security<\u002fcode> / <code>x-token-scope<\u002fcode> 为准；组织成员/管理员校验由服务端执行。<\u002fp>\n<\u002fblockquote>\n<h3 id=\"16-auth-and-misc-get-apiorgs-orgs_list\">GET /api/orgs — orgs_list<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-post-apiorgs-orgs_create\">POST /api/orgs — orgs_create<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<p>错误码：<\u002fp>\n<ul>\n<li><code>409 ORG_SLUG_EXISTS<\u002fcode>：slug 已存在（不会再与「写库失败」混用同一个 409）；<\u002fli>\n<li><code>500 ORG_CREATE_FAILED<\u002fcode>：组织写库失败。组织行与 provisioning 初始状态/仓库选项<br />\n  在同一条 INSERT 写入，失败不会留下 <code>provision_status=NULL<\u002fcode> 的半成品。<\u002fli>\n<\u002ful>\n<h3 id=\"16-auth-and-misc-get-apiorgsrepo-namespaces-orgs_repo_namespaces\">GET /api/orgs/repo-namespaces — orgs_repo_namespaces<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiorgssearchusers-orgs_search_users\">GET /api/orgs/search/users — orgs_search_users<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-delete-apiorgsorg_id-orgs_delete\">DELETE /api/orgs/{org_id} — orgs_delete<\u002fh3>\n<blockquote>\n<p>scope：<code>user_only<\u002fcode><\u002fp>\n<\u002fblockquote>\n<p>参数与响应字段以 <code>/openapi.json<\u002fcode> 为准；组织类错误返回 <code>detail.error_code<\u002fcode>。<\u002fp>\n<h3 id=\"16-auth-and-misc-get-apiorgsorg_id-orgs_detail\">GET
