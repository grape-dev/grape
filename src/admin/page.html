<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Bot 管理台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}

/* Login */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)}
.login-card{background:#fff;border-radius:12px;padding:40px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.login-card h1{text-align:center;margin-bottom:4px;font-size:22px}
.login-card .sub{text-align:center;color:#888;font-size:13px;margin-bottom:20px}
.login-card input{width:100%;padding:12px 16px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none}
.login-card input:focus{border-color:#667eea}
.login-card .btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.login-card .btn.primary{background:#667eea;color:#fff}
.login-card .btn.primary:disabled{opacity:.6}
.login-card .err{color:#e74c3c;font-size:13px;text-align:center;margin-top:8px}

/* Panel */
#panel-page{display:none;max-width:1200px;margin:0 auto;padding:0 24px 24px}
.header{background:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px}
.header h2{font-size:16px;font-weight:600}
.header a{font-size:13px;color:#e74c3c;cursor:pointer}
.layout{display:flex;gap:24px}
.sidebar{width:260px;flex-shrink:0}
.sidebar h3{font-size:13px;color:#888;padding:0 12px;margin-bottom:8px}
.list{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.item:hover{background:#f8f9ff}
.item.active{background:#eef0ff;font-weight:600}
.item:last-child{border-bottom:none}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#ccc}
.dot.ok{background:#27ae60}
.add-btn{padding:12px;text-align:center;color:#667eea;cursor:pointer;font-size:14px;border-top:1px solid #f0f0f0;display:block}

.main{flex:1;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:24px}
.main h3{font-size:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;margin-bottom:16px}
.group{margin-bottom:18px}
.group h4{font-size:13px;color:#888;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #f5f5f5}
.row{margin-bottom:10px}
.row label{display:block;font-size:12px;color:#666;margin-bottom:2px}
.row .input-wrap{display:flex;gap:6px}
.row input, .row select{flex:1;padding:9px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none}
.row input:focus{border-color:#667eea}
.row .eye{background:#f5f5f5;border:1px solid #d9d9d9;border-radius:6px;padding:0 10px;cursor:pointer;font-size:14px;color:#888;display:flex;align-items:center;user-select:none}
.actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0}
.actions button{padding:10px 20px;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.btn-prim{background:#667eea;color:#fff}
.btn-sec{background:#e8e8e8;color:#333}
.btn-del{background:#e74c3c;color:#fff}
.empty{flex:1;background:#fff;border-radius:8px;padding:60px;text-align:center;color:#888;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{background:#27ae60}
.toast.err{background:#e74c3c}
@media(max-width:767px){.layout{flex-direction:column}.sidebar{width:100%}}
</style>
</head><body>

<!-- ========== Login ========== -->
<div id="login-page">
  <div class="login-card">
    <h1>DevOps Bot</h1><p class="sub">管理台登录</p>
    <form method="POST" action="/api/admin/login" onsubmit="doLogin();return false">
      <input id="login-user" name="username" placeholder="用户名" autocomplete="username" required>
      <input id="login-pass" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
      <button class="btn primary" type="submit">登录</button>
    </form>
    <div id="login-err" class="err" style="display:none"></div>
  </div>
</div>

<!-- ========== Panel ========== -->
<div id="panel-page">
  <div class="header"><h2>DevOps Bot 管理台</h2><a onclick="doLogout()">退出</a></div>
  <div class="layout">
    <div class="sidebar">
      <h3>账户列表</h3>
      <div class="list" id="account-list"></div>
      <span class="add-btn" onclick="doAdd()">+ 新增</span>
    </div>
    <div id="form-panel" class="main" style="display:none"></div>
    <div id="empty-panel" class="empty">请选择左侧账户</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ======== State ========
var TOKEN = "";
var ACCOUNTS = [];
var CUR_ACCOUNT = null;
var IS_NEW = false;
var SHOW_FIELDS = {};

// ======== Init ========
(function(){
  TOKEN = __TOKEN_PLACEHOLDER__ || '';
  try { var emb = __ACCOUNTS_PLACEHOLDER__; ACCOUNTS = Array.isArray(emb) ? emb : []; }catch(e){ ACCOUNTS = []; }
  var qs = new URLSearchParams(window.location.search);
  if (qs.get('token')) TOKEN = qs.get('token');
  if (TOKEN) { document.getElementById('login-page').style.display='none'; document.getElementById('panel-page').style.display='block'; renderList(); }
})();

// ======== Toast ========
function toast(msg, ok){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(ok?'ok':'err'); setTimeout(function(){t.className='toast';},2500); }

// ======== Login ========
function doLogin(){
  var u = document.getElementById('login-user').value;
  var p = document.getElementById('login-pass').value;
  var e = document.getElementById('login-err');
  e.style.display = 'none';
  var btn = document.querySelector('#login-page button[type=submit]');
  if (btn) { btn.disabled = true; btn.textContent = '登录中…'; }
  try {
    fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if(!d.token){ throw new Error('no token'); }
      TOKEN = d.token;
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('panel-page').style.display = 'block';
      fetchAccounts();
    })
    .catch(function(err){ e.textContent = '登录失败: '+(err.message||'请重试'); e.style.display='block'; if(btn){ btn.disabled=false; btn.textContent='登录'; } });
  } catch(ex) { e.textContent = '错误: '+ex.message; e.style.display='block'; if(btn){ btn.disabled=false; btn.textContent='登录'; } }
  return false;
}

// ======== Logout ========
function doLogout(){ TOKEN=''; window.location.href='/admin/'; }

// ======== API ========
function api(method, path, body, cb){
  fetch(path,{method:method,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):null})
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d,status:r.status}; }); })
  .then(function(r){ cb(r.ok, r.data, r.status); })
  .catch(function(){ toast('网络错误',false); });
}

// ======== Accounts ========
function fetchAccounts(){
  api('GET','/api/admin/accounts','',function(ok,data){
    if(ok){ ACCOUNTS = data; renderList(); } else { toast('加载账户失败',false); }
  });
}

function renderList(){
  var el = document.getElementById('account-list');
  if (!ACCOUNTS || !ACCOUNTS.length) { el.innerHTML = '<div style="padding:12px;color:#888;font-size:13px;text-align:center">无账户</div>'; return; }
  var h = '';
  ACCOUNTS.forEach(function(a){
    var active = CUR_ACCOUNT && CUR_ACCOUNT.name === a.name ? ' active' : '';
    h += '<div class="item'+active+'" onclick="selectAccount(\''+a.name+'\')">'
      + '<span>'+a.name+'</span>'
      + '<span class="dots">'
      + '<span class="dot'+(a.gitcode_api_token==='YES'?' ok':'')+'"></span>'
      + '<span class="dot'+(a.feishu_app_id==='YES'?' ok':'')+'"></span>'
      + '<span class="dot'+(a.huawei_cloud_ak==='YES'?' ok':'')+'"></span>'
      + '</span></div>';
  });
  el.innerHTML = h;
}

function selectAccount(name){
  api('GET','/api/admin/accounts/'+name,'',function(ok,data){
    if(!ok){ toast('加载失败',false); return; }
    CUR_ACCOUNT = data; IS_NEW = false; SHOW_FIELDS = {};
    renderList(); renderForm();
  });
}

function doAdd(){
  CUR_ACCOUNT = {name:'',gitcode_api_token:'',gitcode_webhook_token:'',feishu_app_id:'',feishu_app_secret:'',huawei_cloud_ak:'',huawei_cloud_sk:'',CODEARTS_CLI_AK:'',CODEARTS_CLI_SK:'',bot_usernames:''};
  IS_NEW = true; SHOW_FIELDS = {};
  CUR_ACCOUNT.name = '__new__';
  renderList(); renderForm();
}

// ======== Form ========
function toggleShow(key){ SHOW_FIELDS[key] = !SHOW_FIELDS[key]; renderForm(); }

function renderForm(){
  var a = CUR_ACCOUNT;
  if (!a) { document.getElementById('form-panel').style.display='none'; document.getElementById('empty-panel').style.display='block'; return; }
  document.getElementById('form-panel').style.display='block'; document.getElementById('empty-panel').style.display='none';

  var isNew = IS_NEW;
  var title = isNew ? '新增账户' : a.name;
  var show = SHOW_FIELDS;

  function field(label, key, placeholder){
    placeholder = placeholder || '';
    var type = show[key] ? 'text' : 'password';
    var val = (a[key] !== undefined && a[key] !== null) ? a[key] : '';
    return '<div class="row"><label>'+label+'</label>'
      + '<div class="input-wrap"><input type="'+type+'" value="'+esc(val)+'" onchange="CUR_ACCOUNT[\''+key+'\']=this.value" placeholder="'+placeholder+'">'
      + '<span class="eye" onclick="toggleShow(\''+key+'\')">'+(show[key]?'&#128065;':'&#128064;')+'</span></div></div>';
  }
  function text(label, key){
    var val = (a[key] !== undefined && a[key] !== null) ? a[key] : '';
    return '<div class="row"><label>'+label+'</label><input type="text" value="'+esc(val)+'" onchange="CUR_ACCOUNT[\''+key+'\']=this.value"></div>';
  }

  var h = '<h3>'+title+'</h3>';
  h += '<div class="group"><h4>基础信息</h4>';
  h += text('账户名称','name', true);
  h += text('Bot 用户名（逗号分隔）','bot_usernames');
  h += '</div>';

  h += '<div class="group"><h4>GitCode</h4>';
  h += field('API Token','gitcode_api_token','Personal Access Token');
  h += field('Webhook Token','gitcode_webhook_token','Webhook 验证 Token');
  h += '</div>';

  h += '<div class="group"><h4>飞书</h4>';
  h += field('App ID','feishu_app_id');
  h += field('App Secret','feishu_app_secret');
  h += '</div>';

  h += '<div class="group"><h4>华为云</h4>';
  h += field('Access Key','huawei_cloud_ak');
  h += field('Secret Key','huawei_cloud_sk');
  h += '</div>';

  h += '<div class="group"><h4>CodeArts</h4>';
  h += field('CLI Access Key','CODEARTS_CLI_AK');
  h += field('CLI Secret Key','CODEARTS_CLI_SK');
  h += '</div>';

  h += '<div class="actions">';
  h += '<button class="btn-prim" onclick="doSave()">保存</button>';
  h += '<button class="btn-sec" onclick="doTest()">测试连接</button>';
  if (!isNew && a.name !== 'default') h += '<button class="btn-del" onclick="doDelete()">删除</button>';
  h += '</div>';

  document.getElementById('form-panel').innerHTML = h;
  if (isNew) {
    document.querySelector('#form-panel input').removeAttribute('disabled');
    document.querySelector('#form-panel input').focus();
  }
}

var RENDER_TIMER = null;
function scheduleRender(){ clearTimeout(RENDER_TIMER); RENDER_TIMER = setTimeout(renderForm, 200); }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ======== Actions ========
function doSave(){
  var n = CUR_ACCOUNT.name;
  if (IS_NEW) n = document.querySelector('#form-panel input').value;
  if (!n || !n.trim()){ toast('请输入账户名称',false); return; }
  var payload = {};
  for(var k in CUR_ACCOUNT){ if(k!=='name'||!IS_NEW) payload[k] = CUR_ACCOUNT[k]; }
  payload.name = n;
  // normalize bot_usernames from comma-separated string
  if (typeof payload.bot_usernames === 'string') {
    payload.bot_usernames = payload.bot_usernames.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  }
  var nn = IS_NEW ? n : CUR_ACCOUNT.name;
  api('PUT','/api/admin/accounts/'+encodeURIComponent(nn),payload,function(ok){
    if(ok){ toast('保存成功',true); IS_NEW=false; fetchAccounts(); } else { toast('保存失败',false); }
  });
}

function doTest(){
  api('POST','/api/admin/accounts/'+encodeURIComponent(CUR_ACCOUNT.name)+'/test','',function(ok,data){
    toast(data.status||data.error||'测试完成',ok);
  });
}

function doDelete(){
  if(!confirm('确定删除 '+CUR_ACCOUNT.name+' ?')) return;
  api('DELETE','/api/admin/accounts/'+encodeURIComponent(CUR_ACCOUNT.name),'',function(ok){
    if(ok){ toast('已删除',true); CUR_ACCOUNT=null; document.getElementById('form-panel').style.display='none';document.getElementById('empty-panel').style.display='block'; fetchAccounts(); }
    else { toast('删除失败',false); }
  });
}
</script>
</body></html>
