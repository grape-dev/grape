<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Bot 管理台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0,#764ba2 100%)}
.login-card{background:#fff;border-radius:12px;padding:40px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.login-card h1{text-align:center;margin-bottom:8px;font-size:22px}
.login-card p{text-align:center;color:#888;font-size:13px;margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;margin-bottom:12px;outline:0}
.login-card button{width:100%;padding:12px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.login-error{color:#e74c3c;font-size:13px;text-align:center;margin-top:8px;display:none}
.panel{padding:24px;max-width:800px;margin:0 auto}
.panel h2{margin-bottom:20px}
</style>
</head><body>
<div id="loginPage" class="login-page">
<div class="login-card">
<h1>DevOps Bot</h1>
<p>管理台登录</p>
<form action="/api/admin/login" method="POST">
<input type="text" name="username" value="developer" placeholder="用户名">
<input type="password" name="password" value="YOUR_SSH_PASSWORD" placeholder="密码">
<button type="submit">登录</button>
</form>
</div></div>
<div id="panelPage" class="panel" style="display:none">
<h2>DevOps Bot 管理台</h2>
<p>加载中...</p>
</div>
<script>
// Extract token from URL after redirect
var params=new URLSearchParams(window.location.search);
var token=params.get('token');
if(token && token.length>0){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('panelPage').style.display='block';
  document.getElementById('panelPage').innerHTML='<h2>DevOps Bot 管理台</h2><p>登录成功，Token: '+token.slice(0,8)+'...</p>';
}
</script>
</body></html>
