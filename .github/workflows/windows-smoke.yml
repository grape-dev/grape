name: windows-smoke

# Issue #351: Windows 冒烟测试——覆盖多行提示词经 stdin 完整到达、
# find_cli exe 优先解析、cmd/bat 壳兜底降级 WARN。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Windows prompt smoke tests (issue #351)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/test_issue_351_windows_prompt.py tests/test_os_adapter.py -v
