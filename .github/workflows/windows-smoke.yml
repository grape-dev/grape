name: windows-smoke

# Issue #351: Windows 冒烟测试——覆盖多行提示词经 stdin 完整到达、
# find_cli exe 优先解析、cmd/bat 壳兜底降级 WARN。
# Issue #473 PR #668 审查修复（QA Nice-to-have）：新增 linux-backend job，
# 运行本 Issue 的后端 pytest 与前端 node 源断言测试，回归不再只靠人工。
# Issue #536 QA-Impt 修复：linux-backend 增加 DDL 安全带卡点——显式目标分支
# 运行 scripts/check-destructive-ddl.py + Issue #536 新增 pytest 用例，
# 危险 DDL 回归不再依赖人工本地执行。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Windows prompt smoke tests (issue #351 + #452)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/test_issue_351_windows_prompt.py tests/test_os_adapter.py tests/test_issue_452_windows_install.py -v

  linux-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Backend range-filter tests (issue #473)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/test_issue_473_range_filter.py tests/test_issue_473_local_engine_range.py -v
      - name: Event convergence regression tests (issue #587)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/test_issue_587_event_convergence.py tests/test_terminate_event.py -v
      - name: Labels dual-channel tests (issue #581)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/test_issue_581_labels_dual_channel.py -v
      - name: Frontend source-assertion tests (issue #473)
        run: node tests/js/test_issue_473_range_filter.js
      - name: IM adapter tests (issue #1613)
        # Issue #1613 QA 审查：tests/im（含新增 Telegram 用例）此前未被流水线执行，
        # 回归无法被门禁发现；此处接入全量 IM 适配器用例。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/im -q
      - name: Destructive DDL guard + Issue #536 migration safety tests
        # Issue #536 QA-Impt：CI 显式接入 DDL 卡点与新增用例；base 显式传目标分支
        # （GitCode 注入 CI_MERGE_REQUEST_TARGET_BRANCH_NAME，GitHub 用 PR base），
        # 脚本对不可解析 base 按 FAIL 处理（不再 fail-open）。
        env:
          GITCODE_API_TOKEN: test_token
          DDL_BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          python3 scripts/check-destructive-ddl.py "$DDL_BASE"
          python -m pytest tests/atomic/test_issue_536_migrations.py tests/atomic/test_migration_track_guard.py tests/test_check_destructive_ddl.py -v
      - name: OpenAPI contract endpoint completeness guard (issue #897)
        # Issue #897 P0：契约 v2.2.0 曾被 A 进程子集落盘覆盖，丢失 /api/a2a、
        # /api/tasks/* 等核心工作流端点导致 CLI 命令组不渲染。CI 卡点：
        # 1) 当前代码渲染的契约必须包含 7 个核心工作流端点；
        # 2) 不得删除基线（help/api/openapi-baseline.json，checked-in 的上次
        #    发布契约快照）中核心工作流前缀下端点。--require-baseline 保证
        #    基线缺失时 FAIL，版本间比对不会静默跳过（QA 审查修复项）。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python3 scripts/check-openapi-endpoints.py --require-baseline
          python -m pytest tests/test_check_openapi_endpoints.py -v