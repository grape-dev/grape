name: windows-smoke

# Issue #351: Windows 冒烟测试——覆盖多行提示词经 stdin 完整到达、
# find_cli exe 优先解析、cmd/bat 壳兜底降级 WARN。
# Issue #473 PR #668 审查修复（QA Nice-to-have）：新增 linux-backend job，
# 运行本 Issue 的后端 pytest 与前端 node 源断言测试，回归不再只靠人工。
# Issue #536 QA-Impt 修复：linux-backend 增加 DDL 安全带卡点——显式目标分支
# 运行 scripts/check-destructive-ddl.py + Issue #536 新增 pytest 用例，
# 危险 DDL 回归不再依赖人工本地执行。
# Issue #3874 PR #2003 审查修复（Required）：Windows worker onboard 三段修复的
# 新增用例接入 windows-smoke 门禁（依赖清单/wheels 平台覆盖 × 降级解析器 × ps1 软门）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Windows prompt smoke tests (issue #351 + #452)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_351_windows_prompt.py tests/runtime/test_os_adapter.py tests/runtime/test_issue_452_windows_install.py tests/runtime/test_windows_euid_guard.py tests/runtime/test_worker_windows_deps.py -v
      - name: "Worker onboard dependency + model gate tests (issue #3874)"
        # Issue #3874 PR #2003 审查修复（Required）：三段修复的新增用例此前未接入
        # 任何 CI job，回归只能靠人工 pytest（先例 #1613/#1982/#2133/#2245/#3490）。
        # 覆盖依赖清单同源 + bundled wheels 平台标签（含 win_amd64）、YAML sequences
        # 降级为非阻断 warning、install-worker.ps1 校验软门与 -SkipEngineCheck。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_3874_worker_onboard.py tests/test_engine_model_2545.py tests/test_worker_install_model_gate_2545.py -v
      - name: Worker install register-window tests (issue #3892)
        # Issue #3892 QA 审查修复（Required#3）：新增用例
        # tests/runtime/test_issue_3892_install_worker_register_window.py 此前未接入 CI，
        # 其中 15 条 pwsh 行为用例在没有 PowerShell 的环境恒 skip，回归等于无门禁。
        # windows-latest 自带 pwsh，静态守卫 + 行为用例全部生效（历史日志水位、
        # 硬失败跳过主控交叉验证、回滚提示分支都在此被拦截）。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_3892_install_worker_register_window.py -v


  linux-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Backend range-filter tests (issue #473)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_473_range_filter.py tests/runtime/test_issue_473_local_engine_range.py -v
      - name: Event convergence regression tests (issue #587)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_587_event_convergence.py tests/runtime/test_terminate_event.py -v
      - name: Runtime credential file regression tests (issue #2152)
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python -m pytest tests/runtime/test_dsh_runtime.py \
            tests/runtime/test_executor_token_env.py -v
      - name: Labels dual-channel tests (issue #581)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_581_labels_dual_channel.py -v
      - name: Org dispatch & scene mgmt tests (issue #2112)
        # Issue #2112 PR #1265 审查：tests/mgmt 下派用例此前未进门禁，回归只能靠人工。
        # 显式接入下派 + 组织/场景相关用例，失败可阻断合并。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python -m pytest tests/mgmt/test_org_dispatch.py tests/mgmt/test_org_repo_binding.py \
            tests/mgmt/test_org_provisioning.py tests/mgmt/test_scene_env.py \
            tests/mgmt/test_linked_repos.py tests/runtime/test_org_aggregate_wait.py -v
      - name: Org context & knowledge tests (issue #2150)
        # Issue #2150 PR #1278 审查：新用例此前未进门禁，回归只能靠人工。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/mgmt/test_org_context.py tests/mgmt/test_org_context_autoseed.py \
            tests/mgmt/test_org_context_retention.py \
            tests/mgmt/test_org_context_snapshot.py \
            tests/api/test_event_store_context_digest.py -v
      - name: Org audit query tests (issue #2260)
        # Issue #2260 PR #1344 审查：组织审计查询用例此前未进门禁，回归只能靠人工。
        # 覆盖鉴权/隔离/事件过滤/分页/since/脱敏（含深层嵌套 fail-closed）。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/mgmt/test_org_audit.py -v
      - name: Org pipeline end-to-end integration tests (issue #2153)
        # Issue #2153：组织主体链路（provisioning → 关联仓库 → 下派 → 聚合）端到端集成用例。
        # 独立 integration marker：真实 DB + mock VCS adapter，无外网、无真实 worker。
        # 默认回归通过 pytest.ini addopts 排除 integration，此处单独门禁执行。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/integration -m integration -v
      - name: Engine uid migration tests (issue #646)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_646_engine_uid.py -v
      - name: Session engine uid dual-read tests (issue #868)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_868_session_engine_uid.py -v
      - name: Frontend engine uid consumption tests (issue #868 scope revision)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_868_frontend_uid.py -v
      - name: Engine uid rename-follow anchor guard tests (issue #868 cross-warning)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_868_engine_uid_rename_guard.py -v
      - name: Engine uid seed id-to-uid upgrade guard tests (issue #868 seed upgrade)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_868_seed_uid_upgrade.py -v
      - name: claim-by-uid v2 endpoint tests (issue #1011)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_1011_claim_v2.py -v
      - name: engine_uid rederive backfill + report backfill migration tests (issue #1011)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_1011_migrations.py -v
      - name: autopilot engine binding uid sibling-field tests (issue #1011)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_1011_autopilot_uid.py -v
      - name: worker v2-first/v1-fallback 404 semantics tests (issue #1011)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_1011_worker_v2.py -v
      - name: full dispatch-chain integration tests (issue #1011 acceptance #17)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/api/test_issue_1011_integration.py -v
      - name: Frontend source-assertion tests (issue #473)
        run: node tests/js/test_issue_473_range_filter.js
      - name: Org pipeline page source-assertion tests (org detail split)
        run: node tests/js/test_org_pipeline_page.js
      - name: IM adapter tests (issue #1613)
        # Issue #1613 QA 审查：IM 适配器用例此前未被流水线执行，回归无法被门禁发现；
        # 本仓测试树已按 src 对齐，IM 用例位于 tests/runtime/im/。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/im -q
      - name: AtomCode engine integration tests
        # AtomCode CLI 接入的回归卡点：协议映射、用量拆分、空回复不重开会话、
        # 取消/超时清理提示词文件、沙箱只读挂载、注册完整性、安装器行为。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_atomcode_runtime.py -v
      - name: Frontend autopilot uid source-assertion tests (issue #1011)
        run: node tests/js/test_issue_1011_autopilot_uid.js
      - name: Destructive DDL guard + Issue #536 migration safety tests
        # Issue #536 QA-Impt：CI 显式接入 DDL 卡点与新增用例；base 显式传目标分支
        # （GitCode 注入 CI_MERGE_REQUEST_TARGET_BRANCH_NAME，GitHub 用 PR base），
        # 脚本对不可解析 base 按 FAIL 处理（不再 fail-open）。
        env:
          GITCODE_API_TOKEN: test_token
          DDL_BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          python3 scripts/check-destructive-ddl.py "$DDL_BASE"
          python -m pytest tests/api/test_issue_536_migrations.py tests/kernel/test_check_destructive_ddl.py \
            tests/kernel/test_d105_org_user_text_migration.py tests/kernel/test_context_digest.py -v
      - name: OpenAPI contract endpoint completeness guard (issue #897)
        # Issue #897 P0：契约 v2.2.0 曾被 A 进程子集落盘覆盖，丢失 /api/a2a、
        # /api/tasks/* 等核心工作流端点导致 CLI 命令组不渲染。CI 卡点：
        # 1) 当前代码渲染的契约必须包含 7 个核心工作流端点；
        # 2) 不得删除基线（help/api/openapi-baseline.json，checked-in 的上次
        #    发布契约快照）中核心工作流前缀下端点。--require-baseline 保证
        #    基线缺失时 FAIL，版本间比对不会静默跳过（QA 审查修复项）。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python3 scripts/check-openapi-endpoints.py --require-baseline
          python -m pytest tests/api/test_check_openapi_endpoints.py -v
      - name: Recover-orphans active whitelist tests (issue #1750)
        # Issue #1750：worker 自报活跃白名单 + 回收时机收紧（周期/心跳重注册 rid
        # 变化携带白名单，启动空白名单）；同时回归 recover_orphans 系列既有用例。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_1750_recover_orphans_active_whitelist.py tests/runtime/test_recover_orphans_slots.py tests/api/test_recover_orphans_optimization.py -v
      - name: Reregister/client contract regression tests (issue #1750)
        # Issue #1750：_reregister 默认不回收 + client.recover_orphans 返回 dict 属契约
        # 变更，须回归受影响既有用例（按 node 接入，避开该文件既有基线红灯）。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python -m pytest tests/runtime/test_runtime_agent.py::TestReregister -v
          python -m pytest tests/runtime/test_runtime_agent_concurrency.py::test_reregister_unpacks_register_tuple tests/runtime/test_runtime_agent_concurrency.py::test_reregister_default_does_not_recover -v
          python -m pytest tests/runtime/test_runtime_client.py -v
      - name: Branch guard fail-open + worktree reset archive regression tests (issues #2028/#2041/#2292)
        # Issue #2028（QA 第3/4轮）：branch_guard fail-open/fail-closed 边界、
        # 存量钩子版本升级与幂等/自愈回归（17 项）+ worker 发布闭包回归（29 项）。
        # Issue #2041：worktree 重置归档守卫回归（40 项）。两文件此前均未接入
        # CI，回退只能靠人工 pytest；接入后同类回退由门禁拦截。
        # Issue #2292（同 #2147）：canonical src.kernel.lock 导入/钩子模板版本/
        # fail-open 修复指引/install-worker.sh 冒烟自检回归。
        # Issue #2706（user feedback #7415，第 8 次同类复发终修）：租约层
        # _lock_module() 收敛点 + 缺 lock 模块 fail-open 回归（两个测试文件：
        # fail_open 为主干用例，fallback 增补端到端缺模块部署树 + 降级不吞
        # 真实阻断）；并显式跑守卫/lock 模块 import 冒烟（含 src.lock 旧别名），
        # 防「包缺文件、钩子启动即崩」在发布门禁静默通过。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python -c "import src.domains.runtime.engine.branch_guard; import src.kernel.lock; from src import lock"
          python -m pytest tests/test_issue_2028_branch_guard_fail_open.py tests/runtime/test_worker_package.py -v
          python -m pytest tests/runtime/test_issue_2292_branch_guard_canonical_lock.py -v
          python -m pytest tests/runtime/test_issue_2706_branch_guard_lease_fail_open.py -v
          python -m pytest tests/runtime/test_issue_2706_branch_guard_lease_fallback.py -v
          python -m pytest tests/test_worktree_reset_archive.py -v
      - name: "Issue #1982 probe tri-state + fd regression tests"
        # Issue #1982/#2134：fd 收口与探活三态/服务端分账回归用例此前未接入
        # CI（PR !1202 遗留），回退只能靠人工 pytest；接入 linux-backend 门禁
        # 拦截。fd 用例依赖 /proc/self/fd（文件内置 skipif），必须接 Linux
        # 步骤才全量生效，Windows 步骤无效。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_1982_fd_leak.py tests/runtime/test_issue_1982_probe_state.py -v
      - name: GSB per-method route matrix gate + routing tests (issue #2479)
        # Issue #2479 QA 审查修复（Required#4）：禁止矩阵静态扫描与新增 23 路由
        # 用例此前只挂在 scripts/check-all.sh，CI 实际不执行（漂移/绕过只能靠
        # 人工）。接入 linux-backend 门禁：runtime|insight 引用 mgmt remote 通道
        # （如 GsbClient("mgmt")）可被 CI 拦红，路由/热切换/fail-fast 回归有门禁。
        # 门禁自身单测（别名负例/apps 入口/缺失根 fail-closed）同步骤接入，
        # 防止门禁能力回退时 CI 仍绿。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python3 scripts/check_gsb_route_matrix.py
          python -m pytest tests/scripts/test_check_gsb_route_matrix.py tests/kernel/test_gsb_route.py -v
      - name: Engine recovery loop regression tests (issue #2133)
        # Issue #2133 QA 审查修复（W1 Required）：新增用例 test_issue_2133_recovery.py
        # 此前未接入 CI 门禁（先例 #1613：tests/im 未接入曾被 QA 要求补齐），闭环回归
        # （认领闸门挡 spawn_failed / 时间窗告警降级 / 探活 ok 自动加回 / 任务绑定对账）
        # 只能靠人工本地执行，重构可静默打破而 CI 不红；#1982 探活/fd 用例已由上方
        # 1982 专项步骤接入（QA 建议一并接入已覆盖），此处跑 2133 闭环回归即可。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_2133_recovery.py -v

      - name: Organization provisioning and repo binding tests (issue #2090)
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/mgmt/test_org_provisioning.py tests/mgmt/test_org_repo_binding.py tests/mgmt/test_org_repo_picker.py tests/mgmt/test_repo_org_visibility.py tests/mgmt/test_org_delete_cleanup.py -q
      - name: Takeover dispatch guard regression tests (issue #3201)
        # Issue #3201：接管 active 期间统一拦截自动派发（webhook/direct/A2A/过期自愈/
        # 状态聚合/忽略计数边界）回归用例此前未接入 CI，回退只能靠人工本地执行。
        # 本步骤把新用例与既有 takeover 守卫用例一起纳入门禁。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python -m pytest tests/test_takeover_dispatch_guard_3201.py tests/test_takeover_flow.py tests/test_takeover_event_guard.py tests/test_takeover_dispatch.py tests/test_takeover_mark.py tests/runtime/test_issue_1770_a2a_dispatch_guard.py -q
      - name: Org unassigned int/str visibility tests (issue #3167)
        # Issue #3167 QA 审查修复（Required）：新增回归用例
        # tests/mgmt/test_issue_3167_org_unassigned_int.py 此前未接入 CI，int org_id
        # 导致的 500 与静默漏行回归只能靠人工本地 pytest；接入 linux-backend 门禁
        # （先例 #1613/#1982/#2133/#2479 均由 QA 要求补齐）。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/mgmt/test_issue_3167_org_unassigned_int.py -v
      - name: Coding worktree git writability regression tests (issue #2245)
        # Issue #2245 QA 审查修复（W1 Required）：新增用例 test_issue_2245_git_writable.py
        # 此前未接入 CI 门禁（先例 #1613/#2133），只读 gitdir 迁移、common 只读探测、
        # detached HEAD 保真与 worktree add 失败门禁只能靠人工 pytest，回退无法被 CI 发现。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_2245_git_writable.py -v
      - name: Session tmpdir isolation + release guard tests (issue #2225)
        # Issue #2225 QA 审查修复（R1 Required）：新增用例 test_issue_2225_session_tmpdir.py
        # 与 test_issue_2225_release_guard.py 此前未接入 linux-backend 门禁（先例 #2133/
        # #1982/#1613），并发暂存隔离与跨 Issue 写拦截回归只能靠人工 pytest，重构可静默
        # 打破而 CI 不红。用例内 sweeper 扫描根已收敛到 tmp_path（R3 修复），不会触碰共享
        # worker 的真实 /tmp/opencode。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_2225_session_tmpdir.py tests/runtime/test_issue_2225_release_guard.py -v
      - name: Worker package cross-process build lock regression tests (issue #3490)
        # Issue #3490 QA 审查修复（Required）：新增用例 test_worker_package_build_lock.py
        # 此前未接入 CI 门禁（先例 #1613/#1982/#2133/#2245 均由 QA 要求补齐）。
        # 用例依赖 fcntl.flock 串行化跨进程构建，Windows 无 fcntl 会退化为无锁，
        # 必须放 linux-backend job 才有效。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/kernel/test_worker_package_build_lock.py -v
      - name: Skills repo param + auth route regression tests (issues #1790/#1786)
        # Issue #1790/#1786 移植用例（repo 参数三态校验）与 tests/api/test_auth_routes.py
        # 此前未接入 linux-backend 门禁，回退只能靠人工 pytest；本 PR 修复 NameError 后
        # 两者一并纳入门禁，防止「实现漂移但 CI 仍绿」。
        env:
          GITCODE_API_TOKEN: test_token
        run: |
          python -m pytest tests/test_issue_1790_1786_port.py -v
          python -m pytest tests/api/test_auth_routes.py -v
      - name: Trace relay disabled-state noise regression tests (issue #3699)
        # Issue #3699 QA 审查修复（Required）：新增用例 test_issue_3699_trace_relay_noise.py
        # 此前未接入 linux-backend 门禁（先例 #1613/#2133/#2245/#3167/#3490 均由 QA
        # 要求补齐），中继禁用态降噪与 exporter 退避策略回归只能靠人工 pytest。
        env:
          GITCODE_API_TOKEN: test_token
        run: python -m pytest tests/runtime/test_issue_3699_trace_relay_noise.py -v
      - name: Trace relay observability + deploy config tests (issue 3749)
        # Issue #3749 QA 审查修复（Required）：新增用例
        # test_issue_3749_trace_relay_observability.py（禁用态 503 打点、启动自检、
        # 指标单次注册与两个入口接线）与 test_issue_3749_trace_relay_deploy_config.py
        # （五个配置面 + compose worker-server + 503 告警规则）此前未接入 linux-backend
        # 门禁（先例 #2133/#2245/#3167/#3490/#3699/#3758）。本缺陷正是「CI 绿但指标
