name: lint

# Issue #4158 门禁接入 CI（PR #2077 复审 Optional）：
# 去重门禁此前只挂在本地 `make lint` / `scripts/check-all.sh` 上，现有 workflow
# （inbox-mysql / windows-smoke / lock-regression）都不执行 lint——「验收项：接入 CI」
# 因此名不副实：合入后任何人重新引入顶层同名 def（后者覆盖前者、通知静默退回旧实现）
# 或新增 F811 重定义都不会变红。
# 本 job 执行 `make lint`（import 自检 + F821 棘轮 + 顶层同名定义门禁 + F811 棘轮 +
# 异步阻塞棘轮），并跑本单的回归套件，保证 PR 描述的计数在 CI 里可复算。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: make lint (import / F821 / duplicate-defs / F811 / async-blocking)
        run: make lint
      - name: Notify fan-out regression (issue #4158, #3510, #2419)
        # 与 PR 描述「测试」段同一组命令：静态门禁之外，三族通知扇出与 UUID 归一
        # 必须实际跑通，避免只靠 AST 复核声称「不回归」。
        run: |
          python -m pytest -q tests/runtime/test_issue_4158_notify_shadowing.py \
                            tests/runtime/im/test_im_notify_fanout.py \
                            tests/runtime/test_issue_3510_im_uuid_notify.py \
                            tests/api/test_runtime_public_lib.py
      - name: Faro disconnect + global handler regression (issue #4248)
        # Issue #4248：客户端中断 → 499、全局兜底日志带异常类名、handler 单一来源。
        # 纳入 CI 才能让 PR 描述的用例计数可复算（新用例不能只跑在本地）。
        run: |
          python -m pytest -q tests/insight/test_issue_4248_faro_client_disconnect.py \
                            tests/api/test_issue_4248_api_error_classname.py
