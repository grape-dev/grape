name: lint

# Issue #4158 门禁接入 CI（PR #2077 复审 Optional）：
# 去重门禁此前只挂在本地 `make lint` / `scripts/check-all.sh` 上，现有 workflow
# （inbox-mysql / windows-smoke / lock-regression）都不执行 lint——「验收项：接入 CI」
# 因此名不副实：合入后任何人重新引入顶层同名 def（后者覆盖前者、通知静默退回旧实现）
# 或新增 F811 重定义都不会变红。
# 本 job 执行 `make lint`（import 自检 + F821 棘轮 + 顶层同名定义门禁 + F811 棘轮 +
# 异步阻塞棘轮），并跑本单的回归套件，保证 PR 描述的计数在 CI 里可复算。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: make lint (import / F821 / duplicate-defs / F811 / async-blocking)
        run: make lint
      - name: Notify fan-out regression (issue #4158, #3510, #2419)
        # 与 PR 描述「测试」段同一组命令：静态门禁之外，三族通知扇出与 UUID 归一
        # 必须实际跑通，避免只靠 AST 复核声称「不回归」。
        run: |
          python -m pytest -q tests/runtime/test_issue_4158_notify_shadowing.py \
                            tests/runtime/im/test_im_notify_fanout.py \
                            tests/runtime/test_issue_3510_im_uuid_notify.py \
                            tests/api/test_runtime_public_lib.py
      - name: Worker OOM / outbox / launcher regression (issue #4203)
        # PR #2092 复审 Required：34 例新增测试此前只在本地跑过，未接入任何 CI 白名单，
        # 合入后指标/告警/outbox/预 bind 回归无门禁（改动静默破坏不可见）。
        # 进程内存指标（v2/v1/混合层级回退）、部署配置（两条 worker 启动路径）、
        # launcher 预 bind、消息 outbox 落盘失败语义四族。
        run: |
          python -m pytest -q tests/insight/test_process_memory_metrics.py \
                            tests/deploy/test_issue_4203_deploy_config.py \
                            tests/scripts/test_issue_4203_start_worker.py \
                            tests/runtime/test_issue_4203_msg_outbox.py
      - name: Faro disconnect + global handler regression (issue #4248)
        # Issue #4248：客户端中断 → 499、全局兜底日志带异常类名、handler 单一来源。
        # 纳入 CI 才能让 PR 描述的用例计数可复算（新用例不能只跑在本地）。
        run: |
          python -m pytest -q tests/insight/test_issue_4248_faro_client_disconnect.py \
                            tests/api/test_issue_4248_api_error_classname.py
      - name: Autopilot no-progress stall regression (issue #3741)
        # PR #2160 复审 Required：本单新增用例此前只在本地跑过，CI 里没有任何白名单入口，
        # 合入后「指纹判据 / 重派耗尽收口 / poll 超时终止 / 反向残留 sweep」四族静默回归不可见。
        # 与 PR 描述「测试」段同一组命令，PR 上可直接复算用例数。
        run: |
          python -m pytest -q tests/runtime/test_issue_3741_no_progress_stall.py \
                            tests/runtime/test_issue_2793_no_progress.py \
                            tests/runtime/test_issue_3772_no_progress_scan.py
      - name: Worktree build failure regression (issue #3923)
        # Issue #3923 复审：建树失败必须阻断（凭据归因不可用时透传 git 原文），
        # 这条不变量此前只在本机跑，CI 里无覆盖。纳入本 job 后 PR 上可直接复算。
        run: |
          python -m pytest -q tests/runtime/test_issue_3923_worktree_head_and_attribution.py \
                            tests/runtime/test_repogit.py
      - name: Hermes overlay profiles policy regression (issue #3904)
        # PR #2208 复审 Required：本单新增用例此前只在本地跑过，未接入任何 CI job，
        # 合入后「构建跳过清单与自检必需清单同源 / profiles 不再 100% 回退共享 home /
        # usage_collect 回退感知与先 start 后回退的基线结算」四族回归无门禁。
        run: |
          python -m pytest -q tests/runtime/test_issue_3904_overlay_profiles_policy.py \
                            tests/runtime/test_hermes_overlay_home_439.py \
                            tests/runtime/test_issue_3822_hermes_fallback.py
      - name: Feishu session lifecycle regression (issue #3735 / #3897)
        # PR #2158 复审 Required：本单 8 例新增回归此前只在本地跑，未接入任何 CI
        # 白名单——「装配层丢弃 (ctx, api) 对必须 close session」这条不变量在 CI 里
        # 无覆盖，退回只 pop/clear 也不会变红（与 #4203/#4248/#3923 同一复审判据）。
        run: |
          python -m pytest -q tests/runtime/im/test_issue_3735_feishu_session_lifecycle.py \
                            tests/runtime/im/test_issue_3897_feishu_endpoint_session.py
      - name: Bounded db_lock wait / hold watchdog / external-io gate regression (issue #4295)
        # PR #2205 第 2 轮复审 Required：本单 46 例新增回归此前只在本地跑过——`make lint`
        # 只执行 AST 门禁、不跑用例，CI 里没有任何 pytest step 登记，于是「等锁封顶 →
        # 503」「持有看门狗 + fork 复位」「派生通知任务不继承前台预算」「锁内无外部 IO」
        # 四条不变量被改坏都不会变红（与 #4203/#4248/#3923/#2158 同一复审判据）。
        # 与 PR 描述「测试」段同一组命令，PR 上可直接复算用例数。
        run: |
          python -m pytest -q tests/kernel/test_issue_4295_*.py \
                            tests/api/test_issue_4295_*.py
      - name: GitHub workflow capability regression (issue #4301)
        # PR #2249 复审 Required：本单新增/改动的 4 个能力用例此前只在本地跑过，CI 里没有入口。
        # 合入后 scope 解析（三态）、绑定期预检与落键、spec 阶段阻断、模板未知态保留四族回归
        # 都不会变红（删任一条断言 CI 仍绿）。与 PR 描述「测试」段同一组命令，可直接复算用例数。
        run: |
          python -m pytest -q tests/mgmt/test_issue4301_push_capability_chain.py \
                            tests/mgmt/test_issue4301_workflows_scope_precheck.py \
                            tests/mgmt/test_d105m_workflows_capability.py \
                            tests/mgmt/test_github_oauth_scope.py
