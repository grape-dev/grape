[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsync"
version = "0.1.0"
description = "GitCode → GitHub/ClawHub/DB sync toolchain"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
gitsync = "gitsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
