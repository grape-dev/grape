[pytest]
testpaths = tests
pythonpath = src
addopts = -p no:randomly -m "not e2e_ui"
# 注意：默认禁用 pytest-randomly，保证默认运行确定性（全绿）。
# 随机顺序验证（pytest --randomly-seed=N）已定位并修复 test_tasks / skills / 引擎状态等确定性污染源；
# 但全部用例顺序无关需 DB 逐用例隔离（P1-B 核心大改造，待后续实施）。
timeout = 120
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    atomic: 原子切片测试（Issue 级红/绿契约测试，运行 pytest tests/atomic -m atomic）
    e2e_ui: UI end-to-end scenario tests requiring real browser / remote service (excluded by default; run with `pytest -m e2e_ui`)
    atomic: 真实数据库写入/迁移类原子测试（Issue #512 引入，验收命令 `pytest -m atomic -k online_runtime_last_seen_not_in_future`）
