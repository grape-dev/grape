[pytest]
testpaths = tests
pythonpath = src
addopts = -p no:randomly -m "not e2e_ui"
# 注意：-p no:randomly 临时禁用 pytest-randomly（P0 后仍存在顺序依赖），
# 待 P1-B（DB 逐用例隔离）完成后移除该参数，启用随机顺序验证。
timeout = 120
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e_ui: UI end-to-end scenario tests requiring real browser / remote service (excluded by default; run with `pytest -m e2e_ui`)
