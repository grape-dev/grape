server {
    listen 80;
    server_name _;

    # Issue #542: API JSON 响应开启 gzip（pipeline/issues 等列表接口 0.8~1.4MB 明文
    # → 压缩后 ~100-150KB，公网弱网用户体验直接改善）。仅压缩 application/json，
    # 避免与既有压缩/流式中间件冲突；text/html 为 nginx 内置默认无需声明。
    gzip on;
    gzip_types application/json;
    gzip_min_length 10k;
    gzip_comp_level 5;
    gzip_vary on;

    # Issue #297: 多图 base64 上传放行（前端上限 9×5MB，base64 后 ≈45MB+开销）
    # 附件上限放宽到 200MB（后端 _ATTACH_MAX_SIZE，可用 ATTACH_MAX_SIZE_MB 覆盖）：
    # nginx 必须 ≥ 后端上限，否则大附件在边缘就被 413 截掉，代码层的限制根本没机会生效。
    client_max_body_size 200m;
    # 200MB 在弱网下传输可能远超默认 60s → 加宽请求体读取窗口，避免上传中途被断开
    client_body_timeout 300s;

    # ===== Issue #596 P1：三进程拆分后的三端口反代 =====
    # A 工作台  :38080（用户面 API + SPA + admin + git-repo + runtime 用户面 GET/PUT）
    # B 事件处理 :38081（webhook + A2A + events 操作端点）
    # C Worker  :38082（runtime Worker 协议 + tasks 自报）
    # 分流顺序：B/C 的专用路径先匹配，其余默认走 A。
    # 单进程模式（未拆分部署）：删除本注释以下的 B/C location 块、
    # 把 `location /` 的 proxy_pass 改回 127.0.0.1:3000 即可回退。

    # ===== B 进程：Webhook + A2A =====
    location /webhook/ {
        proxy_pass http://127.0.0.1:38081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/a2a {
        proxy_pass http://127.0.0.1:38081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== B 进程：events 操作端点（terminate / redispatch / a2a-redo / chat 发送） =====
    # 用户操作事件 → 触发 pipeline 重派/终止，属 B 的事件处理层职责（设计文档 §4.5）。
    # GET 查看端点（detail/thread/list）不匹配本块，走默认 A。
    location ~ ^/api/events/[^/]+/(terminate|redispatch|a2a-redo|chat|chat/stream|chat/submit|knowledge|flow/reset) {
        proxy_pass http://127.0.0.1:38081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== C 进程：Worker 协议端点（POST 为主 + worker 数据面 GET） =====
    # Worker 注册/心跳/认领/执行回调/结果上报；rta_ 凭据鉴权的 worker 轮询
    # GET（tags/env/state/install*/package）也归 C——worker 只打 C 端口即可
    # 完成全部协议交互（安装脚本分发 /install 与 /grape-worker.tar.gz 例外：
    # 用户面下载入口归 A，见下方 A 专用块）。
    location ~ ^/api/runtime/(register|heartbeat|admin/batch-recover|runtimes/[^/]+/tasks/claim|runtimes/[^/]+/tasks/claim-by-tag|runtimes/[^/]+/recover-orphans|runtimes/[^/]+/skills-report|runtimes/[^/]+/refresh-skills|runtimes/[^/]+/tags|tasks/[^/]+/(env|state|skill-zip|start|progress|messages|usage|complete|fail|requeue|cancel|converge-event)) {
        proxy_pass http://127.0.0.1:38082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== C 进程：tasks 自报端点（Agent runtime 调用） =====
    location ~ ^/api/tasks/(notify|complete|current|awaiting-input) {
        proxy_pass http://127.0.0.1:38082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== A 进程：其余所有请求（默认） =====
    # 用户面 API + SPA + admin + git-repo + runtime 用户面 GET
    # （machine-health/tasks 列表/engine-onboarding/role-tags/scene-tags）
    # + PUT 标签设置 + install 脚本分发（/api/runtime/install、
    # /api/runtime/grape-worker.tar.gz 用户面下载入口，§2.3 注：归 A）。
    location / {
        proxy_pass http://127.0.0.1:38080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support（IM WS / SSE 流）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
