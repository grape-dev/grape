server:
  port: 8081

spring:
  application:
    name: grape-admin-backend
  # 双数据源（admin-db-split v1.0）：地址由环境变量注入（ADMIN_DB_* / GRAPE_DB_*），代码不写死
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    # dev 共享库阶段曾禁用（SPRING_FLYWAY_ENABLED=false）；双库独立后恢复启用
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 基线方式（P11）：grape_admin_db 结构+数据已从旧库全量迁移，V1-V16 标记已应用不重放
    # （V10/V16 含固定 id 菜单种子 INSERT，重放会与已迁数据主键冲突）；V17+ 正常应用
    # 环境变量可切换：存量迁移场景默认 16（不重放）；现网首次部署（全新空库）设
    # FLYWAY_BASELINE_VERSION=0 → Flyway 全量应用 V1-V16 建表（含菜单种子）
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:16}

# 双数据源（admin-db-split v1.0）：连接地址/账号/密码全部由 admin.env 的 ADMIN_DB_*/GRAPE_DB_*
# 环境变量注入（DataSourceConfig @Value 读取），代码与配置文件均不写死；
# 未配置时 Hikari 启动即失败（fail-fast，防漏配）

app:
  jwt-secret: ${ADMIN_JWT_SECRET:}
  jwt-expire-minutes: 120
  # 技能库目录：可用 SKILLS_DIR 环境变量显式指定（不依赖启动目录）；默认相对 admin/backend 启动时的 ../../skills
  skills-dir: ${SKILLS_DIR:../../skills}
  # 项目模板配置文件路径（独立于 skills-dir，避免部署时找不到 configs/ 目录）
  templates-config: ${TEMPLATES_CONFIG:configs/project-templates.json}
  # 上传大小上限（字节，默认 10MB）
  max-zip-bytes: ${APP_MAX_ZIP_BYTES:10485760}
  # AI 助手 hermes 查询超时（秒，默认 120——复杂查询需更长；对齐 nginx 300s）
  ai-timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:300}
  # 对象存储 OBS（obs-skill-storage-design.md §3 N15）：AK/SK 仅环境变量注入
  obs:
    enabled: ${OBS_ENABLED:false}
    endpoint: ${OBS_ENDPOINT:https://obs.cn-north-4.myhuaweicloud.com}
    bucket: ${OBS_BUCKET:}
    access-key: ${OBS_ACCESS_KEY:}
    secret-key: ${OBS_SECRET_KEY:}
    prefix: ${OBS_PREFIX:grape/prod}
    url-expires: ${OBS_URL_EXPIRES:300}
  # AI 助手（P3 使用）
  hermes-bin: ${HERMES_BIN:}
  hermes-query-script: ${HERMES_QUERY_SCRIPT:ai_hermes_query.py}

logging:
  level:
    com.grape.admin: INFO
