server:
  port: 8081

spring:
  application:
    name: grape-admin-backend
  datasource:
    # dev：grape 测试库（与 grape 服务共享）；prod 由 ADMIN_DB_URL 注入切换
    url: ${ADMIN_DB_URL:jdbc:mysql://127.0.0.1:3306/grape_test_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${ADMIN_DB_USER:root}
    password: ${ADMIN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # grape_test_db 是存量库（已有 grape 业务表），Flyway 需基线化后只应用 admin_* 迁移
    baseline-on-migrate: true
    baseline-version: 0
    # 共享库上其他部署（远程服务器）可能已应用本地没有的迁移文件（如 V10/V11），忽略而非报错
    ignore-migration-patterns: '*:missing'

app:
  jwt-secret: ${ADMIN_JWT_SECRET:}
  jwt-expire-minutes: 120
  # AI 助手（P3 使用）
  hermes-bin: ${HERMES_BIN:}
  hermes-query-script: ${HERMES_QUERY_SCRIPT:ai_hermes_query.py}

logging:
  level:
    com.grape.admin: INFO
