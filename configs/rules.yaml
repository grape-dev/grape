rules:
  - name: "push事件-代码审查"
    match:
      source: [github, gitlab, gitcode]
      event: [push]
    agent: opencode
    prompt_template: push_event
    workspace:
      clone: true
      branch: "{{.Branch}}"

  - name: "PR审查"
    match:
      source: [github, gitlab, gitcode]
      event: [pull_request_opened, pull_request_updated]
    agent: opencode
    prompt_template: pr_review
    workspace:
      clone: true
      branch: "{{.Branch}}"

  - name: "构建失败分析"
    match:
      source: [jenkins, spanner]
      event: [build_failure]
    agent: opencode
    prompt_template: build_failure
    workspace:
      clone: false

  - name: "构建成功通知"
    match:
      source: [jenkins, spanner]
      event: [build_success]
    agent: opencode
    prompt_template: build_success
    workspace:
      clone: false

  - name: "Issue处理"
    match:
      source: [github, gitlab, gitcode]
      event: [issue_opened]
    agent: opencode
    prompt_template: default
    workspace:
      clone: false

  - name: "部署失败分析"
    match:
      source: [jenkins, spanner]
      event: [deploy_failure]
    agent: opencode
    prompt_template: build_failure
    workspace:
      clone: false

  - name: "发布事件"
    match:
      source: [github, gitlab, gitcode]
      event: [release_created]
    agent: opencode
    prompt_template: default
    workspace:
      clone: true
