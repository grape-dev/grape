server:
  port: 8080
  base_url: "http://localhost:8080"

agents:
  opencode:
    cli: "C:\\Users\\janso\\AppData\\Roaming\\npm\\opencode.cmd"
    args: ["run", "{{.Prompt}}", "--dir", "{{.Workspace}}", "--dangerously-skip-permissions"]
    timeout: 5m
    available: true
  claude:
    cli: "claude"
    args: ["--prompt", "{{.Prompt}}"]
    timeout: 5m
    available: false
  openclaw:
    cli: "openclaw"
    args: ["run", "--input", "{{.Prompt}}"]
    timeout: 5m
    available: false

session:
  store: sqlite
  db_path: "./data/sessions.db"
  max_concurrent: 10
  default_timeout: 10m

workspace:
  base_dir: "./data/workspaces"
  auto_clone: true

sources:
  github:
    secret_env: GITHUB_WEBHOOK_SECRET
  gitlab:
    secret_env: GITLAB_WEBHOOK_SECRET
  gitcode:
    secret_env: GITCODE_WEBHOOK_TOKEN
  jenkins:
    secret_env: JENKINS_WEBHOOK_TOKEN
  spanner:
    secret_env: SPANNER_WEBHOOK_TOKEN
