# Grape 集群模式 profile（Issue #699 Phase 6，TC-6.2）
# 用法：PROFILE=configs/profiles/cluster.conf ./scripts/dev_four_process.sh
# 或 systemd EnvironmentFile=/opt/grape/configs/profiles/cluster.conf
#
# 集群模式：MySQL + 三 schema（grape_mgmt / grape_runtime / grape_insight），
# RemoteProvider 经 internal API 跨进程访问。
# 前置：MySQL 实例可用且三 schema 已创建（scripts/migrate_schemas.py --backend mysql）。

GRAPE_MODE=cluster
DEVOPS_DB_BACKEND=mysql
GRAPE_SCHEMA_MODE=1

# MySQL 连接（必填，占位值需替换；变量名与 kernel/mysql_compat 一致）
DEVOPS_DB_HOST=mysql.internal
DEVOPS_DB_PORT=3306
DEVOPS_DB_USER=grape
DEVOPS_DB_PASSWORD=CHANGE_ME
DEVOPS_DB_NAME=grape

# internal API 服务间认证（集群模式必填，kernel/auth_sdk）
GRAPE_SERVICE_SECRET=CHANGE_ME

# RemoteProvider 服务地址（默认同主机四端口；跨机部署时替换）
# GRAPE_RUNTIME_URL=http://127.0.0.1:38082
# GRAPE_MGMT_URL=http://127.0.0.1:38080
# GRAPE_INSIGHT_URL=http://127.0.0.1:38083

# 四进程端口（默认值，可按需覆盖）
# GRAPE_PORT=38080
