# Grape 单机模式 profile（Issue #699 Phase 6，TC-6.1）
# 用法：PROFILE=configs/profiles/single.conf ./scripts/dev_four_process.sh
# 或 systemd EnvironmentFile=/opt/grape/configs/profiles/single.conf
#
# 单机模式：四进程同主机，SQLite + 表前缀模拟三 schema（mgmt_/rt_/ins_）。
# LocalProvider 直连同库；internal API 认证自动跳过。

GRAPE_MODE=single
DEVOPS_DB_BACKEND=sqlite
GRAPE_SCHEMA_MODE=1

# SQLite 并发（防 database is locked，设计 §13）
DEVOPS_SQLITE_WAL=1
DEVOPS_SQLITE_BUSY_TIMEOUT_MS=5000

# 数据路径（按需覆盖；默认 data/sessions.db）
# DEVOPS_DB_PATH=/opt/grape/data/sessions.db

# 四进程端口（默认值，可按需覆盖）
# GRAPE_PORT=38080
