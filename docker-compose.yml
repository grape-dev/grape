services:
  backend:
    build: .
    container_name: grape-backend
    ports:
      - "80:3000"
      - "8080:3000"
    environment:
      - TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      # Issue #452: Docker 环境默认关闭公网 IP 探测
      - GRAPE_AUTO_DETECT_URL=false
    volumes:
      - grape-data:/app/data
      - ./configs:/app/configs
      - ./skills:/app/skills
      - ./examples:/app/examples
      # Issue #452: 挂载 .env 文件（可选，不存在不影响启动）
      - ./.env:/app/.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  grape-data:
