services:
  backend:
    build: .
    container_name: grape-backend
    ports:
      - "80:3000"
      - "8080:3000"
    environment:
      - TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      # Issue #452: Docker 环境默认关闭公网 IP 探测
      - GRAPE_AUTO_DETECT_URL=false
    # 审查修复: 移除 bind mount ./.env:/app/.env（宿主无 .env 时 compose 失败）
    # 容器内 /app/.env 由 Dockerfile COPY .env.example .env 提供；
    # 宿主 .env（如存在）通过 env_file 注入为环境变量，覆盖容器内默认值
    env_file:
      - path: .env
        required: false
    volumes:
      - grape-data:/app/data
      - ./configs:/app/configs
      - ./skills:/app/skills
      - ./examples:/app/examples
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  grape-data:
