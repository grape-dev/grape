[project]
name = "grape"
version = "0.1.0"
description = "Agentic DevOps CLI：契约驱动命令生成 + git 本地传输（token 零暴露）"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
]

[project.scripts]
grape = "grape_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grape_cli*"]